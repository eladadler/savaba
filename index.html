const TWEAK_DEFAULTS = {
  "primaryColor": "#E8547A", "fontPair": "אופי", "radius": "רך",
  "density": "רגיל", "cardVariant": "קלאסי", "showMmNote": true
};
const NAV_ROUTES   = ['home', 'cands', 'offers', 'ai', 'set'];
const TAB_TO_ROUTE = { home:'home', cands:'cands', match:'offers', ai:'ai', set:'set' };
const ROUTE_TO_TAB = { home:'home', cands:'cands', candidate:'cands', candInquiry:'cands', offers:'match', chat:'match', matchFlow:'match', offerDetail:'match', ai:'ai', set:'set' };

// ════════════════════════════════════════════════════════════
// OFFER DETAIL (full-screen offer card, used from bell notification)
// ════════════════════════════════════════════════════════════
function OfferDetail({ th, go, params }) {
  const { offers, candidates, matchmakers, updateOffer } = useContext(DataCtx);
  const { user } = useContext(AuthCtx);
  const myUid = user?.uid;
  const oid   = params?.id;

  const [msgs,          setMsgs]          = useState([]);
  const [text,          setText]          = useState('');
  const [approving,     setApproving]     = useState(false);
  const [confirmReject, setConfirmReject] = useState(false);
  const endRef = React.useRef(null);

  // Mark chat read when screen opens
  useEd(() => { if (oid) localStorage.setItem('chatRead_' + oid, String(Date.now())); }, [oid]);

  // Real-time chat listener
  useEd(() => {
    if (!oid || !myUid) return;
    return db.collection('mm_chats').doc(oid).onSnapshot(snap => setMsgs(snap.data()?.messages || []));
  }, [oid, myUid]);

  // Scroll to bottom on new messages
  useEd(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [msgs]);

  const o = offers.find(x => x.id === oid);

  if (!o) return (
    <>
      <AppHeader th={th} title="הצעת שידוך" onBack={() => go('back')} />
      <div style={{ flex:1, display:'flex', alignItems:'center', justifyContent:'center', fontFamily:th.body, color:alpha(th.ink,0.4) }}>הצעה לא נמצאה</div>
    </>
  );

  const findC = id => candidates.find(c => c.id === id) || { name:'?', grad:gradForId(id||'x'), photos:[] };
  const findM = id => { const mm = matchmakers[id]; if (!mm) return { name:'—', grad:gradForId(id||'x') }; return { ...mm, name:mm.displayName||mm.name||'—', grad:mm.grad||gradForId(id) }; };

  const iAmA      = o.aMm === myUid;
  const candA     = findC(o.aId);
  const candB     = findC(o.bId);
  const mmA       = findM(o.aMm);
  const mmB       = findM(o.bMm);
  const myCand    = iAmA ? candA : candB;
  const theirCand = iAmA ? candB : candA;
  const theirMm   = iAmA ? mmB : mmA;

  const aCandApp   = !!(o.aCandApproved || o.candAApprovedByMm);
  const bCandApp   = !!o.bCandApproved;
  const bothApp    = aCandApp && bCandApp;
  const finalFail  = o.status === 'נדחתה';
  const iAmBothMm  = o.aMm === myUid && o.bMm === myUid;

  // Columns: always [mine, theirs]. For self-match (both mine) both cols are mine.
  const approvalCols = iAmBothMm
    ? [
        { cand:candA, approved:aCandApp, mine:true,  field:'aCandApproved', newOtherApp:bCandApp },
        { cand:candB, approved:bCandApp, mine:true,  field:'bCandApproved', newOtherApp:aCandApp },
      ]
    : [
        { cand:myCand,    approved: iAmA ? aCandApp : bCandApp, mine:true,  field: iAmA ? 'aCandApproved' : 'bCandApproved', newOtherApp: iAmA ? bCandApp : aCandApp },
        { cand:theirCand, approved: iAmA ? bCandApp : aCandApp, mine:false, field: null, newOtherApp: null },
      ];

  const markApproved = async (field, newOtherApp) => {
    setApproving(true);
    await updateOffer(o.id, { [field]: true, ...(newOtherApp ? { status: 'אושרה' } : {}) });
    setApproving(false);
  };

  // WhatsApp — to MY candidate with the OTHER candidate's card link
  const myCandPhone = myCand.phone ? String(myCand.phone).replace(/\D/g,'').replace(/^0/,'972') : '';
  const waToCand    = myCandPhone
    ? `https://wa.me/${myCandPhone}?text=${encodeURIComponent(`שלום ${myCand.name}! שלחתי לך הצעה לשידוך עם ${theirCand.name} 😊 הכרטיסיה: https://eladadler.github.io/savaba/#cand/${theirCand.id}`)}`
    : null;
  // WhatsApp — to THEIR matchmaker
  const theirMmPhone = theirMm.phone ? String(theirMm.phone).replace(/\D/g,'').replace(/^0/,'972') : '';
  const waToMm       = theirMmPhone
    ? `https://wa.me/${theirMmPhone}?text=${encodeURIComponent(`היי ${theirMm.name.split(' ')[0]}, בנושא ההצעה: ${myCand.name} ו${theirCand.name}`)}`
    : null;

  const sendMsg = async () => {
    const t = text.trim();
    if (!t) return;
    setText('');
    await db.collection('mm_chats').doc(oid).set(
      { messages: firebase.firestore.FieldValue.arrayUnion({ from: myUid, text: t, at: Date.now() }),
        offerId: oid, participants: [o.aMm, o.bMm] },
      { merge: true }
    );
  };

  // Prepend the original note (written during match flow) as first chat message
  const allMsgs = [
    ...(o.note ? [{ from: o.aMm, text: o.note, at: o.createdAt?.seconds ? o.createdAt.seconds * 1000 : 0, _isNote: true }] : []),
    ...msgs,
  ];

  const cardShadow = bothApp
    ? `0 6px 26px ${alpha(th.success,0.2)}, 0 0 0 1.5px ${alpha(th.success,0.32)}`
    : `0 4px 14px ${alpha(th.ink,0.06)}`;

  return (
    <>
      <AppHeader th={th} title={`${candA.name} · ${candB.name}`} onBack={() => go('back')} />
      <div style={{ flex:1, overflowY:'auto', padding:'14px 18px 28px' }}>

        {/* ── Celebration ── */}
        {bothApp && (
          <div style={{ textAlign:'center', padding:'10px 0 14px', animation:'sabaFade .4s ease' }}>
            <div style={{ fontSize:40, lineHeight:1 }}>🎉</div>
            <div style={{ fontFamily:th.display, fontWeight:800, fontSize:17, color:th.success, marginTop:8 }}>כולם אישרו — יהי מזל טוב! 💍</div>
          </div>
        )}

        {/* ── Approvals ── */}
        <div style={{ background:th.card, borderRadius:th.r, padding:14, marginBottom:14, boxShadow:cardShadow }}>
          <div style={{ fontFamily:th.display, fontWeight:800, fontSize:12, color:alpha(th.ink,0.45), marginBottom:10, letterSpacing:'.04em', textTransform:'uppercase' }}>אישורים</div>
          <div style={{ display:'flex', gap:8 }}>
            {approvalCols.map(({ cand, approved, mine, field, newOtherApp }) => (
              <div key={cand.id} style={{ flex:1, borderRadius:th.rSm, padding:10,
                background: approved ? alpha(th.success,0.08) : mine ? alpha(th.primary,0.07) : alpha(th.ink,0.04),
                border:`1.5px solid ${approved ? alpha(th.success,0.3) : mine ? alpha(th.primary,0.2) : alpha(th.ink,0.08)}` }}>

                {/* Label */}
                <div style={{ fontFamily:th.body, fontSize:10, fontWeight:800,
                  color: mine ? th.primary : alpha(th.ink,0.38), marginBottom:7,
                  display:'flex', alignItems:'center', gap:4 }}>
                  {mine && <span style={{ fontSize:8 }}>◆</span>}
                  {mine ? 'המועמד/ת שלי' : 'הצד השני'}
                </div>

                {/* Candidate name — clickable → card */}
                <button onClick={() => go('candidate', { id:cand.id })}
                  style={{ all:'unset', cursor:'pointer', display:'flex', alignItems:'center', gap:7, marginBottom:10, width:'100%' }}>
                  <Avatar grad={cand.grad} name={cand.name} size={32} photo={cand.photos?.[0]} />
                  <span style={{ fontFamily:th.display, fontWeight:800, fontSize:13.5, color:th.ink, flex:1, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{cand.name}</span>
                  <Icon name="chevL" size={12} style={{ color:alpha(th.ink,0.25), flexShrink:0 }} />
                </button>

                {/* Status */}
                {approved ? (
                  <div style={{ display:'flex', alignItems:'center', gap:6, padding:'6px 9px', borderRadius:th.rSm, background:alpha(th.success,0.12) }}>
                    <Icon name="check" size={13} style={{ color:th.success }} />
                    <span style={{ fontFamily:th.display, fontWeight:800, fontSize:12, color:th.success }}>{cand.name.split(' ')[0]} אישר/ה</span>
                  </div>
                ) : mine && !finalFail ? (
                  <button disabled={approving} onClick={() => markApproved(field, newOtherApp)}
                    style={{ all:'unset', cursor:approving?'default':'pointer', display:'flex', alignItems:'center', justifyContent:'center', gap:6, padding:'9px 0', borderRadius:th.rSm, background:th.primary, width:'100%', boxSizing:'border-box', opacity:approving?0.6:1 }}>
                    <Icon name="check" size={13} style={{ color:'#fff' }} />
                    <span style={{ fontFamily:th.display, fontWeight:800, fontSize:12.5, color:'#fff' }}>
                      {approving ? 'שומר…' : `${cand.name.split(' ')[0]} מאשר/ת`}
                    </span>
                  </button>
                ) : (
                  <div style={{ display:'flex', alignItems:'center', gap:6, padding:'6px 9px', borderRadius:th.rSm, background:alpha(th.ink,0.06) }}>
                    <Icon name="bell" size={12} style={{ color:th.gold }} />
                    <span style={{ fontFamily:th.body, fontWeight:600, fontSize:12, color:alpha(th.ink,0.5) }}>ממתין לאישור</span>
                  </div>
                )}
              </div>
            ))}
          </div>
          {finalFail && (
            <div style={{ marginTop:10, background:alpha(th.error,0.08), borderRadius:th.rSm, padding:'8px 12px', display:'flex', alignItems:'center', gap:6 }}>
              <Icon name="x" size={14} style={{ color:th.error }} />
              <span style={{ fontFamily:th.body, fontSize:13, color:alpha(th.ink,0.7) }}>ההצעה נדחתה</span>
            </div>
          )}
        </div>

        {/* ── WhatsApp ── */}
        <div style={{ background:th.card, borderRadius:th.r, padding:12, marginBottom:14, boxShadow:`0 3px 10px ${alpha(th.ink,0.04)}` }}>
          <div style={{ fontFamily:th.display, fontWeight:800, fontSize:12, color:alpha(th.ink,0.45), marginBottom:8, letterSpacing:'.04em', textTransform:'uppercase' }}>וואטסאפ</div>
          <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
            {waToCand ? (
              <a href={waToCand} target="_blank" rel="noreferrer"
                style={{ display:'flex', alignItems:'center', gap:10, padding:'10px 12px', borderRadius:th.rSm, background:'#25D36610', border:'1px solid #25D36628', textDecoration:'none' }}>
                <Avatar grad={myCand.grad} name={myCand.name} size={30} photo={myCand.photos?.[0]} />
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontFamily:th.body, fontSize:10.5, fontWeight:700, color:alpha(th.ink,0.45) }}>שלח/י כרטיסיה של {theirCand.name} ל:</div>
                  <div style={{ fontFamily:th.display, fontWeight:800, fontSize:13.5, color:th.ink }}>{myCand.name}</div>
                </div>
                <Icon name="whatsapp" size={22} style={{ color:'#25D366', flexShrink:0 }} />
              </a>
            ) : (
              <div style={{ padding:'9px 12px', borderRadius:th.rSm, background:alpha(th.ink,0.04), fontFamily:th.body, fontSize:12.5, color:alpha(th.ink,0.4) }}>
                אין מספר טלפון עבור {myCand.name}
              </div>
            )}
            {waToMm && (
              <a href={waToMm} target="_blank" rel="noreferrer"
                style={{ display:'flex', alignItems:'center', gap:10, padding:'10px 12px', borderRadius:th.rSm, background:alpha(th.ink,0.03), border:`1px solid ${alpha(th.ink,0.1)}`, textDecoration:'none' }}>
                <Avatar grad={theirMm.grad} name={theirMm.name} size={30} photo={theirMm.photoURL} />
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontFamily:th.body, fontSize:10.5, fontWeight:700, color:alpha(th.ink,0.45) }}>שדכן/ית הצד השני</div>
                  <div style={{ fontFamily:th.display, fontWeight:800, fontSize:13.5, color:th.ink }}>{theirMm.name}</div>
                </div>
                <Icon name="whatsapp" size={22} style={{ color:'#25D366', flexShrink:0 }} />
              </a>
            )}
          </div>
        </div>

        {/* ── Reject ── */}
        {!finalFail && !bothApp && (
          <button onClick={() => setConfirmReject(true)}
            style={{ all:'unset', cursor:'pointer', width:'100%', boxSizing:'border-box', textAlign:'center', padding:'9px 0', borderRadius:th.rSm, border:`1px solid ${alpha(th.error,0.25)}`, color:alpha(th.error,0.8), fontFamily:th.body, fontWeight:700, fontSize:13, marginBottom:14 }}>
            ✕ דחיית הצעה
          </button>
        )}

        {/* ── Chat ── */}
        <div style={{ background:th.card, borderRadius:th.r, padding:14, boxShadow:`0 3px 10px ${alpha(th.ink,0.04)}` }}>
          <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:12 }}>
            <Avatar grad={theirMm.grad} name={theirMm.name} size={24} photo={theirMm.photoURL} />
            <span style={{ fontFamily:th.display, fontWeight:800, fontSize:13, color:th.ink }}>התכתבות עם {theirMm.name}</span>
          </div>
          <div style={{ maxHeight:260, overflowY:'auto', display:'flex', flexDirection:'column', gap:6, marginBottom:12 }}>
            {allMsgs.length === 0 && (
              <div style={{ textAlign:'center', padding:'22px 0', fontFamily:th.body, fontSize:13, color:alpha(th.ink,0.35) }}>
                אין הודעות עדיין — שלח/י הודעה ראשונה
              </div>
            )}
            {allMsgs.map((m, i) => {
              const mine = m.from === myUid;
              return (
                <div key={i} style={{ display:'flex', justifyContent:mine?'flex-end':'flex-start', flexDirection:'column', alignItems:mine?'flex-end':'flex-start' }}>
                  {m._isNote && (
                    <div style={{ fontFamily:th.body, fontSize:10.5, fontWeight:700, color:alpha(th.ink,0.35), marginBottom:3, paddingInline:4 }}>
                      הודעה מלווה להצעה
                    </div>
                  )}
                  <div style={{ maxWidth:'80%', padding:'8px 12px', fontFamily:th.body, fontSize:13.5, lineHeight:1.45,
                    borderRadius: mine ? '14px 14px 4px 14px' : '14px 14px 14px 4px',
                    background: mine ? th.primary : alpha(th.ink,0.08),
                    color: mine ? '#fff' : th.ink }}>
                    {m.text}
                  </div>
                </div>
              );
            })}
            <div ref={endRef} />
          </div>
          <div style={{ display:'flex', gap:8 }}>
            <input value={text} onChange={e => setText(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); } }}
              placeholder={`הודעה ל${theirMm.name.split(' ')[0]}…`}
              style={{ flex:1, fontFamily:th.body, fontSize:14, padding:'9px 12px', borderRadius:th.rSm, border:`1.5px solid ${alpha(th.ink,0.15)}`, background:th.cream, color:th.ink, outline:'none', direction:'rtl' }} />
            <button onClick={sendMsg} disabled={!text.trim()}
              style={{ border:'none', borderRadius:th.rSm, padding:'0 14px', cursor:text.trim()?'pointer':'default', background:text.trim()?th.primary:alpha(th.ink,0.1), color:text.trim()?'#fff':alpha(th.ink,0.3), display:'flex', alignItems:'center', transition:'all .15s' }}>
              <Icon name="send" size={18} />
            </button>
          </div>
        </div>

      </div>

      <Sheet open={confirmReject} onClose={() => setConfirmReject(false)} th={th} title="דחיית הצעת שידוך">
        <div style={{ fontFamily:th.body, fontSize:14, color:alpha(th.ink,0.7), marginBottom:18, lineHeight:1.5 }}>
          לדחות את הצעת השידוך בין <b>{myCand.name}</b> ל-<b>{theirCand.name}</b>? פעולה זו בלתי הפיכה.
        </div>
        <div style={{ display:'flex', gap:10 }}>
          <Btn th={th} full variant="ghost" onClick={() => setConfirmReject(false)}>ביטול</Btn>
          <Btn th={th} full style={{ background:th.error, color:'#fff' }}
            onClick={async () => { await updateOffer(o.id, { status:'נדחתה' }); setConfirmReject(false); go('back'); }}>
            דחה לצמיתות
          </Btn>
        </div>
      </Sheet>
    </>
  );
}

function renderScreen(cur, th, go, profile) {
  const p = cur.params;
  switch (cur.name) {
    case 'onboarding':  return <Onboarding th={th} go={go} />;
    case 'register':    return <Register th={th} go={go} />;
    case 'home':        return <Home th={th} go={go} />;
    case 'cands':       return <Candidates key={p?.linkMode ? 'cands-link' : 'cands'} th={th} go={go} params={p} />;
    case 'candidate':   return <CandidateDetail th={th} go={go} params={p} />;
    case 'matchFlow':   return <MatchFlow th={th} go={go} params={p} />;
    case 'offers':      return <Offers th={th} go={go} params={p} />;
    case 'chat':        return <Chat th={th} go={go} params={p} />;
    case 'candInquiry': return <CandInquiry th={th} go={go} params={p} />;
    case 'ai':          return <AIRecs th={th} go={go} />;
    case 'candidateMode': return <CandidateMode th={th} go={go} />;
    case 'candViewCand':  return <CandViewCand th={th} go={go} params={p} />;
    case 'set':         return <AppSettings th={th} go={go} profile={profile} />;
    case 'admin':         return <AdminPanel th={th} go={go} />;
    case 'inviteLanding': return <InvitationLanding th={th} go={go} token={p.token} />;
    case 'candSelfFill':  return <CandidateSelfFill th={th} go={go} params={p} />;
    case 'editCand':      return <EditCandidateScreen th={th} go={go} params={p} />;
    case 'offerDetail':   return <OfferDetail th={th} go={go} params={p} />;
    default:              return <Home th={th} go={go} />;
  }
}

function Stage({ children }) {
  const [scale, setScale] = React.useState(1);
  React.useEffect(() => {
    const fit = () => {
      const s = Math.min(1, (window.innerWidth-32)/402, (window.innerHeight-32)/874);
      setScale(s);
    };
    fit(); window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, []);
  return (
    <div style={{ position:'fixed', inset:0, display:'flex', alignItems:'center', justifyContent:'center', background:'radial-gradient(circle at 50% 30%, #3a3440, #211d26)' }}>
      <div style={{ transform:`scale(${scale})`, transformOrigin:'center center' }}>{children}</div>
    </div>
  );
}

// Settings screen (replaces screens-e Settings, adds admin link + signout)
function AppSettings({ th, go, profile }) {
  const Row = ({ icon, label, danger, last, onClick, tone }) => (
    <button onClick={onClick} style={{ all:'unset', cursor:'pointer', boxSizing:'border-box', width:'100%', display:'flex', alignItems:'center', gap:13, padding:'13px 14px', borderBottom: last ? 'none' : `1px solid ${alpha(th.ink,0.07)}` }}>
      <div style={{ width:34, height:34, borderRadius:10, background:alpha(danger ? th.error : (tone||th.ink), 0.1), color:danger ? th.error : (tone||th.ink), display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}><Icon name={icon} size={19} /></div>
      <span style={{ flex:1, fontFamily:th.body, fontWeight:600, fontSize:15, color:danger ? th.error : th.ink }}>{label}</span>
      <span style={{ color:alpha(th.ink,0.3) }}><Icon name="chevL" size={18} /></span>
    </button>
  );
  const Group = ({ children }) => <div style={{ background:th.card, borderRadius:th.r, overflow:'hidden', marginBottom:16, boxShadow:`0 4px 14px ${alpha(th.ink,0.05)}` }}>{children}</div>;

  return (
    <>
      <AppHeader th={th} title="הגדרות" big />
      <div style={{ flex:1, overflowY:'auto', padding:'8px 18px 24px' }}>
        <div style={{ display:'flex', alignItems:'center', gap:14, background:th.card, borderRadius:th.rLg, padding:16, marginBottom:18, boxShadow:`0 6px 18px ${alpha(th.ink,0.06)}` }}>
          <Avatar grad={gradForId(profile?.uid||'me')} name={profile?.displayName||profile?.email||'?'} size={62} photo={profile?.photoURL} />
          <div style={{ flex:1 }}>
            <div style={{ fontFamily:th.display, fontWeight:800, fontSize:19, color:th.ink }}>{profile?.displayName || profile?.email}</div>
            <div style={{ fontFamily:th.body, fontSize:13.5, color:alpha(th.ink,0.55) }}>שדכן/ית{profile?.isAdmin ? ' · מנהל' : ''}</div>
          </div>
        </div>

        {profile?.isAdmin && (
          <Group>
            <Row icon="gear" label="פאנל ניהול" tone={th.primary} onClick={() => go('admin')} last />
          </Group>
        )}

        <Group>
          <Row icon="users" label="מעבר למצב מועמד/ת" tone={th.primary} onClick={() => go('candidateMode')} last />
        </Group>
        <Group>
          <Row icon="info" label="הצהרת נגישות" />
          <Row icon="lock" label="פרטיות ואבטחה" last />
        </Group>
        <Group>
          <Row icon="arrow" label="יציאה מהמערכת" danger last onClick={() => { auth.signOut(); }} />
        </Group>
        <div style={{ textAlign:'center', marginTop:8 }}>
          <Logo size={28} color={alpha(th.ink,0.25)} flaw={th.cream} />
          <div style={{ fontFamily:th.display, fontSize:13, color:alpha(th.ink,0.35), marginTop:4 }}>סבבה והכל · גרסה 1.0</div>
        </div>
      </div>
    </>
  );
}

function ImpersonateBanner({ th }) {
  const { isImpersonating, profile, impersonateType, stopImpersonate } = useContext(AuthCtx);
  if (!isImpersonating) return null;
  const label = impersonateType === 'candidate' ? 'מועמד/ת' : 'שדכן/ית';
  return (
    <div style={{ background: '#7B2D00', color: '#fff', padding: '7px 14px', display: 'flex', alignItems: 'center', gap: 8, flexShrink: 0, zIndex: 999 }}>
      <div style={{ fontSize: 14 }}>🎭</div>
      <div style={{ flex: 1, fontFamily: th.display, fontWeight: 800, fontSize: 12.5 }}>
        מדמה {label}: {profile?.displayName || profile?.name || profile?.uid}
      </div>
      <button onClick={stopImpersonate} style={{ border: 'none', background: 'rgba(255,255,255,0.2)', color: '#fff', borderRadius: 999, padding: '4px 12px', fontFamily: th.display, fontWeight: 800, fontSize: 12, cursor: 'pointer' }}>
        יציאה ✕
      </button>
    </div>
  );
}

function AppInner({ inviteToken }) {
  const [t, setTweak]  = useTweaks(TWEAK_DEFAULTS);
  const th             = makeTheme(t);
  const { user, profile } = useContext(AuthCtx);
  const data           = useContext(DataCtx);
  const [stack, setStack] = React.useState([{ name:'onboarding', params:{} }]);
  const cur  = stack[stack.length - 1];

  // ── Edit mode (admin only) ──────────────────────────────────
  const [editMode, setEditMode]     = React.useState(false);
  const [drafts, setDrafts]         = React.useState({});
  const [savingTexts, setSavingTexts] = React.useState(false);
  const isAdmin      = profile?.isAdmin;
  const screenKeys   = SCREEN_TEXTS[cur.name] || [];
  const setDraft     = (key, val) => setDrafts(d => ({ ...d, [key]: val }));
  const cancelEdit   = () => { setEditMode(false); setDrafts({}); };
  React.useEffect(() => { setEditMode(false); setDrafts({}); }, [cur.name]);
  const saveTexts = async () => {
    const entries = Object.entries(drafts);
    if (!entries.length) { setEditMode(false); return; }
    setSavingTexts(true);
    try {
      for (const [key, val] of entries) await data.updateText(key, val);
      setDrafts({}); setEditMode(false);
    } catch(e) { alert('שגיאה בשמירה: ' + e.message); }
    setSavingTexts(false);
  };

  // Handle invite token: route to inviteLanding once profile is loaded
  React.useEffect(() => {
    if (!profile) return;
    if (inviteToken && stack.length === 1 && stack[0].name !== 'inviteLanding' && stack[0].name !== 'candSelfFill') {
      setStack([{ name: 'inviteLanding', params: { token: inviteToken } }]);
      return;
    }
    // Deep link: #cand/CANDIDATE_ID sent via WhatsApp to shadchan
    const hash = window.location.hash;
    if (hash.startsWith('#cand/') && stack.length === 1 && stack[0].name !== 'candidate') {
      const candId = hash.slice('#cand/'.length);
      if (candId) {
        setStack([{ name: 'home', params: {} }, { name: 'candidate', params: { id: candId, viewOnly: true } }]);
        window.history.replaceState(null, '', window.location.pathname + window.location.search);
        return;
      }
    }
    // Skip onboarding if already registered
    if (profile.profileComplete && stack.length === 1 && stack[0].name === 'onboarding') {
      setStack([{ name: 'home', params: {} }]);
    }
  }, [profile]);

  // Patch static globals so existing screens work
  React.useEffect(() => {
    window.CANDIDATES  = data.candidates;
    window.OFFERS      = data.offers;
    window.MATCHMAKERS = data.matchmakers;
    window.findCand    = (id) => data.candidates.find(c => c.id === id);
    window.findMm      = (id) => { const mm = data.matchmakers[id]; if (!mm) return { id, name:'—', grad:['#ccc','#999'] }; return { ...mm, name: mm.displayName || mm.name || '—', grad: mm.grad || ['#ccc','#999'] }; };
    window.CHATS       = {};
    window.AI_PAIRS    = [];
  }, [data.candidates, data.offers, data.matchmakers]);

  const go = React.useCallback((name, params={}) => {
    if (name === 'back')  { setStack(s => s.length > 1 ? s.slice(0,-1) : s); return; }
    if (name === 'tab')   { setStack([{ name: TAB_TO_ROUTE[params.tab]||'home', params:{} }]); return; }
    if (NAV_ROUTES.includes(name)) setStack([{ name, params }]);
    else setStack(s => [...s, { name, params }]);
  }, []);

  const showNav  = NAV_ROUTES.includes(cur.name);
  const activeTab = ROUTE_TO_TAB[cur.name] || 'home';
  const myUid = user?.uid;
  const matchBadge = React.useMemo(() =>
    (data.offers||[]).filter(o => o.bMm === myUid && o.aMm !== myUid && !['אישר','דחה'].includes(o.bStatus) && o.status !== 'נדחתה').length,
    [data.offers, myUid]);
  const candsBadge = React.useMemo(() =>
    (data.candidates||[]).filter(c => c.mmId === myUid && (c.status === 'pending_mm' || c.pendingApproval)).length,
    [data.candidates, myUid]);

  return (
    <TextsCtx.Provider value={{ texts: { ...data.texts, ...drafts }, defaults: DEFAULT_TEXTS }}>
      <>
      <div className="app-shell" style={{ position:'fixed', inset:0, background:'#1e1a23', display:'flex', justifyContent:'center' }}>
        <div dir="rtl" style={{ width:'100%', maxWidth:430, height:'100%', display:'flex', flexDirection:'column', background:th.cream, fontFamily:th.body, overflow:'hidden', position:'relative' }}>
          <ImpersonateBanner th={th} />
          {data.loading
            ? <div style={{ flex:1, display:'flex', alignItems:'center', justifyContent:'center' }}><Logo size={60} color={th.primary} flaw={th.cream} /></div>
            : renderScreen(cur, th, go, profile)}
          {showNav && !data.loading && <BottomNav active={activeTab} onNav={(tab) => go('tab',{tab})} th={th} badges={{ match: matchBadge, cands: candsBadge }} />}

          {/* Admin floating edit-mode button */}
          {isAdmin && !data.loading && screenKeys.length > 0 && !editMode && (
            <button onClick={() => setEditMode(true)} style={{ position:'absolute', bottom: showNav ? 78 : 18, left: 16, zIndex: 40, border:'none', borderRadius:999, padding:'8px 14px', cursor:'pointer', fontFamily:th.display, fontWeight:700, fontSize:12.5, background:th.card, color:alpha(th.ink,0.6), display:'flex', alignItems:'center', gap:6, boxShadow:`0 2px 14px ${alpha(th.ink,0.13)}` }}>
              <Icon name="pencil" size={14} />
              עריכת טקסטים
            </button>
          )}

          {/* Edit mode Sheet */}
          <Sheet open={editMode} onClose={cancelEdit} th={th} title="עריכת טקסטים" height="82%">
            <div style={{ fontFamily:th.body, fontSize:13, color:alpha(th.ink,0.5), marginBottom:18, lineHeight:1.5 }}>
              השינויים מתעדכנים בזמן אמת במסך. לחץ/י שמור כדי לשמור לצמיתות.
            </div>
            {screenKeys.map(key => (
              <div key={key} style={{ marginBottom:20 }}>
                <div style={{ fontFamily:th.body, fontSize:11.5, color:th.gold, fontWeight:700, marginBottom:6 }}>{TEXT_KEYS[key]}</div>
                <textarea
                  value={drafts[key] !== undefined ? drafts[key] : (data.texts[key] || DEFAULT_TEXTS[key] || '')}
                  onChange={e => setDraft(key, e.target.value)}
                  rows={['body','desc','next','text'].some(s => key.includes(s)) ? 3 : 1}
                  style={{ width:'100%', boxSizing:'border-box', borderRadius:8, border:`1.5px solid ${drafts[key] !== undefined ? th.primary : alpha(th.ink,0.15)}`, padding:'8px 10px', fontFamily:th.body, fontSize:14, resize:'vertical', outline:'none', direction:'rtl', background: drafts[key] !== undefined ? alpha(th.primary,0.03) : 'transparent' }}
                />
                {drafts[key] !== undefined && <div style={{ fontFamily:th.body, fontSize:11, color:th.primary, marginTop:3 }}>✎ שונה</div>}
              </div>
            ))}
            <div style={{ display:'flex', gap:8, paddingTop:4 }}>
              <Btn th={th} full disabled={savingTexts} onClick={saveTexts}>
                {savingTexts ? 'שומר…' : Object.keys(drafts).length ? `שמור ${Object.keys(drafts).length} שינויים` : 'שמור'}
              </Btn>
              <Btn th={th} variant="ghost" onClick={cancelEdit}>ביטול</Btn>
            </div>
          </Sheet>
        </div>
      </div>
      <TweaksPanel title="Tweaks">
        <TweakSection label="כרטיסיית מועמד" />
        <TweakRadio label="סגנון" value={t.cardVariant} options={['קלאסי','מגזין','מינימלי']} onChange={v => setTweak('cardVariant',v)} />
        <TweakSection label="תוכן הכרטיסייה" />
        <TweakToggle label="דבר השדכן" value={t.showMmNote} onChange={v => setTweak('showMmNote', v)} />
        <TweakSection label="צבע" />
        <TweakColor label="צבע ראשי" value={t.primaryColor} options={['#E8547A','#C0436B','#7B4B8A','#E0533F','#2B6E5C']} onChange={v => setTweak('primaryColor',v)} />
        <TweakSection label="טיפוגרפיה" />
        <TweakRadio label="פונט" value={t.fontPair} options={['אופי','נקי','ידידותי']} onChange={v => setTweak('fontPair',v)} />
        <TweakSection label="פריסה" />
        <TweakRadio label="עיגול פינות" value={t.radius} options={['חד','רך','מעוגל']} onChange={v => setTweak('radius',v)} />
        <TweakRadio label="צפיפות" value={t.density} options={['קומפקטי','רגיל','מרווח']} onChange={v => setTweak('density',v)} />
      </TweaksPanel>
      </>
    </TextsCtx.Provider>
  );
}

function App() {
  const { user, profile } = useAuthState();
  const data = useFirebaseData(user?.uid);
  const [t]  = useTweaks(TWEAK_DEFAULTS);
  const th   = makeTheme(t);
  const [inviteToken] = React.useState(() => {
    const raw = new URLSearchParams(window.location.search).get('invite');
    if (!raw) return null;
    const clean = raw.split(/https?:\/\//)[0];
    return clean || null;
  });
  // All hooks must come before any conditional returns (Rules of Hooks)
  const [impersonate, setImpersonate] = React.useState(null);
  const startImpersonate = React.useCallback((uid, prof, type) =>
    setImpersonate({ uid, profile: { ...prof, uid }, type }), []);
  const stopImpersonate = React.useCallback(() => setImpersonate(null), []);

  if (user === undefined) {
    return (
      <div style={{ position:'fixed', inset:0, background:'#1e1a23', display:'flex', justifyContent:'center' }}>
        <div style={{ width:'100%', maxWidth:430, height:'100%', display:'flex', alignItems:'center', justifyContent:'center', background:th.cream }}>
          <Logo size={60} color={th.primary} flaw={th.cream} />
        </div>
      </div>
    );
  }

  if (!user) {
    return (
      <div style={{ position:'fixed', inset:0, background:'#1e1a23', display:'flex', justifyContent:'center' }}>
        <div style={{ width:'100%', maxWidth:430, background:th.cream, height:'100%' }}>
          {inviteToken
            ? <CandidateInviteRegister th={th} inviteToken={inviteToken} />
            : <LoginScreen th={th} inviteToken={inviteToken} />}
        </div>
      </div>
    );
  }

  // impersonate = { uid, profile, type: 'matchmaker'|'candidate' }
  const effectiveUser    = impersonate ? { ...user, uid: impersonate.uid } : user;
  const effectiveProfile = impersonate ? impersonate.profile : profile;

  return (
    <AuthCtx.Provider value={{
      user: effectiveUser, profile: effectiveProfile,
      realProfile: profile, realUser: user,
      isImpersonating: !!impersonate,
      impersonateType: impersonate?.type || null,
      startImpersonate, stopImpersonate,
    }}>
      <DataCtx.Provider value={data}>
        <AppInner inviteToken={inviteToken} />
      </DataCtx.Provider>
    </AuthCtx.Provider>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { err: null, info: null }; }
  componentDidCatch(err, info) { this.setState({ err, info }); console.error(err, info); }
  render() {
    const { err, info } = this.state;
    if (!err) return this.props.children;
    const stack = (info?.componentStack || '').trim();
    return (
      <div style={{ position:'fixed', inset:0, background:'#1a0a0a', color:'#ff6b6b', fontFamily:'monospace', overflowY:'auto', padding:'28px 20px', direction:'ltr', boxSizing:'border-box' }}>
        <div style={{ maxWidth:600, margin:'0 auto' }}>
          <div style={{ fontSize:13, color:'#ff9999', marginBottom:6, fontWeight:700, letterSpacing:1 }}>REACT ERROR</div>
          <div style={{ fontSize:17, fontWeight:700, marginBottom:16, color:'#ffaaaa', lineHeight:1.4 }}>{err.toString()}</div>
          {stack && (
            <>
              <div style={{ fontSize:11, color:'#ff6b6b88', marginBottom:6, letterSpacing:1 }}>COMPONENT STACK</div>
              <pre style={{ fontSize:11, color:'#ff9999aa', whiteSpace:'pre-wrap', wordBreak:'break-all', margin:'0 0 20px', lineHeight:1.5 }}>{stack}</pre>
            </>
          )}
          {err.stack && (
            <>
              <div style={{ fontSize:11, color:'#ff6b6b88', marginBottom:6, letterSpacing:1 }}>STACK TRACE</div>
              <pre style={{ fontSize:11, color:'#ff9999aa', whiteSpace:'pre-wrap', wordBreak:'break-all', margin:0, lineHeight:1.5 }}>{err.stack}</pre>
            </>
          )}
          <button onClick={() => this.setState({ err:null, info:null })} style={{ marginTop:24, padding:'10px 22px', background:'#ff6b6b22', border:'1.5px solid #ff6b6b55', borderRadius:8, color:'#ff9999', fontFamily:'monospace', fontSize:13, cursor:'pointer' }}>
            נסה שוב
          </button>
        </div>
      </div>
    );
  }
}

// Also catch unhandled JS errors (outside React tree)
window.addEventListener('error', (e) => {
  const root = document.getElementById('root');
  if (root && root.innerHTML.trim() === '') {
    root.innerHTML = `<div style="position:fixed;inset:0;background:#1a0a0a;color:#ff6b6b;font-family:monospace;padding:28px 20px;overflow:auto;direction:ltr"><div style="max-width:600px;margin:0 auto"><div style="font-size:13px;font-weight:700;margin-bottom:8px;color:#ff9999">JS ERROR</div><div style="font-size:17px;color:#ffaaaa;margin-bottom:16px">${e.message}</div><pre style="font-size:11px;color:#ff9999aa;white-space:pre-wrap">${e.error?.stack || ''}</pre></div></div>`;
  }
});

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary><App /></ErrorBoundary>
);
</script>
</body>
