          deleteCandidate, uploadPhoto, updateText, setUserAdmin, updateList } = useContext(DataCtx);
  const [tab, setTab]         = useState('candidates');
  const [editCand, setEditCand] = useState(null);
  const [newCand,  setNewCand]  = useState(false);
  const [editKey,  setEditKey]  = useState(null);
  const [editVal,  setEditVal]  = useState('');
  const [seeding,  setSeeding]  = useState(false);
  const [updatingPhotos, setUpdatingPhotos] = useState(false);
  const [hideSeed, setHideSeed] = useState(() => localStorage.getItem('hideSeed') === 'true');
  const [waitingPanelLight, setWaitingPanelLight] = useState(() => localStorage.getItem('waitingPanelLight') !== 'false');
  const [invitesOpen, setInvitesOpen] = useState(false);
  const toggleHideSeed = () => setHideSeed(v => { localStorage.setItem('hideSeed', String(!v)); return !v; });
  const toggleWaitingPanel = () => setWaitingPanelLight(v => {
    const next = !v;
    // store 'false' to get dark; remove key (or set 'true') for light (default)
    if (next) localStorage.removeItem('waitingPanelLight');
    else localStorage.setItem('waitingPanelLight', 'false');
    window.dispatchEvent(new Event('waitingPanelChanged'));
    return next;
  });

  // Matchmaker is fictional if it has a seed_ prefix
  const isSeedMm  = (id) => typeof id === 'string' && id.startsWith('seed_');
  // Candidate is fictional if it was never registered via email/password (no candidateUid)
  // isSeed works for both: seed_ prefix → fictional; candidate lookup → fictional if no candidateUid
  const isSeed    = (id) => {
    if (typeof id !== 'string') return false;
    if (id.startsWith('seed_')) return true;
    const cand = candidates.find(c => c.id === id);
    return cand ? !cand.candidateUid : false;
  };
  const visibleCands = hideSeed ? candidates.filter(c => !c.candidateUid) : candidates;
  const visibleMms   = hideSeed ? Object.fromEntries(Object.entries(matchmakers).filter(([id]) => !isSeedMm(id))) : matchmakers;

  const db_avatar = (seed, gender) =>
    `https://api.dicebear.com/9.x/${(gender === 'f' || gender === 'אשה') ? 'lorelei' : 'micah'}/png?seed=${encodeURIComponent(seed)}&size=300&backgroundColor=b6e3f4,c0aede,d1d4f9,ffd5dc,ffdfbf`;

  const SEED_DATA = {
    'דניאל כהן':    { seed: 'daniel-cohen',    gender: 'm', sabaBut: 'מסביר לכולם שהוא "לא בן אדם של בוקר" — כולל ב-11:30' },
    'מיכל שפירא':   { seed: 'michal-shapira',  gender: 'f', sabaBut: 'מדרגת את כל הסרטים לפי כמות הכלבים שמופיעים בהם' },
    'אורי לוין':    { seed: 'uri-levin',        gender: 'm', sabaBut: 'חושב שאם הוא לא שמע על הסרט — הוא כנראה לא טוב' },
    'שירה אברהם':   { seed: 'shira-avraham',    gender: 'f', sabaBut: 'מתווכחת בשינה — ומנצחת' },
    'נועם גולדברג':  { seed: 'noam-goldberg',   gender: 'm', sabaBut: 'מסביר את כל הבעיות בחיים עם אנלוגיות מגולף' },
    'אביגיל רוזן':  { seed: 'avigail-rosen',    gender: 'f', sabaBut: 'מנתחת את כולם פסיכולוגית — כולל את הקופאית בסופר' },
    'אמיר חיון':    { seed: 'amir-hayun',        gender: 'm', sabaBut: 'לא יכול לשבת בבית קפה בלי לקרוא ביקורת על העיצוב שלו' },
    'שושנה פרץ':    { seed: 'shoshana-peretz',   gender: 'f', sabaBut: 'מאבחנת מחלות לכולם בארוחות משפחתיות — גם כשלא שואלים' },
  };

  const updateSeedPhotos = async () => {
    setUpdatingPhotos(true);
    try {
      const snap = await db.collection('candidates').get();
      const batch = db.batch();
      snap.docs.forEach(doc => {
        const d = doc.data();
        const entry = SEED_DATA[d.name];
        if (!entry) return;
        const upd = {};
        if (!d.photos?.length) upd.photos = [db_avatar(entry.seed, entry.gender)];
        if (!d.sabaBut) upd.sabaBut = entry.sabaBut;
        if (Object.keys(upd).length) batch.update(doc.ref, upd);
      });
      await batch.commit();
    } finally {
      setUpdatingPhotos(false);
    }
  };

  if (!profile?.isAdmin) return (
    <div style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', direction: 'rtl', fontFamily: th.body, color: th.error }}>
      אין הרשאות מנהל
    </div>
  );

  const tabs = [['candidates', 'מועמדים'], ['stats', 'סטטיסטיקות'], ['lists', 'רשימות'], ['texts', 'טקסטים'], ['users', 'שדכנים']];

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: th.cream, direction: 'rtl' }}>
      <AppHeader th={th} title="פאנל ניהול" onBack={() => go('back')} />
      <div style={{ display: 'flex', gap: 6, padding: '6px 18px', flexShrink: 0 }}>
        {tabs.map(([id, lbl]) => (
          <button key={id} onClick={() => setTab(id)} style={{ flex: 1, padding: '8px', borderRadius: 999, border: 'none', cursor: 'pointer', fontFamily: th.display, fontWeight: 800, fontSize: 13, background: tab === id ? th.ink : alpha(th.ink, 0.07), color: tab === id ? th.cream : alpha(th.ink, 0.6) }}>{lbl}</button>
        ))}
      </div>

      {/* ── hide-seed toggle ── */}
      <div style={{ padding: '4px 18px 8px', display:'flex', flexWrap:'wrap', alignItems:'center', gap:8, flexShrink:0 }}>
        {/* hide-seed toggle */}
        <button onClick={toggleHideSeed} style={{ display:'flex', alignItems:'center', gap:7, border:'none', background: hideSeed ? alpha(th.ink,0.08) : alpha(th.gold,0.13), borderRadius:999, padding:'6px 14px', cursor:'pointer', transition:'background 0.2s' }}>
          <div style={{ width:28, height:16, background: hideSeed ? th.ink : alpha(th.ink,0.2), borderRadius:999, position:'relative', transition:'background 0.2s', flexShrink:0 }}>
            <div style={{ position:'absolute', top:2, width:12, height:12, borderRadius:'50%', background:'white', transition:'left 0.2s', left: hideSeed ? 14 : 2 }} />
          </div>
          <span style={{ fontFamily:th.body, fontSize:12, fontWeight:700, color: hideSeed ? th.ink : alpha(th.ink,0.5) }}>
            {hideSeed ? 'פיקטיביים מוסתרים' : 'הצג פיקטיביים'}
          </span>
        </button>
        {hideSeed && (
          <span style={{ fontFamily:th.body, fontSize:11, color:alpha(th.ink,0.4) }}>
            {candidates.length - visibleCands.length} מועמדים · {Object.keys(matchmakers).length - Object.keys(visibleMms).length} שדכנים מוסתרים
          </span>
        )}
        {/* waiting panel style toggle */}
        <button onClick={toggleWaitingPanel} style={{ display:'flex', alignItems:'center', gap:7, border:'none', background: waitingPanelLight ? alpha(th.primary,0.1) : alpha(th.ink,0.08), borderRadius:999, padding:'6px 14px', cursor:'pointer', transition:'background 0.2s' }}>
          <div style={{ width:28, height:16, background: waitingPanelLight ? th.primary : alpha(th.ink,0.2), borderRadius:999, position:'relative', transition:'background 0.2s', flexShrink:0 }}>
            <div style={{ position:'absolute', top:2, width:12, height:12, borderRadius:'50%', background:'white', transition:'left 0.2s', left: waitingPanelLight ? 14 : 2 }} />
          </div>
          <span style={{ fontFamily:th.body, fontSize:12, fontWeight:700, color: waitingPanelLight ? th.primary : alpha(th.ink,0.5) }}>
            {waitingPanelLight ? 'פאנל בית: בהיר (ברירת מחדל)' : 'פאנל בית: כהה (קלאסי)'}
          </span>
        </button>
      </div>

      <div style={{ flex: 1, overflowY: 'auto', padding: '10px 18px 30px' }}>
        {/* ── CANDIDATES ── */}
        {tab === 'candidates' && (
          <>
            <Btn th={th} full onClick={() => setInvitesOpen(true)}
              icon={<Icon name="bell" size={18} />} style={{ marginBottom: 10 }}>
              מעקב הזמנות
            </Btn>
            <div style={{ display:'flex', gap:8, marginBottom:10 }}>
              <Btn th={th} full variant="ghost" style={{ color: th.gold, boxShadow: `inset 0 0 0 1.5px ${alpha(th.gold,0.4)}` }}
                onClick={async () => { setSeeding(true); try { await seedTestData(profile.uid); } finally { setSeeding(false); } }}>
                {seeding ? 'טוען…' : '⚡ זרע נתוני בדיקה'}
              </Btn>
              <Btn th={th} variant="ghost" style={{ color: th.error, boxShadow: `inset 0 0 0 1.5px ${alpha(th.error,0.3)}`, flexShrink:0, padding:'0 14px' }}
                onClick={async () => { if(confirm('למחוק את כל נתוני הבדיקה?')) { setSeeding(true); try { await clearSeedData(); } finally { setSeeding(false); } } }}>
                🗑 נקה
              </Btn>
            </div>

            <InvitationsSheet open={invitesOpen} onClose={() => setInvitesOpen(false)} th={th} mmUid={profile?.uid} />
            {candidates.length > 0 && candidates.some(c => !c.photos?.length || !c.sabaBut) && (
              <Btn th={th} full variant="ghost" style={{ marginBottom: 14, color: th.gold, boxShadow: `inset 0 0 0 1.5px ${alpha(th.gold,0.4)}` }}
                onClick={updateSeedPhotos}>
                {updatingPhotos ? 'מעדכן תמונות…' : '🖼 הוסף תמונות DiceBear למועמדי בדיקה'}
              </Btn>
            )}
            {newCand && <CandidateForm th={th} onSave={async (data) => { const id = await addCandidate(data); setNewCand(false); go('candidate', { id }); }} onCancel={() => setNewCand(false)} />}
            {visibleCands.map(c => {
              return (
              <div key={c.id} style={{ background: th.card, borderRadius: th.r, padding: 14, marginBottom: 10, boxShadow: `0 4px 14px ${alpha(th.ink, 0.06)}` }}>
                {editCand === c.id
                  ? <CandidateForm th={th} initial={c} onSave={async (data) => { await updateCandidate(c.id, data); setEditCand(null); go('candidate', { id: c.id }); }} onCancel={() => setEditCand(null)} onUpload={(file) => uploadPhoto(c.id, file)} />
                  : (
                    <>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8 }}>
                        <Avatar grad={gradForId(c.id)} name={c.name} size={44} photo={c.photos?.[0]} />
                        <div style={{ flex: 1 }}>
                          <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 15, color: th.ink }}>{c.name}, {c.age}</div>
                          <div style={{ fontFamily: th.body, fontSize: 12, color: alpha(th.ink, 0.5) }}>{c.region} · {c.religiosity}</div>
                        </div>
                        {c.candidateUid && (
                          <button onClick={() => { startImpersonate(c.candidateUid, { uid: c.candidateUid, displayName: c.name, name: c.name }, 'candidate'); go('candidateMode'); }}
                            title="צפה כמועמד/ת" style={{ border:'none', background:alpha('#7B2D00',0.08), color:'#7B2D00', borderRadius:8, width:34, height:34, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', fontSize:16 }}>🎭</button>
                        )}
                        <button onClick={() => setEditCand(c.id)} style={{ border: 'none', background: alpha(th.ink, 0.06), color: th.ink, borderRadius: 8, width: 34, height: 34, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Icon name="edit" size={17} /></button>
                        <button onClick={() => { if (confirm('למחוק?')) deleteCandidate(c.id); }} style={{ border: 'none', background: alpha(th.error, 0.08), color: th.error, borderRadius: 8, width: 34, height: 34, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Icon name="trash" size={17} /></button>
                      </div>
                      {c.photos?.length > 0 && (
                        <div style={{ display: 'flex', gap: 6, overflowX: 'auto' }}>
                          {c.photos.map((url, i) => <img key={i} src={url} alt="" style={{ width: 56, height: 56, borderRadius: 8, objectFit: 'cover', flexShrink: 0 }} />)}
                        </div>
                      )}
                    </>
                  )}
              </div>
            );})}
          </>
        )}

        {/* ── LISTS ── */}
        {tab === 'lists' && (() => {
          const liveRegions       = (lists.regions       && lists.regions.length)       ? lists.regions       : REGIONS;
          const liveReligiosity   = (lists.religiosity    && lists.religiosity.length)   ? lists.religiosity   : RELIGIOSITY;
          const liveInterests     = (lists.interests      && lists.interests.length)     ? lists.interests     : INTERESTS;
          const livePartnerTraits = (lists.partnerTraits  && lists.partnerTraits.length) ? lists.partnerTraits : PARTNER_TRAITS;

          const listDefs = [
            { key: 'interests',     label: 'תחומי עניין',       live: liveInterests },
            { key: 'partnerTraits', label: 'חשוב בפרטנר',       live: livePartnerTraits },
            { key: 'religiosity',   label: 'קרבה לדת',          live: liveReligiosity },
            { key: 'regions',       label: 'אזורים',             live: liveRegions },
          ];

          return (
            <ListsEditor th={th} listDefs={listDefs} onSave={(key, val) => updateList(key, val)} />
          );
        })()}

        {/* ── TEXTS (CMS) ── */}
        {tab === 'texts' && (
          <>
            <div style={{ fontFamily: th.body, fontSize: 13, color: alpha(th.ink, 0.55), marginBottom: 14 }}>עריכת טקסטים קבועים באפליקציה. לחץ על טקסט לעריכה.</div>
            {Object.entries(TEXT_KEYS).map(([key, label]) => (
              <div key={key} style={{ background: th.card, borderRadius: th.r, padding: 12, marginBottom: 8, boxShadow: `0 3px 10px ${alpha(th.ink, 0.05)}` }}>
                <div style={{ fontFamily: th.body, fontSize: 11, color: th.gold, fontWeight: 700, marginBottom: 4 }}>{label}</div>
                {editKey === key ? (
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                    <textarea value={editVal} onChange={e => setEditVal(e.target.value)} rows={2} style={{ width: '100%', borderRadius: 8, border: `1.5px solid ${alpha(th.ink,0.15)}`, padding: '8px 10px', fontFamily: th.body, fontSize: 14, resize: 'none', outline: 'none' }} />
                    <div style={{ display: 'flex', gap: 8 }}>
                      <Btn th={th} size="s" onClick={async () => { await updateText(key, editVal); setEditKey(null); }}>שמור</Btn>
                      <Btn th={th} size="s" variant="ghost" onClick={() => setEditKey(null)}>ביטול</Btn>
                    </div>
                  </div>
                ) : (
                  <button onClick={() => { setEditKey(key); setEditVal(texts[key] || DEFAULT_TEXTS[key] || ''); }} style={{ all: 'unset', cursor: 'pointer', display: 'block', width: '100%', fontFamily: th.body, fontSize: 14, color: th.ink, lineHeight: 1.4 }}>
                    {texts[key] || DEFAULT_TEXTS[key] || <span style={{ color: alpha(th.ink, 0.35) }}>(ריק)</span>}
                  </button>
                )}
              </div>
            ))}
          </>
        )}

        {/* ── STATS ── */}
        {tab === 'stats' && <AdminStats th={th} hideSeed={hideSeed} isSeed={isSeed} />}

        {/* ── USERS (matchmakers) ── */}
        {tab === 'users' && (() => {
          return Object.values(visibleMms).map(u => {
            const mmCands = visibleCands.filter(c => c.mmId === u.id);
            return (
              <div key={u.id} style={{ background: th.card, borderRadius: th.r, padding: 12, marginBottom: 10, boxShadow: `0 3px 10px ${alpha(th.ink, 0.05)}` }}>
                {/* matchmaker row */}
                <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: mmCands.length ? 10 : 0 }}>
                  <Avatar grad={gradForId(u.id)} name={u.displayName || u.email} size={40} photo={u.photoURL} />
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 14, color: th.ink }}>{u.displayName || u.email}</div>
                    <div style={{ fontFamily: th.body, fontSize: 12, color: alpha(th.ink, 0.5) }}>{u.email} · {mmCands.length} מועמדים</div>
                  </div>
                  <button onClick={() => setUserAdmin(u.id, !u.isAdmin)} style={{ border: 'none', borderRadius: 999, padding: '5px 10px', cursor: 'pointer', fontFamily: th.body, fontWeight: 700, fontSize: 11, background: u.isAdmin ? alpha(th.gold, 0.15) : alpha(th.ink, 0.07), color: u.isAdmin ? th.gold : alpha(th.ink, 0.5) }}>
                    {u.isAdmin ? 'מנהל ✓' : 'מנהל'}
                  </button>
                  <button onClick={() => { startImpersonate(u.id, u, 'matchmaker'); go('home'); }}
                    style={{ border: 'none', borderRadius: 999, padding: '5px 10px', cursor: 'pointer', fontFamily: th.display, fontWeight: 800, fontSize: 11, background: alpha('#7B2D00', 0.1), color: '#7B2D00' }}>
                    🎭 התחזה
                  </button>
                </div>
                {/* candidates mini-list */}
                {mmCands.length > 0 && (
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, paddingTop: 8, borderTop: `1px solid ${alpha(th.ink,0.07)}` }}>
                    {mmCands.map(c => (
                      <button key={c.id} onClick={() => go('candidate', { id: c.id })}
                        style={{ all:'unset', cursor:'pointer', display:'flex', alignItems:'center', gap:5, background:alpha(th.ink,0.05), borderRadius:999, padding:'4px 10px 4px 6px' }}>
                        <Avatar grad={gradForId(c.id)} name={c.name} size={22} photo={c.photos?.[0]} />
                        <span style={{ fontFamily:th.body, fontSize:12, fontWeight:600, color:th.ink }}>{c.name}</span>
                      </button>
                    ))}
                  </div>
                )}
              </div>
            );
          });
        })()}
      </div>
    </div>
  );
}

function CandidateForm({ th, initial, onSave, onCancel, onUpload }) {
  const { lists } = useContext(DataCtx);
  const liveRegions      = (lists.regions      && lists.regions.length)      ? lists.regions      : REGIONS;
  const liveReligiosity  = (lists.religiosity   && lists.religiosity.length)  ? lists.religiosity  : RELIGIOSITY;
  const liveInterests    = (lists.interests     && lists.interests.length)    ? lists.interests    : INTERESTS;
  const livePartnerTraits = (lists.partnerTraits && lists.partnerTraits.length) ? lists.partnerTraits : PARTNER_TRAITS;

  const [step, setStep] = useState(0);
  const [f, setF] = useState(initial || { name:'', age:'', gender:'אשה', region:'', religiosity:'', family:'רווק/ה', kids:0, sabaBut:'', oneLine:'', seesWith:'', interests:[], partner:[], discrete:'', available:true });
  const set = (k) => (v) => setF(s => ({ ...s, [k]: v }));
  const [uploading, setUploading] = useState(false);
  const [uploadedCount, setUploadedCount] = useState((initial?.photos || []).length);

  const steps = onUpload
    ? ['פרטים בסיסיים', 'אישיות', 'תחומי עניין', 'תמונות ופרטים']
    : ['פרטים בסיסיים', 'אישיות', 'תחומי עניין', 'פרטים נוספים'];

  const isLast = step === steps.length - 1;

  const StepDots = () => (
    <div style={{ display: 'flex', justifyContent: 'center', gap: 6, marginBottom: 18 }}>
      {steps.map((s, i) => (
        <div key={i} onClick={() => i < step && setStep(i)} style={{ width: i === step ? 22 : 8, height: 8, borderRadius: 999, background: i === step ? th.primary : i < step ? alpha(th.primary, 0.4) : alpha(th.ink, 0.15), cursor: i < step ? 'pointer' : 'default', transition: 'all 0.2s' }} />
      ))}
    </div>
  );

  return (
    <div style={{ background: alpha(th.ink, 0.03), borderRadius: th.r, padding: 16, marginBottom: 12, border: `1.5px solid ${alpha(th.ink,0.1)}` }}>
      <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 15, color: th.ink, marginBottom: 10, textAlign: 'center' }}>
        {steps[step]}
      </div>
      <StepDots />

      {step === 0 && (
        <>
          <Field th={th} label="שם"><TextInput th={th} value={f.name} onChange={set('name')} /></Field>
          <Field th={th} label="גיל"><TextInput th={th} type="number" value={f.age} onChange={v => setF(s => ({...s, age: +v}))} /></Field>
          <Field th={th} label="מין"><Segmented th={th} value={f.gender} onChange={set('gender')} options={['אשה', 'גבר']} /></Field>
          <Field th={th} label="אזור"><Select th={th} value={f.region} onChange={set('region')} options={liveRegions} /></Field>
          <Field th={th} label="קרבה לדת"><Select th={th} value={f.religiosity} onChange={set('religiosity')} options={liveReligiosity} /></Field>
        </>
      )}

      {step === 1 && (
        <>
          <Field th={th} label="סבבה והכל, אבל…" hint='למשל: "שואל את גוגל Maps כשהוא יודע בדיוק לאן הוא הולך"'>
            <TextArea th={th} value={f.sabaBut} onChange={set('sabaBut')} placeholder='משהו אמיתי ומצחיק שמאפיין אותו/ה…' rows={2} />
          </Field>
          <Field th={th} label="במשפט אחד"><TextInput th={th} value={f.oneLine} onChange={set('oneLine')} placeholder='הגדרה קצרה של האדם…' /></Field>
          <Field th={th} label="רואה את עצמו/ה עם">
            <TextArea th={th} value={f.seesWith} onChange={set('seesWith')} placeholder='תאר/י את הזוגיות שהוא/היא מדמיין/ת לעצמו/ה…' rows={3} />
          </Field>
        </>
      )}

      {step === 2 && (
        <>
          <Field th={th} label="תחומי עניין">
            <MultiChips th={th} value={f.interests} onChange={v => setF(s => ({...s, interests: v}))} options={liveInterests} tone={th.primary} />
          </Field>
          <Field th={th} label="חשוב בפרטנר">
            <MultiChips th={th} value={f.partner} onChange={v => setF(s => ({...s, partner: v}))} options={livePartnerTraits} tone={th.gold} />
          </Field>
        </>
      )}

      {step === 3 && (
        <>
          <Field th={th} label="פרטים דיסקרטיים" hint="גלוי לך בלבד — שדכנים אחרים לא יראו שדה זה">
            <TextArea th={th} value={f.discrete} onChange={set('discrete')} rows={3} placeholder='מידע רגיש שחשוב לדעת…' />
          </Field>
          {onUpload && (
            <div style={{ marginBottom: 12 }}>
              <div style={{ fontFamily: th.body, fontWeight: 700, fontSize: 14, marginBottom: 2, color: th.ink }}>העלאת תמונות</div>
              <div style={{ fontFamily: th.body, fontSize: 12, color: alpha(th.ink, 0.5), marginBottom: 8 }}>ניתן להעלות מספר תמונות · מומלץ תמונות מאונכות באיכות טובה{uploadedCount > 0 ? ` · ${uploadedCount} הועלו` : ''}</div>
              <input type="file" accept="image/*" multiple onChange={async (e) => {
                const files = Array.from(e.target.files);
                if (!files.length) return;
                setUploading(true);
                for (const file of files) { await onUpload(file); setUploadedCount(c => c + 1); }
                setUploading(false);
              }} />
              {uploading && <div style={{ fontFamily: th.body, fontSize: 12, color: th.gold, marginTop: 4 }}>מעלה…</div>}
            </div>
          )}
        </>
      )}

      <div style={{ display: 'flex', gap: 8, marginTop: 16 }}>
        {step > 0
          ? <Btn th={th} variant="ghost" onClick={() => setStep(s => s - 1)}>← חזרה</Btn>
          : <Btn th={th} variant="ghost" onClick={onCancel}>ביטול</Btn>
        }
        {isLast
          ? <Btn th={th} full onClick={() => onSave(f)}>שמור</Btn>
          : <Btn th={th} full onClick={() => setStep(s => s + 1)}>הבא →</Btn>
        }
      </div>
    </div>
  );
}

const TEXT_KEYS = {
  onb_slide1_title: 'אונבורדינג — כותרת שקף 1',
  onb_slide1_body:  'אונבורדינג — גוף שקף 1',

// ONBOARDING
// ════════════════════════════════════════════════════════════
function Onboarding({ th, go }) {
  const [i, setI] = useS(0);
  const slides = [
    {
      kind: 'friends',
      title: 'סבבה והכל אבל...',
      body: 'איזה כיף להכניס קצת הומור לכל הכבדות!',
    },
    {
      kind: 'list',
      title: 'הרשימה שלך, תמיד לפנייך',
      body: 'כל הרווקים והרווקות שלך במקום אחד — מסודר, חי ונושם.',
    },
    {
      kind: 'ai',
      title: 'AI מציע, את/ה מחליט/ה',
      body: 'אפשר לשדך לבד, אפשר להיעזר ברובוט, העיקר שנזכה במצוות!',
    },
  ];
  const last = i === slides.length - 1;
  const s = slides[i];

  const Scene = () => {
    if (s.kind === 'list') return (
      <div style={{ position: 'relative', width: 220, height: 200 }}>
        {[2, 1, 0].map((k, idx) => (
          <div key={k} style={{
            position: 'absolute', top: k * 18, right: k * 14, left: k * 14,
            background: th.card, borderRadius: th.r, padding: 14,
            boxShadow: `0 10px 26px ${alpha(th.ink, 0.12)}`,
            display: 'flex', alignItems: 'center', gap: 12,
            transform: `scale(${1 - k * 0.05})`, opacity: 1 - k * 0.15,
          }}>
            <Avatar grad={AV_GRADS[idx * 2]} name={['ד','א','ש'][idx]} size={42} />
            <div style={{ flex: 1 }}>
              <div style={{ height: 9, width: '60%', background: alpha(th.ink, 0.15), borderRadius: 6, marginBottom: 7 }} />
              <div style={{ height: 7, width: '85%', background: alpha(th.primary, 0.25), borderRadius: 6 }} />
            </div>
          </div>
        ))}
      </div>
    );
    if (s.kind === 'friends') return (
      <div style={{ display: 'flex', alignItems: 'center', gap: 0 }}>
        <Avatar grad={AV_GRADS[4]} name="נ" size={92} style={{ marginInlineEnd: -16, zIndex: 2 }} />
        <div style={{ zIndex: 3, background: th.primary, borderRadius: '50%', width: 56, height: 56, display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff', boxShadow: `0 10px 24px ${alpha(th.primary,0.4)}` }}>
          <Icon name="heart" size={30} fill="#fff" stroke={0} />
        </div>
        <Avatar grad={AV_GRADS[3]} name="א" size={92} style={{ marginInlineStart: -16, zIndex: 1 }} />
      </div>
    );
    if (s.kind === 'ai') return (
      <div style={{ position: 'relative', color: th.gold }}>
        <div style={{ background: alpha(th.gold, 0.14), borderRadius: 40, padding: 30 }}>
          <Icon name="robot" size={90} stroke={1.6} />
        </div>
        <div style={{ position: 'absolute', bottom: -6, left: -6, color: th.primary, background: th.cream, borderRadius: '50%', padding: 8 }}>
          <Icon name="rose" size={34} stroke={1.8} />
        </div>
      </div>
    );
    return <Logo size={150} color={th.primary} flaw={th.cream} />;
  };

  return (
    <div style={{
      height: '100%', display: 'flex', flexDirection: 'column',
      background: `linear-gradient(170deg, ${th.cream}, ${tint(th.primary, 0.84)})`,
      direction: 'rtl', fontFamily: th.body, position: 'relative',
    }}>
      {/* skip */}
      <div style={{ paddingTop: 52, paddingInline: 20, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 7 }}>
          <Logo size={26} color={th.primary} flaw={th.cream} />
          <span style={{ fontFamily: th.display, fontWeight: 800, color: th.ink, fontSize: 18 }}>סבבה והכל</span>
        </div>
        {!last && <button onClick={() => setI(slides.length - 1)} style={{ border: 'none', background: 'none', color: alpha(th.ink, 0.5), fontFamily: th.body, fontWeight: 700, fontSize: 14, cursor: 'pointer' }}>דלג/י</button>}
      </div>

      {/* scene */}
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '0 28px', textAlign: 'center' }}>
        <div key={i} style={{ marginBottom: 40, animation: 'sabaPop .5s cubic-bezier(.2,.9,.3,1)', display: 'flex', justifyContent: 'center' }}><Scene /></div>
        <h1 key={'t'+i} style={{ fontFamily: th.display, fontSize: 28, color: th.ink, margin: '0 0 12px', lineHeight: 1.15, animation: 'sabaUp .4s ease' }}>{s.title}</h1>
        <p style={{ fontFamily: th.body, fontSize: 16.5, color: alpha(th.ink, 0.62), lineHeight: 1.5, maxWidth: 300, margin: 0, textWrap: 'pretty' }}>{s.body}</p>
      </div>

      {/* dots + controls */}
      <div style={{ padding: '0 24px 40px' }}>
        <div style={{ display: 'flex', justifyContent: 'center', gap: 7, marginBottom: 22 }}>
          {slides.map((_, k) => (
            <div key={k} onClick={() => setI(k)} style={{
              width: k === i ? 22 : 8, height: 8, borderRadius: 99, cursor: 'pointer',
              background: k === i ? th.primary : alpha(th.ink, 0.18), transition: 'all .3s',
            }} />
          ))}
        </div>
        {last ? (
          <Btn th={th} full size="l" onClick={() => go('register')}>שנתחיל?</Btn>
        ) : (
          <Btn th={th} full size="l" onClick={() => setI(i + 1)} icon={<span style={{ transform: 'scaleX(-1)', display: 'inline-flex' }}><Icon name="arrow" size={20} /></span>}>הבא</Btn>
        )}
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// MATCHMAKER REGISTRATION
// ════════════════════════════════════════════════════════════
function Register({ th, go }) {
  const { user } = useContext(AuthCtx);
  const { lists } = useContext(DataCtx);
  const liveRegions = (lists.regions && lists.regions.length) ? lists.regions : REGIONS;
  const [f, setF] = useS({ name: '', phone: '', region: '', gender: '', bio: '' });
  const [photoURL, setPhotoURL] = useS('');
  const [uploading, setUploading] = useS(false);
  const [saving, setSaving] = useS(false);
  const set = (k) => (v) => setF(s => ({ ...s, [k]: v }));
  const valid = f.name && f.phone && f.region && f.gender;

  const handlePhoto = async (e) => {
    const file = e.target.files[0];
    if (!file || !user) return;
    setUploading(true);
    try {
      const ref = storage.ref(`profiles/${user.uid}/${Date.now()}_${file.name}`);
      await ref.put(file);
      const url = await ref.getDownloadURL();
      setPhotoURL(url);
    } catch(err) { alert('שגיאה בהעלאת תמונה: ' + err.message); }
    setUploading(false);
  };

  const handleSave = async () => {
    if (!valid || !user) return;
    setSaving(true);
    try {
      await db.collection('users').doc(user.uid).update({
        displayName: f.name,
        phone: f.phone,
        region: f.region,
        gender: f.gender,
        bio: f.bio,
        ...(photoURL ? { photoURL } : {}),
        profileComplete: true,
      });
      go('home');
    } catch(err) { alert('שגיאה: ' + err.message); setSaving(false); }
  };

  return (
    <>
      <AppHeader th={th} title="נעים להכיר" sub="כמה פרטים ונצא לדרך" onBack={() => go('onboarding')} />
      <div style={{ flex: 1, overflowY: 'auto', padding: '18px 18px 30px' }}>
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', marginBottom: 22 }}>
          <label style={{ cursor: 'pointer' }}>
            <input type="file" accept="image/*" style={{ display: 'none' }} onChange={handlePhoto} />
            {photoURL
              ? <img src={photoURL} alt="" decoding="async" style={{ width: 108, height: 108, borderRadius: '50%', objectFit: 'cover', border: `3px solid ${th.primary}` }} />
              : <div style={{ width: 108, height: 108, borderRadius: '50%', background: alpha(th.primary, 0.1), border: `2px dashed ${alpha(th.ink, 0.25)}`, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 6, color: alpha(th.ink, 0.5) }}>
                  <Icon name="camera" size={28} />
                  <span style={{ fontFamily: th.body, fontSize: 12 }}>{uploading ? 'מעלה…' : 'תמונה'}</span>
                </div>}
          </label>
          <div style={{ fontFamily: th.body, fontSize: 13, color: alpha(th.ink, 0.5), marginTop: 8 }}>לחץ/י להוספת תמונת פרופיל</div>
        </div>

        <Field th={th} label="שם פרטי ומשפחה" required>
          <TextInput th={th} value={f.name} onChange={set('name')} placeholder="נועה לוי" />
        </Field>
        <Field th={th} label="טלפון (לוואטסאפ)" required hint="לא יוצג למועמדים — משמש לתיאומים">
          <TextInput th={th} type="tel" value={f.phone} onChange={set('phone')} placeholder="050-0000000" />
        </Field>
        <Field th={th} label="אזור מגורים" required>
          <Select th={th} value={f.region} onChange={set('region')} options={liveRegions} />
        </Field>
        <Field th={th} label="מין" required>
          <Segmented th={th} value={f.gender} onChange={set('gender')} options={['אישה', 'גבר']} />
        </Field>
        <Field th={th} label="קצת עלייך" hint="לא חובה — אפשר להשלים מאוחר יותר בהגדרות">
          <TextArea th={th} value={f.bio} onChange={set('bio')} placeholder="שדכנית בלב, מאמינה שלכל אחד יש את הסבבה־והכל שלו…" rows={3} />
        </Field>

        <div style={{ marginTop: 8 }}>
          <Btn th={th} full size="l" disabled={!valid || saving || uploading} onClick={handleSave}>
            {saving ? 'שומר…' : 'יאללה, מתחילים'}
          </Btn>
          <div style={{ textAlign: 'center', fontFamily: th.body, fontSize: 12.5, color: alpha(th.ink, 0.45), marginTop: 12 }}>
            הרשמה פשוטה. את/ה תמיד יכול/ה להשלים פרטים בהמשך.
          </div>
        </div>
      </div>
    </>
  );
}

// ════════════════════════════════════════════════════════════
// MATCHMAKER HOME
// ════════════════════════════════════════════════════════════
function Home({ th, go }) {
  const { profile } = useContext(AuthCtx);
  const { candidates, offers, notifications, markNotificationRead } = useContext(DataCtx);
  const me = profile || { displayName: '', region: '', grad: AV_GRADS[4] };
  const myUid = profile?.uid;
  const mine = candidates.filter(c => c.mmId === myUid);

  // light panel is the default; admin can revert to dark by setting waitingPanelLight='false'
  const [lightPanel, setLightPanel] = React.useState(() => localStorage.getItem('waitingPanelLight') !== 'false');
  React.useEffect(() => {
    const onStorage = () => setLightPanel(localStorage.getItem('waitingPanelLight') !== 'false');
    window.addEventListener('storage', onStorage);
    window.addEventListener('waitingPanelChanged', onStorage);
    return () => { window.removeEventListener('storage', onStorage); window.removeEventListener('waitingPanelChanged', onStorage); };
  }, []);

  // ── Real action counts ──────────────────────────────────────────
  // 1. Offers where I'm the receiver and haven't responded yet
  const offersNeedingMe = React.useMemo(() =>
    offers.filter(o => o.bMm === myUid && !['אישר','דחה'].includes(o.bStatus) && o.status !== 'נדחתה'),
    [offers, myUid]);

  // 2. My candidates not in any active offer within the past 7 days
  const sevenDaysAgo = new Date(Date.now() - 7 * 24 * 3600 * 1000);
  const recentCandIds = React.useMemo(() => new Set(
    offers
      .filter(o => new Date(o.createdAt) > sevenDaysAgo && o.status !== 'נדחתה')
      .flatMap(o => [o.aId, o.bId])
  ), [offers]);
  const neglectedCands = React.useMemo(() =>
    mine.filter(c => !recentCandIds.has(c.id)),
    [mine, recentCandIds]);

  // 3a. Co-rep approved notifications (unread)
  const coRepApprovedNotifs = React.useMemo(() =>
    notifications.filter(n => n.type === 'corep_approved' && !n.read),
    [notifications]);

  // 3. My offers where both MMs approved but a candidate hasn't responded yet
  const offersAwaitingCand = React.useMemo(() =>
    offers.filter(o =>
      (o.aMm === myUid || o.bMm === myUid) &&
      o.bStatus === 'אישר' &&
      (!o.aCandStatus || !o.bCandStatus) &&
      o.status !== 'נדחתה' && o.status !== 'אושרה'),
    [offers, myUid]);

  // Build waiting list — only items with count > 0
  const waiting = [
    offersNeedingMe.length > 0 && {
      icon: 'heart', tone: th.primary, big: String(offersNeedingMe.length),
      text: offersNeedingMe.length === 1 ? 'הצעת שידוך מחכה לתגובתך' : 'הצעות מחכות לתגובה שלך',
      to: () => go('offers', { filter: 'needsMyApproval' }),
    },
    neglectedCands.length > 0 && {
      icon: 'bell', tone: th.gold, big: String(neglectedCands.length),
      text: neglectedCands.length === 1 ? 'מועמד שלא קיבל יחס מעל 7 ימים' : 'מועמדים שלא קיבלו יחס מעל 7 ימים',
      to: () => go('cands', { filter: 'neglected', neglectedIds: neglectedCands.map(c => c.id) }),
    },
    offersAwaitingCand.length > 0 && {
      icon: 'chat', tone: '#a78bfa', big: String(offersAwaitingCand.length),
      text: offersAwaitingCand.length === 1 ? 'שידוך מחכה לתשובת המועמד' : 'שידוכים מחכים לתשובת המועמד',
      to: () => go('offers', { filter: 'awaitingCand' }),
    },
    coRepApprovedNotifs.length > 0 && {
      icon: 'users', tone: th.success, big: String(coRepApprovedNotifs.length),
      text: coRepApprovedNotifs.length === 1
        ? `${coRepApprovedNotifs[0].candName} אישר/ה שתייצג אותו/ה`
        : `${coRepApprovedNotifs.length} מועמדים אישרו ייצוג שלך`,
      to: () => { coRepApprovedNotifs.forEach(n => markNotificationRead(n.id)); go('cands'); },
    },
  ].filter(Boolean);

  const myOffers = offers.filter(o => o.aMm === myUid || o.bMm === myUid);
  const stats = [
    { n: mine.length,                                                                 label: 'מועמדים פעילים' },
    { n: myOffers.filter(o => o.status === 'אושרה').length,                          label: 'שידוכים אושרו' },
    { n: myOffers.filter(o => o.status === 'נשלחה' || o.status === 'נצפתה').length,  label: 'הצעות פעילות' },
  ];

  return (
    <>
      <div style={{ paddingTop: 50, paddingInline: 18, paddingBottom: 6, background: th.cream, flexShrink: 0, display: 'flex', alignItems: 'center', gap: 12 }}>
        <Avatar grad={gradForId(me.uid||'me')} name={me.displayName||me.email||''} size={46} photo={me.photoURL} />
        <div style={{ flex: 1 }}>
          <div style={{ fontFamily: th.body, fontSize: 13.5, color: alpha(th.ink, 0.55) }}>שלום {(me.displayName||'').split(' ')[0]},</div>
          <div style={{ fontFamily: th.display, fontSize: 21, fontWeight: 800, color: th.ink, lineHeight: 1.1 }}>מה קורה היום?</div>
        </div>
        <NotificationDrawer th={th} go={go} notifications={notifications} markNotificationRead={markNotificationRead} />
      </div>

      <div style={{ flex: 1, overflowY: 'auto', padding: '14px 18px 24px' }}>
        {/* WAITING banner — two styles, toggled by admin */}
        {lightPanel ? (
          /* ── Light / card style ── */
          <div style={{ background: th.card, borderRadius: th.rLg, padding: '16px 18px 8px', marginBottom: 18, boxShadow: `0 6px 24px ${alpha(th.ink, 0.08)}` }}>
            {/* title row */}
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom: 12 }}>
              <span style={{ fontFamily: th.body, fontSize: 12, color: alpha(th.ink, 0.4), fontWeight: 500 }}>היום</span>
              <div style={{ display:'flex', alignItems:'center', gap: 6 }}>
                <span style={{ fontFamily: th.display, fontSize: 17, fontWeight: 800, color: th.ink }}>מה מחכה לך</span>
                <span style={{ fontSize: 17 }}>💛</span>
              </div>
            </div>
            <div style={{ height: 1, background: alpha(th.ink, 0.07), marginBottom: 4 }} />
            {/* items — or all-clear state */}
            {waiting.length === 0 ? (
              <div style={{ padding: '14px 0 8px', textAlign: 'center', fontFamily: th.body, fontSize: 13, color: alpha(th.ink, 0.4) }}>
                ✅ הכל מסודר — אין פעולות ממתינות
              </div>
            ) : waiting.map((w, k) => (
              <React.Fragment key={k}>
                <button onClick={w.to} style={{ all:'unset', cursor:'pointer', display:'flex', alignItems:'center', gap: 10, width:'100%', boxSizing:'border-box', padding:'11px 0' }}>
                  <span style={{ fontFamily: th.display, fontWeight: 900, fontSize: 24, color: w.tone, lineHeight: 1, minWidth: 28, textAlign:'center' }}>{w.big}</span>
                  <span style={{ flex: 1, fontFamily: th.body, fontSize: 13.5, color: alpha(th.ink, 0.78), fontWeight: 500, textAlign:'right' }}>{w.text}</span>
                  <div style={{ width: 32, height: 32, borderRadius: '50%', border:`1.5px solid ${alpha(w.tone, 0.35)}`, color: w.tone, display:'flex', alignItems:'center', justifyContent:'center', flexShrink: 0 }}>
                    <Icon name={w.icon} size={15} fill={w.icon === 'heart' ? w.tone : 'none'} />
                  </div>
                  <span style={{ color: alpha(th.ink, 0.25) }}><Icon name="chevL" size={16} /></span>
                </button>
                {k < waiting.length - 1 && <div style={{ height: 1, background: alpha(th.ink, 0.06) }} />}
              </React.Fragment>
            ))}
          </div>
        ) : (
          /* ── Dark / gradient style (original) ── */
          <div style={{ background: `linear-gradient(135deg, ${th.ink}, ${alpha(th.primary, 0.85)})`, borderRadius: th.rLg, padding: 18, marginBottom: 18, color: th.cream, boxShadow: `0 16px 34px ${alpha(th.ink, 0.28)}` }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 14 }}>
              <Logo size={22} color={th.gold} flaw={th.cream} />

            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              {waiting.length === 0
                ? <div style={{ padding: '8px 0', textAlign:'center', fontFamily: th.body, fontSize: 13, color: 'rgba(255,255,255,0.55)' }}>✅ הכל מסודר — אין פעולות ממתינות</div>

                  <button key={k} onClick={w.to} style={{ all: 'unset', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 12, background: alpha('#ffffff', 0.1), borderRadius: th.r, padding: '10px 12px' }}>

const { useState: useSb, useMemo: useMb } = React;

// ════════════════════════════════════════════════════════════
// INVITATIONS TRACKER — reusable for all matchmakers
// ════════════════════════════════════════════════════════════
function InvitationsSheet({ open, onClose, th, mmUid }) {
  const [invites, setInvites] = useState([]);
  const [loading, setLoading] = useState(false);

  useEffect(() => {
    if (!open || !mmUid) return;
    setLoading(true);
    db.collection('invitations').where('mmId', '==', mmUid).get()
      .then(snap => {
        const items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        items.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
        setInvites(items);
      })
      .catch(() => {})
      .finally(() => setLoading(false));
  }, [open, mmUid]);

  const pending   = invites.filter(i => i.status === 'pending').length;
  const accepted  = invites.filter(i => i.status === 'accepted' || i.status === 'filled').length;

  return (
    <Sheet open={open} onClose={onClose} th={th} title="מעקב הזמנות">
      {/* summary row */}
      {invites.length > 0 && (
        <div style={{ display:'flex', gap:8, marginBottom:14 }}>
          {[
            { label:'נשלחו', n:invites.length, color:alpha(th.ink,0.6) },
            { label:'ממתינות', n:pending, color:th.gold },
            { label:'הצטרפו', n:accepted, color:th.success },
          ].map(s => (
            <div key={s.label} style={{ flex:1, background:alpha(s.color,0.1), borderRadius:th.rSm, padding:'10px 0', textAlign:'center' }}>
              <div style={{ fontFamily:th.display, fontWeight:900, fontSize:22, color:s.color }}>{s.n}</div>
              <div style={{ fontFamily:th.body, fontSize:11, color:alpha(th.ink,0.55), marginTop:2 }}>{s.label}</div>
            </div>
          ))}
        </div>
      )}

      {loading ? (
        <div style={{ textAlign:'center', padding:24, fontFamily:th.body, color:alpha(th.ink,0.4) }}>טוען…</div>
      ) : invites.length === 0 ? (
        <div style={{ textAlign:'center', padding:32, fontFamily:th.body, color:alpha(th.ink,0.4) }}>
          <div style={{ fontSize:36, marginBottom:10 }}>📬</div>
          <div>עדיין לא נשלחו הזמנות</div>
          <div style={{ fontSize:12, marginTop:6, color:alpha(th.ink,0.35) }}>הזמנות שתשלח יופיעו כאן</div>
        </div>
      ) : invites.map(inv => {
        const isPending  = inv.status === 'pending';
        const isAccepted = inv.status === 'accepted' || inv.status === 'filled';
        const statusColor = isPending ? th.gold : isAccepted ? th.success : alpha(th.ink,0.4);
        const statusLabel = { pending:'ממתין/ה', accepted:'נענה/תה', filled:'מילא/ה פרטים' }[inv.status] || inv.status;
        const flowLabel   = inv.flow === 'mm_fills' ? 'אמלא אני' : 'ממלא/ת בעצמו/ה';
        const dateStr     = inv.createdAt?.seconds
          ? new Date(inv.createdAt.seconds * 1000).toLocaleDateString('he-IL', { day:'numeric', month:'short' })
          : '—';
        return (
          <div key={inv.id} style={{ background:th.card, borderRadius:th.r, padding:'12px 14px', marginBottom:8, boxShadow:`0 3px 10px ${alpha(th.ink,0.05)}` }}>
            <div style={{ display:'flex', alignItems:'center', gap:10 }}>
              <Avatar grad={gradForId(inv.id)} name={inv.recipientName || '?'} size={40} />
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontFamily:th.display, fontWeight:800, fontSize:14, color:th.ink }}>
                  {inv.recipientName || <span style={{ color:alpha(th.ink,0.35) }}>ללא שם</span>}
                </div>
                <div style={{ fontFamily:th.body, fontSize:11, color:alpha(th.ink,0.45) }}>{flowLabel} · {dateStr}</div>
              </div>
              <div style={{ background:alpha(statusColor,0.12), color:statusColor, borderRadius:999, padding:'4px 11px', fontFamily:th.display, fontWeight:700, fontSize:12, flexShrink:0 }}>
                {statusLabel}
              </div>
            </div>
            {isAccepted && inv.candidateName && (
              <div style={{ fontFamily:th.body, fontSize:12, color:alpha(th.ink,0.5), marginTop:6, paddingRight:50 }}>
                נרשם/ה כ: <b>{inv.candidateName}</b>
              </div>
            )}
          </div>
        );
      })}
      <Btn th={th} full variant="ghost" style={{ marginTop:8 }}
        onClick={() => { setInvites([]); setLoading(true); db.collection('invitations').where('mmId','==',mmUid).get().then(snap=>{const items=snap.docs.map(d=>({id:d.id,...d.data()}));items.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));setInvites(items);}).finally(()=>setLoading(false)); }}>
        ↻ רענן
      </Btn>
    </Sheet>
  );
}

// CANDIDATES LIST
// ════════════════════════════════════════════════════════════
function Candidates({ th, go, params }) {
  const { candidates, claimCandidate } = useContext(DataCtx);
  const { profile }    = useContext(AuthCtx);
  const [scope, setScope]       = useSb(params?.linkMode ? 'all' : 'mine'); // mine | all
  const [q, setQ]               = useSb('');
  const [filterOpen, setFilterOpen] = useSb(false);
  const [addOpen, setAddOpen]   = useSb(false);
  const [invOpen, setInvOpen]   = useSb(false);
  const [pendingCount, setPendingCount] = useSb(0);
  const [filters, setFilters]   = useSb({ gender: '', rel: [], region: '', status: '', ageMin: 22, ageMax: 45 });
  const [linkMode, setLinkMode] = useSb(params?.linkMode === true);
  const [sentRequests, setSentRequests] = useSb(new Set());

  // Neglected filter from home banner — set of candidate IDs to show
  const [neglectedIds, setNeglectedIds] = useSb(
    params?.filter === 'neglected' && params?.neglectedIds?.length ? new Set(params.neglectedIds) : null
  );

  const myUid = profile?.uid;

  // fetch pending invite count for badge
  useEffect(() => {
    if (!myUid) return;
    db.collection('invitations').where('mmId','==',myUid).where('status','==','pending').get()
      .then(s => setPendingCount(s.size)).catch(() => {});
  }, [myUid]);

  const list = useMb(() => candidates.filter(c => {
    // Neglected filter overrides everything
    if (neglectedIds !== null) return neglectedIds.has(c.id);
    if (scope === 'mine' && c.mmId !== myUid && !c.coMms?.includes(myUid)) return false;
    if (scope === 'all'  && (c.mmId === myUid || c.coMms?.includes(myUid))) return false;
    if (q && !c.name.includes(q) && !(c.oneLine || '').includes(q)) return false;
    if (filters.gender && (filters.gender === 'נשים' ? (c.gender !== 'f' && c.gender !== 'אשה') : (c.gender !== 'm' && c.gender !== 'גבר'))) return false;
    if (filters.region && c.region !== filters.region) return false;
    if (filters.status === 'פנוי' && !c.available) return false;
    if (filters.status === 'תפוס' && c.available) return false;
    if (filters.rel.length && !filters.rel.includes(c.religiosity)) return false;
    if (c.age < filters.ageMin || c.age > filters.ageMax) return false;
    return true;
  }), [candidates, scope, q, filters, myUid, neglectedIds]);

  const activeFilters = (filters.gender ? 1 : 0) + (filters.region ? 1 : 0) + (filters.status ? 1 : 0) + filters.rel.length;

  return (
    <>
      <AppHeader th={th} title="מועמדים" sub={`${list.length} ברשימה`} action={
        <div style={{ display:'flex', gap:8, alignItems:'center' }}>
          {/* add-candidate button */}
          <button onClick={() => setAddOpen(true)} style={{ border:'none', background:th.primary, height:38, borderRadius:999, paddingInline:14, display:'flex', alignItems:'center', gap:5, color:'#fff', cursor:'pointer', fontFamily:th.display, fontWeight:800, fontSize:13, boxShadow:`0 6px 18px ${alpha(th.primary,0.35)}`, whiteSpace:'nowrap' }}>
            <Icon name="plus" size={15} /> הוסף
          </button>
          {/* invite tracker bell */}
          <button onClick={() => setInvOpen(true)} style={{ position:'relative', border:'none', background:th.card, width:42, height:42, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', color:th.ink, cursor:'pointer', boxShadow:'0 2px 8px rgba(0,0,0,0.07)' }}>
            <Icon name="bell" size={21} />
            {pendingCount > 0 && <span style={{ position:'absolute', top:-3, left:-3, background:th.gold, color:'#fff', borderRadius:'50%', minWidth:18, height:18, fontSize:11, fontWeight:800, display:'flex', alignItems:'center', justifyContent:'center', padding:'0 4px' }}>{pendingCount}</span>}
          </button>
        </div>
      } />

      <div style={{ flex: 1, overflowY: 'auto', padding: '8px 18px 90px', position: 'relative' }}>
        {/* search + filter inline */}
        <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 12 }}>
          <div style={{ position: 'relative', flex: 1 }}>
            <span style={{ position: 'absolute', right: 12, top: '50%', transform: 'translateY(-50%)', color: alpha(th.ink, 0.4) }}><Icon name="search" size={19} /></span>
            <input value={q} onChange={e => setQ(e.target.value)} placeholder="חיפוש מועמד…" style={{ width: '100%', boxSizing: 'border-box', padding: '11px 40px 11px 14px', borderRadius: 999, border: `1.5px solid ${alpha(th.ink, 0.12)}`, fontFamily: th.body, fontSize: 14.5, background: th.card, outline: 'none', color: th.ink }} />
          </div>
          <button onClick={() => setFilterOpen(true)} style={{ position:'relative', border:'none', background: activeFilters > 0 ? alpha(th.primary, 0.1) : th.card, width:46, height:46, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', color: activeFilters > 0 ? th.primary : th.ink, cursor:'pointer', flexShrink:0, boxShadow: activeFilters > 0 ? `0 0 0 1.5px ${alpha(th.primary,0.35)}, 0 2px 8px rgba(0,0,0,0.06)` : '0 2px 8px rgba(0,0,0,0.07)' }}>
            <Icon name="filter" size={21} />
            {activeFilters > 0 && <span style={{ position:'absolute', top:-3, left:-3, background:th.primary, color:'#fff', borderRadius:'50%', minWidth:18, height:18, fontSize:11, fontWeight:800, display:'flex', alignItems:'center', justifyContent:'center', padding:'0 4px' }}>{activeFilters}</span>}
          </button>
        </div>

        {/* scope toggle */}
        <div style={{ display: 'flex', gap: 8, marginBottom: 14 }}>
          {[['mine', 'שלי'], ['all', 'שאר המאגר']].map(([id, lbl]) => (
            <button key={id} onClick={() => setScope(id)} style={{ flex: 1, padding: '9px', borderRadius: 999, border: 'none', cursor: 'pointer', fontFamily: th.display, fontWeight: 800, fontSize: 14, background: scope === id ? th.ink : th.card, color: scope === id ? th.cream : alpha(th.ink, 0.55), boxShadow: scope === id ? 'none' : `inset 0 0 0 1.5px ${alpha(th.ink,0.1)}` }}>{lbl}</button>
          ))}
        </div>

        {/* linkMode banner */}
        {linkMode && (
          <div style={{ background:alpha(th.primary,0.07), border:`1.5px solid ${alpha(th.primary,0.2)}`, borderRadius:th.r, padding:'12px 14px', marginBottom:12 }}>
            <div style={{ fontFamily:th.display, fontWeight:800, fontSize:14, color:th.ink, marginBottom:4 }}>🤝 הוסף מועמד/ת לייצוג שלך</div>
            <div style={{ fontFamily:th.body, fontSize:12.5, color:alpha(th.ink,0.6) }}>בחר/י מועמד/ת — לאחר הוספה יופיע/תופיע גם ברשימת ״שלי״ ותוכל/י להציע אותו/ה לשידוכים</div>
          </div>
        )}

        {/* neglected filter chip */}
        {neglectedIds !== null && (
          <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:12, background:alpha(th.gold,0.12), border:`1.5px solid ${alpha(th.gold,0.3)}`, borderRadius:th.rSm, padding:'8px 12px' }}>
            <Icon name="bell" size={14} style={{ color:th.gold, flexShrink:0 }} />
            <span style={{ flex:1, fontFamily:th.body, fontSize:13, color:alpha(th.ink,0.8) }}>מציג מועמדים ללא יחס 7+ ימים</span>
            <button onClick={() => setNeglectedIds(null)} style={{ border:'none', background:'transparent', cursor:'pointer', color:alpha(th.ink,0.5), padding:0, display:'flex', alignItems:'center' }}>
              <Icon name="x" size={16} />
            </button>
          </div>
        )}

        {/* grid */}
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
          {list.map(c => (
            <CandCard key={c.id} c={c} th={th} myUid={myUid}
              onClick={() => linkMode ? null : go('candidate', { id: c.id })}
              linkMode={linkMode}
              requestSent={sentRequests.has(c.id)}
              onLink={async () => {
                if (!c.candidateUid) return;
                await db.collection('coRepRequests').add({
                  mmId: myUid,
                  mmName: profile?.displayName || 'שדכן/ית',
                  candId: c.id,
                  candName: c.name,
                  candidateUid: c.candidateUid,
                  status: 'pending',
                  createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                });
                setSentRequests(prev => new Set([...prev, c.id]));
              }}
            />
          ))}
        </div>
        {list.length === 0 && (
          <div style={{ textAlign: 'center', padding: '50px 20px', color: alpha(th.ink, 0.4) }}>
            <Icon name="search" size={40} />
            <div style={{ fontFamily: th.body, marginTop: 10, fontSize: 15 }}>לא נמצאו מועמדים. נסה/י לשנות פילטרים.</div>
          </div>
        )}
      </div>

      {/* FAB */}
      <button onClick={() => setAddOpen(true)} style={{ position: 'absolute', bottom: 102, left: 20, zIndex: 30, width: 58, height: 58, borderRadius: '50%', border: 'none', background: th.primary, color: '#fff', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: `0 12px 28px ${alpha(th.primary, 0.45)}` }}>
        <Icon name="plus" size={28} />
      </button>

      <FilterSheet open={filterOpen} onClose={() => setFilterOpen(false)} th={th} filters={filters} setFilters={setFilters} />
      <AddSheet open={addOpen} onClose={() => setAddOpen(false)} th={th} go={go} />
      <InvitationsSheet open={invOpen} onClose={() => { setInvOpen(false); db.collection('invitations').where('mmId','==',myUid).where('status','==','pending').get().then(s=>setPendingCount(s.size)).catch(()=>{}); }} th={th} mmUid={myUid} />
    </>
  );
}

      <div style={{ position: 'relative', height: 116, background: `linear-gradient(150deg, ${c.grad[0]}, ${c.grad[1]})`, display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden' }}>
        {c.photos && c.photos[0]
          ? <img src={c.photos[0]} alt="" loading="lazy" decoding="async" style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover' }} />
          : <span style={{ fontFamily: th.display, fontSize: 44, color: 'rgba(255,255,255,0.9)', fontWeight: 800 }}>{c.name.charAt(0)}</span>}
        <div style={{ position: 'absolute', top: 8, right: 8 }}>

function FilterSheet({ open, onClose, th, filters, setFilters }) {
  const { lists } = useContext(DataCtx);
  const liveRegions     = (lists.regions     && lists.regions.length)     ? lists.regions     : REGIONS;
  const liveReligiosity = (lists.religiosity  && lists.religiosity.length) ? lists.religiosity : RELIGIOSITY;
  const set = (k, v) => setFilters(s => ({ ...s, [k]: v }));
  return (
    <Sheet open={open} onClose={onClose} th={th} title="פילטרים">
      <Field th={th} label="מין"><Segmented th={th} value={filters.gender} onChange={v => set('gender', filters.gender === v ? '' : v)} options={['נשים', 'גברים']} /></Field>
      <Field th={th} label="סטטוס"><Segmented th={th} value={filters.status} onChange={v => set('status', filters.status === v ? '' : v)} options={['פנוי', 'תפוס']} /></Field>
      <Field th={th} label={`טווח גיל: ${filters.ageMin}–${filters.ageMax}`}>
        <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
          <input type="range" min={20} max={60} value={filters.ageMin} onChange={e => set('ageMin', Math.min(+e.target.value, filters.ageMax))} style={{ flex: 1, accentColor: th.primary }} />
          <input type="range" min={20} max={60} value={filters.ageMax} onChange={e => set('ageMax', Math.max(+e.target.value, filters.ageMin))} style={{ flex: 1, accentColor: th.primary }} />
        </div>
      </Field>
      <Field th={th} label="אזור"><MultiChips th={th} value={filters.region ? [filters.region] : []} onChange={v => set('region', v[v.length-1] === filters.region ? '' : v[v.length-1] || '')} options={liveRegions} /></Field>
      <Field th={th} label="קרבה לדת"><MultiChips th={th} value={filters.rel} onChange={v => set('rel', v)} options={liveReligiosity} tone={th.gold} /></Field>
      <div style={{ display: 'flex', gap: 10, marginTop: 6 }}>
        <Btn th={th} variant="ghost" onClick={() => setFilters({ gender: '', rel: [], region: '', status: '', ageMin: 22, ageMax: 45 })}>נקה</Btn>
        <Btn th={th} full onClick={onClose}>הצג תוצאות</Btn>
      </div>
    </Sheet>
  );
}

// ════════════════════════════════════════════════════════════
// INVITE FLOW — matchmaker creates invitation link
// ════════════════════════════════════════════════════════════
function InviteFlow({ open, onClose, th, mmId, mmName }) {
  const [step, setStep]         = useState(1); // 1=name, 2=flow-type, 3=link
  const [recipFirst, setFirst]  = useState('');
  const [recipLast,  setLast]   = useState('');
  const [flow, setFlow]         = useState('mm_fills');
  const [token, setToken]       = useState('');
  const [creating, setCreating] = useState(false);
  const [copied,   setCopied]   = useState(false);

  const recipientName = `${recipFirst.trim()} ${recipLast.trim()}`.trim();
  const reset = () => { setStep(1); setFirst(''); setLast(''); setFlow('mm_fills'); setToken(''); setCopied(false); };

  const generate = async () => {
    setCreating(true);
    try {
      const tok = await createInvitation(mmId, mmName, flow, recipientName);
      setToken(tok);
      setStep(3);
    } finally { setCreating(false); }
  };

  const copyLink = () => {
    navigator.clipboard.writeText(inviteURL(token));
    setCopied(true);
    setTimeout(() => setCopied(false), 2500);
  };

  const waText = encodeURIComponent(`היי ${recipFirst.trim()}! 😊\n${mmName} מזמין/ת אותך להצטרף למערכת שידוכים "סבבה והכל".\n\nלחץ/י כאן להרשמה:\n${inviteURL(token)}`);

  return (
    <Sheet open={open} onClose={() => { onClose(); reset(); }} th={th} title="הזמנת מועמד/ת">
      {/* ── Step 1: recipient name ── */}
      {step === 1 && (
        <>
          <div style={{ fontFamily: th.body, fontSize: 14, color: alpha(th.ink, 0.6), marginBottom: 16 }}>
            למי שולחים את ההזמנה?<br/>
            <span style={{ fontSize: 12, color: alpha(th.ink, 0.4) }}>זה ישמש למעקב אחרי ההזמנה</span>
          </div>
          <div style={{ display: 'flex', gap: 8, marginBottom: 14 }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontFamily: th.body, fontSize: 12, fontWeight: 700, color: alpha(th.ink, 0.6), marginBottom: 4 }}>שם פרטי</div>
              <input value={recipFirst} onChange={e => setFirst(e.target.value)} placeholder="ישראל"
                style={{ width: '100%', boxSizing: 'border-box', padding: '11px 12px', borderRadius: th.rSm, border: `1.5px solid ${alpha(th.ink, 0.15)}`, fontFamily: th.body, fontSize: 15, background: th.card, color: th.ink, outline: 'none' }} />
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ fontFamily: th.body, fontSize: 12, fontWeight: 700, color: alpha(th.ink, 0.6), marginBottom: 4 }}>שם משפחה</div>
              <input value={recipLast} onChange={e => setLast(e.target.value)} placeholder="כהן"
                style={{ width: '100%', boxSizing: 'border-box', padding: '11px 12px', borderRadius: th.rSm, border: `1.5px solid ${alpha(th.ink, 0.15)}`, fontFamily: th.body, fontSize: 15, background: th.card, color: th.ink, outline: 'none' }} />
            </div>
          </div>
          <Btn th={th} full disabled={!recipFirst.trim() || !recipLast.trim()} onClick={() => setStep(2)}>הבא →</Btn>
        </>
      )}

      {/* ── Step 2: flow type ── */}
      {step === 2 && (
        <>
          <div style={{ display:'flex', alignItems:'center', gap:8, background:alpha(th.primary,0.07), borderRadius:th.rSm, padding:'8px 12px', marginBottom:14 }}>
            <Icon name="person" size={16} style={{ color: th.primary }} />
            <span style={{ fontFamily:th.display, fontWeight:800, fontSize:14, color:th.ink }}>{recipientName}</span>
          </div>
          <div style={{ fontFamily: th.body, fontSize: 14, color: alpha(th.ink, 0.6), marginBottom: 14 }}>מי ימלא את הפרטים?</div>
          {[
            { val: 'mm_fills', label: 'אני אמלא', desc: 'המועמד/ת פותח/ת את הקישור ומאשר/ת בלבד.' },
            { val: 'cand_fills', label: 'המועמד/ת ימלא/תמלא', desc: 'המועמד/ת ממלא/ת את כל הפרטים ותמונות בעצמו/ה.' },
          ].map(opt => (
            <button key={opt.val} onClick={() => setFlow(opt.val)} style={{
              all: 'unset', cursor: 'pointer', boxSizing: 'border-box', width: '100%',
              padding: '13px 15px', borderRadius: th.r, marginBottom: 10, display: 'block', textAlign: 'right',
              border: `2px solid ${flow === opt.val ? th.primary : alpha(th.ink, 0.12)}`,
              background: flow === opt.val ? alpha(th.primary, 0.06) : th.card,
            }}>
              <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 15, color: flow === opt.val ? th.primary : th.ink, marginBottom: 3 }}>{opt.label}</div>
              <div style={{ fontFamily: th.body, fontSize: 12.5, color: alpha(th.ink, 0.55), lineHeight: 1.4 }}>{opt.desc}</div>
            </button>
          ))}
          <div style={{ display:'flex', gap:8, marginTop:4 }}>
            <Btn th={th} variant="ghost" onClick={() => setStep(1)}>← חזרה</Btn>
            <Btn th={th} full onClick={generate} disabled={creating}>
              {creating ? 'יוצר קישור…' : 'צור קישור הזמנה'}
            </Btn>
          </div>
        </>
      )}

      {/* ── Step 3: link ready ── */}
      {step === 3 && (
        <>
          <div style={{ background: alpha(th.success, 0.1), border: `1.5px solid ${alpha(th.success, 0.25)}`, borderRadius: th.r, padding: 14, marginBottom: 16, textAlign: 'center' }}>
            <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 14, color: th.success, marginBottom: 4 }}>✓ קישור מוכן לשליחה!</div>
            <div style={{ fontFamily: th.display, fontWeight: 700, fontSize: 15, color: th.ink, marginBottom: 2 }}>{recipientName}</div>
            <div style={{ fontFamily: 'monospace', fontSize: 10, color: alpha(th.ink, 0.4), wordBreak: 'break-all' }}>{inviteURL(token)}</div>
          </div>
          <Btn th={th} full onClick={copyLink} icon={<Icon name="link" size={18} />} style={{ marginBottom: 10 }}>
            {copied ? '✓ הועתק!' : 'העתק קישור'}
          </Btn>
          <a href={`https://wa.me/?text=${waText}`} target="_blank" rel="noreferrer" style={{ display: 'block', textDecoration: 'none', marginBottom: 10 }}>
            <Btn th={th} full variant="ghost"><Icon name="whatsapp" size={18} /> שלח/י ב-WhatsApp ל{recipFirst.trim()}</Btn>
          </a>
          <Btn th={th} full variant="ghost" onClick={() => { onClose(); reset(); }}>סגור</Btn>
        </>
      )}
    </Sheet>
  );
}

// ════════════════════════════════════════════════════════════
// INVITATION LANDING — candidate opens invite link
// ════════════════════════════════════════════════════════════
function InvitationLanding({ th, go, token }) {
  const { user, profile } = useContext(AuthCtx);
  const [invite, setInvite]   = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError]     = useState('');
  const [busy, setBusy]       = useState(false);
  const [done, setDone]       = useState(false);

  useEffect(() => {
    db.collection('invitations').doc(token).get().then(doc => {
      if (!doc.exists) { setError('ההזמנה לא נמצאה או פגה תוקף'); }
      else {
        const inv = doc.data();
        if (inv.status !== 'pending') setError('הזמנה זו כבר נוצלה');
        else setInvite(inv);
      }
      setLoading(false);
    }).catch(() => { setError('שגיאה בטעינת ההזמנה'); setLoading(false); });
  }, [token]);

  const accept = async () => {
    setBusy(true);
    try {
      const ref = await db.collection('candidates').add({
        name: profile?.displayName || '', age: 0, gender: '', region: '', religiosity: '',
        family: '', kids: 0, oneLine: '', seesWith: '', sabaBut: '',
        interests: [], partner: [], discrete: '', available: true, photos: [],
        mmId: invite.mmId, candidateUid: user.uid,
        pendingApproval: false, status: 'pending_mm',
        grad: gradForId(user.uid),
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      await db.collection('invitations').doc(token).update({
        status: 'accepted', candidateId: ref.id, candidateUid: user.uid,
        candidateName: profile?.displayName || user.email,
        acceptedAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      await db.collection('notifications').add({
        toUid: invite.mmId, type: 'invite_accepted',
        candidateId: ref.id, candidateName: profile?.displayName || user.email,
        inviteToken: token, read: false,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      setDone(true);
    } catch(e) { setError('שגיאה: ' + e.message); }
    setBusy(false);
  };

  if (loading) return (
    <div style={{ height:'100%', display:'flex', alignItems:'center', justifyContent:'center', background:th.cream }}>
      <Logo size={50} color={th.primary} flaw={th.cream} />
    </div>
  );

  const centeredBox = (emoji, title, body) => (
    <div style={{ height:'100%', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', background:th.cream, padding:32, textAlign:'center', direction:'rtl' }}>
      <div style={{ fontSize:52, marginBottom:16 }}>{emoji}</div>
      <div style={{ fontFamily:th.display, fontSize:22, fontWeight:800, color:th.ink, marginBottom:8 }}>{title}</div>
      <div style={{ fontFamily:th.body, fontSize:15, color:alpha(th.ink,0.6), lineHeight:1.5, maxWidth:280 }}>{body}</div>
    </div>
  );

  if (error) return centeredBox('😕', 'הזמנה לא תקינה', error);
  if (done)  return centeredBox('🎉', 'אישרת בהצלחה!', `${invite.mmName} יקבל/ת הודעה וימשיך/תמשיך למלא את הפרטים שלך.`);

  return (
    <div style={{ height:'100%', display:'flex', flexDirection:'column', background:`linear-gradient(170deg, ${th.cream}, ${tint(th.primary, 0.84)})`, direction:'rtl' }}>
      <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'0 28px', textAlign:'center' }}>
        <Logo size={56} color={th.primary} flaw={th.cream} style={{ marginBottom:20 }} />
        <div style={{ fontFamily:th.display, fontSize:13, fontWeight:700, color:th.primary, letterSpacing:1.5, marginBottom:6 }}>הוזמנת להצטרף</div>
        <h1 style={{ fontFamily:th.display, fontSize:30, fontWeight:800, color:th.ink, margin:'0 0 6px', lineHeight:1.2 }}>סבבה והכל</h1>
        <div style={{ fontFamily:th.body, fontSize:16, color:alpha(th.ink,0.65), marginBottom:28 }}>
          <b>{invite.mmName}</b> מזמין/ת אותך למערכת השידוכים
        </div>
        <div style={{ background:th.card, borderRadius:th.rLg, padding:18, marginBottom:28, width:'100%', maxWidth:320, boxShadow:`0 8px 24px ${alpha(th.ink,0.08)}`, textAlign:'right' }}>
          <div style={{ fontFamily:th.display, fontWeight:800, fontSize:14, color:th.ink, marginBottom:6 }}>מה קורה אחרי שתאשר/י?</div>
          <div style={{ fontFamily:th.body, fontSize:13, color:alpha(th.ink,0.65), lineHeight:1.5 }}>
            {invite.flow === 'mm_fills'
              ? `${invite.mmName} ימלא/תמלא את הפרטים שלך ויצור/תיצור עבורך כרטיסייה.`
              : 'תתבקש/י למלא את הפרטים שלך ולהעלות תמונות. השדכן/ית יאשר/תאשר לפני פרסום.'}
          </div>
        </div>
        <Btn th={th} full size="l" onClick={invite.flow === 'mm_fills' ? accept : () => go('candSelfFill', { token, invite })} disabled={busy}>
          {busy ? 'שניה…' : invite.flow === 'mm_fills' ? '✓ אני מאשר/ת' : 'מלא/י את הפרטים שלי →'}
        </Btn>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// CANDIDATE SELF FILL — candidate fills their own card (flow 2)
// ════════════════════════════════════════════════════════════
function CandidateSelfFill({ th, go, params }) {
  const { user, profile } = useContext(AuthCtx);
  const { lists } = useContext(DataCtx);
  const liveRegions       = (lists.regions       && lists.regions.length)       ? lists.regions       : REGIONS;
  const liveReligiosity   = (lists.religiosity    && lists.religiosity.length)   ? lists.religiosity   : RELIGIOSITY;
  const liveInterests     = (lists.interests      && lists.interests.length)     ? lists.interests     : INTERESTS;
  const livePartnerTraits = (lists.partnerTraits  && lists.partnerTraits.length) ? lists.partnerTraits : PARTNER_TRAITS;
  const { token, invite } = params;
  const [f, setF] = useState({
    name: profile?.displayName || '', age: '', gender: 'אשה',
    region: '', religiosity: '', family: 'רווק/ה', kids: 0,
    sabaBut: '', oneLine: '', seesWith: '', interests: [], partner: [], discrete: '', available: true,
  });
  const set = k => v => setF(s => ({ ...s, [k]: v }));
  const [photos, setPhotos]   = useState([]);
  const [submitting, setSub]  = useState(false);
  const [uploading, setUpl]   = useState(false);
  const [done, setDone]       = useState(false);

  const addPhoto = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    setUpl(true);
    try {
      const ref = storage.ref(`profiles/${user.uid}/${Date.now()}_${file.name}`);
      await ref.put(file);
      const url = await ref.getDownloadURL();
      setPhotos(p => [...p, url]);
    } finally { setUpl(false); }
  };

  const submit = async () => {
    if (!f.name || !f.age) return alert('נא למלא שם וגיל');
    setSub(true);
    try {
      const ref = await db.collection('candidates').add({
        ...f, age: +f.age, photos,
        mmId: invite.mmId, candidateUid: user.uid,
        pendingApproval: true, available: true,
        grad: gradForId(user.uid),
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      await db.collection('invitations').doc(token).update({
        status: 'filled', candidateId: ref.id, candidateUid: user.uid, candidateName: f.name,
        filledAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      await db.collection('notifications').add({
        toUid: invite.mmId, type: 'cand_filled',
        candidateId: ref.id, candidateName: f.name,
        candidateAge: +f.age, candidateRegion: f.region, candidateReligiosity: f.religiosity,
        inviteToken: token, read: false,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      setDone(true);
    } catch(e) { alert('שגיאה: ' + e.message); }
    setSub(false);
  };

  const [step, setStep] = useState(0);
  const steps = ['פרטים בסיסיים', 'קצת עלייך', 'תחומי עניין', 'תמונות'];
  const isLast = step === steps.length - 1;

  const SelfStepDots = () => (
    <div style={{ display:'flex', justifyContent:'center', gap:6, marginBottom:18 }}>
      {steps.map((_, i) => (
        <div key={i} style={{ width: i === step ? 22 : 8, height:8, borderRadius:999, background: i === step ? th.primary : i < step ? alpha(th.primary,0.4) : alpha(th.ink,0.15), transition:'all 0.2s' }} />
      ))}
    </div>
  );

  if (done) return (
    <div style={{ height:'100%', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', background:th.cream, padding:32, textAlign:'center', direction:'rtl' }}>
      <div style={{ fontSize:52, marginBottom:16 }}>🎉</div>
      <div style={{ fontFamily:th.display, fontSize:22, fontWeight:800, color:th.ink, marginBottom:8 }}>הפרטים נשלחו!</div>
      <div style={{ fontFamily:th.body, fontSize:15, color:alpha(th.ink,0.6), lineHeight:1.5, maxWidth:280 }}>
        {invite.mmName} יקבל/ת הודעה ויעיין/תעיין בפרטים שלך. לאחר האישור תהיה/י רשמית במערכת.
      </div>
    </div>
  );

  return (
    <div style={{ height:'100%', display:'flex', flexDirection:'column', background:th.cream, direction:'rtl' }}>
      <AppHeader th={th} title="הפרטים שלי" sub={`עבור ${invite.mmName}`} />
      <div style={{ flex:1, overflowY:'auto', padding:'10px 18px 40px' }}>
        <div style={{ fontFamily:th.display, fontWeight:800, fontSize:16, color:th.ink, marginBottom:10, textAlign:'center' }}>{steps[step]}</div>
        <SelfStepDots />

        {step === 0 && (
          <>
            <Field th={th} label="שם מלא" required><TextInput th={th} value={f.name} onChange={set('name')} placeholder="שם פרטי ומשפחה" /></Field>
            <Field th={th} label="גיל" required><TextInput th={th} type="number" value={f.age} onChange={set('age')} placeholder="25" /></Field>
            <Field th={th} label="מין" required><Segmented th={th} value={f.gender} onChange={set('gender')} options={['אשה','גבר']} /></Field>
            <Field th={th} label="אזור מגורים"><Select th={th} value={f.region} onChange={set('region')} options={liveRegions} /></Field>
            <Field th={th} label="זרם דתי"><Select th={th} value={f.religiosity} onChange={set('religiosity')} options={liveReligiosity} /></Field>
            <Field th={th} label="מצב משפחתי"><TextInput th={th} value={f.family} onChange={set('family')} /></Field>
          </>
        )}

        {step === 1 && (
          <>
            <Field th={th} label='סבבה והכל, אבל…' hint="משהו מצחיק/ייחודי עליך">
              <TextArea th={th} value={f.sabaBut} onChange={set('sabaBut')} placeholder='למשל: "מפחד/ת מיונים אבל רוצה לגור ליד הים"' rows={2} />
            </Field>
            <Field th={th} label="ספר/י על עצמך במשפט">
              <TextInput th={th} value={f.oneLine} onChange={set('oneLine')} placeholder="מה הכי מגדיר אותך?" />
            </Field>
            <Field th={th} label="מחפש/ת">
              <TextArea th={th} value={f.seesWith} onChange={set('seesWith')} placeholder="מה חשוב לך בבן/ת זוג?" rows={3} />
            </Field>
          </>
        )}

        {step === 2 && (
          <>
            <Field th={th} label="תחומי עניין">
              <MultiChips th={th} value={f.interests} onChange={v => setF(s => ({...s, interests:v}))} options={liveInterests} tone={th.primary} />
            </Field>
            <Field th={th} label="חשוב לי בפרטנר">
              <MultiChips th={th} value={f.partner} onChange={v => setF(s => ({...s, partner:v}))} options={livePartnerTraits} tone={th.gold} />
            </Field>
          </>
        )}

        {step === 3 && (
          <Field th={th} label="תמונות" hint="מומלץ תמונות מאונכות באיכות טובה">
            <div style={{ display:'flex', gap:8, flexWrap:'wrap', alignItems:'center', marginBottom:8 }}>
              {photos.map((url, i) => (
                <div key={i} style={{ position:'relative' }}>
                  <img src={url} alt="" loading="lazy" decoding="async" style={{ width:80, height:80, borderRadius:12, objectFit:'cover' }} />
                  <button onClick={() => setPhotos(p => p.filter((_,j) => j!==i))} style={{ position:'absolute', top:-6, insetInlineEnd:-6, width:22, height:22, borderRadius:'50%', border:'none', background:th.error, color:'#fff', fontSize:14, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', lineHeight:1 }}>×</button>
                </div>
              ))}
              <label style={{ width:80, height:80, borderRadius:12, border:`2px dashed ${alpha(th.ink,0.2)}`, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:4, cursor:'pointer', color: uploading ? alpha(th.ink,0.3) : th.primary, flexShrink:0 }}>
                {uploading ? <span style={{ fontFamily:th.body, fontSize:11 }}>מעלה…</span> : <><Icon name="plus" size={22} /><span style={{ fontFamily:th.body, fontSize:11 }}>הוסף/י</span></>}
                <input type="file" accept="image/*" style={{ display:'none' }} onChange={addPhoto} disabled={uploading} />
              </label>
            </div>
          </Field>
        )}

        <div style={{ display:'flex', gap:8, marginTop:20 }}>
          {step > 0
            ? <Btn th={th} variant="ghost" onClick={() => setStep(s => s-1)}>← חזרה</Btn>
            : <div style={{ flex:1 }} />
          }
          {isLast
            ? <Btn th={th} full size="l" onClick={submit} disabled={submitting || !f.name || !f.age}>{submitting ? 'שולח…' : 'שלח/י פרטים לאישור'}</Btn>
            : <Btn th={th} full onClick={() => { if (step===0 && (!f.name||!f.age)) { alert('נא למלא שם וגיל'); return; } setStep(s => s+1); }}>הבא →</Btn>
          }
        </div>
      </div>
    </div>
  );
}
