// NOTIFICATION DRAWER
// ════════════════════════════════════════════════════════════
function NotificationDrawer({ th, go, notifications, markNotificationRead }) {
  const [open, setOpen] = useState(false);
  const unread = notifications.filter(n => !n.read).length;

  const handleTap = (n) => {
    if (!n.read) markNotificationRead(n.id);
    setOpen(false);
    if (n.type === 'corep_approved') {
      go('cands');
    } else {
      go('editCand', { id: n.candidateId || n.candId });
    }
  };

  return (
    <>
      <button onClick={() => setOpen(true)} style={{ position:'relative', border:'none', background:th.card, width:42, height:42, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', color:th.ink, cursor:'pointer', boxShadow:'0 2px 8px rgba(0,0,0,0.07)' }}>
        <Icon name="bell" size={21} />
        {unread > 0 && (
          <span style={{ position:'absolute', top:6, insetInlineEnd:6, minWidth:16, height:16, borderRadius:99, background:th.error, color:'#fff', fontSize:10, fontWeight:800, display:'flex', alignItems:'center', justifyContent:'center', padding:'0 4px', border:`2px solid ${th.card}` }}>{unread}</span>
        )}
      </button>
      <Sheet open={open} onClose={() => setOpen(false)} th={th} title="התראות">
        {notifications.length === 0
          ? <div style={{ textAlign:'center', fontFamily:th.body, color:alpha(th.ink,0.4), padding:'24px 0' }}>אין התראות</div>
          : notifications.map(n => (
            <button key={n.id} onClick={() => handleTap(n)} style={{ all:'unset', cursor:'pointer', boxSizing:'border-box', width:'100%', padding:'12px 14px', borderRadius:th.r, marginBottom:8, display:'block', textAlign:'right', background: n.read ? th.card : alpha(th.primary,0.07), border:`1.5px solid ${n.read ? 'transparent' : alpha(th.primary,0.18)}` }}>
              <div style={{ fontFamily:th.display, fontWeight:800, fontSize:14, color:th.ink, marginBottom:3 }}>
                {n.type === 'corep_approved'
                  ? `🤝 ${n.candName} אישר/ה ייצוג שלך`
                  : n.type === 'invite_accepted'
                    ? `✓ ${n.candidateName} אישר/ה הזמנה`
                    : `📋 ${n.candidateName} הצטרף/ה`}
              </div>
              <div style={{ fontFamily:th.body, fontSize:12.5, color:alpha(th.ink,0.55), marginBottom:n.type === 'cand_filled' && n.candidateAge ? 3 : 0 }}>
                {n.type === 'corep_approved'
                  ? 'המועמד/ת מופיע/ה כעת ברשימת ״שלי״'
                  : n.type === 'invite_accepted'
                    ? 'ממתין/ה שתמלא/י את הפרטים'
                    : 'ממתין/ה לאישור ופרסום'}
              </div>
              {n.type === 'cand_filled' && (n.candidateAge || n.candidateRegion) && (
                <div style={{ fontFamily:th.body, fontSize:11.5, color:alpha(th.ink,0.4) }}>
                  {[n.candidateAge && `גיל ${n.candidateAge}`, n.candidateRegion, n.candidateReligiosity].filter(Boolean).join(' · ')}
                </div>
              )}
            </button>
          ))
        }
      </Sheet>
    </>
  );
}

      <Block label="תחומי עניין"><InterestChips items={c.interests} th={th} /></Block>
      <Hr />
      <Block label="חשוב בפרטנר"><InterestChips items={c.partner} th={th} tone={th.gold} /></Block>
      <Hr />
      <Block label="פרטים">

}

const { useState: useSc, useMemo: useMc } = React;

// mini selectable candidate row
function CandRow({ c, th, selected, onClick, trailing }) {
  return (
    <button onClick={onClick} style={{ all: 'unset', cursor: onClick ? 'pointer' : 'default', boxSizing: 'border-box', width: '100%', display: 'flex', alignItems: 'center', gap: 12, padding: 12, background: th.card, borderRadius: th.r, border: selected ? `2px solid ${th.primary}` : `2px solid transparent`, boxShadow: `0 4px 14px ${alpha(th.ink, 0.06)}`, marginBottom: 10 }}>
      <Avatar grad={c.grad} name={c.name} size={50} photo={c.photos && c.photos[0]} />
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 15.5, color: th.ink }}>{c.name}, {c.age}</div>
        <div style={{ fontFamily: th.body, fontSize: 12.5, color: alpha(th.ink, 0.5), marginBottom: 4 }}>{c.region} · {c.religiosity} · {window.findMm(c.mmId).name.split(' ')[0]}</div>
        <div style={{ fontFamily: th.body, fontSize: 12, color: alpha(th.ink, 0.7), display: 'flex', gap: 5, alignItems: 'center' }}>
          <Logo size={13} color={th.primary} flaw={th.cream} /><span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{c.sabaBut}</span>
        </div>
      </div>
      {trailing}
    </button>

}

function MatchFlow({ th, go, params }) {
  const { lists, candidates, addOffer } = useContext(DataCtx);
  const { profile } = useContext(AuthCtx);
  const liveReligiosity = (lists.religiosity && lists.religiosity.length) ? lists.religiosity : RELIGIOSITY;
  const first = candidates.find(c => c.id === params?.id) || candidates[0];
  const presetSecond = params?.withId ? candidates.find(c => c.id === params.withId) : null;
  const [step, setStep] = useSc(presetSecond ? 3 : 1); // 1 first, 2 choose, 3 proposal, 4 success
  const [second, setSecond] = useSc(presetSecond);
  const [note, setNote] = useSc('');
  const [relFilter, setRelFilter] = useSc('');
  const [sending, setSending] = useSc(false);
  const [firstCandId, setFirstCandId] = useSc(null); // for self-match: who gets notified first
  const [previewCand, setPreviewCand] = useSc(null); // candidate being previewed in step 2

  const myUid = profile?.uid;
  const isSelfMatch = !!(second && first?.mmId === myUid && second?.mmId === myUid);
  // effective "first notified" candidate in self-match
  const notifyFirst  = isSelfMatch ? (firstCandId || first?.id) : null;
  const notifySecond = isSelfMatch ? (notifyFirst === first?.id ? second : first) : null;

  const candidates2 = useMc(() => candidates.filter(c => c.gender !== first?.gender && c.id !== first?.id && c.available && (!relFilter || c.religiosity === relFilter)), [candidates, first, relFilter]);

  const sendOffer = async () => {
    if (!first || !second || sending) return;
    setSending(true);
    try {
      if (isSelfMatch) {
        const a = candidates.find(c => c.id === notifyFirst);
        const b = notifySecond;
        await addOffer({
          aId: a.id, aMm: myUid,
          bId: b.id, bMm: myUid,
          status: 'ממתין למועמד',
          aStatus: 'אישר', bStatus: 'אישר', // matchmaker already approved both
          selfMatch: true,
          candAStatus: 'ממתין',  // first candidate awaiting decision
          candBStatus: 'טרם',   // second candidate not yet their turn
          note: note.trim(), unread: 0,
        });
      } else {
        await addOffer({
          aId: first.id,  aMm: first.mmId || myUid,
          bId: second.id, bMm: second.mmId,
          status: 'נשלחה',
          aStatus: 'ממתין', bStatus: 'ממתין',
          note: note.trim(), unread: 0,
        });
      }
      setStep(4);
    } catch(e) { alert('שגיאה בשליחה: ' + e.message); }
    setSending(false);
  };
  const steps = ['ראשון', 'שני', 'הצעה'];
  const stepIdx = Math.min(step, 3) - 1;

  const back = () => {
    if (step === 1) return go('back');
    if (step === 3 && presetSecond) return go('back');
    setStep(step - 1);
  };

  // STEP 4 — success
  if (step === 4) {
    const candA = isSelfMatch ? candidates.find(c => c.id === notifyFirst) || first : first;
    const candB = isSelfMatch ? notifySecond || second : second;
    return (
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', background: `linear-gradient(170deg, ${th.cream}, ${tint(th.success, 0.86)})`, padding: 28, textAlign: 'center' }}>
        <div style={{ animation: 'sabaPop .5s cubic-bezier(.2,.9,.3,1)', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 4, marginBottom: 24 }}>
          <Avatar grad={candA.grad} name={candA.name} size={84} photo={candA.photos && candA.photos[0]} style={{ marginInlineEnd: -12 }} />
          <div style={{ zIndex: 2, background: th.success, color: '#fff', borderRadius: '50%', width: 46, height: 46, display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: `0 8px 20px ${alpha(th.success, 0.4)}` }}><Icon name="heart" size={26} fill="#fff" stroke={0} /></div>
          <Avatar grad={candB.grad} name={candB.name} size={84} photo={candB.photos && candB.photos[0]} style={{ marginInlineStart: -12 }} />
        </div>
        <h1 style={{ fontFamily: th.display, fontSize: 28, color: th.ink, margin: '0 0 10px' }}>{isSelfMatch ? 'שידוך ישיר!' : 'ההצעה בדרך!'}</h1>
        <p style={{ fontFamily: th.body, fontSize: 16, color: alpha(th.ink, 0.65), lineHeight: 1.5, maxWidth: 300, margin: '0 0 28px' }}>
          {isSelfMatch
            ? <>{candA.name} יקבל/תקבל את ההצעה ראשון/ה. אם יאשר/תאשר — {candB.name} יקבל/תקבל הצעה.</>
            : <>שלחנו את ההצעה לשדכן/ית של {candB.name}. ברגע שתתקבל — {candA.name} יעודכן/תעודכן.</>
          }
        </p>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10, width: '100%', maxWidth: 320 }}>
          <Btn th={th} full size="l" onClick={() => go('offers')}>למעקב הצעות</Btn>
          <Btn th={th} full size="l" variant="ghost" onClick={() => go('tab', { tab: 'home' })}>חזרה לבית</Btn>
        </div>
      </div>
    );
  }

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: th.cream }}>
      <AppHeader th={th} title="שידוך חדש" onBack={back} />
      {/* progress */}
      <div style={{ display: 'flex', gap: 6, padding: '4px 18px 10px', flexShrink: 0 }}>
        {steps.map((s, i) => (
          <div key={i} style={{ flex: 1, textAlign: 'center' }}>
            <div style={{ height: 5, borderRadius: 99, background: i <= stepIdx ? th.primary : alpha(th.ink, 0.12), marginBottom: 5, transition: 'background .3s' }} />
            <span style={{ fontFamily: th.body, fontSize: 11, fontWeight: 700, color: i <= stepIdx ? th.primary : alpha(th.ink, 0.4) }}>{s}</span>
          </div>
        ))}
      </div>

      <div style={{ flex: 1, overflowY: 'auto', padding: '6px 18px 24px' }}>
        {step === 1 && (
          <>
            <div style={{ fontFamily: th.display, fontSize: 19, fontWeight: 800, color: th.ink, marginBottom: 6 }}>מתחילים עם {first.name}</div>
            <p style={{ fontFamily: th.body, fontSize: 14, color: alpha(th.ink, 0.6), marginTop: 0, marginBottom: 14, lineHeight: 1.4 }}>זה/זו המועמד/ת הראשון/ה בשידוך. עכשיו נמצא את ההתאמה.</p>
            <CandRow c={first} th={th} selected />
            <div style={{ display: 'flex', gap: 8, alignItems: 'flex-start', background: alpha(th.gold, 0.12), borderRadius: th.r, padding: 12, marginTop: 4 }}>
              <Icon name="info" size={18} style={{ color: th.gold, flexShrink: 0 }} />
              <span style={{ fontFamily: th.body, fontSize: 13, color: alpha(th.ink, 0.72), lineHeight: 1.4 }}>חוק הבית: לפחות אחד מבני הזוג חייב להיות מועמד/ת <b>שלך</b>.</span>
            </div>
            <Btn th={th} full size="l" style={{ marginTop: 20 }} onClick={() => setStep(2)}>בחר/י התאמה</Btn>
          </>
        )}

        {step === 2 && (
          <>
            <div style={{ fontFamily: th.display, fontSize: 19, fontWeight: 800, color: th.ink, marginBottom: 10 }}>מי מתאים/ה ל{first.name}?</div>
            <div style={{ display: 'flex', gap: 7, overflowX: 'auto', marginBottom: 14, paddingBottom: 4 }}>
              <Chip th={th} label="הכל" active={!relFilter} onClick={() => setRelFilter('')} tone={th.gold} />
              {liveReligiosity.slice(0, 6).map(r => <Chip key={r} th={th} label={r} active={relFilter === r} onClick={() => setRelFilter(relFilter === r ? '' : r)} tone={th.gold} />)}
            </div>
            {candidates2.map(c => (
              <CandRow key={c.id} c={c} th={th} selected={second?.id === c.id} onClick={() => setPreviewCand(c)}
                trailing={second?.id === c.id ? <div style={{ color: th.primary }}><Icon name="check" size={24} /></div> : null} />
            ))}
            {candidates2.length === 0 && <div style={{ textAlign: 'center', color: alpha(th.ink, 0.4), padding: 30, fontFamily: th.body }}>אין התאמות בפילטר הזה</div>}
            <div style={{ height: second ? 72 : 20 }} />
          </>
        )}

        {step === 3 && second && (
          <>
            <div style={{ fontFamily: th.display, fontSize: 19, fontWeight: 800, color: th.ink, marginBottom: 14 }}>הנה ההצעה</div>
            {/* pair summary */}
            <div style={{ background: th.card, borderRadius: th.rLg, padding: 18, boxShadow: `0 8px 22px ${alpha(th.ink, 0.08)}`, marginBottom: 14 }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, marginBottom: 14 }}>
                <div style={{ textAlign: 'center' }}>
                  <Avatar grad={first.grad} name={first.name} size={72} photo={first.photos && first.photos[0]} style={{ marginInline: 'auto' }} />
                  <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 15, color: th.ink, marginTop: 6 }}>{first.name}</div>
                </div>
                <div style={{ color: th.primary, padding: '0 4px' }}><Icon name="heart" size={30} fill={th.primary} stroke={0} /></div>
                <div style={{ textAlign: 'center' }}>
                  <Avatar grad={second.grad} name={second.name} size={72} photo={second.photos && second.photos[0]} style={{ marginInline: 'auto' }} />
                  <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 15, color: th.ink, marginTop: 6 }}>{second.name}</div>
                </div>
              </div>
              <div style={{ background: alpha(th.gold, 0.12), borderRadius: th.r, padding: 13 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 6 }}>
                  <Icon name="spark" size={16} style={{ color: th.gold }} fill={th.gold} />
                  <span style={{ fontFamily: th.display, fontWeight: 800, fontSize: 13.5, color: th.ink }}>למה זה יכול לעבוד</span>
                </div>
                <p style={{ margin: 0, fontFamily: th.body, fontSize: 14, color: alpha(th.ink, 0.75), lineHeight: 1.5 }}>
                  שניהם מ{first.region === second.region ? `אותו אזור (${first.region})` : 'אזורים שונים אבל קרובים בנפש'}, חולקים תחומי עניין ומחפשים חיבור אמיתי. תחושת בטן אומרת — שווה לנסות.
                </p>
              </div>
            </div>

            {isSelfMatch ? (
              <>
                <div style={{ background: alpha(th.primary, 0.07), border: `1.5px solid ${alpha(th.primary,0.2)}`, borderRadius: th.r, padding: 14, marginBottom: 14 }}>
                  <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 13.5, color: th.primary, marginBottom: 10 }}>מי יקבל את ההצעה ראשון?</div>
                  {[first, second].map(c => {
                    const chosen = (firstCandId || first.id) === c.id;
                    return (
                      <button key={c.id} onClick={() => setFirstCandId(c.id)} style={{ all:'unset', cursor:'pointer', boxSizing:'border-box', width:'100%', display:'flex', alignItems:'center', gap:10, padding:'10px 12px', borderRadius:th.rSm, marginBottom:6, background: chosen ? alpha(th.primary,0.1) : alpha(th.ink,0.04), border:`1.5px solid ${chosen ? th.primary : 'transparent'}`, transition:'all .15s' }}>
                        <Avatar grad={c.grad} name={c.name} size={36} photo={c.photos?.[0]} />
                        <div style={{ flex:1 }}>
                          <div style={{ fontFamily:th.display, fontWeight:800, fontSize:14, color:th.ink }}>{c.name}</div>
                          <div style={{ fontFamily:th.body, fontSize:11.5, color:alpha(th.ink,0.5) }}>{c.region}</div>
                        </div>
                        {chosen && <Icon name="check" size={20} style={{ color:th.primary }} />}
                      </button>
                    );
                  })}
                </div>
                <Field th={th} label="הערה אישית (לרשומות שלך)" hint="לא חובה">
                  <TextArea th={th} value={note} onChange={setNote} placeholder="למה חשבתי על השידוך הזה…" rows={2} />
                </Field>
                <div style={{ background:alpha(th.success,0.09), borderRadius:th.rSm, padding:'10px 14px', marginBottom:14, fontFamily:th.body, fontSize:13, color:alpha(th.ink,0.7), lineHeight:1.5 }}>
                  ✓ שני המועמדים שלך — ההצעה מאושרת אוטומטית מצדך. {(candidates.find(c=>c.id===(firstCandId||first.id))||first).name} יקבל/תקבל ראשון.
                </div>
              </>
            ) : (
              <Field th={th} label={`מילה אישית לשדכן/ית של ${second?.name}`} hint="לא חובה — אבל תמיד עוזר">
                <TextArea th={th} value={note} onChange={setNote} placeholder="היי! חשבתי שאולי יש כאן משהו… בא לך שנבדוק?" rows={3} />
              </Field>
            )}
            <Btn th={th} full size="l" style={{ marginTop: 4 }} disabled={sending} onClick={sendOffer} icon={<Icon name="send" size={19} fill="#fff" stroke={0} />}>{sending ? 'שולח…' : isSelfMatch ? 'שלח/י שידוך ישיר' : 'שלח/י הצעה'}</Btn>
          </>
        )}
      </div>

      {/* Floating "proceed" bar — appears at bottom once a candidate is chosen via preview */}
      {step === 2 && second && (
        <div style={{ flexShrink: 0, padding: '10px 18px 18px', background: th.cream, borderTop: `1px solid ${alpha(th.ink, 0.07)}`, boxShadow: `0 -8px 22px ${alpha(th.ink, 0.08)}`, animation: 'sabaUp .2s ease' }}>
          <Btn th={th} full size="l" icon={<Icon name="heart" size={18} fill="#fff" stroke={0} />} onClick={() => setStep(3)}>
            {second.name} — המשך לשליחה
          </Btn>
        </div>
      )}

      {/* Candidate profile preview sheet — slides up when a row is tapped in step 2 */}
      {previewCand && (
        <div onClick={() => setPreviewCand(null)} style={{ position: 'absolute', inset: 0, zIndex: 100, background: alpha(th.ink, 0.42), display: 'flex', alignItems: 'flex-end', animation: 'sabaFade .2s ease' }}>
          <div onClick={e => e.stopPropagation()} style={{ background: th.cream, width: '100%', height: '92%', borderTopLeftRadius: th.rLg, borderTopRightRadius: th.rLg, display: 'flex', flexDirection: 'column', overflow: 'hidden', animation: 'sabaUp .28s cubic-bezier(.2,.9,.3,1)' }}>
            {/* drag handle + close button */}
            <div style={{ display: 'flex', alignItems: 'center', padding: '10px 16px 4px', flexShrink: 0 }}>
              <div style={{ flex: 1, display: 'flex', justifyContent: 'center' }}>
                <div style={{ width: 40, height: 5, borderRadius: 99, background: alpha(th.ink, 0.18) }} />
              </div>
              <button onClick={() => setPreviewCand(null)} style={{ border: 'none', background: alpha(th.ink, 0.07), borderRadius: '50%', width: 34, height: 34, cursor: 'pointer', color: th.ink, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                <Icon name="x" size={18} />
              </button>
            </div>
            {/* scrollable profile body */}
            <div style={{ flex: 1, overflowY: 'auto' }}>
              <PhotoGallery c={previewCand} th={th} height={280}>
                <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, height: 130, background: `linear-gradient(to top, ${alpha(th.ink, 0.76)}, transparent)`, pointerEvents: 'none' }} />
                <div style={{ position: 'absolute', bottom: 36, right: 20, left: 20, color: '#fff', pointerEvents: 'none' }}>
                  <div style={{ fontFamily: th.display, fontSize: 28, fontWeight: 800, lineHeight: 1 }}>{previewCand.name}, {previewCand.age}</div>
                  <div style={{ fontFamily: th.body, fontSize: 14, opacity: 0.9, marginTop: 5 }}>{previewCand.region} · {previewCand.religiosity}</div>
                </div>
              </PhotoGallery>
              <div style={{ padding: '16px 20px 32px' }}>
                {previewCand.sabaBut && <div style={{ marginBottom: 14 }}><SabaBadge th={th} text={previewCand.sabaBut} size="l" /></div>}

                  <div style={{ background: th.card, borderRadius: th.r, padding: 14, marginBottom: 12, boxShadow: `0 4px 14px ${alpha(th.ink, 0.05)}` }}>

                    <p style={{ margin: 0, fontFamily: th.body, fontSize: 15, color: alpha(th.ink, 0.8), lineHeight: 1.5 }}>{previewCand.oneLine}</p>

                )}

                  <div style={{ background: th.card, borderRadius: th.r, padding: 14, marginBottom: 12, boxShadow: `0 4px 14px ${alpha(th.ink, 0.05)}` }}>
                    <div style={{ fontFamily: th.body, fontSize: 12, fontWeight: 700, color: alpha(th.ink, 0.45), marginBottom: 6 }}>רואה את עצמו/ה עם</div>
                    <p style={{ margin: 0, fontFamily: th.body, fontSize: 15, color: alpha(th.ink, 0.8), lineHeight: 1.5 }}>{previewCand.seesWith}</p>
                  </div>
                )}
                {(previewCand.interests?.length > 0) && (
                  <div style={{ background: th.card, borderRadius: th.r, padding: 14, marginBottom: 12, boxShadow: `0 4px 14px ${alpha(th.ink, 0.05)}` }}>
                    <div style={{ fontFamily: th.body, fontSize: 12, fontWeight: 700, color: alpha(th.ink, 0.45), marginBottom: 8 }}>תחומי עניין</div>
                    <InterestChips items={previewCand.interests} th={th} />
                  </div>

                  {infoPairs(previewCand).map(([k, v]) => (
                    <div key={k} style={{ display: 'flex', justifyContent: 'space-between', borderBottom: `1px solid ${alpha(th.ink, 0.07)}`, padding: '10px 0' }}>
                      <span style={{ fontFamily: th.body, fontSize: 13.5, color: alpha(th.ink, 0.5) }}>{k}</span>
                      <span style={{ fontFamily: th.display, fontSize: 14, color: th.ink, fontWeight: 700 }}>{v}</span>
                    </div>
                  ))}
                </div>
                {/* Matchmaker info + inquiry — only for other MMs' candidates */}
                {previewCand.mmId && previewCand.mmId !== myUid && (() => {
                  const mm = window.findMm(previewCand.mmId);
                  return (
                    <div style={{ background: th.card, borderRadius: th.r, padding: 14, marginTop: 12, boxShadow: `0 4px 14px ${alpha(th.ink, 0.05)}` }}>
                      <div style={{ fontFamily: th.body, fontSize: 11.5, fontWeight: 700, color: alpha(th.ink, 0.45), marginBottom: 8 }}>השדכן/ית</div>

                        <Avatar grad={mm.grad} name={mm.name} size={38} />
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 15, color: th.ink }}>{mm.name}</div>
                          <div style={{ fontFamily: th.body, fontSize: 11.5, color: alpha(th.ink, 0.45) }}>שדכן/ית של {previewCand.name}</div>
                        </div>
                      </div>
                      <Btn th={th} full variant="soft" size="s"
                        icon={<Icon name="chat" size={14} />}
                        onClick={() => { setPreviewCand(null); go('candInquiry', { candId: previewCand.id, toMm: previewCand.mmId }); }}>
                        שאל/י שאלה על {previewCand.name}
                      </Btn>
                    </div>
                  );
                })()}
              </div>
            </div>
            {/* sticky "שדך" action button */}
            <div style={{ flexShrink: 0, padding: '12px 20px 28px', background: th.cream, borderTop: `1px solid ${alpha(th.ink, 0.08)}`, boxShadow: `0 -8px 24px ${alpha(th.ink, 0.07)}` }}>
              <Btn th={th} full size="l" icon={<Icon name="heart" size={19} fill="#fff" stroke={0} />}
                onClick={() => { setSecond(previewCand); setPreviewCand(null); setStep(3); }}>
                שדך עם {first.name}
              </Btn>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const { useState: useSd, useRef: useRd, useEffect: useEd } = React;

function statusTone(s, th) {
  return { 'נשלחה': th.gold, 'נצפתה': th.gold, 'אושרה': th.success, 'נדחתה': alpha(th.ink, 0.5),
           'ממתין למועמד': th.primary, 'ממתין למועמד ב': th.primary }[s] || th.gold;
}

// ════════════════════════════════════════════════════════════
// OFFER STATUS
// ════════════════════════════════════════════════════════════
function Offers({ th, go, params }) {
  const { offers, candidates, matchmakers, updateOffer } = useContext(DataCtx);
  const { user } = useContext(AuthCtx);
  const myUid = user?.uid;
  const findC = id => candidates.find(c => c.id === id) || { name:'?', grad: gradForId(id), photos:[] };
  const findM = id => { const mm = matchmakers[id]; if (!mm) return { name:'—', grad: gradForId(id||'x') }; return { ...mm, name: mm.displayName || mm.name || '—', grad: mm.grad || gradForId(id) }; };
  const [tab, setTab] = useSd('pending');
  const [subFilter, setSubFilter] = useSd(params?.filter || null);

  const pending  = offers.filter(o => o.status === 'נשלחה' || o.status === 'נצפתה' || o.status === 'ממתין למועמד' || o.status === 'ממתין למועמד ב');
  const approved = offers.filter(o => o.status === 'אושרה');
  const done     = offers.filter(o => o.status === 'נדחתה');
  const listMap  = { pending, approved, done };

  // Apply sub-filter from home banner — when active, search across ALL offers (not tab-limited)
  let list;
  if (subFilter === 'needsMyApproval') {
    list = offers.filter(o => o.bMm === myUid && !['אישר','דחה'].includes(o.bStatus) && o.status !== 'נדחתה');
  } else if (subFilter === 'awaitingCand') {
    list = offers.filter(o =>
      (o.aMm === myUid || o.bMm === myUid) && o.bStatus === 'אישר' && (!o.aCandStatus || !o.bCandStatus) && o.status !== 'נדחתה' && o.status !== 'אושרה');
  } else {
    list = listMap[tab] || [];
  }

  const subFilterLabels = { needsMyApproval: 'ממתינות לאישורי', awaitingCand: 'ממתינות לתשובת מועמד' };
  const emptyMsg = { pending:'אין הצעות הממתינות לאישור', approved:'אין הצעות שאושרו', done:'אין הצעות שהסתיימו' };

  const tabs = [
    { id:'pending',  lbl:'ממתינות', count: pending.length,  dot: th.gold },
    { id:'approved', lbl:'אושרו',   count: approved.length, dot: th.success },
    { id:'done',     lbl:'נדחו',    count: done.length,     dot: null },
  ];

  return (
    <>
      <AppHeader th={th} title="שידוכים" sub={`${pending.length + approved.length} פעילות`} onBack={() => go('tab', { tab: 'home' })} />
      <div style={{ display: 'flex', gap: 6, padding: '4px 18px 6px', flexShrink: 0 }}>
        {tabs.map(({ id, lbl, count, dot }) => (
          <button key={id} onClick={() => { setTab(id); setSubFilter(null); }} style={{ flex: 1, padding: '8px 4px', borderRadius: 999, border: 'none', cursor: 'pointer', fontFamily: th.display, fontWeight: 800, fontSize: 13, background: tab === id ? th.ink : 'transparent', color: tab === id ? th.cream : alpha(th.ink, 0.5), boxShadow: tab === id ? 'none' : `inset 0 0 0 1.5px ${alpha(th.ink,0.12)}`, position:'relative' }}>
            {lbl}
            {count > 0 && <span style={{ marginInlineStart:4, background: tab===id ? alpha('#fff',0.25) : (dot || alpha(th.ink,0.2)), color:'#fff', borderRadius:99, fontSize:11, fontWeight:800, padding:'1px 6px' }}>{count}</span>}
          </button>
        ))}
      </div>
      {/* Active filter chip */}
      {subFilter && (
        <div style={{ padding: '0 18px 8px', flexShrink: 0 }}>
          <button onClick={() => setSubFilter(null)} style={{ display:'inline-flex', alignItems:'center', gap:6, border:'none', background: alpha(th.primary, 0.1), borderRadius: 999, padding: '5px 12px', cursor:'pointer', fontFamily: th.body, fontSize: 12, fontWeight: 700, color: th.primary }}>
            <Icon name="filter" size={13} />
            {subFilterLabels[subFilter]}
            <span style={{ opacity: 0.6, fontWeight: 400 }}>✕</span>
          </button>
        </div>
      )}
      <div style={{ flex: 1, overflowY: 'auto', padding: '6px 18px 24px' }}>
        {list.length === 0 && (
          <div style={{ textAlign:'center', padding:'40px 20px', fontFamily:th.body, color:alpha(th.ink,0.4) }}>
            {subFilter ? 'אין הצעות מסוג זה כרגע' : emptyMsg[tab]}
          </div>
        )}
        {list.map(o => {
          // Determine which side is "mine" based on logged-in user's UID
          const iAmA   = o.aMm === user?.uid;
          const myCand = findC(iAmA ? o.aId : o.bId);
          const theirC = findC(iAmA ? o.bId : o.aId);
          const theirMm = findM(iAmA ? o.bMm : o.aMm);
          const finalDone = o.status === 'אושרה';
          const finalFail = o.status === 'נדחתה';

          // Per-candidate approval (new Firestore fields; fallback from offer-level status)
          const aCandSt = o.aCandStatus || (finalDone ? 'אישר' : null);
          const bCandSt = o.bCandStatus || (finalDone ? 'אישר' : null);

          // ── 4 steps in FIXED process order: A(initiator) → B(receiver) → A's cand → B's cand ──
          // Labels shift: "אני" is step 1 when I'm A (I initiated), step 2 when I'm B (I received)
          const s1 = 'אישר';                  // A always ✓ — creating the offer = implicit approval
          const s2 = o.bStatus || null;       // B (receiver) must approve
          const s3 = aCandSt;                 // A's candidate
          const s4 = bCandSt;                 // B's candidate
          const allApproved = s1==='אישר' && s2==='אישר' && s3==='אישר' && s4==='אישר';

          const initiatorMm = findM(o.aMm);
          const pipeSteps = [
            { st: s1, label: iAmA ? 'אני' : initiatorMm.name.split(' ')[0] },  // A = initiator
            { st: s2, label: iAmA ? theirMm.name.split(' ')[0] : 'אני' },        // B = receiver
            { st: s3, label: findC(o.aId).name.split(' ')[0] },                  // A's candidate
            { st: s4, label: findC(o.bId).name.split(' ')[0] },                  // B's candidate
          ];
          const activeIdx = pipeSteps.findIndex(p => p.st !== 'אישר');
          const needsMyAction = !iAmA && activeIdx === 1; // I'm B and step 2 (my approval) is pending

          // WhatsApp link
          const waPhone = theirMm.phone ? String(theirMm.phone).replace(/\D/g,'').replace(/^0/,'972') : '';
          const waUrl = waPhone
            ? `https://wa.me/${waPhone}?text=${encodeURIComponent(`היי ${theirMm.name.split(' ')[0]}, בנושא ההצעה: ${myCand.name} ו${theirC.name}`)}`
            : `https://wa.me/`;

          return (
            <div key={o.id} style={{
              background: allApproved
                ? `linear-gradient(150deg, ${alpha(th.success,0.09)}, ${alpha(th.success,0.03)})`
                : th.card,
              borderRadius: th.r, padding: 14, marginBottom: 22,
              boxShadow: allApproved
                ? `0 6px 26px ${alpha(th.success,0.2)}, 0 0 0 1.5px ${alpha(th.success,0.32)}`
                : `0 6px 18px ${alpha(th.ink, 0.06)}`,
            }}>

              {/* Header: names + status badge */}
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12 }}>
                <div style={{ fontFamily:th.display, fontWeight:800, fontSize:15, color:th.ink }}>{myCand.name} · {theirC.name}</div>
                {allApproved
                  ? <div style={{ display:'flex', alignItems:'center', gap:5 }}>
                      <span style={{ fontSize:18 }}>🎉</span>
                      <Tag th={th} tone={th.success} soft={false}>אושרה!</Tag>
                    </div>
                  : <Tag th={th} tone={statusTone(o.status, th)} soft={false}>{o.status}</Tag>
                }
              </div>

              {/* Candidate boxes — tappable → candidate profile */}
              <div style={{ display:'flex', gap:8, marginBottom:10 }}>
                <button onClick={() => go('candidate', { id: iAmA ? o.aId : o.bId })}
                  style={{ all:'unset', cursor:'pointer', flex:1, background:alpha(th.primary,0.07), border:`1.5px solid ${alpha(th.primary,0.2)}`, borderRadius:th.rSm, padding:'9px 12px', display:'flex', alignItems:'center', gap:8, boxSizing:'border-box' }}>
                  <Avatar grad={myCand.grad} name={myCand.name} size={34} photo={myCand.photos?.[0]} />
                  <div style={{ minWidth:0, flex:1 }}>
                    <div style={{ fontFamily:th.body, fontSize:10, fontWeight:700, color:th.primary }}>המועמד/ת שלי</div>
                    <div style={{ fontFamily:th.display, fontWeight:800, fontSize:13.5, color:th.ink, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{myCand.name}</div>
                  </div>
                  <Icon name="chevL" size={13} style={{ color:alpha(th.primary,0.4), flexShrink:0 }} />
                </button>
                <button onClick={() => go('candidate', { id: iAmA ? o.bId : o.aId })}
                  style={{ all:'unset', cursor:'pointer', flex:1, background:alpha(th.ink,0.04), border:`1.5px solid ${alpha(th.ink,0.08)}`, borderRadius:th.rSm, padding:'9px 12px', display:'flex', alignItems:'center', gap:8, boxSizing:'border-box' }}>
                  <Avatar grad={theirC.grad} name={theirC.name} size={34} photo={theirC.photos?.[0]} />
                  <div style={{ minWidth:0, flex:1 }}>
                    <div style={{ fontFamily:th.body, fontSize:10, fontWeight:700, color:alpha(th.ink,0.45) }}>הצד השני</div>
                    <div style={{ fontFamily:th.display, fontWeight:800, fontSize:13.5, color:th.ink, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{theirC.name}</div>
                  </div>
                  <Icon name="chevL" size={13} style={{ color:alpha(th.ink,0.25), flexShrink:0 }} />
                </button>
              </div>

              {/* ── 4-step approval pipeline ── */}
              <div style={{ background: allApproved ? alpha(th.success,0.07) : alpha(th.ink,0.025), borderRadius:th.rSm, padding:'10px 12px', marginBottom:10 }}>
                {/* Celebration banner */}
                {allApproved && (
                  <div style={{ textAlign:'center', marginBottom:9, animation:'sabaFade .5s ease' }}>
                    <div style={{ fontSize:24, lineHeight:1 }}>🎉</div>
                    <div style={{ fontFamily:th.display, fontWeight:800, fontSize:13, color:th.success, marginTop:3 }}>כולם אישרו — יהי מזל טוב! 💍</div>
                  </div>
                )}
                {/* Circles + connectors */}
                <div style={{ display:'flex', alignItems:'center' }}>
                  {pipeSteps.map((step, idx) => {
                    const done   = step.st === 'אישר';
                    const fail   = step.st === 'דחה';
                    const active = !done && !fail && idx === activeIdx;
                    const bg = done ? th.success : fail ? th.error : active ? th.primary : alpha(th.ink,0.13);
                    return (
                      <React.Fragment key={idx}>
                        <div style={{ width:22, height:22, borderRadius:'50%', flexShrink:0, transition:'all .25s', background:bg,
                          boxShadow: active ? `0 0 0 3px ${alpha(th.primary,0.22)}` : done&&allApproved ? `0 0 0 2px ${alpha(th.success,0.3)}` : 'none',
                          display:'flex', alignItems:'center', justifyContent:'center' }}>
                          {done ? <Icon name="check" size={11} style={{ color:'#fff' }} />
                          : fail ? <Icon name="x"    size={11} style={{ color:'#fff' }} />
                          : <span style={{ fontFamily:th.display, fontWeight:800, fontSize:9, color:active?'#fff':alpha(th.ink,0.35) }}>{idx+1}</span>}
                        </div>
                        {idx < 3 && <div style={{ flex:1, height:2, margin:'0 2px', background:done?th.success:alpha(th.ink,0.1), transition:'background .3s' }} />}
                      </React.Fragment>
                    );
                  })}
                </div>
                {/* Step labels */}
                <div style={{ display:'flex', marginTop:5 }}>
                  {pipeSteps.map((step, idx) => {
                    const done   = step.st === 'אישר';
                    const fail   = step.st === 'דחה';
                    const active = !done && !fail && idx === activeIdx;
                    return (
                      <div key={idx} style={{ flex:1, textAlign:'center', minWidth:0, paddingInline:1 }}>
                        <div style={{ fontFamily:th.display, fontWeight:800, fontSize:9.5, color:done?th.success:fail?th.error:active?th.primary:alpha(th.ink,0.38), overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
                          {step.label}
                        </div>
                        <div style={{ fontFamily:th.body, fontSize:8.5, color:alpha(th.ink,0.4), marginTop:1 }}>
                          {done ? '✓' : fail ? '✗' : active && needsMyAction && idx===1 ? '← נדרש' : active ? '…' : ''}
                        </div>
                      </div>
                    );
                  })}
                </div>
                {/* Context callout / action buttons */}
                {!allApproved && !finalFail && activeIdx >= 0 && (
                  needsMyAction ? (
                    /* ── Receiver sees approve / decline buttons ── */
                    <div style={{ marginTop:9, display:'flex', gap:8 }}>
                      <button
                        onClick={async (e) => { e.stopPropagation(); await updateOffer(o.id, { bStatus: 'אישר' }); }}
                        style={{ flex:1, padding:'7px 0', borderRadius:th.rSm, border:'none', cursor:'pointer',
                          fontFamily:th.display, fontWeight:800, fontSize:13,
                          background:alpha(th.success,0.13), color:th.success,
                          display:'flex', alignItems:'center', justifyContent:'center', gap:5 }}>
                        <Icon name="check" size={14} /> אשר
                      </button>
                      <button
                        onClick={async (e) => { e.stopPropagation();
                          if (window.confirm('לדחות את הצעת השידוך?'))
                            await updateOffer(o.id, { bStatus: 'דחה', status: 'נדחתה' }); }}
                        style={{ flex:1, padding:'7px 0', borderRadius:th.rSm,
                          border:`1px solid ${alpha(th.error,0.25)}`, cursor:'pointer',
                          fontFamily:th.display, fontWeight:800, fontSize:13,
                          background:alpha(th.error,0.08), color:th.error,
                          display:'flex', alignItems:'center', justifyContent:'center', gap:5 }}>
                        <Icon name="x" size={14} /> דחה
                      </button>
                    </div>
                  ) : (
                    /* ── Waiting text for other steps ── */
                    <div style={{ marginTop:7, background:alpha(th.gold,0.1), borderRadius:th.rSm, padding:'5px 9px', display:'flex', alignItems:'center', gap:5 }}>
                      <Icon name="bell" size={12} style={{ color:th.gold, flexShrink:0 }} />
                      <span style={{ fontFamily:th.body, fontSize:11, color:alpha(th.ink,0.72) }}>
                        ממתין ל<b>{pipeSteps[activeIdx].label}</b>
                      </span>
                    </div>
                  )
                )}
                {finalFail && (
                  <div style={{ marginTop:7, background:alpha(th.error,0.08), borderRadius:th.rSm, padding:'5px 9px', display:'flex', alignItems:'center', gap:5 }}>
                    <Icon name="x" size={12} style={{ color:th.error, flexShrink:0 }} />
                    <span style={{ fontFamily:th.body, fontSize:11, color:alpha(th.ink,0.7) }}>ההצעה לא התקדמה</span>
                  </div>
                )}
              </div>

              {/* Footer: other MM info + WhatsApp + Chat */}
              <div style={{ display:'flex', alignItems:'center', gap:8, background:alpha(th.ink,0.03), borderRadius:th.rSm, padding:'8px 10px' }}>
                <Avatar grad={theirMm.grad} name={theirMm.name} size={28} photo={theirMm.photoURL} />
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontFamily:th.body, fontSize:11, color:alpha(th.ink,0.45) }}>שדכן/ית הצד השני</div>
                  <div style={{ fontFamily:th.display, fontWeight:800, fontSize:13, color:th.ink }}>{theirMm.name}</div>
                </div>
                {/* WhatsApp button */}
                <a href={waUrl} target="_blank" rel="noreferrer"
                  style={{ display:'flex', alignItems:'center', justifyContent:'center', width:34, height:34, borderRadius:'50%', background:'#25D36612', border:`1px solid #25D36628`, color:'#25D366', textDecoration:'none', flexShrink:0 }}>
                  <Icon name="whatsapp" size={17} style={{ color:'#25D366' }} />
                </a>
                {/* Chat button */}
                <button onClick={() => go('chat', { id: o.id })}
                  style={{ all:'unset', cursor:'pointer', display:'flex', alignItems:'center', gap:5, color:th.primary, flexShrink:0, padding:'6px 10px', borderRadius:999, background:alpha(th.primary,0.08) }}>
                  <Icon name="chat" size={17} />
                  <span style={{ fontFamily:th.body, fontWeight:700, fontSize:12.5 }}>צ'אט</span>
                  {o.unread > 0 && <span style={{ background:th.primary, color:'#fff', borderRadius:999, minWidth:18, height:18, fontSize:11, fontWeight:800, display:'flex', alignItems:'center', justifyContent:'center', padding:'0 4px' }}>{o.unread}</span>}
                </button>
              </div>
            </div>
          );
        })}
      </div>
    </>
  );
}

// ════════════════════════════════════════════════════════════
// MATCHMAKER CHAT
// ════════════════════════════════════════════════════════════
function Chat({ th, go, params }) {
  // All hooks MUST come before any early returns (Rules of Hooks)
  const { offers, candidates, matchmakers, updateOffer } = useContext(DataCtx);
  const { user } = useContext(AuthCtx);
  const [msgs,     setMsgs]     = useSd([]);
  const [text,     setText]     = useSd('');
  const [testOpen, setTestOpen] = useSd(false);
  const endRef = useRd(null);
  useEd(() => { endRef.current?.parentNode?.scrollTo(0, 99999); }, [msgs]);

  const findC = id => candidates.find(c => c.id === id) || { name:'?', grad: gradForId(id||'x'), photos:[] };
  const findM = id => { const mm = matchmakers[id]; if (!mm) return { name:'—', grad: gradForId(id||'x') }; return { ...mm, name: mm.displayName||mm.name||'—', grad: mm.grad||gradForId(id) }; };

  const o = offers.find(x => x.id === params?.id) || offers[0];
  if (!o) return (
    <div style={{ height:'100%', display:'flex', alignItems:'center', justifyContent:'center', background:th.cream, direction:'rtl' }}>
      <div style={{ fontFamily:th.body, color:alpha(th.ink,0.4) }}>לא נמצאה הצעה</div>
    </div>
  );

  const iAmA    = o.aMm === user?.uid;
  const theirMmId = iAmA ? o.bMm : o.aMm;
  const theirMm   = findM(theirMmId);
  const a = findC(o.aId), b = findC(o.bId);
  const myCand   = iAmA ? a : b;
  const theirCand = iAmA ? b : a;

  const send = (t) => { if (!t.trim()) return; setMsgs(m => [...m, { from: 'me', text: t, t: 'עכשיו' }]); setText(''); };
  const incoming = (t) => setMsgs(m => [...m, { from: 'm2', text: t, t: 'עכשיו' }]);

  // Test helpers — simulate other matchmaker's response in Firestore
  const testApprove      = async () => { await updateOffer(o.id, { bStatus: 'אישר' }); incoming('✅ [בדיקה] שדכן ב\' אישר את ההצעה!'); };
  const testDecline      = async () => { await updateOffer(o.id, { bStatus: 'דחה', status: 'נדחתה' }); incoming('❌ [בדיקה] שדכן ב\' דחה את ההצעה.'); };
  const testSeen         = async () => { await updateOffer(o.id, { status: 'נצפתה' }); incoming('👁 [בדיקה] שדכן ב\' ראה את ההצעה.'); };
  const testACandApprove = async () => { await updateOffer(o.id, { aCandStatus: 'אישר' }); incoming(`✅ [בדיקה] ${a.name} אישר/ה את ההצעה!`); };
  const testBCandApprove = async () => { await updateOffer(o.id, { bCandStatus: 'אישר', status: 'אושרה' }); incoming(`🎉 [בדיקה] ${b.name} אישר/ה — ההצעה אושרה!`); };
  const testBCandDecline = async () => { await updateOffer(o.id, { bCandStatus: 'דחה', status: 'נדחתה' }); incoming(`❌ [בדיקה] ${b.name} דחה/תה את ההצעה.`); };

  // WhatsApp link
  const waPhone = theirMm.phone ? String(theirMm.phone).replace(/\D/g,'').replace(/^0/,'972') : '';
  const waUrl = waPhone
    ? `https://wa.me/${waPhone}?text=${encodeURIComponent(`היי ${theirMm.name.split(' ')[0]}, בנושא ההצעה: ${myCand.name} ו${theirCand.name}`)}`
    : `https://wa.me/`;

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: th.cream }}>
      {/* Header */}
      <div style={{ paddingTop: 50, paddingInline: 14, paddingBottom: 10, background: th.card, flexShrink: 0, borderBottom: `1px solid ${alpha(th.ink, 0.08)}`, display: 'flex', alignItems: 'center', gap: 10 }}>
        <button onClick={() => go('offers')} style={{ width: 38, height: 38, borderRadius: '50%', border: 'none', background: alpha(th.ink, 0.05), color: th.ink, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}><Icon name="back" size={20} /></button>
        <Avatar grad={theirMm.grad} name={theirMm.name} size={40} photo={theirMm.photoURL} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 16, color: th.ink }}>{theirMm.name}</div>
          {/* Tappable candidate names → profile */}
          <div style={{ display: 'flex', gap: 6, alignItems: 'center', marginTop: 1 }}>
            <button onClick={() => go('candidate', { id: o.aId })}
              style={{ all:'unset', cursor:'pointer', fontFamily:th.body, fontSize:12, color:th.primary, fontWeight:700 }}>{a.name}</button>
            <span style={{ fontFamily:th.body, fontSize:11, color:alpha(th.ink,0.3) }}>·</span>
            <button onClick={() => go('candidate', { id: o.bId })}
              style={{ all:'unset', cursor:'pointer', fontFamily:th.body, fontSize:12, color:th.primary, fontWeight:700 }}>{b.name}</button>
          </div>
        </div>
        {/* WhatsApp */}
        <a href={waUrl} target="_blank" rel="noreferrer"
          style={{ width:34, height:34, borderRadius:'50%', background:'#25D36612', border:`1px solid #25D36628`, color:'#25D366', display:'flex', alignItems:'center', justifyContent:'center', textDecoration:'none', flexShrink:0 }}>
          <Icon name="whatsapp" size={18} style={{ color:'#25D366' }} />
        </a>
        <Tag th={th} tone={statusTone(o.status, th)} soft={false}>{o.status}</Tag>
      </div>

      {/* Messages */}
      <div style={{ flex: 1, overflowY: 'auto', padding: '14px 16px', display: 'flex', flexDirection: 'column', gap: 10 }}>
        <div style={{ alignSelf: 'center', background: alpha(th.gold, 0.14), borderRadius: th.r, padding: '8px 14px', display: 'flex', alignItems: 'center', gap: 8, marginBottom: 4 }}>
          <Icon name="heart" size={15} style={{ color: th.primary }} fill={th.primary} stroke={0} />

// AI RECOMMENDATIONS
// ════════════════════════════════════════════════════════════
function AIRecs({ th, go }) {
  const { candidates, offers } = React.useContext(DataCtx);
  const { user }               = React.useContext(AuthCtx);
  const myUid = user?.uid;

  // ── Scoring engine ────────────────────────────────────────────
  const pairs = React.useMemo(() => {
    if (!myUid || !candidates.length) return [];

    const mine   = candidates.filter(c => c.mmId === myUid);
    const others = candidates.filter(c => c.mmId && c.mmId !== myUid);
    if (!mine.length || !others.length) return [];

    // Offers already in flight — skip those pairs
    const existing = new Set(
      offers.flatMap(o => [`${o.aId}__${o.bId}`, `${o.bId}__${o.aId}`])
    );

    // Religiosity compatibility (gender-neutral root comparison)
    const rRoot = r => (r||'').replace(/ית$|ית$/,'י').replace(/ה$/,'');
    const RCOMPAT = {
      'חרד':      ['חרד', 'דתי-לאומ'],
      'דתי-לאומ': ['חרד', 'דתי-לאומ', 'מסורת'],
      'מסורת':    ['דתי-לאומ', 'מסורת', 'חילונ'],
      'חילונ':    ['מסורת', 'חילונ'],
    };
    const compatRelig = (r1, r2) => {
      if (!r1 || !r2) return true;
      const k1 = Object.keys(RCOMPAT).find(k => rRoot(r1).startsWith(k));
      const k2 = Object.keys(RCOMPAT).find(k => rRoot(r2).startsWith(k));
      if (!k1 || !k2) return true;
      return k1 === k2 || (RCOMPAT[k1]||[]).some(x => k2.startsWith(x));
    };

    const calcScore = (a, b) => {
      const isFemale = c => c.gender === 'f' || c.gender === 'אשה';
      if (isFemale(a) === isFemale(b)) return -1;   // same gender → skip
      let s = 50;
      // Religiosity: +20 exact match, +8 compatible, -25 incompatible
      if (a.religiosity === b.religiosity) s += 20;
      else if (compatRelig(a.religiosity, b.religiosity)) s += 8;
      else s -= 25;
      // Shared interests: +6 each, max +20
      const shared = (a.interests||[]).filter(i => (b.interests||[]).includes(i));
      s += Math.min(shared.length * 6, 20);
      // Same region +8
      if (a.region && a.region === b.region) s += 8;
      // Age proximity
      const diff = Math.abs((a.age||28) - (b.age||28));
      if (diff <= 3) s += 10; else if (diff <= 7) s += 5; else if (diff > 14) s -= 15;
      // Partner preference match: candidate A wants traits B has
      const partnerMatch = (seeker, candidate) =>
        (seeker.partner||[]).filter(t => {
          const c = candidate;
          if (t === 'הלכתי' || t === 'דתי') return c.religiosity?.includes('דת') || c.religiosity?.includes('חרד');
          if (t === 'חילוני') return c.religiosity?.includes('חילונ');
          if (t === 'שאפתן' || t === 'קרייריסטי') return (c.interests||[]).some(x => ['עסקים','קריירה','אקדמיה'].includes(x));
          if (t === 'חברתי') return (c.interests||[]).some(x => ['נסיעות','בידור','ריקוד'].includes(x));
          if (t === 'אקדמאי' || t === 'אקדמאית') return c.oneLine?.includes('אקדמ') || (c.interests||[]).includes('לימוד');
          return false;
        }).length;
      s += Math.min(partnerMatch(a, b) * 5, 10);
      s += Math.min(partnerMatch(b, a) * 5, 10);
      return Math.min(95, Math.max(10, s));
    };

    const buildWhy = (a, b) => {
      const shared = (a.interests||[]).filter(i => (b.interests||[]).includes(i));
      const parts = [];
      if (a.religiosity && a.religiosity === b.religiosity)
        parts.push(`שניהם ${a.religiosity}`);
      else if (compatRelig(a.religiosity, b.religiosity) && a.religiosity && b.religiosity)
        parts.push('רמת דתיות משלימה');
      if (shared.length)
        parts.push(`עניין משותף: ${shared.slice(0,3).join(', ')}`);
      if (a.region && a.region === b.region)
        parts.push(`שניהם מ${a.region}`);
      if (!parts.length) parts.push('פרופילים עם פוטנציאל התאמה גבוה');
      return parts.join(' · ');
    };

    const out = [];
    for (const c1 of mine) {
      for (const c2 of others) {
        if (existing.has(`${c1.id}__${c2.id}`)) continue;
        const s = calcScore(c1, c2);
        if (s < 0) continue;
        out.push({ aId: c1.id, bId: c2.id, score: s, why: buildWhy(c1, c2) });
      }
    }
    out.sort((x, y) => y.score - x.score);
    return out.slice(0, 10);
  }, [candidates, offers, myUid]);

  // ── Render ────────────────────────────────────────────────────
  return (
    <>
      <AppHeader th={th} title="המלצות AI" sub="הזיווגים שהאלגוריתם מצא השבוע" action={<div style={{ color: th.gold }}><Icon name="spark" size={26} fill={th.gold} /></div>} />
      <div style={{ flex: 1, overflowY: 'auto', padding: '10px 18px 24px' }}>
        <div style={{ display: 'flex', gap: 10, alignItems: 'flex-start', background: alpha(th.gold, 0.1), borderRadius: th.r, padding: 13, marginBottom: 16 }}>
          <Icon name="info" size={18} style={{ color: th.gold, flexShrink: 0 }} />
          <span style={{ fontFamily: th.body, fontSize: 13, color: alpha(th.ink, 0.72), lineHeight: 1.45 }}>
            ה-AI מנתח תחומי עניין, קרבה לדת, אזור ומה חשוב בפרטנר. <b>אתם מחליטים</b> — הוא רק מציע.
          </span>
        </div>

        {pairs.length === 0 && (
          <div style={{ textAlign:'center', padding:'48px 24px', color:alpha(th.ink,0.4) }}>
            <Icon name="spark" size={44} style={{ marginBottom:14, color:alpha(th.ink,0.15) }} />
            <div style={{ fontFamily:th.display, fontWeight:800, fontSize:17, marginBottom:8, color:alpha(th.ink,0.5) }}>אין התאמות כרגע</div>
            <div style={{ fontFamily:th.body, fontSize:13.5, lineHeight:1.5 }}>
              הוסף מועמדים ממגדרים שונים כדי שה-AI יוכל להציע זיווגים
            </div>
          </div>
        )}

        {pairs.map((p, i) => {
          const a = findCand(p.aId), b = findCand(p.bId);
          if (!a || !b) return null;
          const myCand   = a.mmId === myUid ? a : b;
          const theirCand = a.mmId === myUid ? b : a;
          return (
            <div key={i} style={{ background:th.card, borderRadius:th.rLg, padding:16, marginBottom:14, boxShadow:`0 6px 20px ${alpha(th.ink,0.07)}` }}>
              <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:12 }}>
                <div style={{ display:'flex', alignItems:'center' }}>
                  <Avatar grad={a.grad} name={a.name} size={52} photo={a.photos&&a.photos[0]} style={{ marginInlineEnd:-10, zIndex:2 }} />
                  <Avatar grad={b.grad} name={b.name} size={52} photo={b.photos&&b.photos[0]} style={{ marginInlineStart:-10 }} />
                </div>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontFamily:th.display, fontWeight:800, fontSize:16, color:th.ink }}>{a.name} · {b.name}</div>
                  <div style={{ fontFamily:th.body, fontSize:12.5, color:alpha(th.ink,0.5) }}>{a.age} · {b.age} | {a.region} · {b.region}</div>
                </div>
                <ScoreRing score={p.score} th={th} />
              </div>
              <div style={{ background:alpha(th.gold,0.1), borderRadius:th.r, padding:12, marginBottom:12 }}>
                <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:5 }}>
                  <Icon name="spark" size={15} style={{ color:th.gold }} fill={th.gold} />
                  <span style={{ fontFamily:th.display, fontWeight:800, fontSize:13, color:th.ink }}>למה הם מתאימים</span>
                </div>
                <p style={{ margin:0, fontFamily:th.body, fontSize:13.5, color:alpha(th.ink,0.75), lineHeight:1.5 }}>{p.why}</p>
              </div>
              <div style={{ display:'flex', gap:8 }}>
                <Btn th={th} variant="ghost" onClick={() => go('candidate', { id: theirCand.id })}>הצג כרטיסייה</Btn>
                <Btn th={th} full onClick={() => go('matchFlow', { id: myCand.id, withId: theirCand.id })} icon={<Icon name="heart" size={17} fill="#fff" stroke={0} />}>יזום שידוך</Btn>
              </div>
            </div>
          );
        })}
      </div>
    </>
  );
}

// CANDIDATE INQUIRY CHAT — matchmaker ↔ matchmaker about a candidate
// ════════════════════════════════════════════════════════════
function CandInquiry({ th, go, params }) {
  const { candidates, matchmakers } = useContext(DataCtx);
  const { user } = useContext(AuthCtx);
  const myUid   = user?.uid;
  const candId  = params?.candId;
  const toMmId  = params?.toMm;

  const c = candidates.find(x => x.id === candId) || { name:'?', grad:['#ccc','#999'], photos:[] };
  const resolveM = id => { const m = matchmakers[id]; return { ...m, name: m?.displayName||m?.name||'—', grad: m?.grad||['#ccc','#999'] }; };
  const theirMm = resolveM(toMmId);

  // Deterministic doc ID — order-agnostic, unique per (pair of MMs + candidate)
  const chatId = [...[myUid, toMmId].sort(), candId].join('__');

  const [msgs,    setMsgs]    = useSd([]);
  const [text,    setText]    = useSd('');
  const [loading, setLoading] = useSd(true);
  const [sending, setSending] = useSd(false);
  const endRef = useRd(null);

  useEd(() => {
    if (!chatId) return;
    const unsub = db.collection('mm_chats').doc(chatId).onSnapshot(
      snap => { setMsgs(snap.exists ? (snap.data().messages || []) : []); setLoading(false); },
      ()   => setLoading(false)
    );
    return () => unsub();
  }, [chatId]);

  useEd(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [msgs]);

  const send = async () => {
    if (!text.trim() || sending) return;
    const msgText = text.trim();
    setText('');
    setSending(true);
    try {
      await db.collection('mm_chats').doc(chatId).set({
        fromMm: myUid, toMm: toMmId, candId,
        participants: [myUid, toMmId],
        lastAt: firebase.firestore.FieldValue.serverTimestamp(),
        lastMsg: msgText,
        messages: firebase.firestore.FieldValue.arrayUnion({ from: myUid, text: msgText, at: Date.now() }),
      }, { merge: true });
    } catch(e) { console.error(e); }
    setSending(false);
  };

  return (
    <div style={{ height:'100%', display:'flex', flexDirection:'column', background:th.cream }}>
      {/* Header */}
      <div style={{ paddingTop:50, paddingInline:14, paddingBottom:10, background:th.card, flexShrink:0, borderBottom:`1px solid ${alpha(th.ink,0.08)}`, display:'flex', alignItems:'center', gap:10 }}>
        <button onClick={() => go('back')} style={{ width:38, height:38, borderRadius:'50%', border:'none', background:alpha(th.ink,0.05), color:th.ink, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
          <Icon name="back" size={20} />
        </button>
        <Avatar grad={theirMm.grad} name={theirMm.name} size={40} />
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontFamily:th.display, fontWeight:800, fontSize:16, color:th.ink }}>{theirMm.name}</div>
          <div style={{ fontFamily:th.body, fontSize:12, color:alpha(th.ink,0.5) }}>בנושא {c.name}</div>
        </div>
      </div>
      {/* Candidate context chip */}
      <div style={{ flexShrink:0, padding:'10px 16px 6px' }}>
        <div style={{ display:'flex', alignItems:'center', gap:8, background:alpha(th.primary,0.07), border:`1px solid ${alpha(th.primary,0.15)}`, borderRadius:th.rSm, padding:'8px 12px' }}>
          <Avatar grad={c.grad} name={c.name} size={30} photo={c.photos?.[0]} />
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ fontFamily:th.body, fontSize:10, color:alpha(th.ink,0.45) }}>שיחה בנושא</div>
            <div style={{ fontFamily:th.display, fontWeight:800, fontSize:13, color:th.ink }}>{c.name}{c.age?`, ${c.age}`:''}{c.region?` · ${c.region}`:''}</div>
          </div>
        </div>
      </div>
      {/* Messages */}
      <div style={{ flex:1, overflowY:'auto', padding:'8px 16px 12px', display:'flex', flexDirection:'column', gap:8 }}>
        {loading && <div style={{ textAlign:'center', color:alpha(th.ink,0.4), fontFamily:th.body, fontSize:13, padding:24 }}>טוען…</div>}
        {!loading && msgs.length === 0 && (
          <div style={{ textAlign:'center', padding:'36px 20px' }}>
            <div style={{ fontSize:34, marginBottom:10 }}>💬</div>
            <div style={{ fontFamily:th.display, fontWeight:800, fontSize:17, color:th.ink, marginBottom:6 }}>פתח/י שיחה</div>
            <div style={{ fontFamily:th.body, fontSize:13.5, color:alpha(th.ink,0.5), lineHeight:1.55 }}>שאל/י שאלות, קבל/י פרטים נוספים<br />על {c.name} מ{theirMm.name}</div>
          </div>
        )}
        {msgs.map((m, i) => {
          const mine = m.from === myUid;
          return (
            <div key={i} style={{ alignSelf:mine?'flex-start':'flex-end', maxWidth:'80%' }}>
              <div style={{ background:mine?th.primary:th.card, color:mine?'#fff':th.ink, borderRadius:18, borderBottomRightRadius:mine?18:4, borderBottomLeftRadius:mine?4:18, padding:'9px 13px', fontFamily:th.body, fontSize:14.5, lineHeight:1.4, boxShadow:`0 2px 8px ${alpha(th.ink,0.06)}` }}>
                {m.text}
              </div>
              <div style={{ fontFamily:th.body, fontSize:10.5, color:alpha(th.ink,0.4), marginTop:3, textAlign:mine?'right':'left' }}>
                {mine ? 'אני' : theirMm.name}
              </div>
            </div>
          );
        })}
        <div ref={endRef} />
      </div>
      {/* Input bar */}
      <div style={{ flexShrink:0, padding:'10px 14px 24px', background:th.card, borderTop:`1px solid ${alpha(th.ink,0.07)}`, display:'flex', gap:8, alignItems:'flex-end' }}>
        <textarea value={text} onChange={e => setText(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }}
          placeholder={`שאל/י שאלה על ${c.name}…`} rows={1}
          style={{ flex:1, resize:'none', border:'none', outline:'none', background:'transparent', fontFamily:th.body, fontSize:15, color:th.ink, lineHeight:1.5, padding:'4px 0' }} />
        <button onClick={send} disabled={!text.trim()||sending}
          style={{ width:38, height:38, borderRadius:'50%', border:'none', background:text.trim()?th.primary:alpha(th.ink,0.1), color:'#fff', cursor:text.trim()?'pointer':'default', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, transition:'background .15s' }}>
          <Icon name="send" size={17} fill="#fff" stroke={0} />
        </button>
      </div>
    </div>
  );
}

function CandidateMode({ th, go }) {
  const { user } = useContext(AuthCtx);
  const { candidates, offers, matchmakers, updateCandidate, updateOffer } = useContext(DataCtx);

  // Find this user's own candidate profile
  const me = candidates.find(c => c.candidateUid === user?.uid);

  // Find matchmakers who manage this candidate
  const myMms = me
    ? Object.values(matchmakers).filter(mm => mm.id === me.mmId || (me.coMms || []).includes(mm.id))
    : [];

  // Active offers for this candidate — including self-match offers when it's my turn
  const myOffers = me ? offers.filter(o => {
    if (o.status === 'נדחתה' || o.status === 'אושרה') return false;
    if (o.selfMatch) {
      // self-match: show only when it's this candidate's turn
      if (o.aId === me.id) return o.candAStatus === 'ממתין';
      if (o.bId === me.id) return o.candBStatus === 'ממתין';
      return false;
    }
    return o.aId === me.id || o.bId === me.id;
  }) : [];
  const currentOffer = myOffers[0] || null;
  const iAmA = currentOffer ? currentOffer.aId === me?.id : false;
  const otherCandId = currentOffer ? (iAmA ? currentOffer.bId : currentOffer.aId) : null;
  const otherCand = otherCandId ? candidates.find(c => c.id === otherCandId) : null;

  const [decided, setDecided] = useSe(null);
  const [submitting, setSubmitting] = useSe(false);
  const [coRepReqs, setCoRepReqs] = useSe([]);

  // Listen for pending co-rep requests addressed to this candidate
  useEffect(() => {
    if (!user?.uid) return;
    const unsub = db.collection('coRepRequests')
      .where('candidateUid', '==', user.uid)
      .where('status', '==', 'pending')
      .onSnapshot(s => setCoRepReqs(s.docs.map(d => ({ id: d.id, ...d.data() }))));
    return unsub;
  }, [user?.uid]);

  const approveCoRep = async (req) => {
    await db.collection('candidates').doc(req.candId)
      .update({ coMms: firebase.firestore.FieldValue.arrayUnion(req.mmId) });
    await db.collection('coRepRequests').doc(req.id)
      .update({ status: 'accepted', resolvedAt: firebase.firestore.FieldValue.serverTimestamp() });
    await db.collection('notifications').add({
      toUid: req.mmId, type: 'corep_approved',
      candId: req.candId, candName: req.candName,
      read: false, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
  };

  const declineCoRep = async (req) => {
    await db.collection('coRepRequests').doc(req.id)
      .update({ status: 'declined', resolvedAt: firebase.firestore.FieldValue.serverTimestamp() });
  };

  const submitDecision = async (choice) => {
    if (!currentOffer || submitting) return;
    setSubmitting(true);
    try {
      if (currentOffer.selfMatch) {
        if (choice === 'yes') {
          if (iAmA) {
            // first candidate approved → open to second candidate
            await updateOffer(currentOffer.id, { candAStatus: 'אישר', candBStatus: 'ממתין', status: 'ממתין למועמד ב' });
          } else {
            // second candidate approved → match!
            await updateOffer(currentOffer.id, { candBStatus: 'אישר', status: 'אושרה' });
          }
        } else {
          // declined → close offer
          if (iAmA) {
            await updateOffer(currentOffer.id, { candAStatus: 'דחה', status: 'נדחתה' });
          } else {
            await updateOffer(currentOffer.id, { candBStatus: 'דחה', status: 'נדחתה' });
          }
        }
      }
      setDecided(choice);
    } finally { setSubmitting(false); }
  };

  const toggleAvailable = async () => {
    if (!me) return;
    await updateCandidate(me.id, { available: !me.available });
  };

  // No candidate profile found
  if (!me) {
    return (
      <div style={{ height:'100%', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', background:th.cream, padding:32, textAlign:'center', direction:'rtl' }}>
        <div style={{ fontSize:48, marginBottom:16 }}>🔍</div>
        <div style={{ fontFamily:th.display, fontWeight:800, fontSize:20, color:th.ink, marginBottom:8 }}>לא נמצאה כרטיסיית מועמד/ת</div>
        <div style={{ fontFamily:th.body, fontSize:14, color:alpha(th.ink,0.6), lineHeight:1.6, maxWidth:280, marginBottom:24 }}>
          כדי להיכנס למצב מועמד/ת צריך לקבל הזמנה משדכן/ית ולהצטרף דרכה.<br/>
          אם אתה/את גם שדכן/ית — ייתכן שאין לך עדיין כרטיסייה.
        </div>
        <Btn th={th} variant="ghost" onClick={() => go('home')}>חזרה למצב שדכן/ית</Btn>
      </div>
    );
  }

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: th.cream }}>
      {/* header */}
      <div style={{ paddingTop: 50, paddingInline: 18, paddingBottom: 14, background: `linear-gradient(160deg, ${tint(th.primary,0.8)}, ${th.cream})`, flexShrink: 0 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
          <button onClick={() => go('home')} style={{ width: 38, height: 38, borderRadius: '50%', border: 'none', background: alpha('#fff', 0.7), color: th.ink, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}><Icon name="back" size={20} /></button>
          <Avatar grad={me.grad || gradForId(me.id)} name={me.name} size={50} photo={me.photos?.[0]} />
          <div style={{ flex: 1 }}>
            <div style={{ fontFamily: th.display, fontSize: 20, fontWeight: 800, color: th.ink, lineHeight: 1 }}>שלום, {me.name}</div>
            <div style={{ fontFamily: th.body, fontSize: 13, color: alpha(th.ink, 0.55), marginTop: 3 }}>מצב מועמד/ת</div>
          </div>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, background: alpha('#fff', 0.6), borderRadius: th.r, padding: '10px 14px', marginTop: 14 }}>
          <div style={{ flex: 1 }}>
            <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 14.5, color: th.ink }}>{me.available ? 'פנוי/ה להצעות' : 'במנוחה מהצעות'}</div>
            <div style={{ fontFamily: th.body, fontSize: 12, color: alpha(th.ink, 0.55) }}>{me.available ? 'שדכנים יכולים להציע לך' : 'לא תקבל/י הצעות חדשות'}</div>
          </div>
          <Toggle on={!!me.available} onChange={toggleAvailable} th={th} />
        </div>
      </div>

      <div style={{ flex: 1, overflowY: 'auto', padding: '16px 18px 28px' }}>

        {/* CURRENT OFFER */}
        <div style={{ fontFamily: th.display, fontSize: 17, fontWeight: 800, color: th.ink, marginBottom: 10, display: 'flex', alignItems: 'center', gap: 7 }}>
          <Icon name="heart" size={19} style={{ color: th.primary }} fill={th.primary} stroke={0} /> ההצעה הנוכחית
        </div>

        {!currentOffer || !otherCand ? (
          <div style={{ background: alpha(th.ink, 0.04), borderRadius: th.r, padding: '22px 16px', textAlign: 'center', marginBottom: 22 }}>
            <div style={{ fontFamily: th.body, fontSize: 14, color: alpha(th.ink, 0.5) }}>אין הצעה פעילה כרגע</div>
            <div style={{ fontFamily: th.body, fontSize: 12.5, color: alpha(th.ink, 0.4), marginTop: 4 }}>השדכן/ית שלך יעדכן/תעדכן כשתגיע הצעה</div>
          </div>
        ) : decided ? (
          <div style={{ background: th.card, borderRadius: th.rLg, padding: 22, textAlign: 'center', marginBottom: 22, boxShadow: `0 6px 18px ${alpha(th.ink, 0.06)}` }}>
            <div style={{ color: decided === 'yes' ? th.success : alpha(th.ink, 0.4), marginBottom: 8 }}><Icon name={decided === 'yes' ? 'check' : 'sad'} size={40} /></div>
            <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 17, color: th.ink }}>{decided === 'yes' ? (currentOffer?.selfMatch && iAmA ? '🎉 מעולה!' : '🎉 שידוך!') : 'קיבלנו, תודה על הכנות'}</div>
            <p style={{ fontFamily: th.body, fontSize: 13.5, color: alpha(th.ink, 0.6), margin: '6px 0 0', lineHeight: 1.4 }}>
              {decided === 'yes'
                ? (currentOffer?.selfMatch && iAmA ? `עכשיו ${otherCand?.name} יקבל/תקבל את ההצעה.` : 'כל הכבוד לשניכם! השדכן/ית יצרו קשר.')
                : 'נמשיך לחפש.'}
            </p>
          </div>
        ) : (
          <div style={{ background: th.card, borderRadius: th.rLg, overflow: 'hidden', marginBottom: 22, boxShadow: `0 10px 26px ${alpha(th.ink, 0.1)}` }}>
            <PhotoGallery c={otherCand} th={th} height={220}>
              <div style={{ position: 'absolute', top: 12, right: 12, pointerEvents: 'none' }}><Tag th={th} tone={th.primary} soft={false}>הצעה חדשה</Tag></div>
              <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, height: 90, background: `linear-gradient(to top, ${alpha(th.ink,0.7)}, transparent)`, pointerEvents: 'none' }} />
              <div style={{ position: 'absolute', bottom: 14, right: 16, color: '#fff', pointerEvents: 'none' }}>
                <div style={{ fontFamily: th.display, fontSize: 26, fontWeight: 800 }}>{otherCand.name}, {otherCand.age}</div>
                <div style={{ fontFamily: th.body, fontSize: 13.5, opacity: 0.9 }}>{otherCand.region} · {otherCand.religiosity}</div>
              </div>
            </PhotoGallery>
            <div style={{ padding: 16 }}>
              {otherCand.sabaBut && <div style={{ marginBottom: 12 }}><SabaBadge th={th} text={otherCand.sabaBut} /></div>}
              {otherCand.oneLine && <p style={{ margin: '0 0 14px', fontFamily: th.body, fontSize: 14.5, color: alpha(th.ink, 0.75), lineHeight: 1.5 }}>{otherCand.oneLine}</p>}
              <div style={{ display: 'flex', gap: 10 }}>
                <Btn th={th} variant="ghost" full style={{ color: th.error, boxShadow: `inset 0 0 0 1.5px ${alpha(th.error,0.3)}` }} disabled={submitting} onClick={() => submitDecision('no')} icon={<Icon name="x" size={18} />}>לא הפעם</Btn>
                <Btn th={th} variant="success" full disabled={submitting} onClick={() => submitDecision('yes')} icon={<Icon name="heart" size={18} fill="#fff" stroke={0} />}>מעניין אותי</Btn>
              </div>
            </div>
          </div>
        )}

        {/* CO-REP REQUESTS */}
        {coRepReqs.length > 0 && (
          <>
            <div style={{ fontFamily: th.display, fontSize: 17, fontWeight: 800, color: th.ink, marginBottom: 10, display:'flex', alignItems:'center', gap:7 }}>
              🤝 בקשות ייצוג
            </div>
            {coRepReqs.map(req => (
              <div key={req.id} style={{ background: th.card, borderRadius: th.r, padding: 14, marginBottom: 12, boxShadow:`0 4px 14px ${alpha(th.ink,0.06)}`, border:`1.5px solid ${alpha(th.primary,0.15)}` }}>
                <div style={{ fontFamily:th.display, fontWeight:800, fontSize:14.5, color:th.ink, marginBottom:4 }}>
                  {req.mmName} מעוניין/ת לייצג אותך
                </div>
                <div style={{ fontFamily:th.body, fontSize:12.5, color:alpha(th.ink,0.6), marginBottom:12, lineHeight:1.4 }}>
                  אם תאשר/י — {req.mmName} יוכל/תוכל להציע אותך לשידוכים גם מטעמו/ה
                </div>
                <div style={{ display:'flex', gap:8 }}>
                  <button onClick={() => approveCoRep(req)} style={{ flex:1, padding:'9px 0', borderRadius:th.rSm, border:'none', background:th.success, color:'#fff', fontFamily:th.display, fontWeight:800, fontSize:13, cursor:'pointer' }}>✓ אשר/י</button>
                  <button onClick={() => declineCoRep(req)} style={{ flex:1, padding:'9px 0', borderRadius:th.rSm, border:`1.5px solid ${alpha(th.error,0.3)}`, background:alpha(th.error,0.08), color:th.error, fontFamily:th.display, fontWeight:800, fontSize:13, cursor:'pointer' }}>✗ דחה/י</button>
                </div>
              </div>
            ))}
          </>
        )}

        {/* MY MATCHMAKERS */}
        <div style={{ fontFamily: th.display, fontSize: 17, fontWeight: 800, color: th.ink, marginBottom: 10 }}>השדכן/ית שלי</div>
        <div style={{ background: th.card, borderRadius: th.r, padding: 6, marginBottom: 22, boxShadow: `0 4px 14px ${alpha(th.ink, 0.05)}` }}>
          {myMms.length === 0 ? (
            <div style={{ padding: '14px 10px', fontFamily: th.body, fontSize: 13.5, color: alpha(th.ink, 0.45), textAlign: 'center' }}>לא נמצאו שדכנים</div>
          ) : myMms.map((m, i) => (
            <div key={m.uid || m.id} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '10px 10px', borderBottom: i < myMms.length - 1 ? `1px solid ${alpha(th.ink, 0.07)}` : 'none' }}>
              <Avatar grad={m.grad || gradForId(m.uid || m.id)} name={m.displayName || m.name || '?'} size={42} photo={m.photoURL} />
              <div style={{ flex: 1 }}>
                <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 14.5, color: th.ink }}>{m.displayName || m.name}</div>
                <div style={{ fontFamily: th.body, fontSize: 12, color: alpha(th.ink, 0.5) }}>{m.region || ''}</div>
              </div>
              {m.phone && (
                <a href={`https://wa.me/${m.phone.replace(/[^0-9]/g,'')}`} target="_blank" rel="noopener" style={{ border: 'none', background: alpha(th.success, 0.12), color: th.success, borderRadius: 999, width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center', textDecoration: 'none' }}><Icon name="whatsapp" size={19} /></a>
              )}
            </div>
          ))}
        </div>

        {/* actions */}
        <button onClick={() => go('home')} style={{ all: 'unset', cursor: 'pointer', boxSizing: 'border-box', width: '100%', textAlign: 'center', padding: 13, borderRadius: th.r, background: alpha(th.ink, 0.05), fontFamily: th.display, fontWeight: 800, fontSize: 14.5, color: th.ink, marginBottom: 10 }}>מעבר למצב שדכן/ית</button>
      </div>
    </div>
  );
}

        <Group>
          <Row icon="user" label="עריכת פרטים אישיים" />
          <Row icon="bell" label="ניהול התראות" last />

        <Group>
          <Row icon="users" label="מעבר למצב מועמד/ת" tone={th.primary} onClick={() => go('candidateMode')} last />
        </Group>
        <Group>
          <Row icon="info" label="הצהרת נגישות" />
          <Row icon="lock" label="פרטיות ואבטחה" last />
        </Group>
        <Group>
          <Row icon="trash" label="מחיקת חשבון" danger />
          <Row icon="arrow" label="יציאה מהמערכת" danger last onClick={() => go('onboarding')} />

        <div style={{ textAlign: 'center', marginTop: 8 }}>
          <Logo size={28} color={alpha(th.ink, 0.25)} flaw={th.cream} />
          <div style={{ fontFamily: th.display, fontSize: 13, color: alpha(th.ink, 0.35), marginTop: 4 }}>סבבה והכל · גרסה 1.0</div>
        </div>
      </div>
    </>
  );
}

const TWEAK_DEFAULTS = {
  "primaryColor": "#E8547A", "fontPair": "אופי", "radius": "רך",
  "density": "רגיל", "cardVariant": "קלאסי"
};
const NAV_ROUTES   = ['home', 'cands', 'offers', 'ai', 'set'];
const TAB_TO_ROUTE = { home:'home', cands:'cands', match:'offers', ai:'ai', set:'set' };
const ROUTE_TO_TAB = { home:'home', cands:'cands', candidate:'cands', candInquiry:'cands', offers:'match', chat:'match', matchFlow:'match', ai:'ai', set:'set' };

function renderScreen(cur, th, go, profile) {
  const p = cur.params;
  switch (cur.name) {
    case 'onboarding':  return <Onboarding th={th} go={go} />;
    case 'register':    return <Register th={th} go={go} />;
    case 'home':        return <Home th={th} go={go} />;
    case 'cands':       return <Candidates th={th} go={go} params={p} />;
    case 'candidate':   return <CandidateDetail th={th} go={go} params={p} />;
    case 'matchFlow':   return <MatchFlow th={th} go={go} params={p} />;
    case 'offers':      return <Offers th={th} go={go} params={p} />;
    case 'chat':        return <Chat th={th} go={go} params={p} />;
    case 'candInquiry': return <CandInquiry th={th} go={go} params={p} />;
    case 'ai':          return <AIRecs th={th} go={go} />;
    case 'candidateMode': return <CandidateMode th={th} go={go} />;
    case 'set':         return <AppSettings th={th} go={go} profile={profile} />;
    case 'admin':         return <AdminPanel th={th} go={go} />;
    case 'inviteLanding': return <InvitationLanding th={th} go={go} token={p.token} />;
    case 'candSelfFill':  return <CandidateSelfFill th={th} go={go} params={p} />;
    case 'editCand':      return <EditCandidateScreen th={th} go={go} params={p} />;
    default:              return <Home th={th} go={go} />;
  }
}

function Stage({ children }) {
  const [scale, setScale] = React.useState(1);
  React.useEffect(() => {
    const fit = () => {
      const s = Math.min(1, (window.innerWidth-32)/402, (window.innerHeight-32)/874);
      setScale(s);
    };
    fit(); window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, []);
  return (
    <div style={{ position:'fixed', inset:0, display:'flex', alignItems:'center', justifyContent:'center', background:'radial-gradient(circle at 50% 30%, #3a3440, #211d26)' }}>
      <div style={{ transform:`scale(${scale})`, transformOrigin:'center center' }}>{children}</div>
    </div>
  );
}
