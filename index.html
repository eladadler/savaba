  }, []);

  // Neglected filter from home banner — set of candidate IDs to show
  const [neglectedIds, setNeglectedIds] = useSb(
    params?.filter === 'neglected' && params?.neglectedIds?.length ? new Set(params.neglectedIds) : null
  );

  const myUid = profile?.uid;

  // fetch pending invite count for badge
  useEffect(() => {
    if (!myUid) return;
    db.collection('invitations').where('mmId','==',myUid).where('status','==','pending').get()
      .then(s => setPendingCount(s.size)).catch(() => {});
  }, [myUid]);

  // live count of incoming co-rep requests (other shadchanim asking to join my candidates)
  useEd(() => {
    if (!myUid) return;
    return db.collection('coRepRequests')
      .where('toMmId', '==', myUid)
      .where('status', '==', 'pending')
      .onSnapshot(s => setCoRepPending(s.size));
  }, [myUid]);

  const list = useMb(() => candidates.filter(c => {
    // Neglected filter overrides everything
    if (neglectedIds !== null) return neglectedIds.has(c.id);
    if (scope === 'mine' && c.status === 'pending_mm') return false; // hidden until mm fills details
    if (scope === 'mine' && c.mmId !== myUid && !c.coMms?.includes(myUid)) return false;
    if (scope === 'all'  && (c.mmId === myUid || c.coMms?.includes(myUid))) return false;
    if (scope === 'all'  && c.hidden) return false;
    if (q && !c.name.includes(q) && !(c.oneLine || '').includes(q)) return false;
    if (filters.gender && (filters.gender === 'נשים' ? (c.gender !== 'f' && c.gender !== 'אשה') : (c.gender !== 'm' && c.gender !== 'גבר'))) return false;
    if (filters.region && c.region !== filters.region) return false;
    if (filters.status === 'פנוי' && !c.available) return false;
    if (filters.status === 'תפוס' && c.available) return false;
    if (filters.rel.length && !filters.rel.includes(c.religiosity)) return false;
    if (c.age < filters.ageMin || c.age > filters.ageMax) return false;
    if (filters.maritalStatus.length && !filters.maritalStatus.includes(c.family)) return false;
    if (filters.hasChildren === 'no' && (c.kids || 0) > 0) return false;
    if (filters.hasChildren === 'yes' && (c.kids || 0) < filters.childrenMin) return false;
    return true;
  }), [candidates, scope, q, filters, myUid, neglectedIds]);

  const activeFilters = (filters.gender ? 1 : 0) + (filters.region ? 1 : 0) + (filters.status ? 1 : 0) + filters.rel.length + filters.maritalStatus.length + (filters.hasChildren ? 1 : 0);

  return (
    <>
      <AppHeader th={th} title={t('cands_title')} sub={`${list.length} ${t('cands_count_suffix')}`} action={
        <div style={{ display:'flex', gap:8, alignItems:'center' }}>
          {/* add-candidate button */}
          <button onClick={() => setAddOpen(true)} style={{ border:'none', background:th.primary, height:38, borderRadius:999, paddingInline:14, display:'flex', alignItems:'center', gap:5, color:'#fff', cursor:'pointer', fontFamily:th.display, fontWeight:800, fontSize:13, boxShadow:`0 6px 18px ${alpha(th.primary,0.35)}`, whiteSpace:'nowrap' }}>
            <Icon name="plus" size={15} /> {t('cands_add_btn')}
          </button>
          {/* invite tracker bell */}
          <button onClick={() => setInvOpen(true)} style={{ position:'relative', border:'none', background:th.card, width:42, height:42, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', color:th.ink, cursor:'pointer', boxShadow:'0 2px 8px rgba(0,0,0,0.07)' }}>
            <Icon name="bell" size={21} />
            {(pendingCount + coRepPending) > 0 && <span style={{ position:'absolute', top:-3, left:-3, background:th.gold, color:'#fff', borderRadius:'50%', minWidth:18, height:18, fontSize:11, fontWeight:800, display:'flex', alignItems:'center', justifyContent:'center', padding:'0 4px' }}>{pendingCount + coRepPending}</span>}
          </button>
        </div>
      } />

      <div style={{ flex: 1, overflowY: 'auto', padding: '8px 18px 90px', position: 'relative' }}>
        {/* search + filter inline */}
        <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 12 }}>
          <div style={{ position: 'relative', flex: 1 }}>
            <span style={{ position: 'absolute', right: 12, top: '50%', transform: 'translateY(-50%)', color: alpha(th.ink, 0.4) }}><Icon name="search" size={19} /></span>
            <input value={q} onChange={e => setQ(e.target.value)} placeholder={t('cands_search')} style={{ width: '100%', boxSizing: 'border-box', padding: '11px 40px 11px 14px', borderRadius: 999, border: `1.5px solid ${alpha(th.ink, 0.12)}`, fontFamily: th.body, fontSize: 14.5, background: th.card, outline: 'none', color: th.ink }} />
          </div>
          <button onClick={() => setFilterOpen(true)} style={{ position:'relative', border:'none', background: activeFilters > 0 ? alpha(th.primary, 0.1) : th.card, width:46, height:46, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', color: activeFilters > 0 ? th.primary : th.ink, cursor:'pointer', flexShrink:0, boxShadow: activeFilters > 0 ? `0 0 0 1.5px ${alpha(th.primary,0.35)}, 0 2px 8px rgba(0,0,0,0.06)` : '0 2px 8px rgba(0,0,0,0.07)' }}>
            <Icon name="filter" size={21} />
            {activeFilters > 0 && <span style={{ position:'absolute', top:-3, left:-3, background:th.primary, color:'#fff', borderRadius:'50%', minWidth:18, height:18, fontSize:11, fontWeight:800, display:'flex', alignItems:'center', justifyContent:'center', padding:'0 4px' }}>{activeFilters}</span>}
          </button>
        </div>

        {/* scope toggle */}
        <div style={{ display: 'flex', gap: 8, marginBottom: 14 }}>
          {[['mine', t('cands_tab_mine')], ['all', t('cands_tab_all')]].map(([id, lbl]) => (
            <button key={id} onClick={() => { setScope(id); if (id === 'mine') setLinkMode(false); }} style={{ flex: 1, padding: '9px', borderRadius: 999, border: 'none', cursor: 'pointer', fontFamily: th.display, fontWeight: 800, fontSize: 14, background: scope === id ? th.ink : th.card, color: scope === id ? th.cream : alpha(th.ink, 0.55), boxShadow: scope === id ? 'none' : `inset 0 0 0 1.5px ${alpha(th.ink,0.1)}` }}>{lbl}</button>
          ))}
        </div>

        {/* linkMode banner */}
        {linkMode && (
          <div style={{ background:alpha(th.primary,0.07), border:`1.5px solid ${alpha(th.primary,0.2)}`, borderRadius:th.r, padding:'12px 14px', marginBottom:12 }}>
            <div style={{ fontFamily:th.display, fontWeight:800, fontSize:14, color:th.ink, marginBottom:4 }}>🤝 הוסף מועמד/ת לייצוג שלך</div>
            <div style={{ fontFamily:th.body, fontSize:12.5, color:alpha(th.ink,0.6) }}>בחר/י מועמד/ת — לאחר הוספה יופיע/תופיע גם ברשימת ״שלי״ ותוכל/י להציע אותו/ה לשידוכים</div>
          </div>
        )}

        {/* neglected filter chip */}
        {neglectedIds !== null && (
          <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:12, background:alpha(th.gold,0.12), border:`1.5px solid ${alpha(th.gold,0.3)}`, borderRadius:th.rSm, padding:'8px 12px' }}>
            <Icon name="bell" size={14} style={{ color:th.gold, flexShrink:0 }} />
            <span style={{ flex:1, fontFamily:th.body, fontSize:13, color:alpha(th.ink,0.8) }}>מציג מועמדים ללא יחס 7+ ימים</span>
            <button onClick={() => setNeglectedIds(null)} style={{ border:'none', background:'transparent', cursor:'pointer', color:alpha(th.ink,0.5), padding:0, display:'flex', alignItems:'center' }}>
              <Icon name="x" size={16} />
            </button>
          </div>
        )}

        {/* grid */}
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
          {list.map(c => (
            <CandCard key={c.id} c={c} th={th} myUid={myUid}
              onClick={() => linkMode ? null : go('candidate', { id: c.id })}
              linkMode={linkMode}
              photoStyle={cardStyle}
              requestSent={sentRequests.has(c.id)}
              onLink={async () => {
                // Don't create a duplicate if a pending request already exists
                const alreadyPending = coRepRequests?.some(r =>
                  r.candId === c.id && (r.mmId === myUid || r.fromMmId === myUid)
                );
                if (alreadyPending) {
                  setSentRequests(prev => new Set([...prev, c.id]));
                  return;
                }
                if (c.candidateUid) {
                  // candidate has an account → request goes to candidate's app
                  await db.collection('coRepRequests').add({
                    mmId: myUid,
                    mmName: profile?.displayName || 'שדכן/ית',
                    candId: c.id,
                    candName: c.name,
                    candidateUid: c.candidateUid,
                    status: 'pending',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                  });
                } else {
                  // no account yet → request goes to primary matchmaker for approval
                  await db.collection('coRepRequests').add({
                    fromMmId: myUid,
                    fromMmName: profile?.displayName || 'שדכן/ית',
                    toMmId: c.mmId,
                    candId: c.id,
                    candName: c.name,
                    status: 'pending',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                  });
                }
                setSentRequests(prev => new Set([...prev, c.id]));
              }}
            />
          ))}
        </div>
        {list.length === 0 && (
          <div style={{ textAlign: 'center', padding: '50px 20px', color: alpha(th.ink, 0.4) }}>
            <Icon name="search" size={40} />
            <div style={{ fontFamily: th.body, marginTop: 10, fontSize: 15 }}>לא נמצאו מועמדים. נסה/י לשנות פילטרים.</div>
          </div>
        )}
      </div>

      {/* FAB */}
      <button onClick={() => setAddOpen(true)} style={{ position: 'absolute', bottom: 102, left: 20, zIndex: 30, width: 58, height: 58, borderRadius: '50%', border: 'none', background: th.primary, color: '#fff', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: `0 12px 28px ${alpha(th.primary, 0.45)}` }}>
        <Icon name="plus" size={28} />
      </button>

      <FilterSheet open={filterOpen} onClose={() => setFilterOpen(false)} th={th} filters={filters} setFilters={setFilters} />
      <AddSheet open={addOpen} onClose={() => setAddOpen(false)} th={th} go={go} />
      <InvitationsSheet open={invOpen} onClose={() => { setInvOpen(false); db.collection('invitations').where('mmId','==',myUid).where('status','==','pending').get().then(s=>setPendingCount(s.size)).catch(()=>{}); }} th={th} mmUid={myUid} go={go} />
    </>
  );
}

function CandCard({ c, th, myUid, onClick, linkMode, onLink, requestSent, photoStyle }) {
  const isSquare = photoStyle !== 'compact';
  return (
    <button onClick={onClick} style={{ all: 'unset', cursor: linkMode ? 'default' : 'pointer', boxSizing: 'border-box', background: th.card, borderRadius: th.r, overflow: 'hidden', boxShadow: `0 6px 18px ${alpha(th.ink, 0.07)}`, display: 'flex', flexDirection: 'column' }}>
      <div style={{ position: 'relative', ...(isSquare ? { aspectRatio: '1' } : { height: 116 }), background: `linear-gradient(150deg, ${c.grad[0]}, ${c.grad[1]})`, display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden' }}>
        {c.photos && c.photos[0]
          ? <img src={c.photos[0]} alt="" loading="lazy" decoding="async" style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', objectPosition: isSquare ? 'center 20%' : 'center' }} />
          : <span style={{ fontFamily: th.display, fontSize: isSquare ? 56 : 44, color: 'rgba(255,255,255,0.9)', fontWeight: 800 }}>{c.name.charAt(0)}</span>}
        <div style={{ position: 'absolute', top: 8, right: 8 }}>
          {(() => {
            const isFemale = c.gender === 'f' || c.gender === 'אשה';
            const isMale   = c.gender === 'm' || c.gender === 'גבר';
            const avail  = isFemale ? 'פנויה'  : isMale ? 'פנוי'  : 'פנוי/ה';
            const taken  = isFemale ? 'תפוסה'  : isMale ? 'תפוס'  : 'תפוס/ה';
            return <Tag th={th} tone={c.available ? th.success : alpha(th.ink, 0.6)} soft={false}>{c.available ? avail : taken}</Tag>;
          })()}
        </div>
        {false && c.mmId !== myUid && <div style={{ position: 'absolute', top: 8, left: 8 }}><Tag th={th} tone={th.gold} soft={false}>{(window.findMm(c.mmId).name || '—').split(' ')[0]}</Tag></div>}
        {c.hidden && <div style={{ position:'absolute', top:8, left:8, background:'rgba(0,0,0,0.55)', backdropFilter:'blur(4px)', borderRadius:999, padding:'3px 8px', display:'flex', alignItems:'center', gap:4 }}><Icon name="eye" size={12} style={{ color:'rgba(255,255,255,0.75)' }} /><span style={{ fontFamily:'inherit', fontSize:11, fontWeight:700, color:'rgba(255,255,255,0.85)' }}>מוסתר</span></div>}
        {c.photoCount > 1 && (
          <div style={{ position: 'absolute', bottom: 7, left: '50%', transform: 'translateX(-50%)', display: 'flex', gap: 4 }}>
            {Array.from({ length: c.photoCount }).map((_, i) => (
              <span key={i} style={{ width: i === 0 ? 12 : 5, height: 5, borderRadius: 99, background: i === 0 ? '#fff' : 'rgba(255,255,255,0.6)' }} />
            ))}
          </div>
        )}
      </div>
      <div style={{ padding: '10px 12px 12px', flex: 1 }}>
        <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 16, color: th.ink }}>{c.name}, {c.age}</div>
        <div style={{ fontFamily: th.body, fontSize: 12.5, color: alpha(th.ink, 0.5), marginBottom: 8 }}>{c.region} · {c.religiosity}</div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'flex-start', background: alpha(th.ink, 0.04), borderRadius: th.rSm, padding: '7px 9px' }}>
          <Logo size={15} color={th.primary} flaw={th.cream} />
          <span style={{ fontFamily: th.body, fontSize: 11.5, fontWeight: 600, color: th.ink, lineHeight: 1.25, textWrap: 'pretty' }}>{c.sabaBut}</span>
        </div>
      </div>
      {linkMode && (
        <button
          onClick={(e) => { e.stopPropagation(); if (!requestSent && onLink) onLink(); }}
          style={{ width: '100%', padding: '9px 0', border: 'none', cursor: requestSent ? 'default' : 'pointer',
            background: requestSent ? alpha(th.success, 0.13) : th.primary,
            color: requestSent ? th.success : '#fff',
            fontFamily: th.display, fontWeight: 800, fontSize: 12,
            display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 5 }}>
          {requestSent
            ? <><Icon name="check" size={12} /> נשלחה בקשת ייצוג</>
            : <><Icon name="plus" size={12} /> שלח/י בקשת ייצוג</>}
        </button>
      )}
    </button>
  );
}

function FilterSheet({ open, onClose, th, filters, setFilters }) {
  const { lists } = useContext(DataCtx);
  const liveRegions     = (lists.regions     && lists.regions.length)     ? lists.regions     : REGIONS;
  const liveReligiosity = (lists.religiosity  && lists.religiosity.length) ? lists.religiosity : RELIGIOSITY;
  const set = (k, v) => setFilters(s => ({ ...s, [k]: v }));
  return (
    <Sheet open={open} onClose={onClose} th={th} title="פילטרים">
      <Field th={th} label="מין"><Segmented th={th} value={filters.gender} onChange={v => set('gender', filters.gender === v ? '' : v)} options={['נשים', 'גברים']} /></Field>
      <Field th={th} label="סטטוס"><Segmented th={th} value={filters.status} onChange={v => set('status', filters.status === v ? '' : v)} options={['פנוי', 'תפוס']} /></Field>
      <Field th={th} label={`טווח גיל: ${filters.ageMin}–${filters.ageMax}`}>
        <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
          <input type="range" min={20} max={60} value={filters.ageMin} onChange={e => set('ageMin', Math.min(+e.target.value, filters.ageMax))} style={{ flex: 1, accentColor: th.primary }} />
          <input type="range" min={20} max={60} value={filters.ageMax} onChange={e => set('ageMax', Math.max(+e.target.value, filters.ageMin))} style={{ flex: 1, accentColor: th.primary }} />
        </div>
      </Field>
      <Field th={th} label="אזור"><MultiChips th={th} value={filters.region ? [filters.region] : []} onChange={v => set('region', v[v.length-1] === filters.region ? '' : v[v.length-1] || '')} options={liveRegions} /></Field>
      <Field th={th} label="קרבה לדת"><MultiChips th={th} value={filters.rel} onChange={v => set('rel', v)} options={liveReligiosity} tone={th.gold} /></Field>
      <Field th={th} label="סטטוס משפחתי"><MultiChips th={th} value={filters.maritalStatus} onChange={v => set('maritalStatus', v)} options={['רווק/ה', 'גרוש/ה', 'אלמן/ה']} /></Field>
      <Field th={th} label="ילדים">
        <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
          <Segmented th={th} value={filters.hasChildren} onChange={v => set('hasChildren', filters.hasChildren === v ? '' : v)} options={['ללא ילדים', 'עם ילדים']} />
          {filters.hasChildren === 'עם ילדים' && (
            <div style={{ display:'flex', alignItems:'center', gap:12 }}>
              <span style={{ fontFamily:th.body, fontSize:13.5, color:alpha(th.ink,0.6) }}>מינימום</span>
              <button onClick={() => set('childrenMin', Math.max(1, filters.childrenMin - 1))} style={{ width:32, height:32, borderRadius:'50%', border:`1.5px solid ${alpha(th.ink,0.18)}`, background:th.card, cursor:'pointer', fontFamily:th.display, fontWeight:800, fontSize:18, color:th.ink, display:'flex', alignItems:'center', justifyContent:'center' }}>−</button>
              <span style={{ fontFamily:th.display, fontWeight:800, fontSize:18, color:th.ink, minWidth:24, textAlign:'center' }}>{filters.childrenMin}</span>
              <button onClick={() => set('childrenMin', filters.childrenMin + 1)} style={{ width:32, height:32, borderRadius:'50%', border:`1.5px solid ${alpha(th.ink,0.18)}`, background:th.card, cursor:'pointer', fontFamily:th.display, fontWeight:800, fontSize:18, color:th.ink, display:'flex', alignItems:'center', justifyContent:'center' }}>+</button>
              <span style={{ fontFamily:th.body, fontSize:13, color:alpha(th.ink,0.45) }}>ילדים ומעלה</span>
            </div>
          )}
        </div>
      </Field>
      <div style={{ display: 'flex', gap: 10, marginTop: 6 }}>
        <Btn th={th} variant="ghost" onClick={() => setFilters({ gender: '', rel: [], region: '', status: '', ageMin: 22, ageMax: 45, maritalStatus: [], hasChildren: '', childrenMin: 1 })}>נקה</Btn>
        <Btn th={th} full onClick={onClose}>הצג תוצאות</Btn>
      </div>
    </Sheet>
  );
}

// ════════════════════════════════════════════════════════════
// INVITE FLOW — matchmaker creates invitation link
// ════════════════════════════════════════════════════════════
function InviteFlow({ open, onClose, th, mmId, mmName }) {
  const [step, setStep]         = useState(1); // 1=name, 2=link
  const [recipFirst, setFirst]  = useState('');
  const [recipLast,  setLast]   = useState('');
  const [token, setToken]       = useState('');
  const [creating, setCreating] = useState(false);
  const [copied,   setCopied]   = useState(false);

  const recipientName = `${recipFirst.trim()} ${recipLast.trim()}`.trim();
  const reset = () => { setStep(1); setFirst(''); setLast(''); setToken(''); setCopied(false); };

  const generate = async () => {
    setCreating(true);
    try {
      const tok = await createInvitation(mmId, mmName, 'cand_fills', recipientName);
      setToken(tok);
      setStep(2);
    } finally { setCreating(false); }
  };

  const copyLink = () => {
    navigator.clipboard.writeText(inviteURL(token));
    setCopied(true);
    setTimeout(() => setCopied(false), 2500);
  };

  const waText = encodeURIComponent(
    `היי ${recipFirst.trim()} 👋\n\n` +
    `${mmName} מזמין/ת אותך להצטרף לאפליקציית השידוכים *סבבה והכל* 💝\n\n` +
    `תוך כמה דקות תוכל/י למלא את הפרטים שלך — ונתחיל לעבוד בשבילך 🙏\n\n` +
    `👇 לחץ/י כאן להרשמה:\n${inviteURL(token)}`
  );

  return (
    <Sheet open={open} onClose={() => { onClose(); reset(); }} th={th} title="הזמנת מועמד/ת">
      {/* ── Step 1: recipient name ── */}
      {step === 1 && (
        <>
          <div style={{ fontFamily: th.body, fontSize: 14, color: alpha(th.ink, 0.6), marginBottom: 16 }}>
            למי שולחים את ההזמנה?<br/>
            <span style={{ fontSize: 12, color: alpha(th.ink, 0.4) }}>זה ישמש למעקב אחרי ההזמנה</span>
          </div>
          <div style={{ display: 'flex', gap: 8, marginBottom: 14 }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontFamily: th.body, fontSize: 12, fontWeight: 700, color: alpha(th.ink, 0.6), marginBottom: 4 }}>שם פרטי</div>
              <input value={recipFirst} onChange={e => setFirst(e.target.value)} placeholder="ישראל"
                style={{ width: '100%', boxSizing: 'border-box', padding: '11px 12px', borderRadius: th.rSm, border: `1.5px solid ${alpha(th.ink, 0.15)}`, fontFamily: th.body, fontSize: 15, background: th.card, color: th.ink, outline: 'none' }} />
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ fontFamily: th.body, fontSize: 12, fontWeight: 700, color: alpha(th.ink, 0.6), marginBottom: 4 }}>שם משפחה</div>
              <input value={recipLast} onChange={e => setLast(e.target.value)} placeholder="כהן"
                style={{ width: '100%', boxSizing: 'border-box', padding: '11px 12px', borderRadius: th.rSm, border: `1.5px solid ${alpha(th.ink, 0.15)}`, fontFamily: th.body, fontSize: 15, background: th.card, color: th.ink, outline: 'none' }} />
            </div>
          </div>
          <Btn th={th} full disabled={!recipFirst.trim() || !recipLast.trim() || creating} onClick={generate}>
            {creating ? 'יוצר קישור…' : 'צור קישור הזמנה ←'}
          </Btn>
        </>
      )}

      {/* ── Step 2: link ready ── */}
      {step === 2 && (
        <>
          <div style={{ background: alpha(th.success, 0.1), border: `1.5px solid ${alpha(th.success, 0.25)}`, borderRadius: th.r, padding: 14, marginBottom: 16, textAlign: 'center' }}>
            <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 14, color: th.success, marginBottom: 4 }}>✓ קישור מוכן לשליחה!</div>
            <div style={{ fontFamily: th.display, fontWeight: 700, fontSize: 15, color: th.ink, marginBottom: 2 }}>{recipientName}</div>
            <div style={{ fontFamily: 'monospace', fontSize: 10, color: alpha(th.ink, 0.4), wordBreak: 'break-all' }}>{inviteURL(token)}</div>
          </div>
          <Btn th={th} full onClick={copyLink} icon={<Icon name="link" size={18} />} style={{ marginBottom: 10 }}>
            {copied ? '✓ הועתק!' : 'העתק קישור'}
          </Btn>
          <a href={`https://wa.me/?text=${waText}`} target="_blank" rel="noreferrer" style={{ display: 'block', textDecoration: 'none', marginBottom: 10 }}>
            <Btn th={th} full variant="ghost"><Icon name="whatsapp" size={18} /> שלח/י ב-WhatsApp ל{recipFirst.trim()}</Btn>
          </a>
          <Btn th={th} full variant="ghost" onClick={() => { onClose(); reset(); }}>סגור</Btn>
        </>
      )}
    </Sheet>
  );
}

// ════════════════════════════════════════════════════════════
// INVITATION LANDING — candidate opens invite link
// ════════════════════════════════════════════════════════════
function InvitationLanding({ th, go, token }) {
  const { user, profile } = useContext(AuthCtx);
  const [invite, setInvite]   = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError]     = useState('');
  const [busy, setBusy]       = useState(false);
  const [done, setDone]       = useState(false);

  useEffect(() => {
    db.collection('invitations').doc(token).get().then(doc => {
      if (!doc.exists) { setError('ההזמנה לא נמצאה או פגה תוקף'); }
      else {
        const inv = doc.data();
        if (inv.status !== 'pending') setError('הזמנה זו כבר נוצלה');
        else setInvite(inv);
      }
      setLoading(false);
    }).catch(() => { setError('שגיאה בטעינת ההזמנה'); setLoading(false); });
  }, [token]);

  // Skip landing screen for cand_fills — go straight to the form
  useEffect(() => {
    if (invite && invite.flow === 'cand_fills' && go) {
      go('candSelfFill', { token, invite });
    }
  }, [invite]);

  const accept = async () => {
    setBusy(true);
    try {
      const ref = await db.collection('candidates').add({
        name: invite.recipientName || '', age: 0, gender: '', region: '', religiosity: '',
        family: '', kids: 0, oneLine: '', seesWith: '', sabaBut: '',
        interests: [], partner: [], discrete: '', available: true, photos: [],
        mmId: invite.mmId, candidateUid: user.uid,
        pendingApproval: false, status: 'pending_mm',
        grad: gradForId(user.uid),
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      await db.collection('invitations').doc(token).update({
        status: 'accepted', candidateId: ref.id, candidateUid: user.uid,
        candidateName: profile?.displayName || user.email,
        acceptedAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      await db.collection('notifications').add({
        toUid: invite.mmId, type: 'invite_accepted',
        candidateId: ref.id, candidateName: profile?.displayName || user.email,
        inviteToken: token, read: false,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      setDone(true);
    } catch(e) { setError('שגיאה: ' + e.message); }
    setBusy(false);
  };

  if (loading) return (
    <div style={{ height:'100%', display:'flex', alignItems:'center', justifyContent:'center', background:th.cream }}>
      <Logo size={50} color={th.primary} flaw={th.cream} />
    </div>
  );

  const centeredBox = (emoji, title, body) => (
    <div style={{ height:'100%', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', background:th.cream, padding:32, textAlign:'center', direction:'rtl' }}>
      <div style={{ fontSize:52, marginBottom:16 }}>{emoji}</div>
      <div style={{ fontFamily:th.display, fontSize:22, fontWeight:800, color:th.ink, marginBottom:8 }}>{title}</div>
      <div style={{ fontFamily:th.body, fontSize:15, color:alpha(th.ink,0.6), lineHeight:1.5, maxWidth:280 }}>{body}</div>
    </div>
  );

  if (error) return centeredBox('😕', 'הזמנה לא תקינה', error);
  if (done)  return centeredBox('🎉', 'אישרת בהצלחה!', `${invite.mmName} יקבל/ת הודעה וימשיך/תמשיך למלא את הפרטים שלך.`);

  return (
    <div style={{ height:'100%', display:'flex', flexDirection:'column', background:`linear-gradient(170deg, ${th.cream}, ${tint(th.primary, 0.84)})`, direction:'rtl' }}>
      <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'0 28px', textAlign:'center' }}>
        <Logo size={56} color={th.primary} flaw={th.cream} style={{ marginBottom:20 }} />
        <div style={{ fontFamily:th.display, fontSize:13, fontWeight:700, color:th.primary, letterSpacing:1.5, marginBottom:6 }}>הוזמנת להצטרף</div>
        <h1 style={{ fontFamily:th.display, fontSize:30, fontWeight:800, color:th.ink, margin:'0 0 6px', lineHeight:1.2 }}>סבבה והכל</h1>
        <div style={{ fontFamily:th.body, fontSize:16, color:alpha(th.ink,0.65), marginBottom:28 }}>
          <b>{invite.mmName}</b> מזמין/ת אותך למערכת השידוכים
        </div>
        <div style={{ background:th.card, borderRadius:th.rLg, padding:18, marginBottom:28, width:'100%', maxWidth:320, boxShadow:`0 8px 24px ${alpha(th.ink,0.08)}`, textAlign:'right' }}>
          <div style={{ fontFamily:th.display, fontWeight:800, fontSize:14, color:th.ink, marginBottom:6 }}>מה קורה אחרי שתאשר/י?</div>
          <div style={{ fontFamily:th.body, fontSize:13, color:alpha(th.ink,0.65), lineHeight:1.5 }}>
            {invite.flow === 'mm_fills'
              ? `${invite.mmName} ימלא/תמלא את הפרטים שלך ויצור/תיצור עבורך כרטיסייה.`
              : 'תתבקש/י למלא את הפרטים שלך ולהעלות תמונות. השדכן/ית יאשר/תאשר לפני פרסום.'}
          </div>
        </div>
        <Btn th={th} full size="l" onClick={invite.flow === 'mm_fills' ? accept : () => go('candSelfFill', { token, invite })} disabled={busy}>
          {busy ? 'שניה…' : invite.flow === 'mm_fills' ? '✓ אני מאשר/ת' : '← מלא/י את הפרטים שלי'}
        </Btn>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// CANDIDATE SELF FILL — candidate fills their own card (flow 2)
// ════════════════════════════════════════════════════════════
function CandidateSelfFill({ th, go, params }) {
  const { user, profile } = useContext(AuthCtx);
  const { lists } = useContext(DataCtx);
  const liveRegions       = (lists.regions       && lists.regions.length)       ? lists.regions       : REGIONS;
  const liveReligiosity   = (lists.religiosity    && lists.religiosity.length)   ? lists.religiosity   : RELIGIOSITY;
  const liveInterests     = (lists.interests      && lists.interests.length)     ? lists.interests     : INTERESTS;
  const livePartnerTraits = (lists.partnerTraits  && lists.partnerTraits.length) ? lists.partnerTraits : PARTNER_TRAITS;
  const { token, invite } = params;
  const [f, setF] = useState({
    name: invite?.recipientName || '', phone: '', age: '', gender: 'אשה',
    region: '', religiosity: '', family: 'רווק/ה', kids: 0,
    sabaBut: '', oneLine: '', seesWith: '', interests: [], partner: [], discrete: '', available: true,
  });
  const set = k => v => setF(s => ({ ...s, [k]: v }));
  const [photos, setPhotos]   = useState([]);
  const [submitting, setSub]  = useState(false);
  const [uploading, setUpl]   = useState(false);
  const [done, setDone]       = useState(false);

  const addPhoto = async (e) => {
    const files = Array.from(e.target.files || []); if (!files.length) return;
    setUpl(true);
    try {
      const urls = await Promise.all(files.map(async file => {
        const ref = storage.ref(`profiles/${user.uid}/${Date.now()}_${file.name}`);
        await ref.put(file);
        return ref.getDownloadURL();
      }));
      setPhotos(p => [...p, ...urls]);
    } finally { setUpl(false); e.target.value = ''; }
  };
  const setPrimaryPhoto = (i) => setPhotos(p => { const a = [...p]; [a[0], a[i]] = [a[i], a[0]]; return a; });

  const submit = async () => {
    if (!f.name || !f.phone || !f.age || !f.region) return alert('נא למלא את כל שדות החובה');
    setSub(true);
    try {
      const ref = await db.collection('candidates').add({
        ...f, age: +f.age, phone: f.phone.trim(), photos,
        mmId: invite.mmId, candidateUid: user.uid,
        pendingApproval: true, available: true,
        grad: gradForId(user.uid),
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      await db.collection('invitations').doc(token).update({
        status: 'filled', candidateId: ref.id, candidateUid: user.uid, candidateName: f.name,
        filledAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      await db.collection('notifications').add({
        toUid: invite.mmId, type: 'cand_filled',
        candidateId: ref.id, candidateName: f.name,
        candidateAge: +f.age, candidateRegion: f.region, candidateReligiosity: f.religiosity,
        inviteToken: token, read: false,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      setDone(true);
    } catch(e) { alert('שגיאה: ' + e.message); }
    setSub(false);
  };

  const [step, setStep] = useState(0);
  const steps = ['פרטים בסיסיים', 'תמונות', 'קצת עלייך', 'תחומי עניין'];
  const isLast = step === steps.length - 1;

  const SelfStepDots = () => (
    <div style={{ display:'flex', justifyContent:'center', gap:6, marginBottom:18 }}>
      {steps.map((_, i) => (
        <div key={i} style={{ width: i === step ? 22 : 8, height:8, borderRadius:999, background: i === step ? th.primary : i < step ? alpha(th.primary,0.4) : alpha(th.ink,0.15), transition:'all 0.2s' }} />
      ))}
    </div>
  );

  if (done) return (
    <div style={{ height:'100%', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', background:th.cream, padding:32, textAlign:'center', direction:'rtl' }}>
      <div style={{ fontSize:52, marginBottom:16 }}>🎉</div>
      <div style={{ fontFamily:th.display, fontSize:22, fontWeight:800, color:th.ink, marginBottom:8 }}>הפרטים נשלחו!</div>
      <div style={{ fontFamily:th.body, fontSize:15, color:alpha(th.ink,0.6), lineHeight:1.5, maxWidth:280 }}>
        {invite.mmName} יקבל/ת הודעה ויעיין/תעיין בפרטים שלך. לאחר האישור תהיה/י רשמית במערכת.
      </div>
    </div>
  );

  return (
    <div style={{ height:'100%', display:'flex', flexDirection:'column', background:th.cream, direction:'rtl' }}>
      <AppHeader th={th} title="הפרטים שלי" sub={`עבור ${invite.mmName}`} />
      <div style={{ flex:1, overflowY:'auto', padding:'10px 18px 40px' }}>
        <div style={{ fontFamily:th.display, fontWeight:800, fontSize:16, color:th.ink, marginBottom:10, textAlign:'center' }}>{steps[step]}</div>
        <SelfStepDots />

        {step === 0 && (
          <>
            <Field th={th} label="טלפון *"><TextInput th={th} type="tel" value={f.phone} onChange={set('phone')} /></Field>
            <Field th={th} label="גיל *"><TextInput th={th} type="number" value={f.age} onChange={set('age')} /></Field>
            <Field th={th} label="מין"><Segmented th={th} value={f.gender} onChange={set('gender')} options={['אשה','גבר']} /></Field>
            <Field th={th} label="אזור מגורים *"><Select th={th} value={f.region} onChange={set('region')} options={liveRegions} /></Field>
            <Field th={th} label="זרם דתי"><Select th={th} value={f.religiosity} onChange={set('religiosity')} options={liveReligiosity} /></Field>
            <Field th={th} label="סטטוס משפחתי *"><Segmented th={th} value={f.family} onChange={set('family')} options={['רווק/ה', 'גרוש/ה', 'אלמן/ה']} /></Field>
            <Field th={th} label="ילדים">
              <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
                <Segmented th={th} value={(f.kids||0) > 0 ? 'עם ילדים' : 'ללא ילדים'} onChange={v => setF(s => ({ ...s, kids: v === 'עם ילדים' ? 1 : 0 }))} options={['ללא ילדים', 'עם ילדים']} />
                {(f.kids||0) > 0 && (
                  <div style={{ display:'flex', alignItems:'center', gap:12 }}>
                    <button onClick={() => setF(s => ({ ...s, kids: Math.max(1, s.kids - 1) }))} style={{ width:36, height:36, borderRadius:'50%', border:`1.5px solid ${alpha(th.ink,0.18)}`, background:th.card, cursor:'pointer', fontFamily:th.display, fontWeight:800, fontSize:20, color:th.ink, display:'flex', alignItems:'center', justifyContent:'center' }}>−</button>
                    <span style={{ fontFamily:th.display, fontWeight:800, fontSize:20, color:th.ink, minWidth:28, textAlign:'center' }}>{f.kids}</span>
                    <button onClick={() => setF(s => ({ ...s, kids: s.kids + 1 }))} style={{ width:36, height:36, borderRadius:'50%', border:`1.5px solid ${alpha(th.ink,0.18)}`, background:th.card, cursor:'pointer', fontFamily:th.display, fontWeight:800, fontSize:20, color:th.ink, display:'flex', alignItems:'center', justifyContent:'center' }}>+</button>
                    <span style={{ fontFamily:th.body, fontSize:13.5, color:alpha(th.ink,0.5) }}>ילדים</span>
                  </div>
                )}
              </div>
            </Field>
          </>
        )}

        {step === 1 && (
          <div>
            {/* header row */}
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:14 }}>
              <div style={{ fontFamily:th.body, fontSize:13, color:alpha(th.ink,0.5) }}>תמונות מאונכות, פנים ברורות</div>
              <div style={{ fontFamily:th.display, fontWeight:800, fontSize:12,
                color: photos.length > 0 ? th.success : th.error,
                background: photos.length > 0 ? alpha(th.success,0.1) : alpha(th.error,0.08),
                borderRadius:999, padding:'4px 11px' }}>
                {photos.length > 0 ? `✓ ${photos.length} תמונות` : '* חובה'}
              </div>
            </div>

            {/* empty state — big hero upload */}
            {photos.length === 0 && (
              <label style={{ display:'block', cursor: uploading ? 'default' : 'pointer' }}>
                <div style={{ border:`2px dashed ${alpha(th.primary,0.35)}`, borderRadius:th.rLg,
                  background:alpha(th.primary,0.04), padding:'44px 20px', textAlign:'center' }}>
                  <div style={{ fontSize:52, marginBottom:12 }}>{uploading ? '⏳' : '📸'}</div>
                  <div style={{ fontFamily:th.display, fontWeight:800, fontSize:19, color:th.ink, marginBottom:6 }}>
                    {uploading ? 'מעלה תמונות…' : 'הוסף/י תמונות'}
                  </div>
                  <div style={{ fontFamily:th.body, fontSize:13, color:alpha(th.ink,0.5), lineHeight:1.5, marginBottom:20 }}>
                    מומלץ לפחות 2–3 תמונות<br/>ניתן לבחור כמה קבצים בבת אחת
                  </div>
                  {!uploading && (
                    <div style={{ display:'inline-block', background:th.primary, color:'#fff',
                      borderRadius:999, padding:'11px 28px', fontFamily:th.display, fontWeight:800, fontSize:15,
                      boxShadow:`0 6px 18px ${alpha(th.primary,0.3)}` }}>
                      בחר/י קבצים
                    </div>
                  )}
                </div>
                <input type="file" accept="image/*" multiple style={{ display:'none' }} onChange={addPhoto} disabled={uploading} />
              </label>
            )}

            {/* photo grid */}
            {photos.length > 0 && (
              <>
                <div style={{ display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap:8, marginBottom:10 }}>
                  {photos.map((url, i) => (
                    <div key={i} onClick={() => i !== 0 && setPrimaryPhoto(i)}
                      style={{ position:'relative', aspectRatio:'3/4', cursor: i !== 0 ? 'pointer' : 'default' }}>
                      <img src={url} alt="" loading="lazy" decoding="async"
                        style={{ width:'100%', height:'100%', borderRadius:th.r, objectFit:'cover', display:'block',
                          outline: i === 0 ? `2.5px solid ${th.primary}` : 'none', outlineOffset:'-2px' }} />
                      <button onClick={(e) => { e.stopPropagation(); setPhotos(p => p.filter((_,j) => j!==i)); }}
                        style={{ position:'absolute', top:5, insetInlineEnd:5, width:24, height:24,
                          borderRadius:'50%', border:'none', background:'rgba(0,0,0,0.55)',
                          color:'#fff', fontSize:15, cursor:'pointer',
                          display:'flex', alignItems:'center', justifyContent:'center', lineHeight:1 }}>×</button>
                      {i === 0
                        ? <div style={{ position:'absolute', bottom:5, insetInlineStart:5,
                            background:'rgba(0,0,0,0.6)', color:'#fff', borderRadius:999,
                            padding:'3px 8px', fontFamily:th.display, fontWeight:700, fontSize:10 }}>★ ראשי</div>
                        : <div style={{ position:'absolute', bottom:5, insetInlineStart:5,
                            background:'rgba(0,0,0,0.35)', color:'rgba(255,255,255,0.75)', borderRadius:999,
                            padding:'3px 7px', fontFamily:th.display, fontSize:9.5 }}>☆ הגדר כראשי</div>
                      }
                    </div>
                  ))}
                  {/* add more tile */}
                  <label style={{ aspectRatio:'3/4', borderRadius:th.r,
                    border:`2px dashed ${alpha(th.ink,0.2)}`, display:'flex',
                    flexDirection:'column', alignItems:'center', justifyContent:'center',
                    gap:5, cursor: uploading ? 'default' : 'pointer',
                    color: uploading ? alpha(th.ink,0.3) : th.primary, background: th.card }}>
                    {uploading
                      ? <span style={{ fontFamily:th.body, fontSize:11 }}>מעלה…</span>
                      : <><Icon name="plus" size={24} /><span style={{ fontFamily:th.body, fontSize:11, fontWeight:700 }}>הוסף/י</span></>}
                    <input type="file" accept="image/*" multiple style={{ display:'none' }} onChange={addPhoto} disabled={uploading} />
                  </label>
                </div>
                <div style={{ fontFamily:th.body, fontSize:11.5, color:alpha(th.ink,0.4), textAlign:'center' }}>
                  לחץ/י על תמונה להגדרת תמונה ראשית
                </div>
              </>
            )}
          </div>
        )}

        {step === 2 && (
          <>
            <Field th={th} label='סבבה והכל, אבל…' hint="משהו מצחיק/ייחודי עליך">
              <TextArea th={th} value={f.sabaBut} onChange={set('sabaBut')} rows={2} />
            </Field>
            <Field th={th} label="ספר/י על עצמך במשפט">
              <TextInput th={th} value={f.oneLine} onChange={set('oneLine')} />
            </Field>
            <Field th={th} label="מחפש/ת">
              <TextArea th={th} value={f.seesWith} onChange={set('seesWith')} rows={3} />
            </Field>
          </>
        )}

        {step === 3 && (
          <>
            <Field th={th} label="תחומי עניין">
              <MultiChips th={th} value={f.interests} onChange={v => setF(s => ({...s, interests:v}))} options={liveInterests} tone={th.primary} />
            </Field>
            <Field th={th} label="חשוב לי בפרטנר">
              <MultiChips th={th} value={f.partner} onChange={v => setF(s => ({...s, partner:v}))} options={livePartnerTraits} tone={th.gold} />
            </Field>
          </>
        )}

        <div style={{ display:'flex', gap:8, marginTop:20 }}>
          {step > 0
            ? <Btn th={th} variant="ghost" onClick={() => setStep(s => s-1)}>חזרה →</Btn>
            : <div style={{ flex:1 }} />
          }
          {isLast
            ? <Btn th={th} full size="l" onClick={submit} disabled={submitting || !f.name || !f.phone || !f.age || !f.region || photos.length === 0}>{submitting ? 'שולח…' : 'שלח/י פרטים לאישור'}</Btn>
            : <Btn th={th} full onClick={() => {
                if (step === 0) {
                  if (!f.phone || !f.age || !f.region) { alert('נא למלא את כל שדות החובה (המסומנים ב-*)'); return; }
                  if (!/^05\d[-]?\d{7}$/.test(f.phone.replace(/\s/g,''))) { alert('נא להזין מספר נייד ישראלי תקין (למשל 050-1234567)'); return; }
                }
                if (step === 1 && photos.length === 0) { alert('נא להעלות לפחות תמונה אחת'); return; }
                setStep(s => s+1);
              }}>הבא ←</Btn>
          }
        </div>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// EDIT CANDIDATE SCREEN — matchmaker edits after invite accepted
// ════════════════════════════════════════════════════════════
function EditCandidateScreen({ th, go, params }) {
  const { candidates, updateCandidate, uploadPhoto, uploadVoice, approveCandidate } = useContext(DataCtx);
  const { texts: tx, defaults: dx } = useContext(TextsCtx);
  const t = (key) => tx[key] || dx[key] || '';
  const c = candidates.find(x => x.id === params?.id);
  if (!c) return (
    <div style={{ height:'100%', display:'flex', alignItems:'center', justifyContent:'center', background:th.cream }}>
      <Logo size={40} color={th.primary} flaw={th.cream} />
    </div>
  );
  return (
    <div style={{ height:'100%', display:'flex', flexDirection:'column', background:th.cream, direction:'rtl' }}>
      <AppHeader th={th} title={c.name || 'מועמד/ת חדש/ה'} sub={c.status === 'pending_mm' ? 'ממתין/ה למילוי פרטים' : c.pendingApproval ? 'ממתין/ה לאישורך' : 'עריכת פרטים'} onBack={() => go('back')} />
      <div style={{ flex:1, overflowY:'auto', padding:'10px 18px 40px' }}>
        {c.status === 'pending_mm' && (
          <div style={{ background:alpha(th.primary,0.07), border:`1.5px solid ${alpha(th.primary,0.2)}`, borderRadius:th.r, padding:14, marginBottom:16, display:'flex', gap:10 }}>
            <Icon name="edit" size={18} style={{ color:th.primary, flexShrink:0, marginTop:2 }} />
            <div>
              <div style={{ fontFamily:th.display, fontWeight:800, fontSize:14, color:th.ink, marginBottom:3 }}>מלא/י את פרטי המועמד/ת</div>
              <div style={{ fontFamily:th.body, fontSize:12.5, color:alpha(th.ink,0.65), lineHeight:1.4 }}>לאחר שמירה יופיע/תופיע ברשימת המועמדים שלך.</div>
            </div>
          </div>
        )}
        {c.pendingApproval && (() => {
          const emptyCount = [!c.sabaBut, !c.oneLine, !c.seesWith,
            !(c.interests?.length), !(c.partner?.length), !c.voiceNote].filter(Boolean).length;
          return (
            <div style={{ background:`linear-gradient(135deg, ${alpha(th.primary,0.14)}, ${alpha(th.primary,0.06)})`, border:`2.5px solid ${alpha(th.primary,0.55)}`, borderRadius:th.r, padding:'16px 16px 14px', marginBottom:18, boxShadow:`0 6px 22px ${alpha(th.primary,0.22)}` }}>
              <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom: emptyCount > 0 ? 8 : 0 }}>
                <div style={{ width:36, height:36, borderRadius:'50%', background:th.primary, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, boxShadow:`0 3px 10px ${alpha(th.primary,0.45)}` }}>
                  <Icon name="bell" size={17} fill="#fff" stroke={0} style={{ color:'#fff' }} />
                </div>
                <div style={{ fontFamily:th.display, fontWeight:800, fontSize:17, color:th.ink }}>{t('review_banner_title')}</div>
              </div>
              {emptyCount > 0 && (
                <div style={{ fontFamily:th.body, fontSize:13.5, color:alpha(th.ink,0.75), lineHeight:1.5, paddingRight:46 }}>
                  {t('review_banner_body')} יש <b style={{ color:th.primary, fontSize:15 }}>{emptyCount} שדות ריקים</b> — {t('review_banner_empty_suffix')}
                </div>
              )}
              {emptyCount === 0 && (
                <div style={{ fontFamily:th.body, fontSize:13.5, color:alpha(th.ink,0.75), lineHeight:1.5, paddingRight:46 }}>
                  {t('review_banner_body')}
                </div>
              )}
            </div>
          );
        })()}
        <CandidateForm th={th} initial={{ ...c, name: c.name || params?.prefillName || '' }}
          onSave={async (data) => {
            const update = { ...data };
            if (c.status === 'pending_mm') update.status = firebase.firestore.FieldValue.delete();
            await updateCandidate(c.id, update);
            go('back');
          }}
          onSaveStep={async (data) => {
            const update = { ...data };
            if (c.status === 'pending_mm') update.status = firebase.firestore.FieldValue.delete();
            await updateCandidate(c.id, update);
            go('back');
          }}
          onCancel={() => go('back')}
          onUpload={(file) => uploadPhoto(c.id, file)} onUploadVoice={(blob) => uploadVoice(c.id, blob)}
          reviewMode={!!c.pendingApproval} showMmNote={th.showMmNote}
          onApprove={c.pendingApproval ? async (data) => {
            await updateCandidate(c.id, { ...data, pendingApproval: false });
            go('back');
          } : undefined} />
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// NOTIFICATION DRAWER
// ════════════════════════════════════════════════════════════
function NotificationDrawer({ th, go, notifications, markNotificationRead, deleteNotification }) {
  const { offers, candidates, matchmakers } = useContext(DataCtx);
  const { user } = useContext(AuthCtx);
  const myUid = user?.uid;
  const [open, setOpen] = useState(false);

  // Candidate-related notifications — aggregated into one item
  const candNotifs = notifications.filter(n => ['invite_accepted','cand_filled','corep_approved'].includes(n.type));
  const unreadCand = candNotifs.filter(n => !n.read).length;

  // Message notifications — grouped by chatId, one card per conversation
  const msgNotifs = notifications.filter(n => n.type === 'new_msg');
  const msgByChatId = Object.values(
    msgNotifs.reduce((acc, n) => {
      if (!acc[n.chatId] || (n.createdAt?.seconds || 0) > (acc[n.chatId].createdAt?.seconds || 0))
        acc[n.chatId] = n;
      return acc;
    }, {})
  );
  const unreadMsg = msgNotifs.filter(n => !n.read).length;

  // Offers where I'm the receiver and haven't responded yet
  const findC = id => candidates.find(c => c.id === id) || { name:'?', grad: gradForId(id||'x'), photos:[] };
  const findM = id => { const mm = matchmakers?.[id]; if (!mm) return { name:'—', grad: gradForId(id||'x') }; return { ...mm, name: mm.displayName||mm.name||'—' }; };
  const offersNeedingMe = React.useMemo(() =>
    (offers||[]).filter(o => o.bMm === myUid && o.aMm !== myUid && !['אישר','דחה'].includes(o.bStatus) && o.status !== 'נדחתה'),
    [offers, myUid]);

  const totalUnread = unreadCand + offersNeedingMe.length + unreadMsg;

  const goToCands = () => {
    candNotifs.filter(n => !n.read).forEach(n => markNotificationRead(n.id));
    setOpen(false);
    go('cands');
  };
  const deleteAll = () => {
    candNotifs.forEach(n => deleteNotification(n.id));
    msgNotifs.forEach(n => deleteNotification(n.id));
  };

  return (
    <>
      <button onClick={() => setOpen(true)} style={{ position:'relative', border:'none', background:th.card, width:42, height:42, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', color:th.ink, cursor:'pointer', boxShadow:'0 2px 8px rgba(0,0,0,0.07)' }}>
        <Icon name="bell" size={21} />
        {totalUnread > 0 && (
          <span style={{ position:'absolute', top:6, insetInlineEnd:6, minWidth:16, height:16, borderRadius:99, background:th.error, color:'#fff', fontSize:10, fontWeight:800, display:'flex', alignItems:'center', justifyContent:'center', padding:'0 4px', border:`2px solid ${th.card}` }}>{totalUnread}</span>
        )}
      </button>
      <Sheet open={open} onClose={() => setOpen(false)} th={th} title={
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', width:'100%' }}>
          <span>התראות</span>
          {(candNotifs.length > 0 || msgNotifs.length > 0) && (
            <button onClick={deleteAll} style={{ border:'none', background:alpha(th.error,0.08), color:th.error, borderRadius:999, padding:'5px 12px', fontFamily:th.body, fontSize:12, fontWeight:600, cursor:'pointer' }}>
              נקה הכל
            </button>
          )}
        </div>
      }>
        {offersNeedingMe.length === 0 && candNotifs.length === 0 && msgByChatId.length === 0 && (
          <div style={{ textAlign:'center', fontFamily:th.body, color:alpha(th.ink,0.4), padding:'24px 0' }}>אין התראות</div>
        )}

        {/* ── Per-offer approval items ── */}
        {offersNeedingMe.map(o => {
          const myCand   = findC(o.bId);
          const theirC   = findC(o.aId);
          const initMm   = findM(o.aMm);
          return (
            <div key={o.id} style={{ borderRadius:th.r, marginBottom:8, overflow:'hidden', background:alpha(th.primary,0.07), border:`1.5px solid ${alpha(th.primary,0.18)}` }}>
              <button onClick={() => { setOpen(false); go('offerDetail', { id: o.id }); }}
                style={{ all:'unset', cursor:'pointer', boxSizing:'border-box', width:'100%', padding:'12px 14px', display:'block', textAlign:'right' }}>
                <div style={{ fontFamily:th.display, fontWeight:800, fontSize:14, color:th.ink, marginBottom:3 }}>
                  💍 {myCand.name} · {theirC.name}
                </div>
                <div style={{ fontFamily:th.body, fontSize:12.5, color:alpha(th.ink,0.6) }}>
                  {initMm.name} שלח/ה הצעת שידוך — ממתינה לאישורך
                </div>
              </button>
              <button onClick={() => { setOpen(false); go('offerDetail', { id: o.id }); }}
                style={{ all:'unset', cursor:'pointer', boxSizing:'border-box', display:'block', width:'100%', padding:'9px 14px', background:alpha(th.primary,0.09), borderTop:`1px solid ${alpha(th.primary,0.12)}`, fontFamily:th.display, fontWeight:800, fontSize:12.5, color:th.primary, textAlign:'right' }}>
                צפה בהצעה ←
              </button>
            </div>
          );
        })}

        {/* ── Message notifications (one card per conversation) ── */}
        {msgByChatId.map(n => {
          const unreadInChat = msgNotifs.filter(m => m.chatId === n.chatId && !m.read).length;
          const markChat = () => msgNotifs.filter(m => m.chatId === n.chatId).forEach(m => markNotificationRead(m.id));
          const openChat = () => { markChat(); setOpen(false); go('candInquiry', { candId: n.candId, toMm: n.fromMmId }); };
          return (
            <div key={n.chatId} style={{ borderRadius:th.r, marginBottom:8, overflow:'hidden',
              background: unreadInChat > 0 ? alpha(th.primary,0.07) : th.card,
              border:`1.5px solid ${unreadInChat > 0 ? alpha(th.primary,0.18) : 'transparent'}` }}>
              <button onClick={openChat}
                style={{ all:'unset', cursor:'pointer', boxSizing:'border-box', width:'100%', padding:'12px 14px', display:'block', textAlign:'right' }}>
                <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                  <div style={{ flex:1 }}>
                    <div style={{ fontFamily:th.display, fontWeight:800, fontSize:14, color:th.ink, marginBottom:3 }}>
                      💬 הודעה חדשה על {n.candName}
                    </div>
                    <div style={{ fontFamily:th.body, fontSize:12.5, color:alpha(th.ink,0.6) }}>מ-{n.fromMmName}</div>
                  </div>
                  {unreadInChat > 0 && (
                    <span style={{ background:th.primary, color:'#fff', borderRadius:99, minWidth:22, height:22, fontSize:12, fontWeight:800, display:'flex', alignItems:'center', justifyContent:'center', padding:'0 5px', flexShrink:0 }}>{unreadInChat}</span>
                  )}
                </div>
              </button>
              <button onClick={openChat}
                style={{ all:'unset', cursor:'pointer', boxSizing:'border-box', display:'block', width:'100%', padding:'9px 14px', background:alpha(th.primary,0.09), borderTop:`1px solid ${alpha(th.primary,0.12)}`, fontFamily:th.display, fontWeight:800, fontSize:12.5, color:th.primary, textAlign:'right' }}>
                עבור/י לשיחה ←
              </button>
            </div>
          );
        })}

        {/* ── Aggregated candidate notifications ── */}
        {candNotifs.length > 0 && (
          <div style={{ borderRadius:th.r, marginBottom:8, overflow:'hidden', background: unreadCand > 0 ? alpha(th.primary,0.07) : th.card, border:`1.5px solid ${unreadCand > 0 ? alpha(th.primary,0.18) : 'transparent'}` }}>
            <button onClick={goToCands}
              style={{ all:'unset', cursor:'pointer', boxSizing:'border-box', width:'100%', padding:'12px 14px', display:'block', textAlign:'right' }}>
              <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                <div style={{ flex:1 }}>
                  <div style={{ fontFamily:th.display, fontWeight:800, fontSize:14, color:th.ink, marginBottom:3 }}>
                    👥 מועמדים מחכים להתייחסותך
                  </div>
                  <div style={{ fontFamily:th.body, fontSize:12.5, color:alpha(th.ink,0.6) }}>
                    {candNotifs.length === 1 ? 'מועמד/ת אחד/ת' : `${candNotifs.length} מועמדים`} מחייבים פעולה
                  </div>
                </div>
                {unreadCand > 0 && (
                  <span style={{ background:th.primary, color:'#fff', borderRadius:99, minWidth:22, height:22, fontSize:12, fontWeight:800, display:'flex', alignItems:'center', justifyContent:'center', padding:'0 5px', flexShrink:0 }}>{unreadCand}</span>
                )}
              </div>
            </button>
            <button onClick={goToCands}
              style={{ all:'unset', cursor:'pointer', boxSizing:'border-box', display:'block', width:'100%', padding:'9px 14px', background:alpha(th.primary,0.09), borderTop:`1px solid ${alpha(th.primary,0.12)}`, fontFamily:th.display, fontWeight:800, fontSize:12.5, color:th.primary, textAlign:'right' }}>
              עבור/י למועמדים ←
            </button>
          </div>
        )}
      </Sheet>
    </>
  );
}

// ════════════════════════════════════════════════════════════
// CANDIDATE DETAIL — 3 VARIATIONS (the heart)
// ════════════════════════════════════════════════════════════
function CandidateDetail({ th, go, params }) {
  const c = findCand(params?.id) || CANDIDATES[0];
  const [showDiscrete, setShowDiscrete] = useSb(false);
  const [dotsOpen, setDotsOpen] = useSb(false);
  const [delStep, setDelStep] = useSb(null); // null | 'mine' | 'all' | 'cancel-rep'
  const [localAvailable, setLocalAvailable] = useSb(c?.available ?? true);
  const [localHidden, setLocalHidden] = useSb(c?.hidden ?? false);
  const { user } = React.useContext(AuthCtx);
  const { updateCandidate, deleteCandidate, matchmakers } = React.useContext(DataCtx);
  useEd(() => { setLocalAvailable(c?.available ?? true); }, [c?.available]);
  useEd(() => { setLocalHidden(c?.hidden ?? false); }, [c?.hidden]);
  const myUid = user?.uid;
  const viewOnly = !!params?.viewOnly;
  const variant = th.cardVariant;
  const isPrimary   = c?.mmId === myUid;
  const isSecondary = !isPrimary && !!(c?.coMms?.includes(myUid));
  const isMine = isPrimary || isSecondary;
  const cView = { ...c, hidden: localHidden, available: localAvailable };
  const mm = matchmakers?.[c?.mmId] || null;

  const footer = (
    <div style={{ flexShrink: 0, padding: '12px 18px 26px', background: alpha(th.cream, 0.95), backdropFilter: 'blur(12px)', borderTop: `1px solid ${alpha(th.ink, 0.08)}`, display: 'flex', gap: 10 }}>
      <Btn th={th} full size="l" onClick={() => go('matchFlow', { id: c.id })} icon={<Icon name="heart" size={20} fill="#fff" stroke={0} />}>שדך/י את {c.name}</Btn>
    </div>
  );

  const body =
    variant === 'מגזין' ? <MagBody c={cView} th={th} showDiscrete={showDiscrete} setShowDiscrete={setShowDiscrete} go={go} mm={mm} />
    : variant === 'מינימלי' ? <MinBody c={cView} th={th} showDiscrete={showDiscrete} setShowDiscrete={setShowDiscrete} go={go} mm={mm} />
    : <ClassicBody c={cView} th={th} showDiscrete={showDiscrete} setShowDiscrete={setShowDiscrete} go={go} mm={mm} />;

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: th.cream, position: 'relative' }}>
      {/* floating back / dots over content */}
      <div style={{ position: 'absolute', top: 50, right: 16, left: 16, zIndex: 20, display: 'flex', justifyContent: 'space-between', pointerEvents: 'none' }}>
        <button onClick={() => go('back')} style={{ pointerEvents: 'auto', width: 40, height: 40, borderRadius: '50%', border: 'none', background: alpha('#ffffff', 0.85), backdropFilter: 'blur(8px)', color: th.ink, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', boxShadow: '0 2px 10px rgba(0,0,0,0.15)' }}><Icon name="back" size={20} /></button>
        <button onClick={() => setDotsOpen(true)} style={{ pointerEvents: 'auto', width: 40, height: 40, borderRadius: '50%', border: 'none', background: alpha('#ffffff', 0.85), backdropFilter: 'blur(8px)', color: th.ink, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', boxShadow: '0 2px 10px rgba(0,0,0,0.15)' }}><Icon name="dots" size={20} /></button>
      </div>
      <Sheet open={dotsOpen} onClose={() => { setDotsOpen(false); setDelStep(null); }} th={th} title={c.name}>
        {delStep ? (
          /* ── Confirmation screen (shared for all delete/cancel types) ── */
          <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
            <div style={{ background:alpha(th.error||'#e53e3e',0.08), border:`1.5px solid ${alpha(th.error||'#e53e3e',0.25)}`, borderRadius:th.r, padding:'14px 16px', textAlign:'center' }}>
              <div style={{ fontSize:28, marginBottom:8 }}>⚠️</div>
              <div style={{ fontFamily:th.display, fontWeight:800, fontSize:16, color:th.ink, marginBottom:6 }}>
                {delStep === 'cancel-rep' ? 'ביטול ייצוג' : delStep === 'mine' ? 'הסרה מהרשימה שלך' : 'מחיקה לצמיתות'}
              </div>
              <div style={{ fontFamily:th.body, fontSize:13.5, color:alpha(th.ink,0.65), lineHeight:1.55 }}>
                {delStep === 'cancel-rep'
                  ? `לאחר הביטול, ${c.name} לא יופיע/תופיע ברשימת המועמדים שלך. לא תוכל/י לשדך אותו/ה.`
                  : delStep === 'mine'
                  ? `${c.name} יוסר/תוסר מהרשימה שלך בלבד. שדכנים אחרים לא יושפעו.`
                  : `${c.name} יימחק/תימחק לצמיתות מהמערכת אצל כולם. לא ניתן לשחזר.`}
              </div>
            </div>
            <button onClick={async () => {
              if (delStep === 'cancel-rep') {
                await updateCandidate(c.id, { coMms: firebase.firestore.FieldValue.arrayRemove(myUid) });
              } else if (delStep === 'mine') {
                await deleteCandidate(c.id);
              } else {
                await deleteCandidate(c.id);
              }
              setDotsOpen(false); setDelStep(null); go('back');
            }} style={{ all:'unset', cursor:'pointer', boxSizing:'border-box', width:'100%', textAlign:'center', background:th.error||'#e53e3e', color:'#fff', fontFamily:th.display, fontWeight:800, fontSize:15, borderRadius:th.r, padding:'13px 0' }}>
              {delStep === 'cancel-rep' ? 'כן, בטל/י ייצוג' : delStep === 'mine' ? 'כן, הסר מהרשימה שלי' : 'כן, מחק לצמיתות'}
            </button>

function infoPairs(c) {
  return [
    ['גיל', c.age],
    ['אזור', c.region],
    ['מצב משפחתי', c.family || '—'],

// ── VARIANT 1 — קלאסי (warm, friendly) ─────────────────────────
function VoiceNotePlayer({ url, th, fab }) {
  const [playing, setPlaying] = useState(false);
  const audioRef = React.useRef(null);
  if (!url) return null;
  const toggle = (e) => {
    if (e) e.stopPropagation();
    const a = audioRef.current;
    if (!a) return;
    if (playing) { a.pause(); setPlaying(false); }
    else { a.play().catch(() => {}); setPlaying(true); }
  };

  if (fab) return (
    <div style={{ position:'absolute', bottom:18, left:16, zIndex:10 }}>
      <audio ref={audioRef} src={url} onEnded={() => setPlaying(false)} />
      <button
        onClick={toggle}
        aria-label={playing ? 'עצור הקלטה' : 'האזן להקלטת השדכן/ית'}
        style={{ width:48, height:48, borderRadius:'50%', border:`2px solid ${playing ? 'rgba(255,255,255,0.4)' : 'rgba(255,255,255,0.55)'}`, background:playing ? th.primary : 'rgba(255,255,255,0.88)', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', backdropFilter:'blur(8px)', transition:'all 0.2s', boxShadow:'0 3px 16px rgba(0,0,0,0.28)' }}>
        <Icon name={playing ? 'stop' : 'headphones'} size={22} color={playing ? '#fff' : th.primary} fill={playing ? 'rgba(255,255,255,0.25)' : 'none'} />
      </button>
      {playing && (
        <div style={{ position:'absolute', bottom:54, left:0, background:'rgba(20,20,20,0.78)', color:'#fff', fontSize:11, fontFamily:'sans-serif', fontWeight:600, padding:'4px 9px', borderRadius:6, whiteSpace:'nowrap', backdropFilter:'blur(4px)' }}>
          מושמע…
        </div>
      )}
    </div>
  );

  return (
    <div onClick={toggle} style={{ display:'flex', alignItems:'center', gap:12, background:alpha(th.primary,0.08), borderRadius:th.r, padding:'12px 16px', marginBottom:12, cursor:'pointer', border:`1.5px solid ${alpha(th.primary,0.15)}` }}>
      <audio ref={audioRef} src={url} onEnded={() => setPlaying(false)} />
      <button onClick={e => { e.stopPropagation(); toggle(e); }}
        style={{ width:44, height:44, borderRadius:'50%', border:'none', background:playing ? th.primary : alpha(th.primary,0.15), cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, transition:'background 0.2s' }}>
        <Icon name={playing ? 'stop' : 'headphones'} size={20} color={playing ? '#fff' : th.primary} fill={playing ? 'rgba(255,255,255,0.25)' : 'none'} />
      </button>
      <div>
        <div style={{ fontFamily:th.display, fontWeight:800, fontSize:14, color:th.ink }}>הקלטת השדכן/ית</div>
        <div style={{ fontFamily:th.body, fontSize:12, color:alpha(th.ink,0.5), marginTop:2 }}>{playing ? 'מושמע…' : 'לחץ/י להאזנה'}</div>
      </div>
    </div>
  );
}

const { useState: useSc, useMemo: useMc, useEffect: useEc } = React;

function calcScore(a, b) {
  let score = 0, total = 0;
  if (a.age && b.age) {
    const diff = Math.abs(Number(a.age) - Number(b.age));
    score += diff <= 2 ? 10 : diff <= 5 ? 7 : diff <= 8 ? 4 : 1;
    total += 10;
  }
  if (a.region && b.region) { score += a.region === b.region ? 10 : 5; total += 10; }
  if (a.religiosity && b.religiosity) { score += a.religiosity === b.religiosity ? 10 : 3; total += 10; }
  if (a.interests?.length && b.interests?.length) {
    const shared = a.interests.filter(i => b.interests.includes(i)).length;
    score += Math.min(10, shared * 3); total += 10;
  }
  return total > 0 ? Math.round((score / total) * 100) : 50;
}

function MatchFlow({ th, go, params }) {
  const { lists, candidates, offers, addOffer, matchmakers } = useContext(DataCtx);
  const { profile } = useContext(AuthCtx);
  const liveReligiosity = (lists.religiosity && lists.religiosity.length) ? lists.religiosity : RELIGIOSITY;
  const liveRegions     = (lists.regions     && lists.regions.length)     ? lists.regions     : REGIONS;
  const first = candidates.find(c => c.id === params?.id) || candidates[0];
  const presetSecond = params?.withId ? candidates.find(c => c.id === params.withId) : null;
  const [step, setStep] = useSc(presetSecond ? 3 : 1); // 1 first, 2 choose, 3 proposal, 4 success
  const [second, setSecond] = useSc(presetSecond);
  const [note, setNote] = useSc('');
  const [mmMsg, setMmMsg] = useSc('');
  const [matchFilters, setMatchFilters] = useSc({ rel: [], region: '', ageMin: 18, ageMax: 60, maritalStatus: [] });
  const [filterOpen, setFilterOpen] = useSc(false);
  const [q2, setQ2] = useSc('');
  const [sending, setSending] = useSc(false);
  const [firstCandId, setFirstCandId] = useSc(null); // for self-match: who gets notified first
  const [previewCand, setPreviewCand] = useSc(null); // candidate being previewed in step 2
  const [aiScore, setAiScore] = useSc(null);
  const [aiText, setAiText] = useSc(null);
  const [aiLoading, setAiLoading] = useSc(false);
  const [confirmModal, setConfirmModal] = useSc(false); // false | 'step1' | 'step2'
  const [candApproved, setCandApproved] = useSc(null);

  const myUid = profile?.uid;
  const offerExists = (idA, idB) => (offers || []).some(o =>
    o.status !== 'נדחתה' &&
    ((o.aId === idA && o.bId === idB) || (o.aId === idB && o.bId === idA))
  );
  const isSelfMatch = !!(second && first?.mmId === myUid && second?.mmId === myUid);
  // effective "first notified" candidate in self-match
  const notifyFirst  = isSelfMatch ? (firstCandId || first?.id) : null;
  const notifySecond = isSelfMatch ? (notifyFirst === first?.id ? second : first) : null;

  useEc(() => {
    if (step !== 3 || !first || !second || isSelfMatch) return;
    setAiScore(calcScore(first, second));
    setAiLoading(true); setAiText(null);
    (async () => {
      try {
        const cfg = await db.collection('config').doc('settings').get();
        const apiKey = cfg.data()?.anthropicKey;
        if (!apiKey) return;
        const prof = c => [c.name, c.age ? `גיל ${c.age}` : '', c.region, c.religiosity, (c.interests||[]).slice(0,3).join('/')].filter(Boolean).join(', ');
        const res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01' },
          body: JSON.stringify({ model: 'claude-haiku-4-5-20251001', max_tokens: 100,
            messages: [{ role: 'user', content: `אתה שדכן. כתוב משפט אחד בעברית (עד 20 מילה) מדוע ${first.name} ו${second.name} עשויים להתאים.\nא: ${prof(first)}\nב: ${prof(second)}` }] })
        });
        const d = await res.json();
        setAiText(d.content?.[0]?.text?.trim() || null);
      } catch(e) { console.warn('AI analysis:', e); }
      finally { setAiLoading(false); }
    })();
  }, [step, first?.id, second?.id, isSelfMatch]);

  const isFemale2 = g => g === 'f' || g === 'אשה' || g === 'אישה';
  const isMale2   = g => g === 'm' || g === 'גבר';
  const firstIsFemale = isFemale2(first?.gender);
  const firstIsMine = first?.mmId === myUid;
  // No useMemo — always recompute so filter is never stale
  const candidates2 = candidates.filter(c => {
    if (firstIsFemale ? !isMale2(c.gender) : !isFemale2(c.gender)) return false;
    if (c.id === first?.id) return false;
    if (c.available === false) return false;
    if (c.status === 'pending_mm') return false;
    // If first candidate is someone else's, second must be mine
    if (!firstIsMine && c.mmId !== myUid) return false;
    if (q2 && !c.name.includes(q2) && !(c.oneLine || '').includes(q2)) return false;
    if (matchFilters.region && c.region !== matchFilters.region) return false;
    if (matchFilters.rel.length && !matchFilters.rel.includes(c.religiosity)) return false;
    if (c.age < matchFilters.ageMin || c.age > matchFilters.ageMax) return false;
    if (matchFilters.maritalStatus.length && !matchFilters.maritalStatus.includes(c.family)) return false;
    return true;
  }).sort((a, b) => {
    const aEx = offerExists(first?.id, a.id), bEx = offerExists(first?.id, b.id);
    if (aEx !== bEx) return aEx ? 1 : -1;
    return calcScore(first, b) - calcScore(first, a);
  });

  const sendOffer = async () => {
    if (!first || !second || sending) return;
    if (offerExists(first.id, second.id)) { alert('כבר קיימת הצעה בין מועמדים אלה'); return; }
    setSending(true);
    try {
      if (isSelfMatch) {
        const a = candidates.find(c => c.id === notifyFirst);
        const b = notifySecond;
        await addOffer({
          aId: a.id, aMm: myUid,
          bId: b.id, bMm: myUid,
          status: 'ממתין למועמד',
          aStatus: 'אישר', bStatus: 'אישר', // matchmaker already approved both
          selfMatch: true,
          candAStatus: 'ממתין',  // first candidate awaiting decision
          candBStatus: 'טרם',   // second candidate not yet their turn
          note: note.trim(), unread: 0,
        });
      } else {
        await addOffer({
          aId: first.id,  aMm: first.mmId || myUid,
          bId: second.id, bMm: second.mmId,
          status: 'נשלחה',
          aStatus: 'ממתין', bStatus: 'ממתין',
          note: note.trim(), unread: 0,
        });
      }
      setStep(4);
    } catch(e) { alert('שגיאה בשליחה: ' + e.message); }
    setSending(false);
  };
  const steps = ['ראשון', 'שני', 'הצעה'];
  const stepIdx = Math.min(step, 3) - 1;

  const back = () => {
    if (step === 1) return go('back');
    if (step === 3 && presetSecond) return go('back');
    setStep(step - 1);
  };

  // STEP 4 — success
  if (step === 4) {
    const candA = isSelfMatch ? candidates.find(c => c.id === notifyFirst) || first : first;
    const candB = isSelfMatch ? notifySecond || second : second;
    return (
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', background: `linear-gradient(170deg, ${th.cream}, ${tint(th.success, 0.86)})`, padding: 28, textAlign: 'center' }}>
        <div style={{ animation: 'sabaPop .5s cubic-bezier(.2,.9,.3,1)', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 4, marginBottom: 24 }}>
          <Avatar grad={candA.grad} name={candA.name} size={84} photo={candA.photos && candA.photos[0]} style={{ marginInlineEnd: -12 }} />
          <div style={{ zIndex: 2, background: th.success, color: '#fff', borderRadius: '50%', width: 46, height: 46, display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: `0 8px 20px ${alpha(th.success, 0.4)}` }}><Icon name="heart" size={26} fill="#fff" stroke={0} /></div>
          <Avatar grad={candB.grad} name={candB.name} size={84} photo={candB.photos && candB.photos[0]} style={{ marginInlineStart: -12 }} />
        </div>
        <h1 style={{ fontFamily: th.display, fontSize: 28, color: th.ink, margin: '0 0 10px' }}>{isSelfMatch ? 'שידוך ישיר!' : 'ההצעה בדרך!'}</h1>
        <p style={{ fontFamily: th.body, fontSize: 16, color: alpha(th.ink, 0.65), lineHeight: 1.5, maxWidth: 300, margin: '0 0 28px' }}>
          {isSelfMatch
            ? <>{candA.name} יקבל/תקבל את ההצעה ראשון/ה. אם יאשר/תאשר — {candB.name} יקבל/תקבל הצעה.</>
            : (() => {
                const bMm = matchmakers?.[candB.mmId];
                const bMmName = bMm?.displayName || bMm?.name || null;
                return <>שלחנו את ההצעה ל{bMmName ? <strong>{bMmName}</strong> : 'שדכן/ית'}, שדכן/ית של {candB.name}. ברגע שתתקבל — {candA.name} יעודכן/תעודכן.</>;
              })()

        </p>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10, width: '100%', maxWidth: 320 }}>
          <Btn th={th} full size="l" onClick={() => go('offers')}>למעקב הצעות</Btn>
          <Btn th={th} full size="l" variant="ghost" onClick={() => go('tab', { tab: 'home' })}>חזרה לבית</Btn>
        </div>
      </div>
    );
  }

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: th.cream }}>
      <AppHeader th={th} title="שידוך חדש" onBack={back} />

      <div style={{ display: 'flex', gap: 6, padding: '4px 18px 10px', flexShrink: 0 }}>
        {steps.map((s, i) => (
          <div key={i} style={{ flex: 1, textAlign: 'center' }}>
            <div style={{ height: 5, borderRadius: 99, background: i <= stepIdx ? th.primary : alpha(th.ink, 0.12), marginBottom: 5, transition: 'background .3s' }} />
            <span style={{ fontFamily: th.body, fontSize: 11, fontWeight: 700, color: i <= stepIdx ? th.primary : alpha(th.ink, 0.4) }}>{s}</span>
          </div>
        ))}
      </div>

      <div style={{ flex: 1, overflowY: 'auto', padding: '6px 18px 24px' }}>
        {step === 1 && (
          <>
            <div style={{ fontFamily: th.display, fontSize: 19, fontWeight: 800, color: th.ink, marginBottom: 6 }}>מתחילים עם {first.name}</div>
            <p style={{ fontFamily: th.body, fontSize: 14, color: alpha(th.ink, 0.6), marginTop: 0, marginBottom: 14, lineHeight: 1.4 }}>זה/זו המועמד/ת הראשון/ה בשידוך. עכשיו נמצא את ההתאמה.</p>
            <CandRow c={first} th={th} selected />
            <div style={{ display: 'flex', gap: 8, alignItems: 'flex-start', background: alpha(firstIsMine ? th.success : th.gold, 0.12), borderRadius: th.r, padding: 12, marginTop: 4 }}>
              <Icon name="info" size={18} style={{ color: firstIsMine ? th.success : th.gold, flexShrink: 0 }} />
