// iOS.jsx — Simplified iOS 26 (Liquid Glass) device frame
// Based on the iOS 26 UI Kit + Figma status bar spec. No assets, no deps.
// Exports (to window): IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard
//
// Usage — wrap your screen content in <IOSDevice> to get the bezel, status bar
// and home indicator (props: title, dark, keyboard):
//
//   <IOSDevice title="Settings">
//     ...your screen content...
//   </IOSDevice>
//   <IOSDevice dark title="Search" keyboard>…</IOSDevice>
/* END USAGE */

// ─────────────────────────────────────────────────────────────
// Status bar
// ─────────────────────────────────────────────────────────────
function IOSStatusBar({ dark = false, time = '9:41' }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',
      position: 'relative', zIndex: 20, width: '100%',
    }}>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
        <span style={{
          fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590,
          fontSize: 17, lineHeight: '22px', color: c,
        }}>{time}</span>
      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill={c}/>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill={c}/>
        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
          <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark
        ? '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)'
        : '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',
      ...style,
    }}>
      {/* blur + tint */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',
      }} />
      {/* shine */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
      }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Navigation bar — glass pills + large title
// ─────────────────────────────────────────────────────────────
function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>
    </IOSGlassPill>
  );
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,
      paddingTop: 62, paddingBottom: 10, position: 'relative', zIndex: 5,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 16px',
      }}>
        {/* back chevron */}
        {pillIcon(
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" style={{ marginLeft: -1 }}>
            <path d="M10 2L2 10l8 8" stroke={muted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        )}
        {/* trailing ellipsis */}
        {trailingIcon && pillIcon(
          <svg width="22" height="6" viewBox="0 0 22 6">
            <circle cx="3" cy="3" r="2.5" fill={muted}/>
            <circle cx="11" cy="3" r="2.5" fill={muted}/>
            <circle cx="19" cy="3" r="2.5" fill={muted}/>
          </svg>
        )}
      </div>
      {/* large title */}
      <div style={{
        padding: '0 16px',
        fontFamily: '-apple-system, system-ui',
        fontSize: 34, fontWeight: 700, lineHeight: '41px',
        color: text, letterSpacing: 0.4,
      }}>{title}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Grouped list (inset card, r:26) + row (52px)
// ─────────────────────────────────────────────────────────────
function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', minHeight: 52,
      padding: '0 16px', position: 'relative',
      fontFamily: '-apple-system, system-ui', fontSize: 17,
      letterSpacing: -0.43,
    }}>
      {icon && (
        <div style={{
          width: 30, height: 30, borderRadius: 7, background: icon,
          marginRight: 12, flexShrink: 0,
        }} />
      )}
      <div style={{ flex: 1, color: text }}>{title}</div>
      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron && (
        <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
      {!isLast && (
        <div style={{
          position: 'absolute', bottom: 0, right: 0,
          left: icon ? 58 : 16, height: 0.5, background: sep,
        }} />
      )}
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';
  return (
    <div>
      {header && (
        <div style={{
          fontFamily: '-apple-system, system-ui', fontSize: 13,
          color: hc, textTransform: 'uppercase',
          padding: '8px 36px 6px', letterSpacing: -0.08,
        }}>{header}</div>
      )}
      <div style={{
        background: bg, borderRadius: 26,
        margin: '0 16px', overflow: 'hidden',
      }}>{children}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Device frame
// ─────────────────────────────────────────────────────────────
function IOSDevice({
  children, width = 402, height = 874, dark = false,
  title, keyboard = false,
}) {
  return (
    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      boxShadow: '0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12)',
      fontFamily: '-apple-system, system-ui, sans-serif',
      WebkitFontSmoothing: 'antialiased',
    }}>
      {/* dynamic island */}
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
      }} />
      {/* status bar (absolute) */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
        <IOSStatusBar dark={dark} />
      </div>
      {/* nav + content */}
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
        {title !== undefined && <IOSNavBar title={title} dark={dark} />}
        <div style={{ flex: 1, overflow: 'auto' }}>{children}</div>
        {keyboard && <IOSKeyboard dark={dark} />}
      </div>
      {/* home indicator — always on top */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
        height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
        paddingBottom: 8, pointerEvents: 'none',
      }}>
        <div style={{
          width: 139, height: 5, borderRadius: 100,
          background: dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.25)',
        }} />
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Keyboard — iOS 26 liquid glass
// ─────────────────────────────────────────────────────────────
function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';

  // special-key icons
  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };

  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

Object.assign(window, {
  IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard,
});

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});
// theme.jsx — design tokens, icon set, tiny primitives for "סבבה והכל"
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ── Palette (option 0: deep pink / cream / gold) ───────────────
const PALETTE = {
  primary: '#E8547A',
  cream:   '#FFF8F0',
  card:    '#FFFFFF',
  gold:    '#C9A96E',
  ink:     '#1C1C2E',
  success: '#6BCB77',
  error:   '#FF6B6B',
};

// Font pairings (display / body) — all RTL-capable Google fonts
const FONT_PAIRS = {
  'אופי':   { display: '"Secular One", sans-serif', body: '"Assistant", sans-serif' },
  'נקי':    { display: '"Heebo", sans-serif',       body: '"Heebo", sans-serif' },
  'ידידותי':{ display: '"Fredoka", "Rubik", sans-serif', body: '"Rubik", sans-serif' },
};

const RADIUS = { 'חד': 8, 'רך': 16, 'מעוגל': 26 };
const DENSITY = { 'קומפקטי': 0.82, 'רגיל': 1, 'מרווח': 1.18 };

// Compose a style context object from tweaks
function makeTheme(t) {
  const pair = FONT_PAIRS[t.fontPair] || FONT_PAIRS['אופי'];
  const r = RADIUS[t.radius] ?? 16;
  const d = DENSITY[t.density] ?? 1;
  return {
    primary: t.primaryColor || PALETTE.primary,
    cream: PALETTE.cream, card: PALETTE.card, gold: PALETTE.gold,
    ink: PALETTE.ink, success: PALETTE.success, error: PALETTE.error,
    display: pair.display, body: pair.body,
    r, rSm: Math.max(6, r * 0.6), rLg: r * 1.5,
    d, sp: (n) => Math.round(n * d),
    cardVariant: t.cardVariant || 'קלאסי',
  };
}

// soft tint of a hex color toward white
function tint(hex, amt = 0.88) {
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const mix = (c) => Math.round(c + (255 - c) * amt);
  return `rgb(${mix(r)}, ${mix(g)}, ${mix(b)})`;
}
function alpha(hex, a) {
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
}

// ── Auth hook ────────────────────────────────────────────────
function useAuthState() {
  const [user, setUser]       = useState(undefined); // undefined = loading
  const [profile, setProfile] = useState(null);

  useEffect(() => {
    return auth.onAuthStateChanged(async (u) => {
      setUser(u);
      if (!u) { setProfile(null); return; }
      const ref = db.collection('users').doc(u.uid);
      const snap = await ref.get();
      if (!snap.exists) {
        // first user → admin
        const allSnap = await db.collection('users').get();
        const isFirst = allSnap.empty;
        const p = {
          email: u.email,
          displayName: u.displayName || '',
          photoURL: u.photoURL || '',
          isAdmin: isFirst,
          role: 'matchmaker',
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        };
        await ref.set(p);
        setProfile({ uid: u.uid, ...p, isAdmin: isFirst });
      } else {
        setProfile({ uid: u.uid, ...snap.data() });
        // live updates
        ref.onSnapshot(d => setProfile({ uid: u.uid, ...d.data() }));
      }
    });
  }, []);

  return { user, profile };
}

// ── Data hook (live Firestore listeners) ─────────────────────
function useFirebaseData(uid) {
  const [candidates,    setCandidates]    = useState([]);
  const [offers,        setOffers]        = useState([]);
  const [matchmakers,   setMatchmakers]   = useState({});
  const [texts,         setTexts]         = useState({});
  const [lists,         setLists]         = useState({});
  const [notifications, setNotifications] = useState([]);
  const [loading,       setLoading]       = useState(true);

  useEffect(() => {
    if (!uid) return;
    const unsubs = [];

    unsubs.push(db.collection('candidates').onSnapshot(s => {
      setCandidates(s.docs.map(d => {
        const data = d.data();
        return {
          id: d.id,
          ...data,
          grad: data.grad || gradForId(d.id),
          photos: data.photos || [],
          interests: data.interests || [],
          partner: data.partner || [],
        };
      }));
      setLoading(false);
    }));

    unsubs.push(db.collection('offers').onSnapshot(s => {
      setOffers(s.docs.map(d => ({ id: d.id, ...d.data() })));
    }));

    unsubs.push(db.collection('users').onSnapshot(s => {
      const mm = {};
      s.docs.forEach(d => { mm[d.id] = { id: d.id, ...d.data() }; });
      setMatchmakers(mm);
    }));

    unsubs.push(db.collection('config').doc('texts').onSnapshot(d => {
      if (d.exists) setTexts(d.data());
    }));

    unsubs.push(db.collection('config').doc('lists').onSnapshot(d => {
      if (d.exists) setLists(d.data());
    }));

    const notifUnsub = db.collection('notifications')
      .where('toUid', '==', uid)
      .limit(30)
      .onSnapshot(
        s => {
          const arr = s.docs.map(d => ({ id: d.id, ...d.data() }));
          arr.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
          setNotifications(arr);
        },
        err => console.warn('notifications listener error (index may be missing):', err.message)
      );
    unsubs.push(notifUnsub);

    return () => unsubs.forEach(u => u());
  }, [uid]);

  // CRUD helpers
  const addCandidate = useCallback(async (data) => {
    const ref = await db.collection('candidates').add({
      ...data,
      mmId: uid,
      mine: true,
      available: true,
      photos: [],
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    return ref.id;
  }, [uid]);

  const updateCandidate = useCallback((id, data) =>
    db.collection('candidates').doc(id).update(data), []);

  const deleteCandidate = useCallback((id) =>
    db.collection('candidates').doc(id).delete(), []);

  const uploadPhoto = useCallback(async (candidateId, file) => {
    const ext  = file.name.split('.').pop();
    const path = `candidates/${candidateId}/${Date.now()}.${ext}`;
    const ref  = storage.ref(path);
    await ref.put(file);
    const url = await ref.getDownloadURL();
    await db.collection('candidates').doc(candidateId).update({
      photos: firebase.firestore.FieldValue.arrayUnion(url),
    });
    return url;
  }, []);

  const addOffer = useCallback((data) =>
    db.collection('offers').add({
      ...data,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    }), []);

  const updateOffer = useCallback((id, data) =>
    db.collection('offers').doc(id).update(data), []);

  const updateText = useCallback((key, value) =>
    db.collection('config').doc('texts').set({ [key]: value }, { merge: true }), []);

  const setUserAdmin = useCallback((targetUid, isAdmin) =>
    db.collection('users').doc(targetUid).update({ isAdmin }), []);

  const updateList = useCallback((key, value) =>
    db.collection('config').doc('lists').set({ [key]: value }, { merge: true }), []);

  const markNotificationRead = useCallback((id) =>
    db.collection('notifications').doc(id).update({ read: true }), []);

  const approveCandidate = useCallback((candidateId) =>
    db.collection('candidates').doc(candidateId).update({ pendingApproval: false }), []);

  return {
    candidates, offers, matchmakers, texts, lists, notifications, loading,
    addCandidate, updateCandidate, deleteCandidate,
    uploadPhoto, addOffer, updateOffer, updateText, setUserAdmin, updateList,
    markNotificationRead, approveCandidate,
  };
}

async function createInvitation(mmId, mmName, flow) {
  const token = Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
  await db.collection('invitations').doc(token).set({
    mmId, mmName, flow,
    status: 'pending',
    candidateId: null, candidateUid: null, candidateName: null,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
  });

}

// findCand / findMm that work with context data
function useFinders() {
  const { candidates, matchmakers } = useContext(DataCtx);
  const findCand = (id) => candidates.find(c => c.id === id);
  const findMm   = (id) => matchmakers[id] || { id, name: '—', grad: ['#ccc','#999'] };
  return { findCand, findMm };
}

const AV_GRADS = [
  ['#FFD7B5', '#E8547A'], ['#C9A96E', '#8C6B3D'], ['#A8D8C0', '#3E8E73'],
  ['#B9C5FF', '#6A5ACD'], ['#FFC4D6', '#C0436B'], ['#FFE3A3', '#C9A96E'],
  ['#D6B8FF', '#7B4B8A'], ['#BDE0FE', '#4A7FB5'], ['#FFB5A7', '#E0533F'],
];
function gradForId(id) {
  if (!id) return AV_GRADS[0];
  let h = 0; for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) & 0xffff;
  return AV_GRADS[h % AV_GRADS.length];
}

// ── Button ─────────────────────────────────────────────────────
function Btn({ children, onClick, th, variant = 'primary', full, icon, size = 'm', disabled, style }) {
  const pad = size === 'l' ? '15px 22px' : size === 's' ? '8px 14px' : '12px 18px';
  const fs = size === 'l' ? 17 : size === 's' ? 13.5 : 15.5;
  const styles = {
    primary: { background: th.primary, color: '#fff', boxShadow: `0 8px 20px ${alpha(th.primary, 0.32)}` },
    dark:    { background: th.ink, color: th.cream },
    gold:    { background: th.gold, color: '#fff' },
    ghost:   { background: 'transparent', color: th.ink, boxShadow: `inset 0 0 0 1.5px ${alpha(th.ink, 0.18)}` },
    soft:    { background: alpha(th.primary, 0.12), color: th.primary },
    success: { background: th.success, color: '#fff' },
  };
  return (
    <button onClick={disabled ? undefined : onClick} style={{
      ...styles[variant], border: 'none', borderRadius: th.r, padding: pad,
      fontFamily: th.display, fontWeight: variant === 'ghost' ? 700 : 800, fontSize: fs,
      cursor: disabled ? 'not-allowed' : 'pointer', opacity: disabled ? 0.45 : 1,
      width: full ? '100%' : undefined, display: 'inline-flex', alignItems: 'center',
      justifyContent: 'center', gap: 8, transition: 'transform .12s, box-shadow .2s',
      ...style,
    }}
    onMouseDown={(e) => e.currentTarget.style.transform = 'scale(0.97)'}
    onMouseUp={(e) => e.currentTarget.style.transform = 'scale(1)'}
    onMouseLeave={(e) => e.currentTarget.style.transform = 'scale(1)'}

// ── AI score ring ──────────────────────────────────────────────
function ScoreRing({ score, th, size = 54 }) {
  const r = (size - 6) / 2, c = 2 * Math.PI * r;
  const col = score >= 80 ? th.success : score >= 70 ? th.gold : alpha(th.ink, 0.4);
  return (
    <div style={{ position: 'relative', width: size, height: size, flexShrink: 0 }}>
      <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={alpha(th.ink, 0.1)} strokeWidth="4" />
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={col} strokeWidth="4"
          strokelinecap="round" strokeDasharray={c} strokeDashoffset={c * (1 - score / 100)}
          style={{ transition: 'stroke-dashoffset .8s ease' }} />
      </svg>
      <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', lineHeight: 1 }}>
        <span style={{ fontFamily: th.display, fontWeight: 800, fontSize: size * 0.3, color: th.ink }}>{score}</span>
        <span style={{ fontFamily: th.body, fontSize: size * 0.16, color: alpha(th.ink, 0.5) }}>%</span>
      </div>
    </div>
  );
}

      {children}

const inputBase = (th) => ({
  width: '100%', boxSizing: 'border-box', border: `1.5px solid ${alpha(th.ink, 0.14)}`,

});
function TextInput({ value, onChange, th, placeholder, type = 'text' }) {
  return <input type={type} value={value || ''} placeholder={placeholder}
    onChange={(e) => onChange?.(e.target.value)} style={inputBase(th)} />;
}
function TextArea({ value, onChange, th, placeholder, rows = 3 }) {
  return <textarea rows={rows} value={value || ''} placeholder={placeholder}
    onChange={(e) => onChange?.(e.target.value)} style={{ ...inputBase(th), resize: 'none', lineHeight: 1.5 }} />;
}
function Select({ value, onChange, options, th, placeholder }) {

    <div style={{ position: 'relative' }}>
      <select value={value || ''} onChange={(e) => onChange?.(e.target.value)} style={{
        ...inputBase(th), appearance: 'none', WebkitAppearance: 'none', paddingLeft: 38,

}
function Segmented({ value, onChange, options, th }) {
  return (
    <div style={{ display: 'flex', gap: 8 }}>

}
function MultiChips({ value = [], onChange, options, th, tone }) {
  const toggle = (o) => onChange?.(value.includes(o) ? value.filter(x => x !== o) : [...value, o]);
  return (
    <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>

// ── Multi-photo gallery (placeholders until real photos uploaded) ──
function galleryGrad(c, i) {
  const base = AV_GRADS.indexOf(c.grad);
  if (i === 0 && base >= 0) return c.grad;
  const idx = ((base >= 0 ? base : 0) + i * 3) % AV_GRADS.length;
  return AV_GRADS[idx];
}

function PhotoGallery({ c, th, height = 360, radius = 0, children }) {
  const [idx, setIdx] = useStateUI(0);
  const startX = React.useRef(0);
  const photos = c.photos || [];
  const n = Math.max(photos.length, c.photoCount || 1);
  const clamp = (i) => Math.max(0, Math.min(n - 1, i));

  return (
    <div style={{ position: 'relative', height, overflow: 'hidden', borderRadius: radius, background: th.ink, touchAction: 'pan-y' }}
      onPointerDown={(e) => { startX.current = e.clientX; }}
      onPointerUp={(e) => { const d = e.clientX - startX.current; if (d > 40) setIdx(i => clamp(i - 1)); else if (d < -40) setIdx(i => clamp(i + 1)); }}>
      {/* sliding track (LTR internally) */}
      <div style={{ display: 'flex', height: '100%', width: `${n * 100}%`, direction: 'ltr', transform: `translateX(-${idx * (100 / n)}%)`, transition: 'transform .38s cubic-bezier(.4,0,.2,1)' }}>
        {Array.from({ length: n }).map((_, i) => {
          const g = galleryGrad(c, i);
          return (
            <div key={i} style={{ width: `${100 / n}%`, height: '100%', flexShrink: 0, position: 'relative' }}>
              {photos[i]
                ? <img src={photos[i]} alt="" style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />
                : <div style={{ width: '100%', height: '100%', background: `linear-gradient(155deg, ${g[0]}, ${g[1]})`, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                    <span style={{ fontFamily: th.display, fontSize: height * 0.4, color: 'rgba(255,255,255,0.32)', fontWeight: 800 }}>{c.name.charAt(0)}</span>
                  </div>}
            </div>
          );
        })}
      </div>

      {/* overlay content (scrim, name, status) */}
      {children}

      {/* arrows */}
      {n > 1 && (
        <>
          {idx > 0 && <button onClick={() => setIdx(i => clamp(i - 1))} style={galleryArrow(th, 'right')}><Icon name="chevR" size={20} /></button>}
          {idx < n - 1 && <button onClick={() => setIdx(i => clamp(i + 1))} style={galleryArrow(th, 'left')}><Icon name="chevL" size={20} /></button>}
        </>
      )}

      {/* dots + counter */}
      {n > 1 && (
        <div style={{ position: 'absolute', top: 58, left: '50%', transform: 'translateX(-50%)', zIndex: 6, display: 'flex', alignItems: 'center', gap: 6, background: alpha(th.ink, 0.32), backdropFilter: 'blur(6px)', borderRadius: 999, padding: '5px 9px' }}>
          {Array.from({ length: n }).map((_, i) => (
            <span key={i} onClick={() => setIdx(i)} style={{ width: i === idx ? 16 : 6, height: 6, borderRadius: 99, background: i === idx ? '#fff' : 'rgba(255,255,255,0.5)', transition: 'all .25s', cursor: 'pointer' }} />
          ))}
        </div>
      )}
    </div>
  );
}
function galleryArrow(th, side) {
  return { position: 'absolute', top: '50%', [side]: 10, transform: 'translateY(-50%)', zIndex: 6, width: 36, height: 36, borderRadius: '50%', border: 'none', cursor: 'pointer', background: alpha('#ffffff', 0.82), color: th.ink, display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 2px 8px rgba(0,0,0,0.2)' };
}

// circular avatar + thumbnail strip (for the minimal card)
function AvatarGallery({ c, th, size = 120 }) {
  const [idx, setIdx] = useStateUI(0);
  const photos = c.photos || [];
  const n = Math.max(photos.length, c.photoCount || 1);
  const grad = galleryGrad(c, idx);
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 12 }}>
      <div style={{ width: size, height: size, borderRadius: '50%', overflow: 'hidden', boxShadow: `0 0 0 1.5px ${alpha(th.ink, 0.08)}, 0 18px 36px ${alpha(th.ink, 0.14)}`, background: `linear-gradient(140deg, ${grad[0]}, ${grad[1]})`, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
        {photos[idx]
          ? <img src={photos[idx]} alt="" style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
          : <span style={{ fontFamily: th.display, fontWeight: 800, fontSize: size * 0.42, color: '#fff' }}>{c.name.charAt(0)}</span>}
      </div>
      {n > 1 && (
        <div style={{ display: 'flex', gap: 8 }}>
          {Array.from({ length: n }).map((_, i) => {
            const g = galleryGrad(c, i);
            return (
              <button key={i} onClick={() => setIdx(i)} style={{ width: 34, height: 34, borderRadius: '50%', border: i === idx ? `2px solid ${th.primary}` : `2px solid transparent`, padding: 0, cursor: 'pointer', overflow: 'hidden', background: `linear-gradient(140deg, ${g[0]}, ${g[1]})`, opacity: i === idx ? 1 : 0.6 }}>
                {photos[i] && <img src={photos[i]} alt="" style={{ width: '100%', height: '100%', objectFit: 'cover' }} />}
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function ListsEditor({ th, listDefs, onSave }) {
  const [editKey, setEditKey] = useState(null);
  const [items,   setItems]   = useState([]);
  const [newItem, setNewItem] = useState('');

  const startEdit = (key, live) => { setEditKey(key); setItems([...live]); setNewItem(''); };
  const removeItem = (i) => setItems(arr => arr.filter((_, idx) => idx !== i));
  const addItem = () => { const t = newItem.trim(); if (t && !items.includes(t)) { setItems(a => [...a, t]); setNewItem(''); } };

  if (editKey) {
    const def = listDefs.find(d => d.key === editKey);
    return (
      <div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 14 }}>
          <button onClick={() => setEditKey(null)} style={{ border: 'none', background: alpha(th.ink, 0.07), borderRadius: 8, width: 34, height: 34, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Icon name="back" size={18} /></button>
          <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 16, color: th.ink }}>{def.label}</div>
        </div>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: 14 }}>
          {items.map((item, i) => (
            <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 5, background: alpha(th.primary, 0.1), border: `1.5px solid ${alpha(th.primary, 0.3)}`, borderRadius: 999, padding: '6px 12px' }}>
              <span style={{ fontFamily: th.body, fontSize: 14, color: th.ink }}>{item}</span>
              <button onClick={() => removeItem(i)} style={{ border: 'none', background: 'none', cursor: 'pointer', color: alpha(th.ink, 0.4), lineHeight: 1, padding: 0, fontSize: 16 }}>×</button>
            </div>
          ))}
        </div>
        <div style={{ display: 'flex', gap: 8, marginBottom: 16 }}>
          <input value={newItem} onChange={e => setNewItem(e.target.value)} onKeyDown={e => e.key === 'Enter' && addItem()} placeholder="פריט חדש…" style={{ flex: 1, border: `1.5px solid ${alpha(th.ink,0.15)}`, borderRadius: th.rSm, padding: '10px 12px', fontFamily: th.body, fontSize: 14, outline: 'none', background: th.card, color: th.ink }} />
          <Btn th={th} size="s" onClick={addItem}>+ הוסף</Btn>
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          <Btn th={th} full onClick={async () => { await onSave(editKey, items); setEditKey(null); }}>שמור שינויים</Btn>
          <Btn th={th} variant="ghost" onClick={() => setEditKey(null)}>ביטול</Btn>
        </div>
      </div>
    );
  }

  return (
    <div>
      <div style={{ fontFamily: th.body, fontSize: 13, color: alpha(th.ink, 0.55), marginBottom: 14 }}>לחץ על רשימה לעריכה. שינויים משפיעים על כל הטפסים באפליקציה.</div>
      {listDefs.map(({ key, label, live }) => (
        <button key={key} onClick={() => startEdit(key, live)} style={{ all: 'unset', cursor: 'pointer', boxSizing: 'border-box', width: '100%', background: th.card, borderRadius: th.r, padding: '12px 14px', marginBottom: 10, boxShadow: `0 3px 10px ${alpha(th.ink,0.05)}`, display: 'flex', alignItems: 'center', gap: 10 }}>
          <div style={{ flex: 1 }}>
            <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 14, color: th.ink, marginBottom: 4 }}>{label}</div>
            <div style={{ fontFamily: th.body, fontSize: 12, color: alpha(th.ink, 0.5) }}>{live.slice(0,5).join(' · ')}{live.length > 5 ? ` ועוד ${live.length - 5}` : ''}</div>
          </div>
          <Icon name="edit" size={17} style={{ color: alpha(th.ink, 0.4), flexShrink: 0 }} />
        </button>
      ))}
    </div>
  );
}

  const updateSeedPhotos = async () => {
    setUpdatingPhotos(true);
    try {
      const snap = await db.collection('candidates').get();
      const batch = db.batch();
      snap.docs.forEach(doc => {
        const d = doc.data();

      await batch.commit();

                  ? <CandidateForm th={th} initial={c} onSave={async (data) => { await updateCandidate(c.id, data); setEditCand(null); go('candidate', { id: c.id }); }} onCancel={() => setEditCand(null)} onUpload={(file) => uploadPhoto(c.id, file)} />
                  : (
                    <>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8 }}>
                        <Avatar grad={gradForId(c.id)} name={c.name} size={44} photo={c.photos?.[0]} />

                          <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 15, color: th.ink }}>{c.name}, {c.age}</div>
                          <div style={{ fontFamily: th.body, fontSize: 12, color: alpha(th.ink, 0.5) }}>{c.region} · {c.religiosity}</div>
                        </div>
                        <button onClick={() => setEditCand(c.id)} style={{ border: 'none', background: alpha(th.ink, 0.06), color: th.ink, borderRadius: 8, width: 34, height: 34, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Icon name="edit" size={17} /></button>
                        <button onClick={() => { if (confirm('למחוק?')) deleteCandidate(c.id); }} style={{ border: 'none', background: alpha(th.error, 0.08), color: th.error, borderRadius: 8, width: 34, height: 34, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Icon name="trash" size={17} /></button>
                      </div>
                      {c.photos?.length > 0 && (
                        <div style={{ display: 'flex', gap: 6, overflowX: 'auto' }}>
                          {c.photos.map((url, i) => <img key={i} src={url} alt="" style={{ width: 56, height: 56, borderRadius: 8, objectFit: 'cover', flexShrink: 0 }} />)}
                        </div>
                      )}
                    </>
                  )}
              </div>
            ))}
          </>
        )}

        {/* ── LISTS ── */}
        {tab === 'lists' && (() => {
          const liveRegions       = (lists.regions       && lists.regions.length)       ? lists.regions       : REGIONS;
          const liveReligiosity   = (lists.religiosity    && lists.religiosity.length)   ? lists.religiosity   : RELIGIOSITY;
          const liveInterests     = (lists.interests      && lists.interests.length)     ? lists.interests     : INTERESTS;
          const livePartnerTraits = (lists.partnerTraits  && lists.partnerTraits.length) ? lists.partnerTraits : PARTNER_TRAITS;

          const listDefs = [
            { key: 'interests',     label: 'תחומי עניין',       live: liveInterests },
            { key: 'partnerTraits', label: 'חשוב בפרטנר',       live: livePartnerTraits },
            { key: 'religiosity',   label: 'קרבה לדת',          live: liveReligiosity },
            { key: 'regions',       label: 'אזורים',             live: liveRegions },
          ];

          return (
            <ListsEditor th={th} listDefs={listDefs} onSave={(key, val) => updateList(key, val)} />
          );
        })()}

        {/* ── TEXTS (CMS) ── */}
        {tab === 'texts' && (
          <>
            <div style={{ fontFamily: th.body, fontSize: 13, color: alpha(th.ink, 0.55), marginBottom: 14 }}>עריכת טקסטים קבועים באפליקציה. לחץ על טקסט לעריכה.</div>
            {Object.entries(TEXT_KEYS).map(([key, label]) => (
              <div key={key} style={{ background: th.card, borderRadius: th.r, padding: 12, marginBottom: 8, boxShadow: `0 3px 10px ${alpha(th.ink, 0.05)}` }}>
                <div style={{ fontFamily: th.body, fontSize: 11, color: th.gold, fontWeight: 700, marginBottom: 4 }}>{label}</div>
                {editKey === key ? (
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                    <textarea value={editVal} onChange={e => setEditVal(e.target.value)} rows={2} style={{ width: '100%', borderRadius: 8, border: `1.5px solid ${alpha(th.ink,0.15)}`, padding: '8px 10px', fontFamily: th.body, fontSize: 14, resize: 'none', outline: 'none' }} />
                    <div style={{ display: 'flex', gap: 8 }}>
                      <Btn th={th} size="s" onClick={async () => { await updateText(key, editVal); setEditKey(null); }}>שמור</Btn>
                      <Btn th={th} size="s" variant="ghost" onClick={() => setEditKey(null)}>ביטול</Btn>
                    </div>
                  </div>
                ) : (
                  <button onClick={() => { setEditKey(key); setEditVal(texts[key] || DEFAULT_TEXTS[key] || ''); }} style={{ all: 'unset', cursor: 'pointer', display: 'block', width: '100%', fontFamily: th.body, fontSize: 14, color: th.ink, lineHeight: 1.4 }}>
                    {texts[key] || DEFAULT_TEXTS[key] || <span style={{ color: alpha(th.ink, 0.35) }}>(ריק)</span>}
                  </button>
                )}
              </div>
            ))}
          </>
        )}

        {/* ── USERS ── */}
        {tab === 'users' && Object.values(matchmakers).map(u => (
          <div key={u.id} style={{ background: th.card, borderRadius: th.r, padding: 12, marginBottom: 8, display: 'flex', alignItems: 'center', gap: 10, boxShadow: `0 3px 10px ${alpha(th.ink, 0.05)}` }}>

            <div style={{ flex: 1, minWidth: 0 }}>

          </div>
        ))}
      </div>
    </div>
  );
}

function CandidateForm({ th, initial, onSave, onCancel, onUpload }) {
  const { lists } = useContext(DataCtx);
  const liveRegions      = (lists.regions      && lists.regions.length)      ? lists.regions      : REGIONS;
  const liveReligiosity  = (lists.religiosity   && lists.religiosity.length)  ? lists.religiosity  : RELIGIOSITY;
  const liveInterests    = (lists.interests     && lists.interests.length)    ? lists.interests    : INTERESTS;
  const livePartnerTraits = (lists.partnerTraits && lists.partnerTraits.length) ? lists.partnerTraits : PARTNER_TRAITS;

  const [step, setStep] = useState(0);
  const [f, setF] = useState(initial || { name:'', age:'', gender:'אשה', region:'', religiosity:'', family:'רווק/ה', kids:0, sabaBut:'', oneLine:'', seesWith:'', interests:[], partner:[], discrete:'', available:true });
  const set = (k) => (v) => setF(s => ({ ...s, [k]: v }));
  const [uploading, setUploading] = useState(false);
  const [uploadedCount, setUploadedCount] = useState((initial?.photos || []).length);

  const steps = onUpload
    ? ['פרטים בסיסיים', 'אישיות', 'תחומי עניין', 'תמונות ופרטים']
    : ['פרטים בסיסיים', 'אישיות', 'תחומי עניין', 'פרטים נוספים'];

  const isLast = step === steps.length - 1;

  const StepDots = () => (
    <div style={{ display: 'flex', justifyContent: 'center', gap: 6, marginBottom: 18 }}>
      {steps.map((s, i) => (
        <div key={i} onClick={() => i < step && setStep(i)} style={{ width: i === step ? 22 : 8, height: 8, borderRadius: 999, background: i === step ? th.primary : i < step ? alpha(th.primary, 0.4) : alpha(th.ink, 0.15), cursor: i < step ? 'pointer' : 'default', transition: 'all 0.2s' }} />
      ))}
    </div>
  );

  return (
    <div style={{ background: alpha(th.ink, 0.03), borderRadius: th.r, padding: 16, marginBottom: 12, border: `1.5px solid ${alpha(th.ink,0.1)}` }}>
      <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 15, color: th.ink, marginBottom: 10, textAlign: 'center' }}>
        {steps[step]}
      </div>
      <StepDots />

      {step === 0 && (
        <>
          <Field th={th} label="שם"><TextInput th={th} value={f.name} onChange={set('name')} /></Field>
          <Field th={th} label="גיל"><TextInput th={th} type="number" value={f.age} onChange={v => setF(s => ({...s, age: +v}))} /></Field>
          <Field th={th} label="מין"><Segmented th={th} value={f.gender} onChange={set('gender')} options={['אשה', 'גבר']} /></Field>
          <Field th={th} label="אזור"><Select th={th} value={f.region} onChange={set('region')} options={liveRegions} /></Field>
          <Field th={th} label="קרבה לדת"><Select th={th} value={f.religiosity} onChange={set('religiosity')} options={liveReligiosity} /></Field>
        </>
      )}

      {step === 1 && (
        <>
          <Field th={th} label="סבבה והכל, אבל…" hint='למשל: "שואל את גוגל Maps כשהוא יודע בדיוק לאן הוא הולך"'>
            <TextArea th={th} value={f.sabaBut} onChange={set('sabaBut')} placeholder='משהו אמיתי ומצחיק שמאפיין אותו/ה…' rows={2} />
          </Field>
          <Field th={th} label="במשפט אחד"><TextInput th={th} value={f.oneLine} onChange={set('oneLine')} placeholder='הגדרה קצרה של האדם…' /></Field>
          <Field th={th} label="רואה את עצמו/ה עם">
            <TextArea th={th} value={f.seesWith} onChange={set('seesWith')} placeholder='תאר/י את הזוגיות שהוא/היא מדמיין/ת לעצמו/ה…' rows={3} />
          </Field>
        </>
      )}

      {step === 2 && (
        <>
          <Field th={th} label="תחומי עניין">
            <MultiChips th={th} value={f.interests} onChange={v => setF(s => ({...s, interests: v}))} options={liveInterests} tone={th.primary} />
          </Field>
          <Field th={th} label="חשוב בפרטנר">
            <MultiChips th={th} value={f.partner} onChange={v => setF(s => ({...s, partner: v}))} options={livePartnerTraits} tone={th.gold} />
          </Field>
        </>
      )}

      {step === 3 && (
        <>
          <Field th={th} label="פרטים דיסקרטיים" hint="גלוי לך בלבד — שדכנים אחרים לא יראו שדה זה">
            <TextArea th={th} value={f.discrete} onChange={set('discrete')} rows={3} placeholder='מידע רגיש שחשוב לדעת…' />
          </Field>
          {onUpload && (
            <div style={{ marginBottom: 12 }}>
              <div style={{ fontFamily: th.body, fontWeight: 700, fontSize: 14, marginBottom: 2, color: th.ink }}>העלאת תמונות</div>
              <div style={{ fontFamily: th.body, fontSize: 12, color: alpha(th.ink, 0.5), marginBottom: 8 }}>ניתן להעלות מספר תמונות · מומלץ תמונות מאונכות באיכות טובה{uploadedCount > 0 ? ` · ${uploadedCount} הועלו` : ''}</div>
              <input type="file" accept="image/*" multiple onChange={async (e) => {
                const files = Array.from(e.target.files);
                if (!files.length) return;
                setUploading(true);
                for (const file of files) { await onUpload(file); setUploadedCount(c => c + 1); }
                setUploading(false);
              }} />
              {uploading && <div style={{ fontFamily: th.body, fontSize: 12, color: th.gold, marginTop: 4 }}>מעלה…</div>}
            </div>
          )}
        </>
      )}

      <div style={{ display: 'flex', gap: 8, marginTop: 16 }}>
        {step > 0
          ? <Btn th={th} variant="ghost" onClick={() => setStep(s => s - 1)}>← חזרה</Btn>
          : <Btn th={th} variant="ghost" onClick={onCancel}>ביטול</Btn>
        }
        {isLast
          ? <Btn th={th} full onClick={() => onSave(f)}>שמור</Btn>
          : <Btn th={th} full onClick={() => setStep(s => s + 1)}>הבא →</Btn>
        }
      </div>
    </div>
  );
}

// MATCHMAKER REGISTRATION
// ════════════════════════════════════════════════════════════
function Register({ th, go }) {
  const { user } = useContext(AuthCtx);
  const { lists } = useContext(DataCtx);
  const liveRegions = (lists.regions && lists.regions.length) ? lists.regions : REGIONS;
  const [f, setF] = useS({ name: '', phone: '', region: '', gender: '', bio: '' });
  const [photoURL, setPhotoURL] = useS('');
  const [uploading, setUploading] = useS(false);
  const [saving, setSaving] = useS(false);
  const set = (k) => (v) => setF(s => ({ ...s, [k]: v }));
  const valid = f.name && f.phone && f.region && f.gender;

  const handlePhoto = async (e) => {
    const file = e.target.files[0];
    if (!file || !user) return;
    setUploading(true);
    try {
      const ref = storage.ref(`profiles/${user.uid}/${Date.now()}_${file.name}`);
      await ref.put(file);
      const url = await ref.getDownloadURL();
      setPhotoURL(url);
    } catch(err) { alert('שגיאה בהעלאת תמונה: ' + err.message); }
    setUploading(false);
  };

  const handleSave = async () => {
    if (!valid || !user) return;
    setSaving(true);
    try {
      await db.collection('users').doc(user.uid).update({
        displayName: f.name,
        phone: f.phone,
        region: f.region,
        gender: f.gender,
        bio: f.bio,
        ...(photoURL ? { photoURL } : {}),
        profileComplete: true,
      });
      go('home');
    } catch(err) { alert('שגיאה: ' + err.message); setSaving(false); }
  };

  return (
    <>
      <AppHeader th={th} title="נעים להכיר" sub="כמה פרטים ונצא לדרך" onBack={() => go('onboarding')} />
      <div style={{ flex: 1, overflowY: 'auto', padding: '18px 18px 30px' }}>

          <label style={{ cursor: 'pointer' }}>
            <input type="file" accept="image/*" style={{ display: 'none' }} onChange={handlePhoto} />
            {photoURL
              ? <img src={photoURL} alt="" style={{ width: 108, height: 108, borderRadius: '50%', objectFit: 'cover', border: `3px solid ${th.primary}` }} />
              : <div style={{ width: 108, height: 108, borderRadius: '50%', background: alpha(th.primary, 0.1), border: `2px dashed ${alpha(th.ink, 0.25)}`, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 6, color: alpha(th.ink, 0.5) }}>

                  <span style={{ fontFamily: th.body, fontSize: 12 }}>{uploading ? 'מעלה…' : 'תמונה'}</span>
                </div>}
          </label>
          <div style={{ fontFamily: th.body, fontSize: 13, color: alpha(th.ink, 0.5), marginTop: 8 }}>לחץ/י להוספת תמונת פרופיל</div>
        </div>

        <Field th={th} label="שם פרטי ומשפחה" required>
          <TextInput th={th} value={f.name} onChange={set('name')} placeholder="נועה לוי" />
        </Field>
        <Field th={th} label="טלפון (לוואטסאפ)" required hint="לא יוצג למועמדים — משמש לתיאומים">
          <TextInput th={th} type="tel" value={f.phone} onChange={set('phone')} placeholder="050-0000000" />
        </Field>
        <Field th={th} label="אזור מגורים" required>
          <Select th={th} value={f.region} onChange={set('region')} options={liveRegions} />
        </Field>
        <Field th={th} label="מין" required>
          <Segmented th={th} value={f.gender} onChange={set('gender')} options={['אישה', 'גבר']} />
        </Field>
        <Field th={th} label="קצת עלייך" hint="לא חובה — אפשר להשלים מאוחר יותר בהגדרות">
          <TextArea th={th} value={f.bio} onChange={set('bio')} placeholder="שדכנית בלב, מאמינה שלכל אחד יש את הסבבה־והכל שלו…" rows={3} />
        </Field>

        <div style={{ marginTop: 8 }}>
          <Btn th={th} full size="l" disabled={!valid || saving || uploading} onClick={handleSave}>
            {saving ? 'שומר…' : 'יאללה, מתחילים'}
          </Btn>
          <div style={{ textAlign: 'center', fontFamily: th.body, fontSize: 12.5, color: alpha(th.ink, 0.45), marginTop: 12 }}>
            הרשמה פשוטה. את/ה תמיד יכול/ה להשלים פרטים בהמשך.
          </div>
        </div>
      </div>
    </>
  );
}

const { useState: useSb, useMemo: useMb } = React;

// ════════════════════════════════════════════════════════════
// CANDIDATES LIST
// ════════════════════════════════════════════════════════════
function Candidates({ th, go }) {
  const [scope, setScope] = useSb('mine'); // mine | all
  const [q, setQ] = useSb('');
  const [filterOpen, setFilterOpen] = useSb(false);
  const [addOpen, setAddOpen] = useSb(false);
  const [filters, setFilters] = useSb({ gender: '', rel: [], region: '', status: '', ageMin: 22, ageMax: 45 });

  const list = useMb(() => CANDIDATES.filter(c => {
    if (scope === 'mine' && !c.mine) return false;
    if (q && !c.name.includes(q) && !c.oneLine.includes(q)) return false;
    if (filters.gender && (filters.gender === 'נשים' ? (c.gender !== 'f' && c.gender !== 'אשה') : (c.gender !== 'm' && c.gender !== 'גבר'))) return false;
    if (filters.region && c.region !== filters.region) return false;
    if (filters.status === 'פנוי' && !c.available) return false;
    if (filters.status === 'תפוס' && c.available) return false;
    if (filters.rel.length && !filters.rel.includes(c.religiosity)) return false;
    if (c.age < filters.ageMin || c.age > filters.ageMax) return false;
    return true;
  }), [scope, q, filters]);

  const activeFilters = (filters.gender ? 1 : 0) + (filters.region ? 1 : 0) + (filters.status ? 1 : 0) + filters.rel.length;

  return (
    <>
      <AppHeader th={th} title="מועמדים" sub={`${list.length} ברשימה`} action={
        <button onClick={() => setFilterOpen(true)} style={{ position: 'relative', border: 'none', background: th.card, width: 42, height: 42, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: th.ink, cursor: 'pointer', boxShadow: '0 2px 8px rgba(0,0,0,0.07)' }}>
          <Icon name="filter" size={21} />
          {activeFilters > 0 && <span style={{ position: 'absolute', top: -3, left: -3, background: th.primary, color: '#fff', borderRadius: '50%', minWidth: 18, height: 18, fontSize: 11, fontWeight: 800, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '0 4px' }}>{activeFilters}</span>}
        </button>
      } />

      <div style={{ flex: 1, overflowY: 'auto', padding: '8px 18px 90px', position: 'relative' }}>
        {/* search */}
        <div style={{ position: 'relative', marginBottom: 12 }}>
          <span style={{ position: 'absolute', right: 12, top: '50%', transform: 'translateY(-50%)', color: alpha(th.ink, 0.4) }}><Icon name="search" size={19} /></span>
          <input value={q} onChange={e => setQ(e.target.value)} placeholder="חיפוש מועמד…" style={{ width: '100%', boxSizing: 'border-box', padding: '11px 40px 11px 14px', borderRadius: 999, border: `1.5px solid ${alpha(th.ink, 0.12)}`, fontFamily: th.body, fontSize: 14.5, background: th.card, outline: 'none', color: th.ink }} />
        </div>

        {/* scope toggle */}
        <div style={{ display: 'flex', gap: 8, marginBottom: 14 }}>
          {[['mine', 'שלי'], ['all', 'כל המאגר']].map(([id, lbl]) => (
            <button key={id} onClick={() => setScope(id)} style={{ flex: 1, padding: '9px', borderRadius: 999, border: 'none', cursor: 'pointer', fontFamily: th.display, fontWeight: 800, fontSize: 14, background: scope === id ? th.ink : th.card, color: scope === id ? th.cream : alpha(th.ink, 0.55), boxShadow: scope === id ? 'none' : `inset 0 0 0 1.5px ${alpha(th.ink,0.1)}` }}>{lbl}</button>
          ))}
        </div>

        {/* grid */}
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
          {list.map(c => <CandCard key={c.id} c={c} th={th} onClick={() => go('candidate', { id: c.id })} />)}
        </div>
        {list.length === 0 && (
          <div style={{ textAlign: 'center', padding: '50px 20px', color: alpha(th.ink, 0.4) }}>
            <Icon name="search" size={40} />
            <div style={{ fontFamily: th.body, marginTop: 10, fontSize: 15 }}>לא נמצאו מועמדים. נסה/י לשנות פילטרים.</div>
          </div>
        )}
      </div>

      {/* FAB */}
      <button onClick={() => setAddOpen(true)} style={{ position: 'absolute', bottom: 102, left: 20, zIndex: 30, width: 58, height: 58, borderRadius: '50%', border: 'none', background: th.primary, color: '#fff', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: `0 12px 28px ${alpha(th.primary, 0.45)}` }}>
        <Icon name="plus" size={28} />
      </button>

      <FilterSheet open={filterOpen} onClose={() => setFilterOpen(false)} th={th} filters={filters} setFilters={setFilters} />
      <AddSheet open={addOpen} onClose={() => setAddOpen(false)} th={th} go={go} />
    </>
  );
}

        <div style={{ display: 'flex', gap: 6, alignItems: 'flex-start', background: alpha(th.ink, 0.04), borderRadius: th.rSm, padding: '7px 9px' }}>
          <Logo size={15} color={th.primary} flaw={th.cream} />
          <span style={{ fontFamily: th.body, fontSize: 11.5, fontWeight: 600, color: th.ink, lineHeight: 1.25, textWrap: 'pretty' }}>{c.sabaBut}</span>
        </div>
      </div>
    </button>

function FilterSheet({ open, onClose, th, filters, setFilters }) {
  const { lists } = useContext(DataCtx);
  const liveRegions     = (lists.regions     && lists.regions.length)     ? lists.regions     : REGIONS;
  const liveReligiosity = (lists.religiosity  && lists.religiosity.length) ? lists.religiosity : RELIGIOSITY;
  const set = (k, v) => setFilters(s => ({ ...s, [k]: v }));
  return (
    <Sheet open={open} onClose={onClose} th={th} title="פילטרים">
      <Field th={th} label="מין"><Segmented th={th} value={filters.gender} onChange={v => set('gender', filters.gender === v ? '' : v)} options={['נשים', 'גברים']} /></Field>
      <Field th={th} label="סטטוס"><Segmented th={th} value={filters.status} onChange={v => set('status', filters.status === v ? '' : v)} options={['פנוי', 'תפוס']} /></Field>
      <Field th={th} label={`טווח גיל: ${filters.ageMin}–${filters.ageMax}`}>
        <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
          <input type="range" min={20} max={60} value={filters.ageMin} onChange={e => set('ageMin', Math.min(+e.target.value, filters.ageMax))} style={{ flex: 1, accentColor: th.primary }} />
          <input type="range" min={20} max={60} value={filters.ageMax} onChange={e => set('ageMax', Math.max(+e.target.value, filters.ageMin))} style={{ flex: 1, accentColor: th.primary }} />
        </div>
      </Field>
      <Field th={th} label="אזור"><MultiChips th={th} value={filters.region ? [filters.region] : []} onChange={v => set('region', v[v.length-1] === filters.region ? '' : v[v.length-1] || '')} options={liveRegions} /></Field>
      <Field th={th} label="קרבה לדת"><MultiChips th={th} value={filters.rel} onChange={v => set('rel', v)} options={liveReligiosity} tone={th.gold} /></Field>
      <div style={{ display: 'flex', gap: 10, marginTop: 6 }}>
        <Btn th={th} variant="ghost" onClick={() => setFilters({ gender: '', rel: [], region: '', status: '', ageMin: 22, ageMax: 45 })}>נקה</Btn>
        <Btn th={th} full onClick={onClose}>הצג תוצאות</Btn>
      </div>
    </Sheet>
  );
}
