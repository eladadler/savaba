// CAND VIEW CAND — candidate reads another candidate's card
// ════════════════════════════════════════════════════════════
function CandViewCand({ th, go, params }) {
  const { candidates, matchmakers } = useContext(DataCtx);
  const { user, isImpersonating, profile } = useContext(AuthCtx);

  const c = candidates.find(x => x.id === params?.id);
  const me = candidates.find(x => x.candidateUid === user?.uid)
           || (isImpersonating ? candidates.find(x => x.id === user?.uid) : null);
  const myMms = me
    ? Object.values(matchmakers).filter(mm => mm.id === me.mmId || (me.coMms || []).includes(mm.id))
    : [];
  const myMm = myMms[0] || null;
  const myMmPhone = myMm?.phone ? String(myMm.phone).replace(/\D/g,'').replace(/^0/,'972') : '';
  const myMmFirst = myMm ? (myMm.displayName || myMm.name || 'שדכן/ית').split(' ')[0] : 'שדכן/ית';
  const theirMm = c?.mmId ? matchmakers[c.mmId] : null;
  const theirMmName = theirMm ? (theirMm.displayName || theirMm.name || 'שדכן/ית') : 'לא ידוע';

  if (!c) return (
    <div style={{ height:'100%', display:'flex', alignItems:'center', justifyContent:'center', background:th.cream }}>
      <div style={{ textAlign:'center', color:alpha(th.ink,0.5), fontFamily:th.body }}>לא נמצא מועמד/ת</div>
    </div>
  );

  const candUrl = window.location.origin + window.location.pathname + '#cand/' + c.id;
  const myName = me?.name || profile?.displayName || me?.displayName || '';
  const isFemG = g => g === 'f' || g === 'אשה' || g === 'אישה';
  const meIsFem      = isFemG(me?.gender || profile?.gender || '');
  const myMmGender   = myMm?.gender || '';
  const myMmIsFem    = myMmGender ? isFemG(myMmGender) : null;   // null = unknown
  const theirMmGndr  = theirMm?.gender || '';
  const theirMmIsFem = theirMmGndr ? isFemG(theirMmGndr) : null;
  const cIsFem       = isFemG(c.gender);
  const waInterested = meIsFem ? 'מעוניינת' : 'מעוניין';
  const waMmCan      = myMmIsFem === null ? 'תוכל/י' : myMmIsFem ? 'תוכלי' : 'תוכל';
  const waTheirTitle = theirMmIsFem === null ? 'שדכן/ית' : theirMmIsFem ? 'שדכנית' : 'שדכן';
  const waCandPoss   = cIsFem ? 'שלה' : 'שלו';
  const waMsg = `היי ${myMmFirst},\n\nזה אני, ${myName}.\nראיתי את הפרופיל של ${c.name} ואני מאוד ${waInterested} לברר התאמה.\nאשמח אם ${waMmCan} לפנות ל${waTheirTitle} ${waCandPoss} (${theirMmName}).\n\nקישור לכרטיסייה:\n${candUrl}`;
  const waUrl = myMmPhone ? `https://wa.me/${myMmPhone}?text=${encodeURIComponent(waMsg)}` : null;

  return (
    <div style={{ height:'100%', display:'flex', flexDirection:'column', background:th.cream, position:'relative' }}>
      <div style={{ paddingTop:50, paddingInline:18, paddingBottom:12, flexShrink:0, display:'flex', alignItems:'center', gap:12, background:`linear-gradient(160deg,${tint(th.primary,0.85)},${th.cream})` }}>
        <button onClick={() => go('back')}
          style={{ width:38, height:38, borderRadius:'50%', border:'none', background:alpha('#fff',0.7), color:th.ink, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
          <Icon name="back" size={20} />
        </button>
        <div style={{ fontFamily:th.display, fontWeight:800, fontSize:19, color:th.ink }}>{c.name}</div>
      </div>
      <div style={{ flex:1, overflowY:'auto', paddingBottom:90 }}>
        <PhotoGallery c={c} th={th} height={320}>
          <div style={{ position:'absolute', bottom:0, left:0, right:0, height:110, background:`linear-gradient(to top,${alpha(th.ink,0.75)},transparent)`, pointerEvents:'none' }} />
          <div style={{ position:'absolute', bottom:16, right:18, color:'#fff', pointerEvents:'none' }}>
            <div style={{ fontFamily:th.display, fontSize:26, fontWeight:800, lineHeight:1 }}>{c.name}{c.age ? `, ${c.age}` : ''}</div>
            <div style={{ fontFamily:th.body, fontSize:13.5, opacity:0.9, marginTop:4 }}>{c.region}{c.religiosity ? ` · ${c.religiosity}` : ''}</div>
          </div>
          {c.voiceNote && <VoiceNotePlayer url={c.voiceNote} th={th} fab />}
        </PhotoGallery>
        <div style={{ padding:'18px 18px 0' }}>
          {c.sabaBut && <div style={{ marginBottom:14 }}><SabaBadge th={th} text={c.sabaBut} /></div>}
          {c.oneLine && <p style={{ fontFamily:th.body, fontSize:15, color:alpha(th.ink,0.78), lineHeight:1.6, margin:'0 0 16px' }}>{c.oneLine}</p>}
          <div style={{ display:'flex', flexWrap:'wrap', gap:8, marginBottom:18 }}>
            {[c.region, c.religiosity, c.family, c.age && `גיל ${c.age}`, c.height && `${c.height} ס"מ`].filter(Boolean).map((tag,i) => (
              <span key={i} style={{ background:alpha(th.primary,0.09), color:th.ink, borderRadius:999, padding:'5px 12px', fontFamily:th.body, fontSize:12.5, fontWeight:600 }}>{tag}</span>
            ))}
          </div>
          {c.interests && c.interests.length > 0 && (
            <div style={{ marginBottom:18 }}>
              <div style={{ fontFamily:th.display, fontWeight:800, fontSize:14, color:alpha(th.ink,0.55), marginBottom:8 }}>תחומי עניין</div>
              <div style={{ display:'flex', flexWrap:'wrap', gap:6 }}>
                {c.interests.map((int,i) => <span key={i} style={{ background:alpha(th.gold,0.12), color:alpha(th.ink,0.75), borderRadius:999, padding:'4px 11px', fontFamily:th.body, fontSize:12, fontWeight:600 }}>{int}</span>)}
              </div>
            </div>
          )}
          {theirMm && (
            <div style={{ background:alpha(th.ink,0.04), borderRadius:th.r, padding:'11px 13px', marginBottom:18, display:'flex', alignItems:'center', gap:10 }}>
              <Avatar grad={theirMm.grad || gradForId(theirMm.id || theirMm.uid || '')} name={theirMmName} size={36} photo={theirMm.photoURL} />
              <div>
                <div style={{ fontFamily:th.body, fontSize:11, color:alpha(th.ink,0.45) }}>שדכן/ית של {c.name}</div>
                <div style={{ fontFamily:th.display, fontWeight:800, fontSize:14, color:th.ink }}>{theirMmName}</div>
              </div>
            </div>
          )}
        </div>
      </div>
      <div style={{ position:'absolute', bottom:0, left:0, right:0, paddingTop:12, paddingInline:18, paddingBottom:'max(16px, env(safe-area-inset-bottom))', background:th.card, borderTop:`1px solid ${alpha(th.ink,0.08)}`, boxShadow:`0 -4px 20px ${alpha(th.ink,0.07)}` }}>
        {waUrl ? (
          <a href={waUrl} target="_blank" rel="noopener"
            style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:10, padding:'14px 0', borderRadius:th.r, background:'#25D366', color:'#fff', textDecoration:'none', fontFamily:th.display, fontWeight:800, fontSize:15, boxShadow:'0 6px 18px rgba(37,211,102,0.3)' }}>
            <Icon name="whatsapp" size={22} /> שלח/י בקשה לשדכן/ית שלי
          </a>
        ) : (
          <div style={{ textAlign:'center', fontFamily:th.body, fontSize:13, color:alpha(th.ink,0.5), padding:'10px 0' }}>
            {myMm ? 'לשדכן/ית שלך אין מספר טלפון — פנה/י אליו/ה ישירות' : 'לא נמצא/ה שדכן/ית משויך/ת'}
          </div>
        )}
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// CANDIDATE MODE — home screen for the candidate-facing app
// ════════════════════════════════════════════════════════════
function CandidateMode({ th, go }) {
  const { user, isImpersonating } = useContext(AuthCtx);
  const { candidates, offers, matchmakers, coRepRequests, lists, updateCandidate, updateOffer, deleteCandidate, reportEngagement, reportDeletion } = useContext(DataCtx);
  const { texts: _tx, defaults: _dx } = useContext(TextsCtx);
  const t = (key) => _tx[key] || _dx[key] || '';

  // Find this user's own candidate profile (also match by doc ID when admin impersonates a candidate without account)
  const me = candidates.find(c => c.candidateUid === user?.uid)
          || (isImpersonating ? candidates.find(c => c.id === user?.uid) : null);

  // Primary matchmaker first, then secondaries
  const myMms = useMemo(() => {
    if (!me) return [];
    const primary = matchmakers[me.mmId] ? [matchmakers[me.mmId]] : [];
    const secondaries = (me.coMms || []).map(id => matchmakers[id]).filter(Boolean);
    return [...primary, ...secondaries];
  }, [me, matchmakers]);

  // All active offers for this candidate
  const myOffers = useMemo(() => {
    if (!me) return [];
    return offers.filter(o => {
      if (o.status === 'נדחתה') return false;
      // Show offer to candidate only after both matchmakers approved (status = 'אושרה')
      if (o.status !== 'אושרה') return false;
      return o.aId === me.id || o.bId === me.id;
    });
  }, [me, offers]);

  // Co-rep requests — loaded in DataCtx, deduplicated by requesting matchmaker
  const coRepReqs = useMemo(() => {
    if (!me?.id) return [];
    const seen = new Set();
    return coRepRequests.filter(r => {
      if (r.candId !== me.id && r.candidateUid !== me.candidateUid) return false;
      const mmKey = r.mmId || r.fromMmId;
      if (seen.has(mmKey)) return false;
      seen.add(mmKey);
      return true;
    });
  }, [coRepRequests, me?.id, me?.candidateUid]);

  const [offerIdx, setOfferIdx] = useSe(0);
  const [candTab, setCandTab] = useSb('home');
  const [browseSeen, setBrowseSeen] = useState(() => localStorage.getItem('candBrowseSeen') === '1');
  const markBrowseSeen = () => { localStorage.setItem('candBrowseSeen', '1'); setBrowseSeen(true); };

  // Delete flow
  const [deleteModal, setDeleteModal] = useState(false); // false | 'reason' | 'confirm'
  const [deleteReason, setDeleteReason] = useState('');
  const [deleteNote, setDeleteNote] = useState('');
  const [deleting, setDeleting] = useState(false);

  // Engagement flow
  const [engageModal, setEngageModal] = useState(false); // false | 'source' | 'pick' | 'confirm' | 'done'
  const [engageSource, setEngageSource] = useState(null); // 'app' | 'other'
  const [engageOfferId, setEngageOfferId] = useState(null);
  const [engaging, setEngaging] = useState(false);

  const DEFAULT_DELETE_REASONS = ['מצאתי בן/בת זוג בדרך אחרת', 'אין לי זמן כרגע', 'לא מרוצה מהשירות', 'לוקח/ת הפסקה', 'אחר'];
  const deleteReasons = (lists?.deleteReasons?.length) ? lists.deleteReasons : DEFAULT_DELETE_REASONS;

  // Clamp index when offers list changes
  const safeIdx = Math.min(offerIdx, Math.max(0, myOffers.length - 1));
  const currentOffer = myOffers[safeIdx] || null;
  const iAmA = currentOffer ? currentOffer.aId === me?.id : false;
  const otherCandId = currentOffer ? (iAmA ? currentOffer.bId : currentOffer.aId) : null;
  const otherCand = otherCandId ? candidates.find(c => c.id === otherCandId) : null;

  const toggleAvailable = async () => {
    if (!me) return;
    await updateCandidate(me.id, { available: !me.available });
  };

  const declineOffer = async () => {
    if (!currentOffer) return;
    if (iAmA) await updateOffer(currentOffer.id, { candAStatus: 'דחה', status: 'נדחתה' });
    else       await updateOffer(currentOffer.id, { candBStatus: 'דחה', status: 'נדחתה' });
  };

  const approveCoRep = async (req) => {
    const representingMmId = req.mmId || req.fromMmId;
    await db.collection('candidates').doc(req.candId)
      .update({ coMms: firebase.firestore.FieldValue.arrayUnion(representingMmId) });
    await db.collection('coRepRequests').doc(req.id)
      .update({ status: 'accepted', resolvedAt: firebase.firestore.FieldValue.serverTimestamp() });
    await db.collection('notifications').add({
      toUid: representingMmId, type: 'corep_approved',
      candId: req.candId, candName: req.candName,
      read: false, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
  };

  const declineCoRep = async (req) => {
    await db.collection('coRepRequests').doc(req.id)
      .update({ status: 'declined', resolvedAt: firebase.firestore.FieldValue.serverTimestamp() });
  };

  const cancelCoRep = async (mmId) => {
    await db.collection('candidates').doc(me.id)
      .update({ coMms: firebase.firestore.FieldValue.arrayRemove(mmId) });
  };

  // No candidate profile found
  if (!me) {
    return (
      <div style={{ height:'100%', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', background:th.cream, padding:32, textAlign:'center', direction:'rtl' }}>
        <div style={{ fontSize:48, marginBottom:16 }}>🔍</div>
        <div style={{ fontFamily:th.display, fontWeight:800, fontSize:20, color:th.ink, marginBottom:8 }}>לא נמצאה כרטיסיית מועמד/ת</div>
        <div style={{ fontFamily:th.body, fontSize:14, color:alpha(th.ink,0.6), lineHeight:1.6, maxWidth:280, marginBottom:24 }}>
          כדי להיכנס למצב מועמד/ת צריך לקבל הזמנה משדכן/ית ולהצטרף דרכה.<br/>
          אם אתה/את גם שדכן/ית — ייתכן שאין לך עדיין כרטיסייה.
        </div>
        <Btn th={th} variant="ghost" onClick={() => go('home')}>חזרה למצב שדכן/ית</Btn>
      </div>
    );
  }

  const browseMale = me.gender === 'גבר' || me.gender === 'm';

  const tabBar = (
    <div style={{ display:'flex', background:th.card, borderTop:`1px solid ${alpha(th.ink,0.08)}`, flexShrink:0 }}>
      {[
        {id:'home',     label:'בית',    icon:'home'},
        {id:'browse',   label: browseMale ? 'מועמדות' : 'מועמדים', icon:'users'},
        {id:'settings', label:'הגדרות', icon:'gear'},
      ].map(tab => (
        <button key={tab.id} onClick={() => { if (tab.id === 'browse') markBrowseSeen(); setCandTab(tab.id); }}
          style={{ flex:1, border:'none', background:'transparent', display:'flex', flexDirection:'column', alignItems:'center', gap:3, padding:'10px 0 8px', cursor:'pointer', color: candTab === tab.id ? th.primary : alpha(th.ink,0.45), position:'relative' }}>
          <Icon name={tab.icon} size={22} />
          <span style={{ fontFamily:th.display, fontWeight:800, fontSize:10 }}>{tab.label}</span>
          {tab.id === 'browse' && !browseSeen && (
            <span style={{ position:'absolute', top:8, right:'calc(50% - 14px)', width:8, height:8, borderRadius:'50%', background:th.primary, boxShadow:`0 0 0 2px ${th.card}` }} />
          )}
        </button>
      ))}
    </div>
  );

  if (candTab === 'browse') {
    return (
      <div style={{ height:'100%', display:'flex', flexDirection:'column', background:th.cream }}>
        <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden' }}>
          <CandBrowse th={th} go={go} me={me} />
        </div>
        {tabBar}
      </div>
    );
  }

  // ── Settings tab ──────────────────────────────────────────────
  if (candTab === 'settings') {
    const engagedOffer = engageOfferId ? myOffers.find(o => o.id === engageOfferId) : null;
    const engagedPartner = engagedOffer ? candidates.find(c => c.id === (engagedOffer.aId === me.id ? engagedOffer.bId : engagedOffer.aId)) : null;

    const doDelete = async () => {
      setDeleting(true);
      try {
        await reportDeletion({ candidateId: me.id, candName: me.name, reason: deleteReason, note: deleteNote });
        await deleteCandidate(me.id);
        go('onboarding');
      } catch(e) { alert('שגיאה: ' + e.message); }
      setDeleting(false);
    };

    const doEngage = async () => {
      setEngaging(true);
      try {
        const notViaApp = engageSource === 'other';
        const engData = {
          candId: me.id, candName: me.name,
          offerId: engagedOffer?.id || null,
          partnerId: engagedPartner?.id || null,
          partnerName: engagedPartner?.name || null,
          notViaApp,
        };
        await reportEngagement(engData);
        await updateCandidate(me.id, { isEngaged: true, isHidden: true, engagedToId: engagedPartner?.id || null, engagedNotViaApp: notViaApp });
        if (engagedOffer) await db.collection('offers').doc(engagedOffer.id).update({ isEngaged: true });
        setEngageModal('done');
      } catch(e) { alert('שגיאה: ' + e.message); }
      setEngaging(false);
    };

    return (
      <div style={{ height:'100%', display:'flex', flexDirection:'column', background:th.cream }}>

        {/* ── DELETE MODAL ── */}
        {deleteModal && (
          <div style={{ position:'fixed', inset:0, zIndex:1000, background:alpha('#000',0.5), display:'flex', alignItems:'flex-end' }}
            onClick={() => { if (!deleting) setDeleteModal(false); }}>
            <div style={{ width:'100%', background:th.card, borderRadius:`24px 24px 0 0`, padding:'24px 20px 40px', direction:'rtl' }}
              onClick={e => e.stopPropagation()}>
              {deleteModal === 'reason' && (<>
                <div style={{ fontFamily:th.display, fontWeight:800, fontSize:18, color:th.ink, marginBottom:6 }}>מחיקת פרופיל</div>
                <div style={{ fontFamily:th.body, fontSize:13.5, color:alpha(th.ink,0.6), marginBottom:18, lineHeight:1.5 }}>
                  מצטערים לשמוע 😔 נשמח לדעת מה הסיבה — זה עוזר לנו להשתפר.
                </div>
                <div style={{ display:'flex', flexDirection:'column', gap:8, marginBottom:16 }}>
                  {deleteReasons.map(r => (
                    <button key={r} onClick={() => setDeleteReason(r)}
                      style={{ all:'unset', cursor:'pointer', padding:'11px 14px', borderRadius:th.r, border:`1.5px solid ${deleteReason === r ? th.error : alpha(th.ink,0.12)}`,
                        background: deleteReason === r ? alpha(th.error,0.06) : th.cream,
                        fontFamily:th.body, fontSize:14, color: deleteReason === r ? th.error : th.ink, display:'flex', alignItems:'center', gap:8 }}>
                      <div style={{ width:18, height:18, borderRadius:'50%', border:`2px solid ${deleteReason === r ? th.error : alpha(th.ink,0.25)}`, flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center' }}>
                        {deleteReason === r && <div style={{ width:8, height:8, borderRadius:'50%', background:th.error }} />}
                      </div>
                      {r}
                    </button>
                  ))}
                </div>
                <textarea value={deleteNote} onChange={e => setDeleteNote(e.target.value)} placeholder="הערה נוספת (לא חובה)..." rows={2}
                  style={{ width:'100%', boxSizing:'border-box', borderRadius:th.r, border:`1.5px solid ${alpha(th.ink,0.12)}`, padding:'10px 12px', fontFamily:th.body, fontSize:13.5, resize:'none', outline:'none', marginBottom:16 }} />
                <div style={{ display:'flex', gap:10 }}>
                  <button onClick={() => setDeleteModal(false)}
                    style={{ flex:1, padding:'13px 0', borderRadius:th.r, border:`1.5px solid ${alpha(th.ink,0.15)}`, background:'transparent', fontFamily:th.display, fontWeight:800, fontSize:14, color:alpha(th.ink,0.6), cursor:'pointer' }}>
                    ביטול
                  </button>
                  <button onClick={() => deleteReason && setDeleteModal('confirm')} disabled={!deleteReason}
                    style={{ flex:2, padding:'13px 0', borderRadius:th.r, border:'none', background: deleteReason ? th.error : alpha(th.ink,0.12), color:'#fff', fontFamily:th.display, fontWeight:800, fontSize:14, cursor: deleteReason ? 'pointer' : 'not-allowed' }}>
                    המשך
                  </button>
                </div>
              </>)}

              {deleteModal === 'confirm' && (<>
                <div style={{ textAlign:'center', marginBottom:16 }}>
                  <div style={{ fontSize:48 }}>🗑️</div>
                  <div style={{ fontFamily:th.display, fontWeight:800, fontSize:18, color:th.error, marginTop:8 }}>מחיקה סופית</div>
                </div>
                <div style={{ background:alpha(th.error,0.07), borderRadius:th.r, padding:'12px 14px', marginBottom:20, fontFamily:th.body, fontSize:13.5, color:alpha(th.ink,0.7), lineHeight:1.55 }}>
                  הפרופיל שלך, התמונות, וכל הנתונים שלך יימחקו לצמיתות.<br/>
                  <strong>אין דרך לשחזר את הנתונים.</strong>
                </div>
                <div style={{ display:'flex', gap:10 }}>
                  <button onClick={() => setDeleteModal('reason')} disabled={deleting}
                    style={{ flex:1, padding:'13px 0', borderRadius:th.r, border:`1.5px solid ${alpha(th.ink,0.15)}`, background:'transparent', fontFamily:th.display, fontWeight:800, fontSize:14, color:alpha(th.ink,0.6), cursor:'pointer' }}>
                    חזרה
                  </button>
                  <button onClick={doDelete} disabled={deleting}
                    style={{ flex:2, padding:'13px 0', borderRadius:th.r, border:'none', background:th.error, color:'#fff', fontFamily:th.display, fontWeight:800, fontSize:14, cursor:'pointer' }}>
                    {deleting ? 'מוחק...' : 'כן, מחק את הפרופיל שלי'}
                  </button>
                </div>
              </>)}
            </div>
          </div>
        )}

        {/* ── ENGAGEMENT MODAL ── */}
        {engageModal && (
          <div style={{ position:'fixed', inset:0, zIndex:1000, background:alpha('#000',0.5), display:'flex', alignItems:'flex-end' }}
            onClick={() => { if (!engaging && engageModal !== 'done') { setEngageModal(false); setEngageSource(null); setEngageOfferId(null); } }}>
            <div style={{ width:'100%', background:th.card, borderRadius:`24px 24px 0 0`, padding:'24px 20px 40px', direction:'rtl', maxHeight:'80vh', overflowY:'auto' }}
              onClick={e => e.stopPropagation()}>

              {engageModal === 'source' && (<>
                <div style={{ textAlign:'center', marginBottom:20 }}>
                  <div style={{ fontSize:52 }}>💍</div>
                  <div style={{ fontFamily:th.display, fontWeight:800, fontSize:20, color:th.ink, marginTop:10 }}>מזל טוב! 🎉</div>
                  <div style={{ fontFamily:th.body, fontSize:14, color:alpha(th.ink,0.6), marginTop:6 }}>איך הגעתם לאחד/ת לשנייה?</div>
                </div>
                <div style={{ display:'flex', flexDirection:'column', gap:12, marginBottom:16 }}>
                  <button onClick={() => { setEngageSource('app'); setEngageModal('pick'); }}
                    style={{ all:'unset', cursor:'pointer', padding:'16px 18px', borderRadius:th.r, background:alpha(th.primary,0.06), border:`1.5px solid ${alpha(th.primary,0.25)}`, display:'flex', alignItems:'center', gap:14 }}>
                    <div style={{ fontSize:32 }}>📱</div>
                    <div>
                      <div style={{ fontFamily:th.display, fontWeight:800, fontSize:15, color:th.ink }}>בזכות האפליקציה!</div>
                      <div style={{ fontFamily:th.body, fontSize:12.5, color:alpha(th.ink,0.55), marginTop:3 }}>ההכרות הייתה דרך ההצעות שקיבלתי כאן</div>
                    </div>
                  </button>
                  <button onClick={() => { setEngageSource('other'); setEngageModal('confirm'); }}
                    style={{ all:'unset', cursor:'pointer', padding:'16px 18px', borderRadius:th.r, background:alpha(th.ink,0.03), border:`1.5px solid ${alpha(th.ink,0.12)}`, display:'flex', alignItems:'center', gap:14 }}>
                    <div style={{ fontSize:32 }}>🤝</div>
                    <div>
                      <div style={{ fontFamily:th.display, fontWeight:800, fontSize:15, color:th.ink }}>לא מתוך האפליקציה</div>
                      <div style={{ fontFamily:th.body, fontSize:12.5, color:alpha(th.ink,0.55), marginTop:3 }}>הכרנו בדרך אחרת</div>
                    </div>
                  </button>
                </div>
                <button onClick={() => { setEngageModal(false); setEngageSource(null); }}
                  style={{ all:'unset', cursor:'pointer', width:'100%', textAlign:'center', padding:'10px 0', fontFamily:th.body, fontSize:14, color:alpha(th.ink,0.45) }}>
                  ביטול
                </button>
              </>)}

              {engageModal === 'pick' && (<>
                <div style={{ fontFamily:th.display, fontWeight:800, fontSize:18, color:th.ink, marginBottom:6 }}>עם מי התחתנת/ת? 💍</div>
                <div style={{ fontFamily:th.body, fontSize:13, color:alpha(th.ink,0.55), marginBottom:18 }}>בחר/י מבין ההצעות שאושרו עבורך</div>
                {myOffers.length === 0 ? (
                  <div style={{ fontFamily:th.body, fontSize:13.5, color:alpha(th.ink,0.5), textAlign:'center', padding:'20px 0' }}>אין הצעות מאושרות</div>
                ) : (
                  <div style={{ display:'flex', flexDirection:'column', gap:10, marginBottom:16 }}>
                    {myOffers.map(o => {
                      const partnerId = o.aId === me.id ? o.bId : o.aId;
                      const partner = candidates.find(c => c.id === partnerId);
                      if (!partner) return null;
                      const sel = engageOfferId === o.id;
                      return (
                        <button key={o.id} onClick={() => setEngageOfferId(sel ? null : o.id)}
                          style={{ all:'unset', cursor:'pointer', padding:'12px 14px', borderRadius:th.r, border:`1.5px solid ${sel ? th.primary : alpha(th.ink,0.12)}`,
                            background: sel ? alpha(th.primary,0.06) : th.cream, display:'flex', alignItems:'center', gap:12 }}>
                          <Avatar grad={partner.grad} name={partner.name} size={40} photo={partner.photos?.[0]} />
                          <div style={{ flex:1 }}>
                            <div style={{ fontFamily:th.display, fontWeight:800, fontSize:15, color:th.ink }}>{partner.name}</div>
                            <div style={{ fontFamily:th.body, fontSize:12, color:alpha(th.ink,0.5) }}>{partner.age}{partner.region ? ` · ${partner.region}` : ''}</div>
                          </div>
                          {sel && <div style={{ width:22, height:22, borderRadius:'50%', background:th.primary, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                            <Icon name="check" size={12} style={{ color:'#fff' }} />
                          </div>}
                        </button>
                      );
                    })}
                  </div>
                )}
                <div style={{ display:'flex', gap:10 }}>
                  <button onClick={() => { setEngageModal('source'); setEngageOfferId(null); }}
                    style={{ flex:1, padding:'13px 0', borderRadius:th.r, border:`1.5px solid ${alpha(th.ink,0.15)}`, background:'transparent', fontFamily:th.display, fontWeight:800, fontSize:14, color:alpha(th.ink,0.6), cursor:'pointer' }}>
                    חזרה
                  </button>
                  <button onClick={() => engageOfferId && setEngageModal('confirm')} disabled={!engageOfferId}
                    style={{ flex:2, padding:'13px 0', borderRadius:th.r, border:'none', background: engageOfferId ? th.primary : alpha(th.ink,0.12), color:'#fff', fontFamily:th.display, fontWeight:800, fontSize:14, cursor: engageOfferId ? 'pointer' : 'not-allowed' }}>
                    המשך
                  </button>
                </div>
              </>)}

              {engageModal === 'confirm' && (<>
                <div style={{ textAlign:'center', marginBottom:20 }}>
                  <div style={{ fontSize:52 }}>💍</div>
                  <div style={{ fontFamily:th.display, fontWeight:800, fontSize:20, color:th.ink, marginTop:10 }}>
                    {engagedPartner ? `${me.name} + ${engagedPartner.name}` : 'מזל טוב!'}
                  </div>
                  {engageSource === 'app' && engagedPartner && (
                    <div style={{ fontFamily:th.body, fontSize:13.5, color:alpha(th.ink,0.6), marginTop:6, lineHeight:1.5 }}>
                      ישמח לנו להכריז על ה-Match המיוחד הזה!
                    </div>
                  )}
                  {engageSource === 'other' && (
                    <div style={{ fontFamily:th.body, fontSize:13.5, color:alpha(th.ink,0.6), marginTop:6 }}>
                      כמה שמחים בשבילך! 🎊
                    </div>
                  )}
                </div>
                <div style={{ background:alpha(th.primary,0.06), borderRadius:th.r, padding:'12px 14px', marginBottom:20, fontFamily:th.body, fontSize:13.5, color:alpha(th.ink,0.7), lineHeight:1.55 }}>
                  לאחר האישור הפרופיל שלך יוסתר אוטומטית מהמערכת.
                </div>
                <div style={{ display:'flex', gap:10 }}>
                  <button onClick={() => setEngageModal(engageSource === 'app' ? 'pick' : 'source')} disabled={engaging}
                    style={{ flex:1, padding:'13px 0', borderRadius:th.r, border:`1.5px solid ${alpha(th.ink,0.15)}`, background:'transparent', fontFamily:th.display, fontWeight:800, fontSize:14, color:alpha(th.ink,0.6), cursor:'pointer' }}>
                    חזרה
                  </button>
                  <button onClick={doEngage} disabled={engaging}
                    style={{ flex:2, padding:'13px 0', borderRadius:th.r, border:'none', background:th.primary, color:'#fff', fontFamily:th.display, fontWeight:800, fontSize:14, cursor:'pointer' }}>
                    {engaging ? 'שומר...' : '💍 אשר נישואין'}
                  </button>
                </div>
              </>)}

              {engageModal === 'done' && (<>
                <div style={{ textAlign:'center', padding:'20px 0' }}>
                  <div style={{ fontSize:64 }}>🥂</div>
                  <div style={{ fontFamily:th.display, fontWeight:800, fontSize:22, color:th.primary, marginTop:12 }}>מזל טוב וברכות!</div>
                  <div style={{ fontFamily:th.body, fontSize:14.5, color:alpha(th.ink,0.65), marginTop:8, lineHeight:1.6 }}>
                    שיהיה בנין עדי עד 💐<br/>הפרופיל שלך הוסתר מהמערכת.
                  </div>
                  <button onClick={() => go('onboarding')}
                    style={{ marginTop:24, padding:'14px 36px', borderRadius:th.r, border:'none', background:th.primary, color:'#fff', fontFamily:th.display, fontWeight:800, fontSize:15, cursor:'pointer' }}>
                    סיום
                  </button>
                </div>
              </>)}

            </div>
          </div>
        )}

        <div style={{ paddingTop:54, paddingInline:18, paddingBottom:14, background:`linear-gradient(160deg,${tint(th.primary,0.8)},${th.cream})`, flexShrink:0 }}>
          <div style={{ fontFamily:th.display, fontWeight:800, fontSize:22, color:th.ink }}>הגדרות</div>
        </div>
        <div style={{ flex:1, overflowY:'auto', padding:'16px 18px 28px' }}>

          {/* Switch to matchmaker mode */}
          <div style={{ background:th.card, borderRadius:th.r, overflow:'hidden', boxShadow:`0 4px 14px ${alpha(th.ink,0.05)}`, marginBottom:14 }}>
            <button onClick={() => go('home')}
              style={{ all:'unset', cursor:'pointer', boxSizing:'border-box', width:'100%', display:'flex', alignItems:'center', gap:14, padding:'14px 16px' }}>
              <div style={{ width:38, height:38, borderRadius:'50%', background:alpha(th.primary,0.1), display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                <Icon name="users" size={20} style={{ color:th.primary }} />
              </div>
              <div style={{ flex:1 }}>
                <div style={{ fontFamily:th.display, fontWeight:800, fontSize:14.5, color:th.ink }}>{t('cand_settings_mm')}</div>
                <div style={{ fontFamily:th.body, fontSize:12, color:alpha(th.ink,0.5) }}>{t('cand_settings_mm_sub')}</div>
              </div>
              <Icon name="chevL" size={18} style={{ color:alpha(th.ink,0.3) }} />
            </button>
          </div>

          {/* Getting married! */}
          {!me.isEngaged && (
            <div style={{ background:th.card, borderRadius:th.r, overflow:'hidden', boxShadow:`0 4px 14px ${alpha(th.ink,0.05)}`, marginBottom:14 }}>
              <button onClick={() => { setEngageModal('source'); setEngageSource(null); setEngageOfferId(null); }}
                style={{ all:'unset', cursor:'pointer', boxSizing:'border-box', width:'100%', display:'flex', alignItems:'center', gap:14, padding:'14px 16px' }}>
                <div style={{ width:38, height:38, borderRadius:'50%', background:alpha(th.gold,0.15), display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, fontSize:20 }}>
                  💍
                </div>
                <div style={{ flex:1 }}>
                  <div style={{ fontFamily:th.display, fontWeight:800, fontSize:14.5, color:th.ink }}>{t('cand_settings_engage')}</div>
                  <div style={{ fontFamily:th.body, fontSize:12, color:alpha(th.ink,0.5) }}>{t('cand_settings_engage_sub')}</div>
                </div>
                <Icon name="chevL" size={18} style={{ color:alpha(th.ink,0.3) }} />
              </button>
            </div>
          )}
          {me.isEngaged && (
            <div style={{ background:alpha(th.gold,0.08), borderRadius:th.r, padding:'14px 16px', marginBottom:14, border:`1.5px solid ${alpha(th.gold,0.3)}`, display:'flex', alignItems:'center', gap:12 }}>
              <span style={{ fontSize:24 }}>💍</span>
              <div style={{ fontFamily:th.body, fontSize:13.5, color:alpha(th.ink,0.75) }}>כרטיסייתך מסומנת כ"נישא/אה" — מזל טוב!</div>
            </div>
          )}

          {/* Delete profile */}
          <div style={{ background:th.card, borderRadius:th.r, overflow:'hidden', boxShadow:`0 4px 14px ${alpha(th.ink,0.05)}`, marginBottom:20 }}>
            <button onClick={() => { setDeleteReason(''); setDeleteNote(''); setDeleteModal('reason'); }}
              style={{ all:'unset', cursor:'pointer', boxSizing:'border-box', width:'100%', display:'flex', alignItems:'center', gap:14, padding:'14px 16px' }}>
              <div style={{ width:38, height:38, borderRadius:'50%', background:alpha(th.error,0.1), display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                <Icon name="trash" size={18} style={{ color:th.error }} />
              </div>
              <div style={{ flex:1 }}>
                <div style={{ fontFamily:th.display, fontWeight:800, fontSize:14.5, color:th.error }}>{t('cand_settings_delete')}</div>
                <div style={{ fontFamily:th.body, fontSize:12, color:alpha(th.ink,0.5) }}>{t('cand_settings_delete_sub')}</div>
              </div>
              <Icon name="chevL" size={18} style={{ color:alpha(th.ink,0.3) }} />
            </button>
          </div>

          <div style={{ background:alpha(th.ink,0.04), borderRadius:th.r, padding:'11px 14px' }}>
            <div style={{ fontFamily:th.body, fontSize:12, color:alpha(th.ink,0.45), lineHeight:1.5 }}>
              {t('cand_footer')}
            </div>
          </div>
        </div>
        {tabBar}
      </div>
    );
  }

  // ── Home tab ─────────────────────────────────────────────────
  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: th.cream }}>

      <div style={{ paddingTop: 50, paddingInline: 18, paddingBottom: 14, background: `linear-gradient(160deg, ${tint(th.primary,0.8)}, ${th.cream})`, flexShrink: 0 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
          <Avatar grad={me.grad || gradForId(me.id)} name={me.name} size={50} photo={me.photos?.[0]} />
          <div style={{ flex: 1 }}>
            <div style={{ fontFamily: th.display, fontSize: 20, fontWeight: 800, color: th.ink, lineHeight: 1 }}>שלום, {me.name}</div>
            <div style={{ fontFamily: th.body, fontSize: 13, color: alpha(th.ink, 0.55), marginTop: 3 }}>מצב מועמד/ת</div>
          </div>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, background: alpha('#fff', 0.6), borderRadius: th.r, padding: '10px 14px', marginTop: 14 }}>
          <div style={{ flex: 1 }}>
            <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 14.5, color: th.ink }}>{me.available ? t('cand_available') : t('cand_busy')}</div>
            <div style={{ fontFamily: th.body, fontSize: 12, color: alpha(th.ink, 0.55) }}>{me.available ? t('cand_available_sub') : t('cand_busy_sub')}</div>
          </div>
          <Toggle on={!!me.available} onChange={toggleAvailable} th={th} />
        </div>
      </div>

      <div style={{ flex: 1, overflowY: 'auto', padding: '16px 18px 28px' }}>

        {/* OFFERS */}
        <div style={{ fontFamily: th.display, fontSize: 17, fontWeight: 800, color: th.ink, marginBottom: 10, display: 'flex', alignItems: 'center', gap: 7 }}>
          <Icon name="heart" size={19} style={{ color: th.primary }} fill={th.primary} stroke={0} /> {t('cand_offers_title')}
          {myOffers.length > 1 && (
            <span style={{ marginRight: 'auto', display:'flex', alignItems:'center', gap:6 }}>
              <button onClick={() => setOfferIdx(i => Math.max(0, i-1))} disabled={safeIdx === 0}
                style={{ border:'none', background:'none', cursor:'pointer', color: safeIdx === 0 ? alpha(th.ink,0.25) : th.primary, padding:2, display:'flex' }}>
                <Icon name="chevR" size={18} />
              </button>
              <span style={{ fontFamily:th.body, fontSize:13, color:alpha(th.ink,0.5) }}>{safeIdx+1}/{myOffers.length}</span>
              <button onClick={() => setOfferIdx(i => Math.min(myOffers.length-1, i+1))} disabled={safeIdx === myOffers.length-1}
                style={{ border:'none', background:'none', cursor:'pointer', color: safeIdx === myOffers.length-1 ? alpha(th.ink,0.25) : th.primary, padding:2, display:'flex' }}>
                <Icon name="chevL" size={18} />
              </button>
            </span>
          )}
        </div>

        {!currentOffer || !otherCand ? (
          <div style={{ background: alpha(th.ink, 0.04), borderRadius: th.r, padding: '22px 16px', textAlign: 'center', marginBottom: 22 }}>
            <div style={{ fontFamily: th.body, fontSize: 14, color: alpha(th.ink, 0.5) }}>{t('cand_no_offer')}</div>
            <div style={{ fontFamily: th.body, fontSize: 12.5, color: alpha(th.ink, 0.4), marginTop: 4 }}>{t('cand_no_offer_sub')}</div>
          </div>
        ) : (
          <div style={{ background: th.card, borderRadius: th.rLg, overflow: 'hidden', marginBottom: 22, boxShadow: `0 10px 26px ${alpha(th.ink, 0.1)}` }}>
            {/* photo — clickable to open full card */}
            <div style={{ position:'relative', cursor:'pointer' }} onClick={() => go('candViewCand', { id: otherCand.id, meId: me.id })}>
              <PhotoGallery c={otherCand} th={th} height={220}>
                <div style={{ position: 'absolute', top: 12, right: 12, pointerEvents: 'none' }}><Tag th={th} tone={th.primary} soft={false}>{t('cand_offer_tag')}</Tag></div>
                <div style={{ position: 'absolute', top: 12, left: 12, pointerEvents: 'none' }}>
                  <div style={{ background:alpha('#fff',0.85), borderRadius:999, padding:'3px 9px', fontFamily:th.body, fontSize:11.5, fontWeight:700, color:alpha(th.ink,0.7) }}>
                    {t('cand_offer_view_hint')}
                  </div>
                </div>
                <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, height: 90, background: `linear-gradient(to top, ${alpha(th.ink,0.7)}, transparent)`, pointerEvents: 'none' }} />
                <div style={{ position: 'absolute', bottom: 14, right: 16, color: '#fff', pointerEvents: 'none' }}>
                  <div style={{ fontFamily: th.display, fontSize: 26, fontWeight: 800 }}>{otherCand.name}, {otherCand.age}</div>
                  <div style={{ fontFamily: th.body, fontSize: 13.5, opacity: 0.9 }}>{otherCand.region}{otherCand.religiosity ? ` · ${otherCand.religiosity}` : ''}</div>
                </div>
              </PhotoGallery>
            </div>
            <div style={{ padding: 16 }}>
              {otherCand.sabaBut && <div style={{ marginBottom: 12 }}><SabaBadge th={th} text={otherCand.sabaBut} /></div>}
              {otherCand.oneLine && <p style={{ margin: '0 0 14px', fontFamily: th.body, fontSize: 14.5, color: alpha(th.ink, 0.75), lineHeight: 1.5 }}>{otherCand.oneLine}</p>}
              <div style={{ display: 'flex', gap: 10, marginBottom: 8 }}>
                {(() => {
                  const phone = otherCand.phone ? String(otherCand.phone).replace(/\D/g,'').replace(/^0/,'972') : null;
                  return phone ? (
                    <a href={`https://wa.me/${phone}`} target="_blank" rel="noopener"
                      style={{ flex:1, display:'flex', alignItems:'center', justifyContent:'center', gap:8, padding:'12px 0', borderRadius:th.r, background:'#25D366', color:'#fff', textDecoration:'none', fontFamily:th.display, fontWeight:800, fontSize:14, boxShadow:'0 6px 16px rgba(37,211,102,0.35)' }}>
                      <Icon name="whatsapp" size={20} /> שלח/י הודעה
                    </a>
                  ) : (
                    <div style={{ flex:1, padding:'12px 0', borderRadius:th.r, background:alpha(th.ink,0.07), color:alpha(th.ink,0.4), fontFamily:th.body, fontSize:13, textAlign:'center' }}>
                      אין מספר טלפון
                    </div>
                  );
                })()}
                <button onClick={declineOffer}
                  style={{ flex:1, padding:'12px 0', borderRadius:th.r, border:`1.5px solid ${alpha(th.error,0.3)}`, background:alpha(th.error,0.07), color:th.error, fontFamily:th.display, fontWeight:800, fontSize:14, cursor:'pointer' }}>
                  {t('cand_decline_btn')}
                </button>
              </div>
            </div>
          </div>
        )}

        {/* BROWSE HINT */}
        {!browseSeen && (
          <button onClick={() => { markBrowseSeen(); setCandTab('browse'); }}
            style={{ all:'unset', cursor:'pointer', boxSizing:'border-box', width:'100%', marginBottom:22, display:'block',
              background:`linear-gradient(135deg, ${th.primary}, ${alpha(th.primary,0.78)})`,
              borderRadius:th.rLg, overflow:'hidden', position:'relative',
              boxShadow:`0 8px 28px ${alpha(th.primary,0.38)}` }}>
            <div style={{ padding:'20px 18px 18px', display:'flex', alignItems:'center', gap:16 }}>
              <div style={{ fontSize:44, lineHeight:1, flexShrink:0 }}>
                {browseMale ? '👩' : '👨'}
              </div>
              <div style={{ flex:1 }}>
                <div style={{ fontFamily:th.display, fontWeight:800, fontSize:17, color:'#fff', lineHeight:1.25, marginBottom:5 }}>
                  {browseMale ? t('cand_browse_hint_m') : t('cand_browse_hint_f')}
                </div>
                <div style={{ fontFamily:th.body, fontSize:13, color:alpha('#fff',0.8), lineHeight:1.4 }}>
                  {t('cand_browse_hint_sub')}
                </div>
              </div>
              <div style={{ width:36, height:36, borderRadius:'50%', background:alpha('#fff',0.2), display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                <Icon name="chevL" size={20} style={{ color:'#fff' }} />
              </div>
            </div>
            <div style={{ height:4, background:alpha('#fff',0.15) }}>
              <div style={{ height:'100%', width:'100%', background:alpha('#fff',0.3), animation:'shimmer 2s infinite' }} />
            </div>
          </button>
        )}

        {/* CO-REP REQUESTS */}
        {coRepReqs.length > 0 && (
          <>
            <div style={{ fontFamily: th.display, fontSize: 17, fontWeight: 800, color: th.ink, marginBottom: 10, display:'flex', alignItems:'center', gap:7 }}>
              🤝 בקשות ייצוג
            </div>
            {coRepReqs.map(req => (
              <div key={req.id} style={{ background: th.card, borderRadius: th.r, padding: 14, marginBottom: 12, boxShadow:`0 4px 14px ${alpha(th.ink,0.06)}`, border:`1.5px solid ${alpha(th.primary,0.15)}` }}>
                <div style={{ fontFamily:th.display, fontWeight:800, fontSize:14.5, color:th.ink, marginBottom:4 }}>
                  {req.mmName || req.fromMmName} מעוניין/ת לייצג אותך
                </div>
                <div style={{ fontFamily:th.body, fontSize:12.5, color:alpha(th.ink,0.6), marginBottom:12, lineHeight:1.4 }}>
                  אם תאשר/י — {req.mmName || req.fromMmName} יוכל/תוכל להציע אותך לשידוכים גם מטעמו/ה
                </div>
                <div style={{ display:'flex', gap:8 }}>
                  <button onClick={() => approveCoRep(req)} style={{ flex:1, padding:'9px 0', borderRadius:th.rSm, border:'none', background:th.success, color:'#fff', fontFamily:th.display, fontWeight:800, fontSize:13, cursor:'pointer' }}>✓ אשר/י</button>
                  <button onClick={() => declineCoRep(req)} style={{ flex:1, padding:'9px 0', borderRadius:th.rSm, border:`1.5px solid ${alpha(th.error,0.3)}`, background:alpha(th.error,0.08), color:th.error, fontFamily:th.display, fontWeight:800, fontSize:13, cursor:'pointer' }}>✗ דחה/י</button>
                </div>
              </div>
            ))}
          </>
        )}

        {/* MY MATCHMAKERS */}
        <div style={{ fontFamily: th.display, fontSize: 17, fontWeight: 800, color: th.ink, marginBottom: 10 }}>{t('cand_mms_title')}</div>
        <div style={{ background: th.card, borderRadius: th.r, padding: 6, marginBottom: 22, boxShadow: `0 4px 14px ${alpha(th.ink, 0.05)}` }}>
          {myMms.length === 0 ? (
            <div style={{ padding: '14px 10px', fontFamily: th.body, fontSize: 13.5, color: alpha(th.ink, 0.45), textAlign: 'center' }}>לא נמצאו שדכנים</div>
          ) : myMms.map((m, i) => {
            const isPrimaryMm = m.id === me.mmId;
            return (
              <div key={m.uid || m.id} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '10px 10px', borderBottom: i < myMms.length - 1 ? `1px solid ${alpha(th.ink, 0.07)}` : 'none' }}>
                <Avatar grad={m.grad || gradForId(m.uid || m.id)} name={m.displayName || m.name || '?'} size={42} photo={m.photoURL} />
                <div style={{ flex: 1 }}>
                  <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                    <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 14.5, color: th.ink }}>{m.displayName || m.name}</div>
                    <span style={{ fontFamily:th.body, fontSize:10.5, fontWeight:700, color: isPrimaryMm ? th.primary : alpha(th.ink,0.4), background: isPrimaryMm ? alpha(th.primary,0.1) : alpha(th.ink,0.07), borderRadius:999, padding:'2px 7px' }}>
                      {isPrimaryMm ? 'שדכן ראשי' : 'שדכן משני'}
                    </span>
                  </div>
                  <div style={{ fontFamily: th.body, fontSize: 12, color: alpha(th.ink, 0.5) }}>{m.region || ''}</div>
                </div>
                <div style={{ display:'flex', gap:6, alignItems:'center' }}>
                  {m.phone && (
                    <a href={`https://wa.me/${String(m.phone).replace(/[^0-9]/g,'')}`} target="_blank" rel="noopener"
                      style={{ border: 'none', background: alpha(th.success, 0.12), color: th.success, borderRadius: 999, width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center', textDecoration: 'none' }}>
                      <Icon name="whatsapp" size={19} />
                    </a>
                  )}
                  {!isPrimaryMm && (
                    <button onClick={() => cancelCoRep(m.id || m.uid)}
                      style={{ border:`1px solid ${alpha(th.error,0.3)}`, background:alpha(th.error,0.07), color:th.error, borderRadius:999, padding:'5px 10px', fontFamily:th.body, fontWeight:700, fontSize:11, cursor:'pointer', whiteSpace:'nowrap' }}>
                      בטל ייצוג
                    </button>
                  )}
                </div>
              </div>
            );
          })}
        </div>

      </div>
      {tabBar}
    </div>
  );
}

// APP — with auth + data providers
