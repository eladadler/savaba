  const [editKey,  setEditKey]  = useState(null);
  const [editVal,  setEditVal]  = useState('');
  const [seeding,  setSeeding]  = useState(false);
  const [updatingPhotos, setUpdatingPhotos] = useState(false);
  const [confirmWipe, setConfirmWipe] = useState(null); // null | 'offers' | 'candidates' | 'matchmakers'
  const [wiping, setWiping] = useState(false);
  const [deletionLog, setDeletionLog] = useState([]);
  const [notifEmail, setNotifEmail] = useState('');
  const [notifEmailInput, setNotifEmailInput] = useState('');
  const [savingEmail, setSavingEmail] = useState(false);

  useEffect(() => {
    db.collection('deletions').orderBy('at', 'desc').limit(50).get()
      .then(s => setDeletionLog(s.docs.map(d => ({ id: d.id, ...d.data() }))))
      .catch(() => {});
    db.collection('config').doc('settings').get()
      .then(d => { if (d.exists && d.data().notifEmail) { setNotifEmail(d.data().notifEmail); setNotifEmailInput(d.data().notifEmail); } })
      .catch(() => {});
  }, []);
  const [hideSeed, setHideSeed] = useState(() => localStorage.getItem('hideSeed') === 'true');
  const [waitingPanelLight, setWaitingPanelLight] = useState(() => localStorage.getItem('waitingPanelLight') !== 'false');
  const [cardStyle, setCardStyle] = useState(() => localStorage.getItem('candCardStyle') || 'square');
  const [invitesOpen, setInvitesOpen] = useState(false);
  const toggleHideSeed = () => setHideSeed(v => { localStorage.setItem('hideSeed', String(!v)); return !v; });
  const toggleWaitingPanel = () => setWaitingPanelLight(v => {
    const next = !v;
    // store 'false' to get dark; remove key (or set 'true') for light (default)
    if (next) localStorage.removeItem('waitingPanelLight');
    else localStorage.setItem('waitingPanelLight', 'false');
    window.dispatchEvent(new Event('waitingPanelChanged'));
    return next;
  });
  const toggleCardStyle = () => setCardStyle(v => {
    const next = v === 'square' ? 'compact' : 'square';
    localStorage.setItem('candCardStyle', next);
    window.dispatchEvent(new Event('storage'));
    return next;
  });

  // Matchmaker is fictional if it has a seed_ prefix
  const isSeedMm  = (id) => typeof id === 'string' && id.startsWith('seed_');
  // Candidate is fictional if it was never registered via email/password (no candidateUid)
  // isSeed works for both: seed_ prefix → fictional; candidate lookup → fictional if no candidateUid
  const isSeed    = (id) => {
    if (typeof id !== 'string') return false;
    if (id.startsWith('seed_')) return true;
    const cand = candidates.find(c => c.id === id);
    return cand ? !cand.candidateUid : false;
  };
  const visibleCands = hideSeed ? candidates.filter(c => !!c.candidateUid) : candidates;
  const visibleMms   = hideSeed ? Object.fromEntries(Object.entries(matchmakers).filter(([id]) => !isSeedMm(id))) : matchmakers;
  const myCands      = visibleCands.filter(c => c.mmId === profile?.uid);
  const otherCands   = visibleCands.filter(c => c.mmId !== profile?.uid);

  const db_avatar = (seed, gender) =>
    `https://api.dicebear.com/9.x/${(gender === 'f' || gender === 'אשה') ? 'lorelei' : 'micah'}/png?seed=${encodeURIComponent(seed)}&size=300&backgroundColor=b6e3f4,c0aede,d1d4f9,ffd5dc,ffdfbf`;

  const SEED_DATA = {
    'דניאל כהן':    { seed: 'daniel-cohen',    gender: 'm', sabaBut: 'מסביר לכולם שהוא "לא בן אדם של בוקר" — כולל ב-11:30' },
    'מיכל שפירא':   { seed: 'michal-shapira',  gender: 'f', sabaBut: 'מדרגת את כל הסרטים לפי כמות הכלבים שמופיעים בהם' },
    'אורי לוין':    { seed: 'uri-levin',        gender: 'm', sabaBut: 'חושב שאם הוא לא שמע על הסרט — הוא כנראה לא טוב' },
    'שירה אברהם':   { seed: 'shira-avraham',    gender: 'f', sabaBut: 'מתווכחת בשינה — ומנצחת' },
    'נועם גולדברג':  { seed: 'noam-goldberg',   gender: 'm', sabaBut: 'מסביר את כל הבעיות בחיים עם אנלוגיות מגולף' },
    'אביגיל רוזן':  { seed: 'avigail-rosen',    gender: 'f', sabaBut: 'מנתחת את כולם פסיכולוגית — כולל את הקופאית בסופר' },
    'אמיר חיון':    { seed: 'amir-hayun',        gender: 'm', sabaBut: 'לא יכול לשבת בבית קפה בלי לקרוא ביקורת על העיצוב שלו' },
    'שושנה פרץ':    { seed: 'shoshana-peretz',   gender: 'f', sabaBut: 'מאבחנת מחלות לכולם בארוחות משפחתיות — גם כשלא שואלים' },
  };

  const updateSeedPhotos = async () => {
    setUpdatingPhotos(true);
    try {
      const snap = await db.collection('candidates').get();
      const batch = db.batch();
      snap.docs.forEach(doc => {
        const d = doc.data();
        const entry = SEED_DATA[d.name];
        if (!entry) return;
        const upd = {};
        if (!d.photos?.length) upd.photos = [db_avatar(entry.seed, entry.gender)];
        if (!d.sabaBut) upd.sabaBut = entry.sabaBut;
        if (Object.keys(upd).length) batch.update(doc.ref, upd);
      });
      await batch.commit();
    } finally {
      setUpdatingPhotos(false);
    }
  };

  if (!profile?.isAdmin) return (
    <div style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', direction: 'rtl', fontFamily: th.body, color: th.error }}>
      אין הרשאות מנהל
    </div>
  );

  const tabs = [['candidates', 'מועמדים'], ['stats', 'סטטיסטיקות'], ['lists', 'רשימות'], ['texts', 'טקסטים'], ['users', 'שדכנים'], ['danger', '⚠️']];

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: th.cream, direction: 'rtl' }}>
      <AppHeader th={th} title="פאנל ניהול" onBack={() => go('back')} />
      <div style={{ display: 'flex', gap: 6, padding: '6px 18px', flexShrink: 0 }}>
        {tabs.map(([id, lbl]) => (
          <button key={id} onClick={() => setTab(id)} style={{ flex: 1, padding: '8px', borderRadius: 999, border: 'none', cursor: 'pointer', fontFamily: th.display, fontWeight: 800, fontSize: 13, background: tab === id ? th.ink : alpha(th.ink, 0.07), color: tab === id ? th.cream : alpha(th.ink, 0.6) }}>{lbl}</button>
        ))}
      </div>

      {/* ── hide-seed toggle ── */}
      <div style={{ padding: '4px 18px 8px', display:'flex', flexWrap:'wrap', alignItems:'center', gap:8, flexShrink:0 }}>
        {/* hide-seed toggle */}
        <button onClick={toggleHideSeed} style={{ display:'flex', alignItems:'center', gap:7, border:'none', background: hideSeed ? alpha(th.ink,0.08) : alpha(th.gold,0.13), borderRadius:999, padding:'6px 14px', cursor:'pointer', transition:'background 0.2s' }}>
          <div style={{ width:28, height:16, background: hideSeed ? th.ink : alpha(th.ink,0.2), borderRadius:999, position:'relative', transition:'background 0.2s', flexShrink:0 }}>
            <div style={{ position:'absolute', top:2, width:12, height:12, borderRadius:'50%', background:'white', transition:'left 0.2s', left: hideSeed ? 14 : 2 }} />
          </div>
          <span style={{ fontFamily:th.body, fontSize:12, fontWeight:700, color: hideSeed ? th.ink : alpha(th.ink,0.5) }}>
            {hideSeed ? 'פיקטיביים מוסתרים' : 'הצג פיקטיביים'}
          </span>
        </button>
        {hideSeed && (
          <span style={{ fontFamily:th.body, fontSize:11, color:alpha(th.ink,0.4) }}>
            {candidates.length - visibleCands.length} מועמדים · {Object.keys(matchmakers).length - Object.keys(visibleMms).length} שדכנים מוסתרים
          </span>
        )}
        {/* waiting panel style toggle */}
        <button onClick={toggleWaitingPanel} style={{ display:'flex', alignItems:'center', gap:7, border:'none', background: waitingPanelLight ? alpha(th.primary,0.1) : alpha(th.ink,0.08), borderRadius:999, padding:'6px 14px', cursor:'pointer', transition:'background 0.2s' }}>
          <div style={{ width:28, height:16, background: waitingPanelLight ? th.primary : alpha(th.ink,0.2), borderRadius:999, position:'relative', transition:'background 0.2s', flexShrink:0 }}>
            <div style={{ position:'absolute', top:2, width:12, height:12, borderRadius:'50%', background:'white', transition:'left 0.2s', left: waitingPanelLight ? 14 : 2 }} />
          </div>
          <span style={{ fontFamily:th.body, fontSize:12, fontWeight:700, color: waitingPanelLight ? th.primary : alpha(th.ink,0.5) }}>
            {waitingPanelLight ? 'פאנל בית: בהיר (ברירת מחדל)' : 'פאנל בית: כהה (קלאסי)'}
          </span>
        </button>
        {/* card photo style toggle */}
        <button onClick={toggleCardStyle} style={{ display:'flex', alignItems:'center', gap:7, border:'none', background: cardStyle === 'square' ? alpha(th.primary,0.1) : alpha(th.ink,0.08), borderRadius:999, padding:'6px 14px', cursor:'pointer', transition:'background 0.2s' }}>
          <div style={{ width:28, height:16, background: cardStyle === 'square' ? th.primary : alpha(th.ink,0.2), borderRadius:999, position:'relative', transition:'background 0.2s', flexShrink:0 }}>
            <div style={{ position:'absolute', top:2, width:12, height:12, borderRadius:'50%', background:'white', transition:'left 0.2s', left: cardStyle === 'square' ? 14 : 2 }} />
          </div>
          <span style={{ fontFamily:th.body, fontSize:12, fontWeight:700, color: cardStyle === 'square' ? th.primary : alpha(th.ink,0.5) }}>
            {cardStyle === 'square' ? 'כרטיסיה: ריבועית (ברירת מחדל)' : 'כרטיסיה: קומפקטית (קלאסי)'}
          </span>
        </button>
      </div>

      <div style={{ flex: 1, overflowY: 'auto', padding: '10px 18px 30px' }}>
        {/* ── CANDIDATES ── */}
        {tab === 'candidates' && (
          <>
            <InvitationsSheet open={invitesOpen} onClose={() => setInvitesOpen(false)} th={th} mmUid={profile?.uid} go={go} />
            {newCand && <CandidateForm th={th} onSave={async (data) => { const id = await addCandidate(data); setNewCand(false); go('candidate', { id }); }} onCancel={() => setNewCand(false)} />}

            {/* ── helper to render a candidate row ── */}
            {(() => {
              const CandRow = ({ c }) => (
                <div key={c.id} style={{ background: th.card, borderRadius: th.r, padding: 14, marginBottom: 10, boxShadow: `0 4px 14px ${alpha(th.ink, 0.06)}` }}>
                  {editCand === c.id
                    ? <CandidateForm th={th} initial={c} onSave={async (data) => { await updateCandidate(c.id, data); setEditCand(null); go('candidate', { id: c.id }); }} onCancel={() => setEditCand(null)} onUpload={(file) => uploadPhoto(c.id, file)} onUploadVoice={(blob) => uploadVoice(c.id, blob)} />
                    : (
                      <>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8 }}>
                          <Avatar grad={gradForId(c.id)} name={c.name} size={44} photo={c.photos?.[0]} />
                          <div style={{ flex: 1, minWidth: 0 }}>

                          </div>
                          <button onClick={() => {
                            if (!c.gender) { setGenderFix(c.id); return; }
                            const fakeUid = c.candidateUid || c.id;
                            startImpersonate(fakeUid, { uid: fakeUid, displayName: c.name, name: c.name, gender: c.gender }, 'candidate');
                            go('candidateMode');
                          }} title="צפה כמועמד/ת" style={{ border:'none', background:alpha('#7B2D00',0.08), color:'#7B2D00', borderRadius:8, width:34, height:34, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', fontSize:16 }}>🎭</button>
                          <button onClick={() => setEditCand(c.id)} style={{ border: 'none', background: alpha(th.ink, 0.06), color: th.ink, borderRadius: 8, width: 34, height: 34, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Icon name="edit" size={17} /></button>
                          <button onClick={() => setConfirmDelete(c.id)} style={{ border: 'none', background: alpha(th.error, 0.08), color: th.error, borderRadius: 8, width: 34, height: 34, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Icon name="trash" size={17} /></button>
                        </div>
                        {genderFix === c.id && (
                          <div style={{ background: alpha(th.primary, 0.07), border: `1px solid ${alpha(th.primary, 0.18)}`, borderRadius: 10, padding: '10px 12px', display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
                            <span style={{ fontFamily: th.body, fontSize: 13, color: th.ink, flex: 1 }}>מגדר חסר — בחר/י כדי להמשיך:</span>
                            {['גבר', 'אשה'].map(g => (
                              <button key={g} onClick={async () => {
                                await updateCandidate(c.id, { gender: g });
                                setGenderFix(null);
                                const fakeUid = c.candidateUid || c.id;
                                startImpersonate(fakeUid, { uid: fakeUid, displayName: c.name, name: c.name, gender: g }, 'candidate');
                                go('candidateMode');
                              }} style={{ border: 'none', background: th.primary, color: '#fff', borderRadius: 8, padding: '6px 16px', cursor: 'pointer', fontFamily: th.display, fontWeight: 800, fontSize: 13 }}>{g}</button>
                            ))}
                            <button onClick={() => setGenderFix(null)} style={{ border: 'none', background: 'transparent', cursor: 'pointer', color: alpha(th.ink, 0.4), fontSize: 16, padding: '2px 6px' }}>✕</button>
                          </div>
                        )}
                      </>
                    )}
                </div>
              );

              const SectionHeader = ({ label, count }) => (
                <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:10, marginTop:4 }}>
                  <div style={{ fontFamily:th.display, fontWeight:800, fontSize:14, color:th.ink }}>{label}</div>
                  <div style={{ background:alpha(th.ink,0.08), borderRadius:999, padding:'2px 10px', fontFamily:th.body, fontSize:12, fontWeight:700, color:alpha(th.ink,0.5) }}>{count}</div>
                </div>
              );

              return (
                <>
                  <SectionHeader label="המועמדים שלי" count={myCands.length} />
                  {myCands.length === 0 && <div style={{ fontFamily:th.body, fontSize:13, color:alpha(th.ink,0.4), textAlign:'center', padding:'12px 0 18px' }}>אין מועמדים</div>}
                  {myCands.map(c => <CandRow key={c.id} c={c} />)}

                  <div style={{ height:1, background:alpha(th.ink,0.1), margin:'14px 0' }} />
                  <SectionHeader label="מועמדים של שדכנים אחרים" count={otherCands.length} />
                  {otherCands.length === 0 && <div style={{ fontFamily:th.body, fontSize:13, color:alpha(th.ink,0.4), textAlign:'center', padding:'12px 0 18px' }}>אין מועמדים</div>}
                  {otherCands.map(c => {
                    const mm = matchmakers[c.mmId];
                    return (
                      <div key={c.id}>

                          </div>
                        )}
                        <CandRow c={c} />
                      </div>
                    );
                  })}
                </>
              );
            })()}
          </>
        )}

        {/* ── DELETE CONFIRMATION SHEET ── */}
        {(() => {
          const cToDelete = confirmDelete ? candidates.find(c => c.id === confirmDelete) : null;
          return (
            <Sheet open={!!confirmDelete} onClose={() => setConfirmDelete(null)} th={th} title="מחיקת מועמד/ת">
              {cToDelete && (
                <>
                  <div style={{ display:'flex', alignItems:'center', gap:12, background:alpha(th.error,0.06), borderRadius:th.r, padding:14, marginBottom:16 }}>
                    <Avatar grad={gradForId(cToDelete.id)} name={cToDelete.name} size={44} photo={cToDelete.photos?.[0]} />
                    <div>
                      <div style={{ fontFamily:th.display, fontWeight:800, fontSize:16, color:th.ink }}>{cToDelete.name}, {cToDelete.age}</div>
                      <div style={{ fontFamily:th.body, fontSize:12.5, color:alpha(th.ink,0.5) }}>{cToDelete.region} · {cToDelete.religiosity}</div>
                    </div>
                  </div>
                  <div style={{ fontFamily:th.body, fontSize:14, color:alpha(th.ink,0.65), marginBottom:20, lineHeight:1.5 }}>
                    פעולה זו תמחק לצמיתות את הכרטיסייה של {cToDelete.name} מהמערכת. לא ניתן לשחזר.
                  </div>
                  <div style={{ display:'flex', gap:8 }}>
                    <Btn th={th} full variant="ghost" onClick={() => setConfirmDelete(null)}>ביטול</Btn>
                    <Btn th={th} full onClick={async () => { await deleteCandidate(confirmDelete); setConfirmDelete(null); }}
                      style={{ background:th.error, boxShadow:`0 6px 18px ${alpha(th.error,0.3)}` }}>
                      <Icon name="trash" size={16} /> מחק לצמיתות
                    </Btn>
                  </div>
                </>
              )}
            </Sheet>
          );
        })()}

        {/* ── LISTS ── */}
        {tab === 'lists' && (() => {
          const liveRegions       = (lists.regions       && lists.regions.length)       ? lists.regions       : REGIONS;
          const liveReligiosity   = (lists.religiosity    && lists.religiosity.length)   ? lists.religiosity   : RELIGIOSITY;
          const liveInterests     = (lists.interests      && lists.interests.length)     ? lists.interests     : INTERESTS;
          const livePartnerTraits = (lists.partnerTraits  && lists.partnerTraits.length) ? lists.partnerTraits : PARTNER_TRAITS;
          const DEFAULT_DEL_REASONS = ['מצאתי בן/בת זוג בדרך אחרת', 'אין לי זמן כרגע', 'לא מרוצה מהשירות', 'לוקח/ת הפסקה', 'אחר'];
          const liveDeleteReasons = (lists.deleteReasons  && lists.deleteReasons.length) ? lists.deleteReasons : DEFAULT_DEL_REASONS;

          const listDefs = [

        {/* ── TEXTS (CMS) ── */}

            {Object.entries(TEXT_KEYS).map(([key, label]) => (

        {/* ── DANGER ZONE ── */}

          ];
          const doWipe = async (action) => {
            setWiping(true);
            try {
              const snap = await db.collection(action.col).get();
              const toDelete = action.skipAdmin ? snap.docs.filter(d => d.id !== profile?.uid) : snap.docs;
              for (let i = 0; i < toDelete.length; i += 500) {

            setConfirmWipe(null);

          return (
            <div>

              {/* ── EMAIL FOR NOTIFICATIONS ── */}
              <div style={{ background: th.card, borderRadius: th.r, padding: '14px 16px', marginBottom: 16, boxShadow: `0 3px 10px ${alpha(th.ink,0.05)}` }}>

                <div style={{ fontFamily: th.body, fontSize: 12.5, color: alpha(th.ink, 0.5), marginBottom: 10, lineHeight: 1.4 }}>

                </div>
                <div style={{ display:'flex', gap:8 }}>
                  <input value={notifEmailInput} onChange={e => setNotifEmailInput(e.target.value)} placeholder="example@email.com" dir="ltr"
                    style={{ flex:1, border:`1.5px solid ${alpha(th.ink,0.15)}`, borderRadius:th.rSm, padding:'9px 12px', fontFamily:th.body, fontSize:13.5, outline:'none', background:th.cream }} />
                  <button disabled={savingEmail || notifEmailInput === notifEmail}
                    onClick={async () => { setSavingEmail(true); await db.collection('config').doc('settings').set({ notifEmail: notifEmailInput }, { merge: true }); setNotifEmail(notifEmailInput); setSavingEmail(false); }}
                    style={{ padding:'9px 16px', borderRadius:th.rSm, border:'none', background: notifEmailInput !== notifEmail ? th.primary : alpha(th.ink,0.1), color: notifEmailInput !== notifEmail ? '#fff' : alpha(th.ink,0.4), fontFamily:th.display, fontWeight:800, fontSize:13, cursor:'pointer', whiteSpace:'nowrap' }}>
                    {savingEmail ? 'שומר…' : 'שמור'}
                  </button>
                </div>
                {notifEmail && <div style={{ fontFamily:th.body, fontSize:11.5, color:th.success, marginTop:6 }}>✓ שמור: {notifEmail}</div>}
              </div>

              {/* ── DELETION LOG ── */}
              {deletionLog.length > 0 && (
                <div style={{ background: th.card, borderRadius: th.r, padding: '14px 16px', marginBottom: 20, boxShadow: `0 3px 10px ${alpha(th.ink,0.05)}` }}>
                  <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 14, color: th.ink, marginBottom: 12 }}>🗑️ יומן מחיקות ({deletionLog.length})</div>
                  <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
                    {deletionLog.map(d => (
                      <div key={d.id} style={{ borderBottom:`1px solid ${alpha(th.ink,0.07)}`, paddingBottom:8, marginBottom:0 }}>
                        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:2 }}>
                          <span style={{ fontFamily:th.display, fontWeight:700, fontSize:13, color:th.ink }}>{d.candName || '(ללא שם)'}</span>
                          <span style={{ fontFamily:th.body, fontSize:11, color:alpha(th.ink,0.4) }}>
                            {d.at?.seconds ? new Date(d.at.seconds*1000).toLocaleDateString('he-IL') : ''}
                          </span>
                        </div>
                        <div style={{ fontFamily:th.body, fontSize:12.5, color:alpha(th.ink,0.6) }}>{d.reason || '—'}</div>
                        {d.note && <div style={{ fontFamily:th.body, fontSize:12, color:alpha(th.ink,0.45), fontStyle:'italic', marginTop:2 }}>"{d.note}"</div>}
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <div style={{ background: alpha(th.error, 0.07), border: `1.5px solid ${alpha(th.error, 0.28)}`, borderRadius: th.r, padding: '14px 16px', marginBottom: 20, display: 'flex', gap: 12, alignItems: 'flex-start' }}>
                <span style={{ fontSize: 24, lineHeight: 1 }}>☠️</span>
                <div>
                  <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 15, color: th.error, marginBottom: 4 }}>אזור מסוכן</div>
                  <div style={{ fontFamily: th.body, fontSize: 13, color: alpha(th.ink, 0.65), lineHeight: 1.55 }}>
                    הפעולות כאן הן <strong>בלתי הפיכות לחלוטין</strong>. אין undo, אין שחזור. יש לפעול בזהירות קיצונית.
                  </div>
                </div>
              </div>
              {WIPE_ACTIONS.map(action => (
                <div key={action.id} style={{ background: th.card, borderRadius: th.r, padding: '14px 16px', marginBottom: 10, border: `1.5px solid ${confirmWipe === action.id ? th.error : alpha(th.ink, 0.08)}`, transition: 'border-color .15s' }}>
                  <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 15, color: th.ink, marginBottom: 3 }}>{action.label}</div>
                  <div style={{ fontFamily: th.body, fontSize: 13, color: alpha(th.ink, 0.5), marginBottom: 12 }}>{action.desc}</div>
                  {confirmWipe !== action.id ? (
                    <button onClick={() => setConfirmWipe(action.id)}
                      style={{ border: `1.5px solid ${th.error}`, borderRadius: th.rSm, padding: '7px 16px', background: 'transparent', cursor: 'pointer', fontFamily: th.display, fontWeight: 800, fontSize: 13, color: th.error }}>
                      מחק הכל
                    </button>
                  ) : (
                    <div style={{ background: alpha(th.error, 0.07), borderRadius: th.rSm, padding: '12px 14px' }}>
                      <div style={{ fontFamily: th.body, fontSize: 13, fontWeight: 700, color: th.error, marginBottom: 10 }}>
                        ⚠️ האם אתה בטוח לחלוטין? פעולה זו בלתי הפיכה לחלוטין.
                      </div>
                      <div style={{ display: 'flex', gap: 8 }}>
                        <button disabled={wiping} onClick={() => doWipe(action)}
                          style={{ flex: 1, border: 'none', borderRadius: th.rSm, padding: '9px 0', background: th.error, cursor: wiping ? 'default' : 'pointer', fontFamily: th.display, fontWeight: 800, fontSize: 13, color: '#fff', opacity: wiping ? 0.6 : 1 }}>
                          {wiping ? 'מוחק…' : 'כן, מחק הכל'}
                        </button>
                        <button disabled={wiping} onClick={() => setConfirmWipe(null)}
                          style={{ border: `1.5px solid ${alpha(th.ink, 0.15)}`, borderRadius: th.rSm, padding: '9px 16px', background: 'transparent', cursor: 'pointer', fontFamily: th.display, fontWeight: 800, fontSize: 13, color: alpha(th.ink, 0.5) }}>
                          ביטול
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              ))}
            </div>
          );
        })()}

        {/* ── USERS (matchmakers) ── */}
        {tab === 'users' && (() => {
          return Object.values(visibleMms).map(u => {
            const mmCands = visibleCands.filter(c => c.mmId === u.id);
            return (
              <div key={u.id} style={{ background: th.card, borderRadius: th.r, padding: 12, marginBottom: 10, boxShadow: `0 3px 10px ${alpha(th.ink, 0.05)}` }}>
                {/* matchmaker row */}
                <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: mmCands.length ? 10 : 0 }}>
                  <Avatar grad={gradForId(u.id)} name={u.displayName || u.email} size={40} photo={u.photoURL} />
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 14, color: th.ink }}>{u.displayName || u.email}</div>
                    <div style={{ fontFamily: th.body, fontSize: 12, color: alpha(th.ink, 0.5) }}>{u.email} · {mmCands.length} מועמדים</div>
                  </div>
                  <button onClick={() => setUserAdmin(u.id, !u.isAdmin)} style={{ border: 'none', borderRadius: 999, padding: '5px 10px', cursor: 'pointer', fontFamily: th.body, fontWeight: 700, fontSize: 11, background: u.isAdmin ? alpha(th.gold, 0.15) : alpha(th.ink, 0.07), color: u.isAdmin ? th.gold : alpha(th.ink, 0.5) }}>
                    {u.isAdmin ? 'מנהל ✓' : 'מנהל'}
                  </button>
                  <button onClick={() => { startImpersonate(u.id, u, 'matchmaker'); go('home'); }}
                    style={{ border: 'none', borderRadius: 999, padding: '5px 10px', cursor: 'pointer', fontFamily: th.display, fontWeight: 800, fontSize: 11, background: alpha('#7B2D00', 0.1), color: '#7B2D00' }}>
                    🎭 התחזה
                  </button>
                </div>
                {/* candidates mini-list */}
                {mmCands.length > 0 && (
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, paddingTop: 8, borderTop: `1px solid ${alpha(th.ink,0.07)}` }}>
                    {mmCands.map(c => (
                      <button key={c.id} onClick={() => go('candidate', { id: c.id })}
                        style={{ all:'unset', cursor:'pointer', display:'flex', alignItems:'center', gap:5, background:alpha(th.ink,0.05), borderRadius:999, padding:'4px 10px 4px 6px' }}>
                        <Avatar grad={gradForId(c.id)} name={c.name} size={22} photo={c.photos?.[0]} />
                        <span style={{ fontFamily:th.body, fontSize:12, fontWeight:600, color:th.ink }}>{c.name}</span>
                      </button>
                    ))}
                  </div>
                )}
              </div>
            );
          });
        })()}
      </div>
    </div>
  );
}

function CandidateForm({ th, initial, onSave, onCancel, onUpload, onUploadVoice, reviewMode, showMmNote, onApprove, onSaveStep }) {
  const { lists } = useContext(DataCtx);
  const { texts: _tx, defaults: _dx } = useContext(TextsCtx);
  const _t = (key) => _tx[key] || _dx[key] || '';
  const liveRegions       = (lists.regions      && lists.regions.length)      ? lists.regions      : REGIONS;
  const liveReligiosity   = (lists.religiosity   && lists.religiosity.length)  ? lists.religiosity  : RELIGIOSITY;
  const liveInterests     = (lists.interests     && lists.interests.length)    ? lists.interests    : INTERESTS;
  const livePartnerTraits = (lists.partnerTraits && lists.partnerTraits.length) ? lists.partnerTraits : PARTNER_TRAITS;

  const [step, setStep] = useState(0);
  const normFamily = (v) => v?.includes('גרוש') ? 'גרוש/ה' : v?.includes('אלמן') || v?.includes('אלמנ') ? 'אלמן/ה' : 'רווק/ה';
  const [f, setF] = useState(() => {
    const base = initial || { name:'', age:'', gender:'אשה', region:'', religiosity:'', family:'רווק/ה', kids:0, sabaBut:'', oneLine:'', seesWith:'', interests:[], partner:[], discrete:'', available:true };
    const fam = base.family || '';
    return { ...base, family: ['רווק/ה','גרוש/ה','אלמן/ה'].includes(fam) ? fam : normFamily(fam), kids: base.kids || 0 };
  });
  const set = (k) => (v) => setF(s => ({ ...s, [k]: v }));
  const [uploading, setUploading] = useState(false);
  const [photos, setPhotos] = useState(initial?.photos || []);

  const [voiceRecording, setVoiceRecording] = useState(false);
  const [voiceRec, setVoiceRec] = useState(null);
  const [voiceBlob, setVoiceBlob] = useState(null);
  const [voiceUrl, setVoiceUrl] = useState(initial?.voiceNote || null);
  const [voiceUploading, setVoiceUploading] = useState(false);
  const voiceChunksRef = React.useRef([]);
  const [mmNote, setMmNote] = useState(initial?.mmNote || '');

  useEffect(() => {
    if (!voiceBlob || !onUploadVoice) return;
    let canceled = false;
    setVoiceUploading(true);
    onUploadVoice(voiceBlob)
      .then(url => { if (!canceled) { setVoiceUrl(url); setVoiceBlob(null); } })
      .catch(() => { if (!canceled) alert('שגיאה בהעלאת ההקלטה — נסה/י שוב'); })
      .finally(() => { if (!canceled) setVoiceUploading(false); });
    return () => { canceled = true; };
  }, [voiceBlob]);

  const startVoiceRecording = async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      voiceChunksRef.current = [];
      const mr = new MediaRecorder(stream);
      mr.ondataavailable = e => { if (e.data.size > 0) voiceChunksRef.current.push(e.data); };
      mr.onstop = () => {
        const blob = new Blob(voiceChunksRef.current, { type: mr.mimeType || 'audio/webm' });
        setVoiceBlob(blob);
        stream.getTracks().forEach(t => t.stop());
      };
      mr.start();
      setVoiceRec(mr);
      setVoiceRecording(true);
    } catch { alert('לא ניתן לגשת למיקרופון'); }
  };

  const stopVoiceRecording = () => {
    if (voiceRec) { voiceRec.stop(); setVoiceRec(null); setVoiceRecording(false); }
  };

  const steps = onUpload
    ? ['פרטים בסיסיים', 'תמונות', 'הקלטה קולית', 'אישיות', 'תחומי עניין', ...(showMmNote ? ['דבר השדכן'] : []), 'פרטים נוספים']
    : ['פרטים בסיסיים', 'אישיות', 'תחומי עניין', ...(showMmNote ? ['דבר השדכן'] : []), 'פרטים נוספים'];

  const EmptyHighlight = ({ isEmpty, children }) => !reviewMode || !isEmpty ? children : (
    <div style={{ borderRadius: th.r, border: `1.5px solid ${alpha(th.primary, 0.45)}`, background: alpha(th.primary, 0.04), padding: 10, position: 'relative' }}>
      <div style={{ fontFamily: th.display, fontSize: 11, fontWeight: 800, color: th.primary, marginBottom: 6 }}>
        כדאי למלא — יחזק את הכרטיסייה
      </div>
      {children}
    </div>
  );

  const isLast = step === steps.length - 1;
  const stepName = steps[step];

  const addPhoto = async (e) => {
    const files = Array.from(e.target.files || []); if (!files.length) return;
    setUploading(true);
    try {
      const urls = await Promise.all(files.map(file => onUpload(file)));
      setPhotos(p => [...p, ...urls]);
    } finally { setUploading(false); if (e.target) e.target.value = ''; }
  };
  const removePhoto = (i) => setPhotos(p => p.filter((_, j) => j !== i));
  const setPrimaryPhoto = (i) => setPhotos(p => { const a = [...p]; [a[0], a[i]] = [a[i], a[0]]; return a; });

  const StepDots = () => (
    <div style={{ display: 'flex', justifyContent: 'center', gap: 6, marginBottom: 18 }}>
      {steps.map((s, i) => (
        <div key={i} onClick={() => i < step && setStep(i)} style={{ width: i === step ? 22 : 8, height: 8, borderRadius: 999, background: i === step ? th.primary : i < step ? alpha(th.primary, 0.4) : alpha(th.ink, 0.15), cursor: i < step ? 'pointer' : 'default', transition: 'all 0.2s' }} />
      ))}
    </div>
  );

  return (
    <div style={{ background: alpha(th.ink, 0.03), borderRadius: th.r, padding: 16, marginBottom: 12, border: `1.5px solid ${alpha(th.ink,0.1)}` }}>
      <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 15, color: th.ink, marginBottom: 10, textAlign: 'center' }}>
        {stepName}
      </div>
      <StepDots />

      {stepName === 'פרטים בסיסיים' && (
        <>
          <Field th={th} label="שם"><TextInput th={th} value={f.name} onChange={set('name')} /></Field>
          <Field th={th} label="טלפון"><TextInput th={th} type="tel" value={f.phone || ''} onChange={set('phone')} placeholder="05X-XXXXXXX" /></Field>
          <Field th={th} label="גיל"><TextInput th={th} type="number" value={f.age} onChange={v => setF(s => ({...s, age: +v}))} /></Field>
          <Field th={th} label="מין"><Segmented th={th} value={f.gender} onChange={set('gender')} options={['אשה', 'גבר']} /></Field>
          <Field th={th} label="אזור"><Select th={th} value={f.region} onChange={set('region')} options={liveRegions} /></Field>
          <Field th={th} label="קרבה לדת"><Select th={th} value={f.religiosity} onChange={set('religiosity')} options={liveReligiosity} /></Field>
          <Field th={th} label="סטטוס משפחתי"><Segmented th={th} value={f.family} onChange={set('family')} options={['רווק/ה', 'גרוש/ה', 'אלמן/ה']} /></Field>
          <Field th={th} label="ילדים">
            <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
              <Segmented th={th} value={(f.kids||0) > 0 ? 'עם ילדים' : 'ללא ילדים'} onChange={v => setF(s => ({ ...s, kids: v === 'עם ילדים' ? 1 : 0 }))} options={['ללא ילדים', 'עם ילדים']} />
              {(f.kids||0) > 0 && (
                <div style={{ display:'flex', alignItems:'center', gap:12 }}>
                  <button onClick={() => setF(s => ({ ...s, kids: Math.max(1, s.kids - 1) }))} style={{ width:36, height:36, borderRadius:'50%', border:`1.5px solid ${alpha(th.ink,0.18)}`, background:th.card, cursor:'pointer', fontFamily:th.display, fontWeight:800, fontSize:20, color:th.ink, display:'flex', alignItems:'center', justifyContent:'center' }}>−</button>
                  <span style={{ fontFamily:th.display, fontWeight:800, fontSize:20, color:th.ink, minWidth:28, textAlign:'center' }}>{f.kids}</span>
                  <button onClick={() => setF(s => ({ ...s, kids: s.kids + 1 }))} style={{ width:36, height:36, borderRadius:'50%', border:`1.5px solid ${alpha(th.ink,0.18)}`, background:th.card, cursor:'pointer', fontFamily:th.display, fontWeight:800, fontSize:20, color:th.ink, display:'flex', alignItems:'center', justifyContent:'center' }}>+</button>
                  <span style={{ fontFamily:th.body, fontSize:13.5, color:alpha(th.ink,0.5) }}>ילדים</span>
                </div>
              )}
            </div>
          </Field>
        </>
      )}

      {stepName === 'תמונות' && (
        <div>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:14 }}>
            <div style={{ fontFamily:th.body, fontSize:13, color:alpha(th.ink,0.5) }}>תמונות מאונכות, פנים ברורות</div>
            <div style={{ fontFamily:th.display, fontWeight:800, fontSize:12,
              color: photos.length > 0 ? th.success : alpha(th.ink,0.4),
              background: photos.length > 0 ? alpha(th.success,0.1) : alpha(th.ink,0.06),
              borderRadius:999, padding:'4px 11px' }}>
              {photos.length > 0 ? `✓ ${photos.length} תמונות` : 'אין עדיין'}
            </div>
          </div>
          {photos.length === 0 && (
            <label style={{ display:'block', cursor: uploading ? 'default' : 'pointer' }}>
              <div style={{ border:`2px dashed ${alpha(th.primary,0.35)}`, borderRadius:th.rLg,
                background:alpha(th.primary,0.04), padding:'40px 20px', textAlign:'center' }}>
                <div style={{ fontSize:48, marginBottom:10 }}>{uploading ? '⏳' : '📸'}</div>
                <div style={{ fontFamily:th.display, fontWeight:800, fontSize:18, color:th.ink, marginBottom:6 }}>
                  {uploading ? 'מעלה תמונות…' : 'הוסף/י תמונות'}
                </div>
                <div style={{ fontFamily:th.body, fontSize:13, color:alpha(th.ink,0.5), lineHeight:1.5, marginBottom:18 }}>
                  מומלץ לפחות 2–3 תמונות<br/>ניתן לבחור כמה קבצים בבת אחת
                </div>
                {!uploading && (
                  <div style={{ display:'inline-block', background:th.primary, color:'#fff',
                    borderRadius:999, padding:'10px 26px', fontFamily:th.display, fontWeight:800, fontSize:14,
                    boxShadow:`0 6px 18px ${alpha(th.primary,0.3)}` }}>
                    בחר/י קבצים
                  </div>
                )}
              </div>
              <input type="file" accept="image/*" multiple style={{ display:'none' }} onChange={addPhoto} disabled={uploading} />
            </label>
          )}
          {photos.length > 0 && (
            <>
              <div style={{ display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap:8, marginBottom:10 }}>
                {photos.map((url, i) => (
                  <div key={i} onClick={() => i !== 0 && setPrimaryPhoto(i)}
                    style={{ position:'relative', aspectRatio:'3/4', cursor: i !== 0 ? 'pointer' : 'default' }}>
                    <img src={url} alt="" loading="lazy"
                      style={{ width:'100%', height:'100%', borderRadius:th.r, objectFit:'cover', display:'block',
                        outline: i === 0 ? `2.5px solid ${th.primary}` : 'none', outlineOffset:'-2px' }} />
                    <button onClick={(e) => { e.stopPropagation(); removePhoto(i); }}
                      style={{ position:'absolute', top:5, insetInlineEnd:5, width:24, height:24,
                        borderRadius:'50%', border:'none', background:'rgba(0,0,0,0.55)',
                        color:'#fff', fontSize:15, cursor:'pointer', lineHeight:1,
                        display:'flex', alignItems:'center', justifyContent:'center' }}>×</button>
                    {i === 0
                      ? <div style={{ position:'absolute', bottom:5, insetInlineStart:5,
                          background:'rgba(0,0,0,0.6)', color:'#fff', borderRadius:999,
                          padding:'3px 8px', fontFamily:th.display, fontWeight:700, fontSize:10 }}>★ ראשי</div>
                      : <div style={{ position:'absolute', bottom:5, insetInlineStart:5,
                          background:'rgba(0,0,0,0.35)', color:'rgba(255,255,255,0.75)', borderRadius:999,
                          padding:'3px 7px', fontFamily:th.display, fontSize:9.5 }}>☆ הגדר כראשי</div>
                    }
                  </div>
                ))}
                <label style={{ aspectRatio:'3/4', borderRadius:th.r,
                  border:`2px dashed ${alpha(th.ink,0.2)}`, display:'flex',
                  flexDirection:'column', alignItems:'center', justifyContent:'center',
                  gap:5, cursor: uploading ? 'default' : 'pointer',
                  color: uploading ? alpha(th.ink,0.3) : th.primary, background: th.card }}>
                  {uploading
                    ? <span style={{ fontFamily:th.body, fontSize:11 }}>מעלה…</span>
                    : <><Icon name="plus" size={24} /><span style={{ fontFamily:th.body, fontSize:11, fontWeight:700 }}>הוסף/י</span></>}
                  <input type="file" accept="image/*" multiple style={{ display:'none' }} onChange={addPhoto} disabled={uploading} />
                </label>
              </div>
              <div style={{ fontFamily:th.body, fontSize:11.5, color:alpha(th.ink,0.45), textAlign:'center' }}>
                לחץ/י על תמונה להגדרת תמונה ראשית
              </div>
            </>
          )}
        </div>
      )}

      {stepName === 'הקלטה קולית' && (
        <div style={{ textAlign:'center', padding:'8px 0' }}>
          {reviewMode && !voiceUrl && (
            <div style={{ borderRadius: th.r, border: `1.5px solid ${alpha(th.primary, 0.45)}`, background: alpha(th.primary, 0.04), padding: '8px 12px', marginBottom: 14, textAlign: 'right' }}>
              <div style={{ fontFamily: th.display, fontSize: 11, fontWeight: 800, color: th.primary }}>כדאי להוסיף הקלטה — מוסיפה אמינות לכרטיסייה</div>
            </div>
          )}
          <div style={{ fontFamily:th.body, fontSize:14, color:alpha(th.ink,0.6), lineHeight:1.6, marginBottom:20 }}>
            הקלט/י כמה מילים על המועמד/ת<br/>
            <span style={{ fontSize:12.5, opacity:0.8 }}>הקלטה מוסיפה אישיות — שדכנים אחרים ישמעו אותך</span>
          </div>

          {voiceUrl && (
            <div style={{ marginBottom:16 }}>
              <div style={{ fontFamily:th.display, fontWeight:800, fontSize:13, color:th.primary, marginBottom:10 }}>✓ ההקלטה נשמרה</div>
              <audio controls src={voiceUrl} style={{ width:'100%', maxWidth:340, borderRadius:8 }} />
              <button onClick={() => { setVoiceUrl(null); setVoiceBlob(null); }}
                style={{ fontFamily:th.body, fontSize:13, color:th.error, background:'none', border:'none', cursor:'pointer', fontWeight:700, marginTop:10 }}>
                × הסר והקלט מחדש
              </button>
            </div>
          )}

          {voiceUploading && (
            <div style={{ fontFamily:th.body, fontSize:14, color:th.primary, margin:'20px 0' }}>
              ⏳ שומר הקלטה…
            </div>
          )}

          {!voiceUrl && !voiceUploading && (
            <>
              <button
                onClick={voiceRecording ? stopVoiceRecording : startVoiceRecording}
                style={{ width:88, height:88, borderRadius:'50%', border:`3px solid ${voiceRecording ? th.error : th.primary}`, background:voiceRecording ? alpha(th.error,0.09) : alpha(th.primary,0.09), cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 14px', transition:'all 0.2s', boxShadow:voiceRecording ? `0 0 0 10px ${alpha(th.error,0.1)}` : 'none' }}>
                <Icon name={voiceRecording ? 'stop' : 'mic'} size={38} color={voiceRecording ? th.error : th.primary} fill={voiceRecording ? alpha(th.error,0.25) : alpha(th.primary,0.15)} />
              </button>
              <div style={{ fontFamily:th.body, fontSize:13.5, color:voiceRecording ? th.error : alpha(th.ink,0.5), fontWeight:voiceRecording ? 700 : 400, marginBottom:14, transition:'color 0.2s' }}>
                {voiceRecording ? '⏺ מקליט… לחץ/י להפסקה' : 'לחץ/י להתחיל הקלטה'}
              </div>
            </>
          )}
        </div>
      )}

      {stepName === 'אישיות' && (
        <>
          <EmptyHighlight isEmpty={!f.sabaBut}>
            <Field th={th} label="סבבה והכל, אבל…" hint='למשל: "שואל את גוגל Maps כשהוא יודע בדיוק לאן הוא הולך"'>
              <TextArea th={th} value={f.sabaBut} onChange={set('sabaBut')} placeholder='משהו אמיתי ומצחיק שמאפיין אותו/ה…' rows={2} />
            </Field>
          </EmptyHighlight>
          <EmptyHighlight isEmpty={!f.oneLine}>
            <Field th={th} label="במשפט אחד"><TextInput th={th} value={f.oneLine} onChange={set('oneLine')} placeholder='הגדרה קצרה של האדם…' /></Field>
          </EmptyHighlight>
          <EmptyHighlight isEmpty={!f.seesWith}>
            <Field th={th} label="רואה את עצמו/ה עם">
              <TextArea th={th} value={f.seesWith} onChange={set('seesWith')} placeholder='תאר/י את הזוגיות שהוא/היא מדמיין/ת לעצמו/ה…' rows={3} />
            </Field>
          </EmptyHighlight>
        </>
      )}

      {stepName === 'תחומי עניין' && (
        <>
          <EmptyHighlight isEmpty={!(f.interests?.length)}>
            <Field th={th} label="תחומי עניין">
              <MultiChips th={th} value={f.interests} onChange={v => setF(s => ({...s, interests: v}))} options={liveInterests} tone={th.primary} />
            </Field>
          </EmptyHighlight>
          <EmptyHighlight isEmpty={!(f.partner?.length)}>
            <Field th={th} label="חשוב בפרטנר">
              <MultiChips th={th} value={f.partner} onChange={v => setF(s => ({...s, partner: v}))} options={livePartnerTraits} tone={th.gold} />
            </Field>
          </EmptyHighlight>
        </>
      )}

      {stepName === 'פרטים נוספים' && (
        <div>
          <div style={{ background: alpha(th.ink, 0.04), border: `1.5px solid ${alpha(th.ink, 0.12)}`, borderRadius: th.r, padding: '12px 14px', marginBottom: 14, display: 'flex', gap: 11, alignItems: 'flex-start' }}>
            <div style={{ flexShrink: 0, width: 36, height: 36, borderRadius: '50%', background: alpha(th.ink, 0.08), display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={alpha(th.ink, 0.65)} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 13, color: th.ink, marginBottom: 3 }}>
                גלוי לך בלבד
              </div>
              <div style={{ fontFamily: th.body, fontSize: 12.5, color: alpha(th.ink, 0.55), lineHeight: 1.5 }}>
                שדכנים אחרים לא רואים שדה זה.<br/>
                אם למועמד/ת יש כמה שדכנים — כל אחד רואה רק את מה <em>שהוא</em> כתב כאן.
              </div>
            </div>
          </div>
          <TextArea th={th} value={f.discrete} onChange={set('discrete')} rows={4} placeholder='מידע רגיש שחשוב לדעת…' />
        </div>
      )}

      {stepName === 'דבר השדכן' && (
        <div>
          <div style={{ fontFamily:th.body, fontSize:13.5, color:alpha(th.ink,0.6), lineHeight:1.6, marginBottom:14 }}>
            כתוב/י משפט או שניים על המועמד/ת מנקודת מבטך — יופיע בכרטיסייה עם תמונתך ושמך.
          </div>
          <TextArea th={th} value={mmNote} onChange={setMmNote} placeholder='למה אני משדך/ת את האדם הזה? מה מיוחד בו/ה?' rows={4} />
        </div>
      )}

      <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginTop: 16 }}>
        {isLast && onApprove && (
          <Btn th={th} full variant="success" onClick={() => onApprove({ ...f, ...(onUpload ? { photos, voiceNote: voiceUrl || null } : {}), ...(showMmNote ? { mmNote } : {}) })}>
            {_t('review_approve_btn')}
          </Btn>
        )}
        <div style={{ display: 'flex', gap: 8 }}>
          {step > 0
            ? <Btn th={th} variant="ghost" onClick={() => setStep(s => s - 1)}>← חזרה</Btn>
            : <Btn th={th} variant="ghost" onClick={onCancel}>ביטול</Btn>
          }
          {!isLast && onSaveStep && (
            <Btn th={th} variant="soft" onClick={() => onSaveStep({ ...f, ...(onUpload ? { photos, voiceNote: voiceUrl || null } : {}), ...(showMmNote ? { mmNote } : {}) })}>שמור וצא</Btn>
          )}
          {isLast
            ? <Btn th={th} full variant={onApprove ? 'ghost' : 'primary'} onClick={() => onSave({ ...f, ...(onUpload ? { photos, voiceNote: voiceUrl || null } : {}), ...(showMmNote ? { mmNote } : {}) })}>{onApprove ? 'שמור בלבד' : 'שמור'}</Btn>
            : <Btn th={th} full onClick={() => setStep(s => s + 1)}>הבא ←</Btn>
          }
        </div>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// ONBOARDING
// ════════════════════════════════════════════════════════════
function Onboarding({ th, go }) {
  const [i, setI] = useS(0);
  const { texts: tx, defaults: dx } = useContext(TextsCtx);
  const t = (key) => tx[key] || dx[key] || '';
  const slides = [
    { kind: 'friends', title: t('onb_slide1_title'), body: t('onb_slide1_body') },
    { kind: 'list',    title: t('onb_slide2_title'), body: t('onb_slide2_body') },
    { kind: 'ai',      title: t('onb_slide3_title'), body: t('onb_slide3_body') },
  ];
  const last = i === slides.length - 1;
  const s = slides[i];

  const Scene = () => {
    if (s.kind === 'list') return (
      <div style={{ position: 'relative', width: 220, height: 200 }}>
        {[2, 1, 0].map((k, idx) => (
          <div key={k} style={{
            position: 'absolute', top: k * 18, right: k * 14, left: k * 14,
            background: th.card, borderRadius: th.r, padding: 14,
            boxShadow: `0 10px 26px ${alpha(th.ink, 0.12)}`,
            display: 'flex', alignItems: 'center', gap: 12,
            transform: `scale(${1 - k * 0.05})`, opacity: 1 - k * 0.15,
          }}>
            <Avatar grad={AV_GRADS[idx * 2]} name={['ד','א','ש'][idx]} size={42} />
            <div style={{ flex: 1 }}>
              <div style={{ height: 9, width: '60%', background: alpha(th.ink, 0.15), borderRadius: 6, marginBottom: 7 }} />
              <div style={{ height: 7, width: '85%', background: alpha(th.primary, 0.25), borderRadius: 6 }} />
            </div>
          </div>
        ))}
      </div>
    );
    if (s.kind === 'friends') return (
      <div style={{ display: 'flex', alignItems: 'center', gap: 0 }}>
        <Avatar grad={AV_GRADS[4]} name="נ" size={92} style={{ marginInlineEnd: -16, zIndex: 2 }} />
        <div style={{ zIndex: 3, background: th.primary, borderRadius: '50%', width: 56, height: 56, display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff', boxShadow: `0 10px 24px ${alpha(th.primary,0.4)}` }}>
          <Icon name="heart" size={30} fill="#fff" stroke={0} />
        </div>
        <Avatar grad={AV_GRADS[3]} name="א" size={92} style={{ marginInlineStart: -16, zIndex: 1 }} />
      </div>
    );
    if (s.kind === 'ai') return (
      <div style={{ position: 'relative', color: th.gold }}>
        <div style={{ background: alpha(th.gold, 0.14), borderRadius: 40, padding: 30 }}>
          <Icon name="robot" size={90} stroke={1.6} />
        </div>
        <div style={{ position: 'absolute', bottom: -6, left: -6, color: th.primary, background: th.cream, borderRadius: '50%', padding: 8 }}>
          <Icon name="rose" size={34} stroke={1.8} />
        </div>
      </div>
    );
    return <Logo size={150} color={th.primary} flaw={th.cream} />;
  };

  return (
    <div style={{
      height: '100%', display: 'flex', flexDirection: 'column',
      background: `linear-gradient(170deg, ${th.cream}, ${tint(th.primary, 0.84)})`,
      direction: 'rtl', fontFamily: th.body, position: 'relative',
    }}>
      {/* skip */}
      <div style={{ paddingTop: 52, paddingInline: 20, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 7 }}>
          <Logo size={26} color={th.primary} flaw={th.cream} />
          <span style={{ fontFamily: th.display, fontWeight: 800, color: th.ink, fontSize: 18 }}>סבבה והכל</span>
        </div>
        {!last && <button onClick={() => setI(slides.length - 1)} style={{ border: 'none', background: 'none', color: alpha(th.ink, 0.5), fontFamily: th.body, fontWeight: 700, fontSize: 14, cursor: 'pointer' }}>דלג/י</button>}
      </div>

      {/* scene */}
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '0 28px', textAlign: 'center' }}>
        <div key={i} style={{ marginBottom: 40, animation: 'sabaPop .5s cubic-bezier(.2,.9,.3,1)', display: 'flex', justifyContent: 'center' }}><Scene /></div>
        <h1 key={'t'+i} style={{ fontFamily: th.display, fontSize: 28, color: th.ink, margin: '0 0 12px', lineHeight: 1.15, animation: 'sabaUp .4s ease' }}>{s.title}</h1>
        <p style={{ fontFamily: th.body, fontSize: 16.5, color: alpha(th.ink, 0.62), lineHeight: 1.5, maxWidth: 300, margin: 0, textWrap: 'pretty' }}>{s.body}</p>
      </div>

      {/* dots + controls */}
      <div style={{ padding: '0 24px 40px' }}>
        <div style={{ display: 'flex', justifyContent: 'center', gap: 7, marginBottom: 22 }}>
          {slides.map((_, k) => (
            <div key={k} onClick={() => setI(k)} style={{
              width: k === i ? 22 : 8, height: 8, borderRadius: 99, cursor: 'pointer',
              background: k === i ? th.primary : alpha(th.ink, 0.18), transition: 'all .3s',
            }} />
          ))}
        </div>
        {last ? (
          <Btn th={th} full size="l" onClick={() => go('register')}>שנתחיל?</Btn>
        ) : (
          <Btn th={th} full size="l" onClick={() => setI(i + 1)} icon={<span style={{ transform: 'scaleX(-1)', display: 'inline-flex' }}><Icon name="arrow" size={20} /></span>}>הבא</Btn>
        )}
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// MATCHMAKER REGISTRATION
// ════════════════════════════════════════════════════════════
function Register({ th, go }) {
  const { user } = useContext(AuthCtx);
  const { texts: tx, defaults: dx } = useContext(TextsCtx);
  const t = (key) => tx[key] || dx[key] || '';
  const [step, setStep] = useS(1);
  const [firstName, setFirstName] = useS('');
  const [lastName, setLastName] = useS('');
  const [phone, setPhone] = useS('');
  const [phoneError, setPhoneError] = useS('');
  const [photoURL, setPhotoURL] = useS('');
  const [uploading, setUploading] = useS(false);
  const [saving, setSaving] = useS(false);

  const isPhoneValid = (p) => {
    const d = p.replace(/\D/g, '');
    return (d.length === 10 && d.startsWith('05')) || (d.length === 12 && d.startsWith('9725'));
  };

  const step1Valid = firstName.trim() && lastName.trim() && phone && isPhoneValid(phone);

  const handlePhoneBlur = () => {
    if (phone && !isPhoneValid(phone)) setPhoneError('מספר לא תקין — לדוגמה: 050-0000000');
    else setPhoneError('');
  };

  const handlePhoto = async (e) => {
    const file = e.target.files[0];
    if (!file || !user) return;
    setUploading(true);
    try {
      const ref = storage.ref(`profiles/${user.uid}/${Date.now()}_${file.name}`);
      await ref.put(file);
      const url = await ref.getDownloadURL();
      setPhotoURL(url);
    } catch(err) { alert('שגיאה בהעלאת תמונה: ' + err.message); }
    setUploading(false);
  };

  const handleSave = async () => {
    if (!user) return;
    setSaving(true);
    try {
      await db.collection('users').doc(user.uid).update({
        displayName: `${firstName.trim()} ${lastName.trim()}`,
        phone: phone.trim(),
        ...(photoURL ? { photoURL } : {}),
        profileComplete: true,
      });
      go('home');
    } catch(err) { alert('שגיאה: ' + err.message); setSaving(false); }
  };

  const StepDots = ({ active }) => (
    <div style={{ display: 'flex', gap: 6, justifyContent: 'center', marginBottom: 28 }}>
      {[1, 2].map(n => (
        <div key={n} style={{ height: 4, borderRadius: 2, transition: 'all 0.25s',
          width: active === n ? 28 : 16,
          background: active === n ? th.primary : alpha(th.ink, 0.15) }} />
      ))}
    </div>
  );

  if (step === 1) return (
    <>
      <AppHeader th={th} title={t('register_title')} sub={t('register_sub')} onBack={() => go('onboarding')} />
      <div style={{ flex: 1, overflowY: 'auto', padding: '18px 18px 30px' }}>
        <StepDots active={1} />
        <Field th={th} label="שם פרטי" required>
          <TextInput th={th} value={firstName} onChange={setFirstName} placeholder="נועה" />
        </Field>
        <Field th={th} label="שם משפחה" required>
          <TextInput th={th} value={lastName} onChange={setLastName} placeholder="לוי" />
        </Field>
        <Field th={th} label="טלפון (ווצאפ)" required hint="לא יוצג למועמדים — משמש לתיאומים">
          <TextInput th={th} type="tel" value={phone}
            onChange={v => { setPhone(v); if (phoneError) setPhoneError(''); }}
            onBlur={handlePhoneBlur} placeholder="050-0000000" />
          {phoneError && <div style={{ fontFamily: th.body, fontSize: 12, color: '#d93025', marginTop: 5 }}>{phoneError}</div>}
        </Field>
        <div style={{ marginTop: 8 }}>
          <Btn th={th} full size="l" disabled={!step1Valid} onClick={() => setStep(2)}>המשך</Btn>
        </div>
      </div>
    </>
  );

  return (
    <>
      <AppHeader th={th} title="תמונת פרופיל" onBack={() => setStep(1)} />
      <div style={{ flex: 1, overflowY: 'auto', padding: '18px 18px 30px' }}>
        <StepDots active={2} />
        <div style={{ background: alpha(th.gold, 0.09), border: `1px solid ${alpha(th.gold, 0.22)}`, borderRadius: th.r, padding: '13px 15px', marginBottom: 26 }}>
          <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 14, color: th.ink, marginBottom: 5 }}>למה כדאי להוסיף תמונה?</div>
          <div style={{ fontFamily: th.body, fontSize: 13, color: alpha(th.ink, 0.68), lineHeight: 1.55 }}>
            שדכנים עם תמונה זוכים ליותר אמון מצד מועמדים ומשפחותיהם. התמונה תופיע רק לשדכנים אחרים שאיתם תעבוד — לא למועמדים.
          </div>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', marginBottom: 30 }}>
          <label style={{ cursor: 'pointer' }}>
            <input type="file" accept="image/*" style={{ display: 'none' }} onChange={handlePhoto} />
            {photoURL
              ? <img src={photoURL} alt="" decoding="async" style={{ width: 120, height: 120, borderRadius: '50%', objectFit: 'cover', border: `3px solid ${th.primary}` }} />
              : <div style={{ width: 120, height: 120, borderRadius: '50%', background: alpha(th.primary, 0.08), border: `2px dashed ${alpha(th.ink, 0.2)}`, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 8 }}>
                  <Icon name="camera" size={32} style={{ color: alpha(th.ink, 0.38) }} />
                  <span style={{ fontFamily: th.body, fontSize: 12, color: alpha(th.ink, 0.45) }}>{uploading ? 'מעלה…' : 'בחר/י תמונה'}</span>
                </div>}
          </label>
          {photoURL && (
            <label style={{ cursor: 'pointer', marginTop: 10 }}>
              <input type="file" accept="image/*" style={{ display: 'none' }} onChange={handlePhoto} />
              <span style={{ fontFamily: th.body, fontSize: 13, color: th.primary }}>החלף תמונה</span>
            </label>
          )}
        </div>
        <Btn th={th} full size="l" disabled={saving || uploading} onClick={handleSave}>
          {saving ? 'שומר…' : photoURL ? 'יאללה, מתחילים!' : 'המשך בלי תמונה'}
        </Btn>
        {!photoURL && (
          <div style={{ textAlign: 'center', fontFamily: th.body, fontSize: 12, color: alpha(th.ink, 0.38), marginTop: 10 }}>
            אפשר להוסיף תמונה גם בהמשך דרך ההגדרות
          </div>
        )}
      </div>
    </>
  );
}

// ════════════════════════════════════════════════════════════
// MATCHMAKER HOME
// ════════════════════════════════════════════════════════════
function Home({ th, go }) {
  const { profile } = useContext(AuthCtx);
  const { candidates, offers, notifications, markNotificationRead, deleteNotification } = useContext(DataCtx);
  const { texts: tx, defaults: dx } = useContext(TextsCtx);
  const t = (key) => tx[key] || dx[key] || '';
  const me = profile || { displayName: '', region: '', grad: AV_GRADS[4] };
  const myUid = profile?.uid;
  const mine = candidates.filter(c => c.mmId === myUid);
  const others = candidates.filter(c => c.mmId !== myUid);
  const [candTab, setCandTab] = useS('others');

  // light panel is the default; admin can revert to dark by setting waitingPanelLight='false'
  const [lightPanel, setLightPanel] = React.useState(() => localStorage.getItem('waitingPanelLight') !== 'false');
  React.useEffect(() => {
    const onStorage = () => setLightPanel(localStorage.getItem('waitingPanelLight') !== 'false');
    window.addEventListener('storage', onStorage);
    window.addEventListener('waitingPanelChanged', onStorage);
    return () => { window.removeEventListener('storage', onStorage); window.removeEventListener('waitingPanelChanged', onStorage); };
  }, []);

  // ── Real action counts ──────────────────────────────────────────
  // 1. Offers where I'm the receiver and haven't responded yet
  const offersNeedingMe = React.useMemo(() =>
    offers.filter(o => o.bMm === myUid && o.aMm !== myUid && !['אישר','דחה'].includes(o.bStatus) && o.status !== 'נדחתה'),
    [offers, myUid]);

  // 2. My candidates not in any active offer within the past 7 days
  const sevenDaysAgo = new Date(Date.now() - 7 * 24 * 3600 * 1000);
  const recentCandIds = React.useMemo(() => new Set(
    offers
      .filter(o => new Date(o.createdAt) > sevenDaysAgo && o.status !== 'נדחתה')
      .flatMap(o => [o.aId, o.bId])
  ), [offers]);
  const neglectedCands = React.useMemo(() =>
    mine.filter(c => !recentCandIds.has(c.id)),
    [mine, recentCandIds]);

  // 3a. Co-rep approved notifications (unread)
  const coRepApprovedNotifs = React.useMemo(() =>
    notifications.filter(n => n.type === 'corep_approved' && !n.read),
    [notifications]);

  // 3b. Unread message notifications — grouped by chatId
  const newMsgNotifs = React.useMemo(() =>
    notifications.filter(n => n.type === 'new_msg' && !n.read),
    [notifications]);
  const newMsgChats = React.useMemo(() => Object.values(
    newMsgNotifs.reduce((acc, n) => {
      if (!acc[n.chatId] || (n.createdAt?.seconds || 0) > (acc[n.chatId].createdAt?.seconds || 0))
        acc[n.chatId] = n;
      return acc;
    }, {})
  ), [newMsgNotifs]);

  // 3. My offers where both MMs approved but a candidate hasn't responded yet
  const offersAwaitingCand = React.useMemo(() =>
    offers.filter(o =>
      (o.aMm === myUid || o.bMm === myUid) &&
      o.bStatus === 'אישר' &&
      (!o.aCandStatus || !o.bCandStatus) &&
      o.status !== 'נדחתה' && o.status !== 'אושרה'),
    [offers, myUid]);

  // Build waiting list — only items with count > 0
  const waiting = [
    offersNeedingMe.length > 0 && {
      icon: 'heart', tone: th.primary, big: String(offersNeedingMe.length),
      text: offersNeedingMe.length === 1 ? 'הצעת שידוך מחכה לתגובתך' : 'הצעות מחכות לתגובה שלך',
      to: () => go('offers', { filter: 'needsMyApproval' }),
    },
    neglectedCands.length > 0 && {
      icon: 'bell', tone: th.gold, big: String(neglectedCands.length),
      text: neglectedCands.length === 1 ? 'מועמד שלא קיבל יחס מעל 7 ימים' : 'מועמדים שלא קיבלו יחס מעל 7 ימים',
      to: () => go('cands', { filter: 'neglected', neglectedIds: neglectedCands.map(c => c.id) }),
    },
    offersAwaitingCand.length > 0 && {
      icon: 'chat', tone: '#a78bfa', big: String(offersAwaitingCand.length),
      text: offersAwaitingCand.length === 1 ? 'שידוך מחכה לתשובת המועמד' : 'שידוכים מחכים לתשובת המועמד',
      to: () => go('offers', { filter: 'awaitingCand' }),
    },
    coRepApprovedNotifs.length > 0 && {
      icon: 'users', tone: th.success, big: String(coRepApprovedNotifs.length),
      text: coRepApprovedNotifs.length === 1
        ? `${coRepApprovedNotifs[0].candName} אישר/ה שתייצג אותו/ה`
        : `${coRepApprovedNotifs.length} מועמדים אישרו ייצוג שלך`,
      to: () => { coRepApprovedNotifs.forEach(n => markNotificationRead(n.id)); go('cands'); },
    },
    newMsgChats.length > 0 && {
      icon: 'chat', tone: th.primary, big: String(newMsgNotifs.length),
      text: newMsgChats.length === 1
        ? `הודעה חדשה על ${newMsgChats[0].candName} מ-${newMsgChats[0].fromMmName}`
        : `${newMsgChats.length} שיחות עם הודעות חדשות`,
      to: () => {
        const first = newMsgChats[0];
        go('candInquiry', { candId: first.candId, toMm: first.fromMmId });
      },
    },
  ].filter(Boolean);

  const myOffers = offers.filter(o => o.aMm === myUid || o.bMm === myUid);
  const stats = [
    { n: mine.length,                                                                 label: t('home_stat_cands'),    to: () => go('cands') },
    { n: myOffers.filter(o => o.status === 'אושרה').length,                          label: t('home_stat_approved'), to: () => go('offers', { tab: 'approved' }) },
    { n: myOffers.filter(o => o.status === 'נשלחה' || o.status === 'נצפתה').length,  label: t('home_stat_offers'),   to: () => go('offers') },
  ];

  return (
    <>
      <div style={{ paddingTop: 50, paddingInline: 18, paddingBottom: 6, background: th.cream, flexShrink: 0, display: 'flex', alignItems: 'center', gap: 12 }}>
        <Avatar grad={gradForId(me.uid||'me')} name={me.displayName||me.email||''} size={46} photo={me.photoURL} />
        <div style={{ flex: 1 }}>
          <div style={{ fontFamily: th.body, fontSize: 13.5, color: alpha(th.ink, 0.55) }}>שלום {(me.displayName||'').split(' ')[0]},</div>
          <div style={{ fontFamily: th.display, fontSize: 21, fontWeight: 800, color: th.ink, lineHeight: 1.1 }}>{mine.length === 0 ? 'ברוכים הבאים!' : t('home_greeting')}</div>
        </div>
      </div>

      <div style={{ flex: 1, overflowY: 'auto', padding: '14px 18px 24px' }}>
        {/* WAITING banner — hidden when no candidates yet, replaced by onboarding CTA */}
        {mine.length === 0 ? (
          <button onClick={() => go('cands', { autoAdd: true })} style={{ all:'unset', cursor:'pointer', display:'flex', flexDirection:'column', alignItems:'center', textAlign:'center', gap:18, width:'100%', boxSizing:'border-box', background:`linear-gradient(160deg, #fce8ea 0%, #fdf3f5 60%, #fef5e4 100%)`, border:`1.5px solid ${alpha(th.primary,0.15)}`, borderRadius:th.rLg, padding:'32px 24px 26px', marginBottom:18, boxShadow:`0 4px 24px ${alpha(th.primary,0.08)}` }}>
            {/* illustration */}
            <div style={{ position:'relative', width:110, height:100 }}>
              {/* sparkles */}
              <svg width="110" height="100" viewBox="0 0 110 100" style={{ position:'absolute', top:0, left:0, overflow:'visible' }}>

const { useState: useSb, useMemo: useMb } = React;

// ════════════════════════════════════════════════════════════
// INVITATIONS TRACKER — reusable for all matchmakers
// ════════════════════════════════════════════════════════════
function InvitationsSheet({ open, onClose, th, mmUid, go }) {
  const { candidates } = useContext(DataCtx);
  const [invites, setInvites] = useState([]);
  const [loading, setLoading] = useState(false);
  const [coRepReqs, setCoRepReqs] = useState([]);

  useEffect(() => {
    if (!open || !mmUid) return;
    setLoading(true);
    db.collection('invitations').where('mmId', '==', mmUid).get()
      .then(snap => {
        const items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        items.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
        setInvites(items);
      })
      .catch(() => {})
      .finally(() => setLoading(false));
  }, [open, mmUid]);

  useEffect(() => {
    if (!open || !mmUid) return;
    return db.collection('coRepRequests')
      .where('toMmId', '==', mmUid)
      .where('status', '==', 'pending')
      .onSnapshot(s => setCoRepReqs(s.docs.map(d => ({ id: d.id, ...d.data() }))));
  }, [open, mmUid]);

  const approveCoRepMM = async (req) => {
    await db.collection('candidates').doc(req.candId)
      .update({ coMms: firebase.firestore.FieldValue.arrayUnion(req.fromMmId) });
    await db.collection('coRepRequests').doc(req.id)
      .update({ status: 'accepted', resolvedAt: firebase.firestore.FieldValue.serverTimestamp() });
    await db.collection('notifications').add({
      toUid: req.fromMmId, type: 'corep_approved',
      candId: req.candId, candName: req.candName,
      read: false, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
  };

  const declineCoRepMM = async (req) => {
    await db.collection('coRepRequests').doc(req.id)
      .update({ status: 'declined', resolvedAt: firebase.firestore.FieldValue.serverTimestamp() });
  };

  const pending   = invites.filter(i => i.status === 'pending').length;
  const accepted  = invites.filter(i => i.status === 'accepted' || i.status === 'filled').length;

  return (
    <Sheet open={open} onClose={onClose} th={th} title="מעקב הזמנות">
      {/* co-rep requests from other shadchanim */}
      {coRepReqs.length > 0 && (
        <div style={{ marginBottom: 18 }}>
          <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 15, color: th.ink, marginBottom: 10 }}>
            🤝 בקשות ייצוג משותף
          </div>
          {coRepReqs.map(req => (
            <div key={req.id} style={{ background: th.card, borderRadius: th.r, padding: 14, marginBottom: 10, border: `1.5px solid ${alpha(th.primary, 0.2)}`, boxShadow: `0 3px 10px ${alpha(th.ink, 0.05)}` }}>
              <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 14, color: th.ink, marginBottom: 2 }}>
                {req.fromMmName} מבקש/ת לייצג את {req.candName}
              </div>
              <div style={{ fontFamily: th.body, fontSize: 12.5, color: alpha(th.ink, 0.55), marginBottom: 12 }}>
                אישור יאפשר לשדכן/ית הזה/ה להציע את {req.candName} לשידוכים גם מטעמו/ה
              </div>
              <div style={{ display: 'flex', gap: 8 }}>
                <button onClick={() => approveCoRepMM(req)} style={{ flex: 1, padding: '9px 0', borderRadius: th.rSm, border: 'none', background: th.success, color: '#fff', fontFamily: th.display, fontWeight: 800, fontSize: 13, cursor: 'pointer' }}>✓ אשר/י</button>
                <button onClick={() => declineCoRepMM(req)} style={{ flex: 1, padding: '9px 0', borderRadius: th.rSm, border: `1.5px solid ${alpha(th.error || '#e53e3e', 0.3)}`, background: alpha(th.error || '#e53e3e', 0.08), color: th.error || '#e53e3e', fontFamily: th.display, fontWeight: 800, fontSize: 13, cursor: 'pointer' }}>✗ דחה/י</button>
              </div>
            </div>
          ))}
        </div>
      )}
      {/* summary row */}
      {invites.length > 0 && (
        <div style={{ display:'flex', gap:8, marginBottom:14 }}>
          {[
            { label:'נשלחו', n:invites.length, color:alpha(th.ink,0.6) },
            { label:'ממתינות', n:pending, color:th.gold },
            { label:'הצטרפו', n:accepted, color:th.success },
          ].map(s => (
            <div key={s.label} style={{ flex:1, background:alpha(s.color,0.1), borderRadius:th.rSm, padding:'10px 0', textAlign:'center' }}>
              <div style={{ fontFamily:th.display, fontWeight:900, fontSize:22, color:s.color }}>{s.n}</div>
              <div style={{ fontFamily:th.body, fontSize:11, color:alpha(th.ink,0.55), marginTop:2 }}>{s.label}</div>
            </div>
          ))}
        </div>
      )}

      {loading ? (
        <div style={{ textAlign:'center', padding:24, fontFamily:th.body, color:alpha(th.ink,0.4) }}>טוען…</div>
      ) : invites.length === 0 ? (
        <div style={{ textAlign:'center', padding:32, fontFamily:th.body, color:alpha(th.ink,0.4) }}>
          <div style={{ fontSize:36, marginBottom:10 }}>📬</div>
          <div>עדיין לא נשלחו הזמנות</div>
          <div style={{ fontSize:12, marginTop:6, color:alpha(th.ink,0.35) }}>הזמנות שתשלח יופיעו כאן</div>
        </div>
      ) : invites.map(inv => {
        const cand        = inv.candidateId ? candidates.find(c => c.id === inv.candidateId) : null;
        const isApproved  = cand && !cand.pendingApproval && inv.status === 'filled';
        const isPending   = inv.status === 'pending';
        const isAccepted  = inv.status === 'accepted' || inv.status === 'filled';
        const canFill     = isAccepted && !isApproved && inv.flow === 'mm_fills' && inv.candidateId && go;
        const canReview   = inv.status === 'filled' && !isApproved && inv.flow === 'cand_fills' && inv.candidateId && go;
        const isClickable = canFill || canReview || isApproved;

        const statusColor = isApproved ? th.success
          : isPending ? th.gold
          : isAccepted ? th.primary
          : alpha(th.ink,0.4);
        const statusLabel = isApproved ? '✓ פעיל/ה'
          : inv.status === 'pending' ? 'ממתין/ה'
          : inv.status === 'accepted' ? 'נענה/תה'
          : inv.status === 'filled' ? 'מילא/ה פרטים'
          : inv.status;
        const flowLabel   = inv.flow === 'mm_fills' ? 'אמלא אני' : 'ממלא/ת בעצמו/ה';
        const dateStr     = inv.createdAt?.seconds
          ? new Date(inv.createdAt.seconds * 1000).toLocaleDateString('he-IL', { day:'numeric', month:'short' })
          : '—';
        return (
          <div key={inv.id}
            onClick={isClickable ? () => { onClose(); go('editCand', { id: inv.candidateId, prefillName: inv.recipientName }); } : undefined}
            style={{ background: isApproved ? alpha(th.success, 0.04) : th.card, borderRadius:th.r, padding:'12px 14px', marginBottom:8, boxShadow:`0 3px 10px ${alpha(th.ink,0.05)}`, cursor: isClickable ? 'pointer' : 'default', border: isApproved ? `1.5px solid ${alpha(th.success, 0.25)}` : isClickable ? `1.5px solid ${alpha(th.primary,0.15)}` : '1.5px solid transparent' }}>
            <div style={{ display:'flex', alignItems:'center', gap:10 }}>
              <Avatar grad={gradForId(inv.id)} name={inv.recipientName || '?'} size={40} />
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontFamily:th.display, fontWeight:800, fontSize:14, color:th.ink }}>
                  {inv.recipientName || <span style={{ color:alpha(th.ink,0.35) }}>ללא שם</span>}
                </div>
                <div style={{ fontFamily:th.body, fontSize:11, color:alpha(th.ink,0.45) }}>{flowLabel} · {dateStr}</div>
              </div>
              <div style={{ display:'flex', flexDirection:'column', alignItems:'flex-end', gap:4 }}>
                <div style={{ background:alpha(statusColor,0.12), color:statusColor, borderRadius:999, padding:'4px 11px', fontFamily:th.display, fontWeight:700, fontSize:12 }}>
                  {statusLabel}
                </div>
                {canFill    && <div style={{ fontFamily:th.display, fontWeight:700, fontSize:11, color:th.primary }}>מלא/י פרטים ←</div>}
                {canReview  && <div style={{ fontFamily:th.display, fontWeight:700, fontSize:11, color:th.primary }}>בדוק/י ואשר/י ←</div>}
                {isApproved && <div style={{ fontFamily:th.display, fontWeight:700, fontSize:11, color:th.success }}>צפה/י בכרטיסייה ←</div>}
              </div>
            </div>
            {isAccepted && inv.candidateName && (
              <div style={{ fontFamily:th.body, fontSize:12, color:alpha(th.ink,0.5), marginTop:6, paddingRight:50 }}>
                נרשם/ה כ: <b>{inv.candidateName}</b>
              </div>
            )}
          </div>
        );
      })}
      <Btn th={th} full variant="ghost" style={{ marginTop:8 }}
        onClick={() => { setInvites([]); setLoading(true); db.collection('invitations').where('mmId','==',mmUid).get().then(snap=>{const items=snap.docs.map(d=>({id:d.id,...d.data()}));items.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));setInvites(items);}).finally(()=>setLoading(false)); }}>
        ↻ רענן
      </Btn>
    </Sheet>
  );
}
