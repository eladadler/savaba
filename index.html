// INVITE FLOW — matchmaker creates invitation link
// ════════════════════════════════════════════════════════════
function InviteFlow({ open, onClose, th, mmId, mmName }) {
  const [step, setStep] = useState(1);
  const [flow, setFlow] = useState('mm_fills');
  const [token, setToken] = useState('');
  const [creating, setCreating] = useState(false);
  const [copied, setCopied] = useState(false);

  const reset = () => { setStep(1); setFlow('mm_fills'); setToken(''); setCopied(false); };

  const generate = async () => {
    setCreating(true);
    try { const tok = await createInvitation(mmId, mmName, flow); setToken(tok); setStep(2); }
    finally { setCreating(false); }
  };

  const copyLink = () => {
    navigator.clipboard.writeText(inviteURL(token));
    setCopied(true);
    setTimeout(() => setCopied(false), 2500);
  };

  const waText = encodeURIComponent(`היי! 😊\n${mmName} מזמין/ת אותך להצטרף למערכת שידוכים "סבבה והכל".\n\nלחץ/י כאן להרשמה:\n${inviteURL(token)}`);

  return (
    <Sheet open={open} onClose={() => { onClose(); reset(); }} th={th} title="הזמנת מועמד/ת">
      {step === 1 ? (
        <>
          <div style={{ fontFamily: th.body, fontSize: 14, color: alpha(th.ink, 0.6), marginBottom: 14 }}>מי ימלא את פרטי המועמד/ת?</div>
          {[
            { val: 'mm_fills', label: 'אני אמלא', desc: 'המועמד/ת פותח/ת את הקישור ומאשר/ת בלבד. אתה/את ממלא/ת את הכרטיסייה.' },
            { val: 'cand_fills', label: 'המועמד/ת ימלא/תמלא', desc: 'המועמד/ת ממלא/ת את כל הפרטים ותמונות בעצמו/ה. אתה/את מאשר/ת לפני פרסום.' },
          ].map(opt => (
            <button key={opt.val} onClick={() => setFlow(opt.val)} style={{
              all: 'unset', cursor: 'pointer', boxSizing: 'border-box', width: '100%',
              padding: '13px 15px', borderRadius: th.r, marginBottom: 10, display: 'block', textAlign: 'right',
              border: `2px solid ${flow === opt.val ? th.primary : alpha(th.ink, 0.12)}`,
              background: flow === opt.val ? alpha(th.primary, 0.06) : th.card,
            }}>
              <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 15, color: flow === opt.val ? th.primary : th.ink, marginBottom: 3 }}>{opt.label}</div>
              <div style={{ fontFamily: th.body, fontSize: 12.5, color: alpha(th.ink, 0.55), lineHeight: 1.4 }}>{opt.desc}</div>
            </button>
          ))}
          <Btn th={th} full onClick={generate} style={{ marginTop: 4 }} disabled={creating}>
            {creating ? 'יוצר קישור…' : 'צור קישור הזמנה'}
          </Btn>
        </>
      ) : (
        <>
          <div style={{ background: alpha(th.success, 0.1), border: `1.5px solid ${alpha(th.success, 0.25)}`, borderRadius: th.r, padding: 14, marginBottom: 16, textAlign: 'center' }}>
            <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 14, color: th.success, marginBottom: 6 }}>✓ קישור נוצר!</div>
            <div style={{ fontFamily: 'monospace', fontSize: 11, color: alpha(th.ink, 0.55), wordBreak: 'break-all', lineHeight: 1.5 }}>{inviteURL(token)}</div>
          </div>
          <Btn th={th} full onClick={copyLink} icon={<Icon name="link" size={18} />} style={{ marginBottom: 10 }}>
            {copied ? '✓ הועתק!' : 'העתק קישור'}
          </Btn>
          <a href={`https://wa.me/?text=${waText}`} target="_blank" rel="noreferrer" style={{ display: 'block', textDecoration: 'none', marginBottom: 10 }}>
            <Btn th={th} full variant="ghost">💬 פתח ווצאפ עם הקישור</Btn>
          </a>
          <Btn th={th} full variant="ghost" onClick={() => { onClose(); reset(); }}>סגור</Btn>
        </>
      )}
    </Sheet>
  );
}

// ════════════════════════════════════════════════════════════
// INVITATION LANDING — candidate opens invite link
// ════════════════════════════════════════════════════════════
function InvitationLanding({ th, go, token }) {
  const { user, profile } = useContext(AuthCtx);
  const [invite, setInvite]   = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError]     = useState('');
  const [busy, setBusy]       = useState(false);
  const [done, setDone]       = useState(false);

  useEffect(() => {
    db.collection('invitations').doc(token).get().then(doc => {
      if (!doc.exists) { setError('ההזמנה לא נמצאה או פגה תוקף'); }
      else {
        const inv = doc.data();
        if (inv.status !== 'pending') setError('הזמנה זו כבר נוצלה');
        else setInvite(inv);
      }
      setLoading(false);
    }).catch(() => { setError('שגיאה בטעינת ההזמנה'); setLoading(false); });
  }, [token]);

  const accept = async () => {
    setBusy(true);
    try {
      const ref = await db.collection('candidates').add({
        name: profile?.displayName || '', age: 0, gender: '', region: '', religiosity: '',
        family: '', kids: 0, oneLine: '', seesWith: '', sabaBut: '',
        interests: [], partner: [], discrete: '', available: true, photos: [],
        mmId: invite.mmId, candidateUid: user.uid,
        pendingApproval: false, status: 'pending_mm',
        grad: gradForId(user.uid),
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      await db.collection('invitations').doc(token).update({
        status: 'accepted', candidateId: ref.id, candidateUid: user.uid,
        candidateName: profile?.displayName || user.email,
        acceptedAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      await db.collection('notifications').add({
        toUid: invite.mmId, type: 'invite_accepted',
        candidateId: ref.id, candidateName: profile?.displayName || user.email,
        inviteToken: token, read: false,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      setDone(true);
    } catch(e) { setError('שגיאה: ' + e.message); }
    setBusy(false);
  };

  if (loading) return (
    <div style={{ height:'100%', display:'flex', alignItems:'center', justifyContent:'center', background:th.cream }}>
      <Logo size={50} color={th.primary} flaw={th.cream} />
    </div>
  );

  const centeredBox = (emoji, title, body) => (
    <div style={{ height:'100%', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', background:th.cream, padding:32, textAlign:'center', direction:'rtl' }}>
      <div style={{ fontSize:52, marginBottom:16 }}>{emoji}</div>
      <div style={{ fontFamily:th.display, fontSize:22, fontWeight:800, color:th.ink, marginBottom:8 }}>{title}</div>
      <div style={{ fontFamily:th.body, fontSize:15, color:alpha(th.ink,0.6), lineHeight:1.5, maxWidth:280 }}>{body}</div>
    </div>
  );

  if (error) return centeredBox('😕', 'הזמנה לא תקינה', error);
  if (done)  return centeredBox('🎉', 'אישרת בהצלחה!', `${invite.mmName} יקבל/ת הודעה וימשיך/תמשיך למלא את הפרטים שלך.`);

  return (
    <div style={{ height:'100%', display:'flex', flexDirection:'column', background:`linear-gradient(170deg, ${th.cream}, ${tint(th.primary, 0.84)})`, direction:'rtl' }}>
      <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'0 28px', textAlign:'center' }}>
        <Logo size={56} color={th.primary} flaw={th.cream} style={{ marginBottom:20 }} />
        <div style={{ fontFamily:th.display, fontSize:13, fontWeight:700, color:th.primary, letterSpacing:1.5, marginBottom:6 }}>הוזמנת להצטרף</div>
        <h1 style={{ fontFamily:th.display, fontSize:30, fontWeight:800, color:th.ink, margin:'0 0 6px', lineHeight:1.2 }}>סבבה והכל</h1>
        <div style={{ fontFamily:th.body, fontSize:16, color:alpha(th.ink,0.65), marginBottom:28 }}>
          <b>{invite.mmName}</b> מזמין/ת אותך למערכת השידוכים
        </div>
        <div style={{ background:th.card, borderRadius:th.rLg, padding:18, marginBottom:28, width:'100%', maxWidth:320, boxShadow:`0 8px 24px ${alpha(th.ink,0.08)}`, textAlign:'right' }}>
          <div style={{ fontFamily:th.display, fontWeight:800, fontSize:14, color:th.ink, marginBottom:6 }}>מה קורה אחרי שתאשר/י?</div>
          <div style={{ fontFamily:th.body, fontSize:13, color:alpha(th.ink,0.65), lineHeight:1.5 }}>
            {invite.flow === 'mm_fills'
              ? `${invite.mmName} ימלא/תמלא את הפרטים שלך ויצור/תיצור עבורך כרטיסייה.`
              : 'תתבקש/י למלא את הפרטים שלך ולהעלות תמונות. השדכן/ית יאשר/תאשר לפני פרסום.'}
          </div>
        </div>
        <Btn th={th} full size="l" onClick={invite.flow === 'mm_fills' ? accept : () => go('candSelfFill', { token, invite })} disabled={busy}>
          {busy ? 'שניה…' : invite.flow === 'mm_fills' ? '✓ אני מאשר/ת' : 'מלא/י את הפרטים שלי →'}
        </Btn>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// CANDIDATE SELF FILL — candidate fills their own card (flow 2)
// ════════════════════════════════════════════════════════════
function CandidateSelfFill({ th, go, params }) {
  const { user, profile } = useContext(AuthCtx);
  const { lists } = useContext(DataCtx);
  const liveRegions       = (lists.regions       && lists.regions.length)       ? lists.regions       : REGIONS;
  const liveReligiosity   = (lists.religiosity    && lists.religiosity.length)   ? lists.religiosity   : RELIGIOSITY;
  const liveInterests     = (lists.interests      && lists.interests.length)     ? lists.interests     : INTERESTS;
  const livePartnerTraits = (lists.partnerTraits  && lists.partnerTraits.length) ? lists.partnerTraits : PARTNER_TRAITS;
  const { token, invite } = params;
  const [f, setF] = useState({
    name: profile?.displayName || '', age: '', gender: 'אשה',
    region: '', religiosity: '', family: 'רווק/ה', kids: 0,
    sabaBut: '', oneLine: '', seesWith: '', interests: [], partner: [], discrete: '', available: true,
  });
  const set = k => v => setF(s => ({ ...s, [k]: v }));
  const [photos, setPhotos]   = useState([]);
  const [submitting, setSub]  = useState(false);
  const [uploading, setUpl]   = useState(false);
  const [done, setDone]       = useState(false);

  const addPhoto = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    setUpl(true);
    try {
      const ref = storage.ref(`profiles/${user.uid}/${Date.now()}_${file.name}`);
      await ref.put(file);
      const url = await ref.getDownloadURL();
      setPhotos(p => [...p, url]);
    } finally { setUpl(false); }
  };

  const submit = async () => {
    if (!f.name || !f.age) return alert('נא למלא שם וגיל');
    setSub(true);
    try {
      const ref = await db.collection('candidates').add({
        ...f, age: +f.age, photos,
        mmId: invite.mmId, candidateUid: user.uid,
        pendingApproval: true, available: true,
        grad: gradForId(user.uid),
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      await db.collection('invitations').doc(token).update({
        status: 'filled', candidateId: ref.id, candidateUid: user.uid, candidateName: f.name,
        filledAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      await db.collection('notifications').add({
        toUid: invite.mmId, type: 'cand_filled',
        candidateId: ref.id, candidateName: f.name,
        candidateAge: +f.age, candidateRegion: f.region, candidateReligiosity: f.religiosity,
        inviteToken: token, read: false,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      setDone(true);
    } catch(e) { alert('שגיאה: ' + e.message); }
    setSub(false);
  };

  const [step, setStep] = useState(0);
  const steps = ['פרטים בסיסיים', 'קצת עלייך', 'תחומי עניין', 'תמונות'];
  const isLast = step === steps.length - 1;

  const SelfStepDots = () => (
    <div style={{ display:'flex', justifyContent:'center', gap:6, marginBottom:18 }}>
      {steps.map((_, i) => (
        <div key={i} style={{ width: i === step ? 22 : 8, height:8, borderRadius:999, background: i === step ? th.primary : i < step ? alpha(th.primary,0.4) : alpha(th.ink,0.15), transition:'all 0.2s' }} />
      ))}
    </div>
  );

  if (done) return (
    <div style={{ height:'100%', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', background:th.cream, padding:32, textAlign:'center', direction:'rtl' }}>
      <div style={{ fontSize:52, marginBottom:16 }}>🎉</div>
      <div style={{ fontFamily:th.display, fontSize:22, fontWeight:800, color:th.ink, marginBottom:8 }}>הפרטים נשלחו!</div>
      <div style={{ fontFamily:th.body, fontSize:15, color:alpha(th.ink,0.6), lineHeight:1.5, maxWidth:280 }}>
        {invite.mmName} יקבל/ת הודעה ויעיין/תעיין בפרטים שלך. לאחר האישור תהיה/י רשמית במערכת.
      </div>
    </div>
  );

  return (
    <div style={{ height:'100%', display:'flex', flexDirection:'column', background:th.cream, direction:'rtl' }}>
      <AppHeader th={th} title="הפרטים שלי" sub={`עבור ${invite.mmName}`} />
      <div style={{ flex:1, overflowY:'auto', padding:'10px 18px 40px' }}>
        <div style={{ fontFamily:th.display, fontWeight:800, fontSize:16, color:th.ink, marginBottom:10, textAlign:'center' }}>{steps[step]}</div>
        <SelfStepDots />

        {step === 0 && (
          <>
            <Field th={th} label="שם מלא" required><TextInput th={th} value={f.name} onChange={set('name')} placeholder="שם פרטי ומשפחה" /></Field>
            <Field th={th} label="גיל" required><TextInput th={th} type="number" value={f.age} onChange={set('age')} placeholder="25" /></Field>
            <Field th={th} label="מין" required><Segmented th={th} value={f.gender} onChange={set('gender')} options={['אשה','גבר']} /></Field>
            <Field th={th} label="אזור מגורים"><Select th={th} value={f.region} onChange={set('region')} options={liveRegions} /></Field>
            <Field th={th} label="זרם דתי"><Select th={th} value={f.religiosity} onChange={set('religiosity')} options={liveReligiosity} /></Field>
            <Field th={th} label="מצב משפחתי"><TextInput th={th} value={f.family} onChange={set('family')} /></Field>
          </>
        )}

        {step === 1 && (
          <>
            <Field th={th} label='סבבה והכל, אבל…' hint="משהו מצחיק/ייחודי עליך">
              <TextArea th={th} value={f.sabaBut} onChange={set('sabaBut')} placeholder='למשל: "מפחד/ת מיונים אבל רוצה לגור ליד הים"' rows={2} />
            </Field>
            <Field th={th} label="ספר/י על עצמך במשפט">
              <TextInput th={th} value={f.oneLine} onChange={set('oneLine')} placeholder="מה הכי מגדיר אותך?" />
            </Field>
            <Field th={th} label="מחפש/ת">
              <TextArea th={th} value={f.seesWith} onChange={set('seesWith')} placeholder="מה חשוב לך בבן/ת זוג?" rows={3} />
            </Field>
          </>
        )}

        {step === 2 && (
          <>
            <Field th={th} label="תחומי עניין">
              <MultiChips th={th} value={f.interests} onChange={v => setF(s => ({...s, interests:v}))} options={liveInterests} tone={th.primary} />
            </Field>
            <Field th={th} label="חשוב לי בפרטנר">
              <MultiChips th={th} value={f.partner} onChange={v => setF(s => ({...s, partner:v}))} options={livePartnerTraits} tone={th.gold} />
            </Field>
          </>
        )}

        {step === 3 && (
          <Field th={th} label="תמונות" hint="מומלץ תמונות מאונכות באיכות טובה">
            <div style={{ display:'flex', gap:8, flexWrap:'wrap', alignItems:'center', marginBottom:8 }}>
              {photos.map((url, i) => (
                <div key={i} style={{ position:'relative' }}>
                  <img src={url} alt="" style={{ width:80, height:80, borderRadius:12, objectFit:'cover' }} />
                  <button onClick={() => setPhotos(p => p.filter((_,j) => j!==i))} style={{ position:'absolute', top:-6, insetInlineEnd:-6, width:22, height:22, borderRadius:'50%', border:'none', background:th.error, color:'#fff', fontSize:14, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', lineHeight:1 }}>×</button>
                </div>
              ))}
              <label style={{ width:80, height:80, borderRadius:12, border:`2px dashed ${alpha(th.ink,0.2)}`, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:4, cursor:'pointer', color: uploading ? alpha(th.ink,0.3) : th.primary, flexShrink:0 }}>
                {uploading ? <span style={{ fontFamily:th.body, fontSize:11 }}>מעלה…</span> : <><Icon name="plus" size={22} /><span style={{ fontFamily:th.body, fontSize:11 }}>הוסף/י</span></>}
                <input type="file" accept="image/*" style={{ display:'none' }} onChange={addPhoto} disabled={uploading} />
              </label>
            </div>
          </Field>
        )}

        <div style={{ display:'flex', gap:8, marginTop:20 }}>
          {step > 0
            ? <Btn th={th} variant="ghost" onClick={() => setStep(s => s-1)}>← חזרה</Btn>
            : <div style={{ flex:1 }} />
          }
          {isLast
            ? <Btn th={th} full size="l" onClick={submit} disabled={submitting || !f.name || !f.age}>{submitting ? 'שולח…' : 'שלח/י פרטים לאישור'}</Btn>
            : <Btn th={th} full onClick={() => { if (step===0 && (!f.name||!f.age)) { alert('נא למלא שם וגיל'); return; } setStep(s => s+1); }}>הבא →</Btn>
          }
        </div>
      </div>
    </div>
  );
}

// EDIT CANDIDATE SCREEN — matchmaker edits after invite accepted
// ════════════════════════════════════════════════════════════
function EditCandidateScreen({ th, go, params }) {
  const { candidates, updateCandidate, uploadPhoto, approveCandidate } = useContext(DataCtx);
  const c = candidates.find(x => x.id === params?.id);
  if (!c) return (
    <div style={{ height:'100%', display:'flex', alignItems:'center', justifyContent:'center', background:th.cream }}>
      <Logo size={40} color={th.primary} flaw={th.cream} />
    </div>
  );
  return (
    <div style={{ height:'100%', display:'flex', flexDirection:'column', background:th.cream, direction:'rtl' }}>
      <AppHeader th={th} title={c.name || 'מועמד/ת חדש/ה'} sub={c.pendingApproval ? 'ממתין/ה לאישורך' : 'עריכת פרטים'} onBack={() => go('back')} />
      <div style={{ flex:1, overflowY:'auto', padding:'10px 18px 40px' }}>
        {c.pendingApproval && (
          <div style={{ background:alpha(th.gold,0.12), border:`1.5px solid ${alpha(th.gold,0.3)}`, borderRadius:th.r, padding:14, marginBottom:16, display:'flex', gap:10 }}>
            <Icon name="info" size={18} style={{ color:th.gold, flexShrink:0, marginTop:2 }} />
            <div>
              <div style={{ fontFamily:th.display, fontWeight:800, fontSize:14, color:th.ink, marginBottom:3 }}>ממתין/ה לאישורך</div>
              <div style={{ fontFamily:th.body, fontSize:12.5, color:alpha(th.ink,0.65), lineHeight:1.4 }}>המועמד/ת מילא/ה פרטים. עבור/י על הכרטיסייה ואשר/י כדי שתופיע במערכת.</div>
            </div>
          </div>
        )}
        <CandidateForm th={th} initial={c}
          onSave={async (data) => { await updateCandidate(c.id, data); go('back'); }}
          onCancel={() => go('back')}
          onUpload={(file) => uploadPhoto(c.id, file)} />
        {c.pendingApproval && (
          <Btn th={th} full variant="success" style={{ marginTop:14 }}
            onClick={async () => { await approveCandidate(c.id); go('back'); }}>
            ✓ אשר/י — פרסם כרטיסייה
          </Btn>
        )}
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// NOTIFICATION DRAWER
// ════════════════════════════════════════════════════════════
function NotificationDrawer({ th, go, notifications, markNotificationRead }) {
  const [open, setOpen] = useState(false);
  const unread = notifications.filter(n => !n.read).length;

  const handleTap = (n) => {
    if (!n.read) markNotificationRead(n.id);
    setOpen(false);
    go('editCand', { id: n.candidateId });
  };

  return (
    <>
      <button onClick={() => setOpen(true)} style={{ position:'relative', border:'none', background:th.card, width:42, height:42, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', color:th.ink, cursor:'pointer', boxShadow:'0 2px 8px rgba(0,0,0,0.07)' }}>
        <Icon name="bell" size={21} />
        {unread > 0 && (
          <span style={{ position:'absolute', top:6, insetInlineEnd:6, minWidth:16, height:16, borderRadius:99, background:th.error, color:'#fff', fontSize:10, fontWeight:800, display:'flex', alignItems:'center', justifyContent:'center', padding:'0 4px', border:`2px solid ${th.card}` }}>{unread}</span>
        )}
      </button>
      <Sheet open={open} onClose={() => setOpen(false)} th={th} title="התראות">
        {notifications.length === 0
          ? <div style={{ textAlign:'center', fontFamily:th.body, color:alpha(th.ink,0.4), padding:'24px 0' }}>אין התראות</div>
          : notifications.map(n => (
            <button key={n.id} onClick={() => handleTap(n)} style={{ all:'unset', cursor:'pointer', boxSizing:'border-box', width:'100%', padding:'12px 14px', borderRadius:th.r, marginBottom:8, display:'block', textAlign:'right', background: n.read ? th.card : alpha(th.primary,0.07), border:`1.5px solid ${n.read ? 'transparent' : alpha(th.primary,0.18)}` }}>
              <div style={{ fontFamily:th.display, fontWeight:800, fontSize:14, color:th.ink, marginBottom:3 }}>
                {n.type === 'invite_accepted' ? `✓ ${n.candidateName} אישר/ה הזמנה` : `📋 ${n.candidateName} הצטרף/ה`}
              </div>
              <div style={{ fontFamily:th.body, fontSize:12.5, color:alpha(th.ink,0.55), marginBottom:n.type === 'cand_filled' && n.candidateAge ? 3 : 0 }}>
                {n.type === 'invite_accepted' ? 'ממתין/ה שתמלא/י את הפרטים' : 'ממתין/ה לאישור ופרסום'}
              </div>
              {n.type === 'cand_filled' && (n.candidateAge || n.candidateRegion) && (
                <div style={{ fontFamily:th.body, fontSize:11.5, color:alpha(th.ink,0.4) }}>
                  {[n.candidateAge && `גיל ${n.candidateAge}`, n.candidateRegion, n.candidateReligiosity].filter(Boolean).join(' · ')}
                </div>
              )}
            </button>
          ))
        }
      </Sheet>
    </>
  );
}

        mmId={profile?.uid} mmName={profile?.displayName || 'השדכן/ית'} />

// CANDIDATE DETAIL — 3 VARIATIONS (the heart)
// ════════════════════════════════════════════════════════════
function CandidateDetail({ th, go, params }) {
  const c = findCand(params?.id) || CANDIDATES[0];
  const [showDiscrete, setShowDiscrete] = useSb(false);
  const variant = th.cardVariant;

  const footer = (
    <div style={{ flexShrink: 0, padding: '12px 18px 26px', background: alpha(th.cream, 0.95), backdropFilter: 'blur(12px)', borderTop: `1px solid ${alpha(th.ink, 0.08)}`, display: 'flex', gap: 10 }}>
      <button onClick={() => {}} style={{ width: 52, borderRadius: th.r, border: `1.5px solid ${alpha(th.ink, 0.15)}`, background: th.card, color: th.success, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', flexShrink: 0 }}><Icon name="whatsapp" size={24} /></button>
      <Btn th={th} full size="l" onClick={() => go('matchFlow', { id: c.id })} icon={<Icon name="heart" size={20} fill="#fff" stroke={0} />}>שדך/י את {c.name}</Btn>
    </div>
  );

  const body =
    variant === 'מגזין' ? <MagBody c={c} th={th} showDiscrete={showDiscrete} setShowDiscrete={setShowDiscrete} go={go} />
    : variant === 'מינימלי' ? <MinBody c={c} th={th} showDiscrete={showDiscrete} setShowDiscrete={setShowDiscrete} go={go} />
    : <ClassicBody c={c} th={th} showDiscrete={showDiscrete} setShowDiscrete={setShowDiscrete} go={go} />;

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: th.cream, position: 'relative' }}>
      {/* floating back / dots over content */}
      <div style={{ position: 'absolute', top: 50, right: 16, left: 16, zIndex: 20, display: 'flex', justifyContent: 'space-between', pointerEvents: 'none' }}>
        <button onClick={() => go('back')} style={{ pointerEvents: 'auto', width: 40, height: 40, borderRadius: '50%', border: 'none', background: alpha('#ffffff', 0.85), backdropFilter: 'blur(8px)', color: th.ink, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', boxShadow: '0 2px 10px rgba(0,0,0,0.15)' }}><Icon name="back" size={20} /></button>
        <button style={{ pointerEvents: 'auto', width: 40, height: 40, borderRadius: '50%', border: 'none', background: alpha('#ffffff', 0.85), backdropFilter: 'blur(8px)', color: th.ink, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', boxShadow: '0 2px 10px rgba(0,0,0,0.15)' }}><Icon name="dots" size={20} /></button>
      </div>
      <div style={{ flex: 1, overflowY: 'auto' }}>{body}</div>
      {footer}
    </div>
  );
}

// shared sub-sections
function InterestChips({ items, th, tone }) {
  return <div style={{ display: 'flex', flexWrap: 'wrap', gap: 7 }}>{items.map(i => <Chip key={i} label={i} th={th} tone={tone} active />)}</div>;
}
function DiscreteBox({ c, th, show, setShow, mag }) {
  return (
    <div style={{ background: mag ? 'transparent' : alpha(th.ink, 0.04), borderRadius: th.r, padding: mag ? 0 : 14, border: `1.5px dashed ${alpha(th.ink, 0.18)}` }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: show ? 8 : 0 }}>
        <Icon name="lock" size={17} style={{ color: th.gold }} />
        <span style={{ fontFamily: th.display, fontWeight: 800, fontSize: 14, color: th.ink, flex: 1 }}>פרטים דיסקרטיים</span>
        <button onClick={() => setShow(!show)} style={{ border: 'none', background: 'none', color: th.primary, fontFamily: th.body, fontWeight: 700, fontSize: 13, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 4 }}>
          <Icon name="eye" size={16} />{show ? 'הסתר' : 'גלוי לשדכן בלבד'}
        </button>
      </div>
      {show && <div style={{ fontFamily: th.body, fontSize: 14, color: alpha(th.ink, 0.7), lineHeight: 1.5 }}>{c.discrete}</div>}
    </div>
  );
}

Object.assign(window, { Candidates, CandidateDetail, InterestChips, DiscreteBox });
// screens-b2.jsx — the 3 candidate-card body variations
const { useState: useSb2 } = React;

function infoPairs(c) {
  return [
    ['גיל', c.age],
    ['אזור', c.region],
    ['מצב', c.family],
    ['ילדים', c.kids ? `${c.kids}` : 'אין'],
    ['קרבה לדת', c.religiosity],
  ];
}

// ── VARIANT 1 — קלאסי (warm, friendly) ─────────────────────────

      <div style={{ display: 'flex', alignItems: 'center', gap: 7, marginBottom: 10 }}>
        {icon && <span style={{ color: th.primary }}><Icon name={icon} size={18} /></span>}

      </div>
      {children}

  );
  return (
    <div>
      {/* hero gallery */}
      <PhotoGallery c={c} th={th} height={360}>
        <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, height: 170, background: `linear-gradient(to top, ${alpha(th.ink, 0.74)}, transparent)`, pointerEvents: 'none' }} />
        <div style={{ position: 'absolute', bottom: 50, right: 20, left: 20, color: '#fff', pointerEvents: 'none' }}>
          <div style={{ marginBottom: 10 }}>
            <Tag th={th} tone={c.available ? th.success : alpha(th.ink, 0.7)} soft={false}>{c.available ? 'פנוי/ה להצעות' : 'תפוס/ה'}</Tag>
          </div>
          <div style={{ fontFamily: th.display, fontSize: 32, fontWeight: 800, lineHeight: 1 }}>{c.name}, {c.age}</div>
          <div style={{ fontFamily: th.body, fontSize: 15, opacity: 0.92, marginTop: 4 }}>{c.region} · {c.religiosity}</div>
        </div>
      </PhotoGallery>

      <div style={{ padding: '0 16px 24px', marginTop: -28, position: 'relative' }}>
        {/* the saba badge overlaps the hero */}
        <div style={{ marginBottom: 14 }}><SabaBadge th={th} text={c.sabaBut} size="l" /></div>

        <Section label="במשפט אחד" icon="user">
          <p style={{ margin: 0, fontFamily: th.body, fontSize: 15.5, color: alpha(th.ink, 0.78), lineHeight: 1.5 }}>{c.oneLine}</p>
        </Section>
        <Section label="רואה אותו/ה משתדך/ת עם…" icon="heart">
          <p style={{ margin: 0, fontFamily: th.body, fontSize: 15.5, color: alpha(th.ink, 0.78), lineHeight: 1.5 }}>{c.seesWith}</p>
        </Section>
        <Section label="תחומי עניין" icon="spark"><InterestChips items={c.interests} th={th} /></Section>
        <Section label="מה חשוב אצל הפרטנר" icon="check"><InterestChips items={c.partner} th={th} tone={th.gold} /></Section>

// screens-c.jsx — Match flow (wizard)
const { useState: useSc, useMemo: useMc } = React;

// mini selectable candidate row
function CandRow({ c, th, selected, onClick, trailing }) {
  return (
    <button onClick={onClick} style={{ all: 'unset', cursor: onClick ? 'pointer' : 'default', boxSizing: 'border-box', width: '100%', display: 'flex', alignItems: 'center', gap: 12, padding: 12, background: th.card, borderRadius: th.r, border: selected ? `2px solid ${th.primary}` : `2px solid transparent`, boxShadow: `0 4px 14px ${alpha(th.ink, 0.06)}`, marginBottom: 10 }}>
      <Avatar grad={c.grad} name={c.name} size={50} photo={c.photos && c.photos[0]} />
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 15.5, color: th.ink }}>{c.name}, {c.age}</div>
        <div style={{ fontFamily: th.body, fontSize: 12.5, color: alpha(th.ink, 0.5), marginBottom: 4 }}>{c.region} · {c.religiosity} · {findMm(c.mm).name.split(' ')[0]}</div>
        <div style={{ fontFamily: th.body, fontSize: 12, color: alpha(th.ink, 0.7), display: 'flex', gap: 5, alignItems: 'center' }}>
          <Logo size={13} color={th.primary} flaw={th.cream} /><span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{c.sabaBut}</span>
        </div>
      </div>
      {trailing}
    </button>
  );
}

function MatchFlow({ th, go, params }) {
  const { lists, candidates, addOffer } = useContext(DataCtx);
  const { profile } = useContext(AuthCtx);
  const liveReligiosity = (lists.religiosity && lists.religiosity.length) ? lists.religiosity : RELIGIOSITY;
  const first = candidates.find(c => c.id === params?.id) || candidates[0];
  const presetSecond = params?.withId ? candidates.find(c => c.id === params.withId) : null;
  const [step, setStep] = useSc(presetSecond ? 3 : 1); // 1 first, 2 choose, 3 proposal, 4 success
  const [second, setSecond] = useSc(presetSecond);
  const [note, setNote] = useSc('');
  const [relFilter, setRelFilter] = useSc('');
  const [sending, setSending] = useSc(false);

  const candidates2 = useMc(() => candidates.filter(c => c.gender !== first?.gender && c.id !== first?.id && c.available && (!relFilter || c.religiosity === relFilter)), [candidates, first, relFilter]);

  const sendOffer = async () => {
    if (!first || !second || sending) return;
    setSending(true);
    try {
      await addOffer({
        aId: first.id,  aMm: first.mmId || profile?.uid,
        bId: second.id, bMm: second.mmId,
        status: 'נשלחה',
        aStatus: 'ממתין', bStatus: 'ממתין',
        note: note.trim(),
        unread: 0,
      });
      setStep(4);
    } catch(e) { alert('שגיאה בשליחה: ' + e.message); }
    setSending(false);
  };
  const steps = ['ראשון', 'שני', 'הצעה'];
  const stepIdx = Math.min(step, 3) - 1;

  const back = () => {
    if (step === 1) return go('back');
    if (step === 3 && presetSecond) return go('back');
    setStep(step - 1);
  };

  // STEP 4 — success
  if (step === 4) return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', background: `linear-gradient(170deg, ${th.cream}, ${tint(th.success, 0.86)})`, padding: 28, textAlign: 'center' }}>
      <div style={{ animation: 'sabaPop .5s cubic-bezier(.2,.9,.3,1)', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 4, marginBottom: 24 }}>
        <Avatar grad={first.grad} name={first.name} size={84} photo={first.photos && first.photos[0]} style={{ marginInlineEnd: -12 }} />
        <div style={{ zIndex: 2, background: th.success, color: '#fff', borderRadius: '50%', width: 46, height: 46, display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: `0 8px 20px ${alpha(th.success, 0.4)}` }}><Icon name="heart" size={26} fill="#fff" stroke={0} /></div>
        <Avatar grad={second.grad} name={second.name} size={84} photo={second.photos && second.photos[0]} style={{ marginInlineStart: -12 }} />
      </div>
      <h1 style={{ fontFamily: th.display, fontSize: 28, color: th.ink, margin: '0 0 10px' }}>ההצעה בדרך!</h1>
      <p style={{ fontFamily: th.body, fontSize: 16, color: alpha(th.ink, 0.65), lineHeight: 1.5, maxWidth: 300, margin: '0 0 28px' }}>
        שלחנו ל{findMm(second.mm).name} את ההצעה. ברגע שתתקבל — {first.name} יקבל/תקבל הודעה בוואטסאפ.
      </p>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10, width: '100%', maxWidth: 320 }}>
        <Btn th={th} full size="l" onClick={() => go('offers')}>למעקב הצעות</Btn>
        <Btn th={th} full size="l" variant="ghost" onClick={() => go('tab', { tab: 'home' })}>חזרה לבית</Btn>
      </div>
    </div>
  );

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: th.cream }}>
      <AppHeader th={th} title="שידוך חדש" onBack={back} />
      {/* progress */}
      <div style={{ display: 'flex', gap: 6, padding: '4px 18px 10px', flexShrink: 0 }}>
        {steps.map((s, i) => (
          <div key={i} style={{ flex: 1, textAlign: 'center' }}>
            <div style={{ height: 5, borderRadius: 99, background: i <= stepIdx ? th.primary : alpha(th.ink, 0.12), marginBottom: 5, transition: 'background .3s' }} />
            <span style={{ fontFamily: th.body, fontSize: 11, fontWeight: 700, color: i <= stepIdx ? th.primary : alpha(th.ink, 0.4) }}>{s}</span>
          </div>
        ))}
      </div>

      <div style={{ flex: 1, overflowY: 'auto', padding: '6px 18px 24px' }}>
        {step === 1 && (
          <>
            <div style={{ fontFamily: th.display, fontSize: 19, fontWeight: 800, color: th.ink, marginBottom: 6 }}>מתחילים עם {first.name}</div>
            <p style={{ fontFamily: th.body, fontSize: 14, color: alpha(th.ink, 0.6), marginTop: 0, marginBottom: 14, lineHeight: 1.4 }}>זה/זו המועמד/ת הראשון/ה בשידוך. עכשיו נמצא את ההתאמה.</p>
            <CandRow c={first} th={th} selected />
            <div style={{ display: 'flex', gap: 8, alignItems: 'flex-start', background: alpha(th.gold, 0.12), borderRadius: th.r, padding: 12, marginTop: 4 }}>
              <Icon name="info" size={18} style={{ color: th.gold, flexShrink: 0 }} />
              <span style={{ fontFamily: th.body, fontSize: 13, color: alpha(th.ink, 0.72), lineHeight: 1.4 }}>חוק הבית: לפחות אחד מבני הזוג חייב להיות מועמד/ת <b>שלך</b>.</span>
            </div>
            <Btn th={th} full size="l" style={{ marginTop: 20 }} onClick={() => setStep(2)}>בחר/י התאמה</Btn>
          </>
        )}

        {step === 2 && (
          <>
            <div style={{ fontFamily: th.display, fontSize: 19, fontWeight: 800, color: th.ink, marginBottom: 10 }}>מי מתאים/ה ל{first.name}?</div>
            <div style={{ display: 'flex', gap: 7, overflowX: 'auto', marginBottom: 14, paddingBottom: 4 }}>
              <Chip th={th} label="הכל" active={!relFilter} onClick={() => setRelFilter('')} tone={th.gold} />
              {liveReligiosity.slice(0, 6).map(r => <Chip key={r} th={th} label={r} active={relFilter === r} onClick={() => setRelFilter(relFilter === r ? '' : r)} tone={th.gold} />)}
            </div>
            {candidates2.map(c => (
              <CandRow key={c.id} c={c} th={th} selected={second?.id === c.id} onClick={() => setSecond(c)}
                trailing={second?.id === c.id ? <div style={{ color: th.primary }}><Icon name="check" size={24} /></div> : null} />
            ))}
            {candidates2.length === 0 && <div style={{ textAlign: 'center', color: alpha(th.ink, 0.4), padding: 30, fontFamily: th.body }}>אין התאמות בפילטר הזה</div>}
            <Btn th={th} full size="l" style={{ marginTop: 8 }} disabled={!second} onClick={() => setStep(3)}>{second ? `המשך עם ${second.name}` : 'בחר/י מועמד/ת'}</Btn>
          </>
        )}

        {step === 3 && second && (
          <>
            <div style={{ fontFamily: th.display, fontSize: 19, fontWeight: 800, color: th.ink, marginBottom: 14 }}>הנה ההצעה</div>
            {/* pair summary */}
            <div style={{ background: th.card, borderRadius: th.rLg, padding: 18, boxShadow: `0 8px 22px ${alpha(th.ink, 0.08)}`, marginBottom: 14 }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, marginBottom: 14 }}>
                <div style={{ textAlign: 'center' }}>

const { useState: useSd, useRef: useRd, useEffect: useEd } = React;

function statusTone(s, th) {
  return { 'נשלחה': th.gold, 'נצפתה': th.gold, 'אושרה': th.success, 'נדחתה': alpha(th.ink, 0.5) }[s] || th.gold;
}

// OFFER STATUS
// ════════════════════════════════════════════════════════════
function Offers({ th, go }) {
  const { offers, candidates, matchmakers } = useContext(DataCtx);
  const findC = id => candidates.find(c => c.id === id) || { name:'?', grad: gradForId(id), photos:[] };
  const findM = id => { const mm = matchmakers[id]; if (!mm) return { name:'—', grad: gradForId(id||'x') }; return { ...mm, name: mm.displayName || mm.name || '—', grad: mm.grad || gradForId(id) }; };
  const [tab, setTab] = useSd('pending');

  const pending  = offers.filter(o => o.status === 'נשלחה' || o.status === 'נצפתה');
  const approved = offers.filter(o => o.status === 'אושרה');
  const done     = offers.filter(o => o.status === 'נדחתה');
  const listMap  = { pending, approved, done };
  const list     = listMap[tab] || [];

  const emptyMsg = { pending:'אין הצעות הממתינות לאישור', approved:'אין הצעות שאושרו', done:'אין הצעות שהסתיימו' };

  const tabs = [
    { id:'pending',  lbl:'ממתינות', count: pending.length,  dot: th.gold },
    { id:'approved', lbl:'אושרו',   count: approved.length, dot: th.success },
    { id:'done',     lbl:'הסתיימו', count: done.length,     dot: null },
  ];

  return (
    <>
      <AppHeader th={th} title="שידוכים" sub={`${pending.length + approved.length} פעילות`} onBack={() => go('tab', { tab: 'home' })} />
      <div style={{ display: 'flex', gap: 6, padding: '4px 18px 10px', flexShrink: 0 }}>
        {tabs.map(({ id, lbl, count, dot }) => (
          <button key={id} onClick={() => setTab(id)} style={{ flex: 1, padding: '8px 4px', borderRadius: 999, border: 'none', cursor: 'pointer', fontFamily: th.display, fontWeight: 800, fontSize: 13, background: tab === id ? th.ink : 'transparent', color: tab === id ? th.cream : alpha(th.ink, 0.5), boxShadow: tab === id ? 'none' : `inset 0 0 0 1.5px ${alpha(th.ink,0.12)}`, position:'relative' }}>
            {lbl}
            {count > 0 && <span style={{ marginInlineStart:4, background: tab===id ? alpha('#fff',0.25) : (dot || alpha(th.ink,0.2)), color: tab===id ? '#fff' : '#fff', borderRadius:99, fontSize:11, fontWeight:800, padding:'1px 6px' }}>{count}</span>}
          </button>
        ))}
      </div>
      <div style={{ flex: 1, overflowY: 'auto', padding: '6px 18px 24px' }}>
        {list.length === 0 && (
          <div style={{ textAlign:'center', padding:'40px 20px', fontFamily:th.body, color:alpha(th.ink,0.4) }}>
            {emptyMsg[tab]}
          </div>
        )}
        {list.map(o => {
          const a = findC(o.aId), b = findC(o.bId), bMm = findM(o.bMm);
          return (
            <button key={o.id} onClick={() => go('chat', { id: o.id })} style={{ all: 'unset', cursor: 'pointer', boxSizing: 'border-box', width: '100%', background: th.card, borderRadius: th.r, padding: 14, marginBottom: 12, boxShadow: `0 6px 18px ${alpha(th.ink, 0.06)}` }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 4, marginBottom: 12 }}>
                <Avatar grad={a.grad} name={a.name} size={46} photo={a.photos && a.photos[0]} style={{ marginInlineEnd: -8 }} />
                <Avatar grad={b.grad} name={b.name} size={46} photo={b.photos && b.photos[0]} style={{ marginInlineStart: -8, marginInlineEnd: 10 }} />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 15.5, color: th.ink }}>{a.name} · {b.name}</div>
                  <div style={{ fontFamily: th.body, fontSize: 12.5, color: alpha(th.ink, 0.5) }}>השדכן/ית של {b.name}: {bMm.name}</div>
                </div>
                <Tag th={th} tone={statusTone(o.status, th)} soft={false}>{o.status}</Tag>
              </div>
              {/* per-side status */}
              <div style={{ display: 'flex', gap: 8, marginBottom: 12 }}>
                {[[a.name, o.aStatus], [b.name, o.bStatus]].map(([n, st], i) => (
                  <div key={i} style={{ flex: 1, background: alpha(th.ink, 0.04), borderRadius: th.rSm, padding: '7px 10px' }}>
                    <div style={{ fontFamily: th.body, fontSize: 11, color: alpha(th.ink, 0.5) }}>{n}</div>
                    <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 13.5, color: st === 'אישר' ? th.success : st === 'דחה' ? th.error : alpha(th.ink, 0.7) }}>{st}</div>
                  </div>
                ))}
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <div style={{ flex: 1, display: 'flex', alignItems: 'center', gap: 6, color: th.primary }}>
                  <Icon name="chat" size={18} /><span style={{ fontFamily: th.body, fontWeight: 700, fontSize: 13.5 }}>פתח/י צ'אט עם {(bMm.name || '—').split(' ')[0]}</span>
                </div>
                {o.unread > 0 && <span style={{ background: th.primary, color: '#fff', borderRadius: 999, minWidth: 20, height: 20, fontSize: 12, fontWeight: 800, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '0 5px' }}>{o.unread}</span>}
              </div>
            </button>
          );
        })}
      </div>
    </>
  );
}

function Chat({ th, go, params }) {
  const { offers, candidates, matchmakers, updateOffer } = useContext(DataCtx);
  const findC = id => candidates.find(c => c.id === id) || { name:'?', grad: gradForId(id||'x'), photos:[] };
  const findM = id => matchmakers[id] || { name:'—', grad: gradForId(id||'x') };
  const o = offers.find(x => x.id === params?.id) || offers[0];
  if (!o) return (
    <div style={{ height:'100%', display:'flex', alignItems:'center', justifyContent:'center', background:'#fff', direction:'rtl' }}>
      <div style={{ fontFamily:'system-ui', color:'#888' }}>לא נמצאה הצעה</div>
    </div>
  );
  const a = findC(o.aId), b = findC(o.bId), bMm = findM(o.bMm);
  const [msgs, setMsgs] = useSd([]);
  const [text, setText] = useSd('');
  const [testOpen, setTestOpen] = useSd(false);
  const endRef = useRd(null);
  useEd(() => { endRef.current?.parentNode?.scrollTo(0, 99999); }, [msgs]);

  const send = (t) => { if (!t.trim()) return; setMsgs(m => [...m, { from: 'me', text: t, t: 'עכשיו' }]); setText(''); };
  const incoming = (t) => setMsgs(m => [...m, { from: 'm2', text: t, t: 'עכשיו' }]);

  // Test helpers — simulate other matchmaker's response in Firestore
  const testApprove = async () => {
    await updateOffer(o.id, { bStatus: 'אישר', status: 'אושרה' });
    incoming('✅ [בדיקה] שדכן ב\' אישר את ההצעה!');
  };
  const testDecline = async () => {
    await updateOffer(o.id, { bStatus: 'דחה', status: 'נדחתה' });
    incoming('❌ [בדיקה] שדכן ב\' דחה את ההצעה.');
  };
  const testSeen = async () => {
    await updateOffer(o.id, { status: 'נצפתה' });
    incoming('👁 [בדיקה] שדכן ב\' ראה את ההצעה.');
  };

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: th.cream }}>
      {/* header */}
      <div style={{ paddingTop: 50, paddingInline: 14, paddingBottom: 10, background: th.card, flexShrink: 0, borderBottom: `1px solid ${alpha(th.ink, 0.08)}`, display: 'flex', alignItems: 'center', gap: 10 }}>
        <button onClick={() => go('offers')} style={{ width: 38, height: 38, borderRadius: '50%', border: 'none', background: alpha(th.ink, 0.05), color: th.ink, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}><Icon name="back" size={20} /></button>
        <Avatar grad={bMm.grad} name={bMm.name} size={40} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 16, color: th.ink }}>{bMm.name}</div>
          <div style={{ fontFamily: th.body, fontSize: 12, color: alpha(th.ink, 0.5) }}>על {a.name} ו{b.name}</div>
        </div>
        <Tag th={th} tone={statusTone(o.status, th)} soft={false}>{o.status}</Tag>
      </div>

      {/* messages */}
      <div style={{ flex: 1, overflowY: 'auto', padding: '14px 16px', display: 'flex', flexDirection: 'column', gap: 10 }}>
        {/* the proposal card pinned at top */}
        <div style={{ alignSelf: 'center', background: alpha(th.gold, 0.14), borderRadius: th.r, padding: '8px 14px', display: 'flex', alignItems: 'center', gap: 8, marginBottom: 4 }}>
          <Icon name="heart" size={15} style={{ color: th.primary }} fill={th.primary} stroke={0} />
          <span style={{ fontFamily: th.body, fontSize: 12.5, color: alpha(th.ink, 0.7) }}>הצעת שידוך: {a.name} · {b.name}</span>
        </div>
        {msgs.map((m, i) => {
          const mine = m.from === 'me';
          return (
            <div key={i} style={{ alignSelf: mine ? 'flex-start' : 'flex-end', maxWidth: '78%' }}>
              <div style={{ background: mine ? th.primary : th.card, color: mine ? '#fff' : th.ink, borderRadius: 18, borderBottomRightRadius: mine ? 18 : 4, borderBottomLeftRadius: mine ? 4 : 18, padding: '9px 13px', fontFamily: th.body, fontSize: 14.5, lineHeight: 1.4, boxShadow: `0 2px 8px ${alpha(th.ink, 0.06)}` }}>{m.text}</div>
              <div style={{ fontFamily: th.body, fontSize: 10.5, color: alpha(th.ink, 0.4), marginTop: 3, textAlign: mine ? 'right' : 'left' }}>{m.t}</div>
            </div>
          );
        })}
        <div ref={endRef} />
      </div>

      {/* 🔧 TEST PANEL */}
      <div style={{ flexShrink:0, borderTop:`1px solid ${alpha(th.ink,0.07)}` }}>
        <button onClick={() => setTestOpen(x => !x)} style={{ all:'unset', cursor:'pointer', width:'100%', boxSizing:'border-box', padding:'8px 14px', display:'flex', alignItems:'center', gap:6, background:alpha('#f59e0b',0.08) }}>
          <span style={{ fontSize:14 }}>🔧</span>
          <span style={{ fontFamily:th.body, fontSize:12, fontWeight:700, color:'#b45309', flex:1 }}>כלי בדיקה — מאחורי הקלעים</span>
          <span style={{ fontFamily:th.body, fontSize:11, color:alpha(th.ink,0.4) }}>{testOpen ? '▲ סגור' : '▼ פתח'}</span>
        </button>
        {testOpen && (
          <div style={{ padding:'8px 14px 12px', background:alpha('#f59e0b',0.05), display:'flex', flexDirection:'column', gap:6 }}>
            <div style={{ fontFamily:th.body, fontSize:11, color:alpha(th.ink,0.5), marginBottom:2 }}>סמולציה של תגובת השדכן השני ({bMm.name}) — שומר ב-Firestore:</div>
            <div style={{ display:'flex', gap:6 }}>
              <Btn th={th} size="s" variant="ghost" onClick={testSeen} style={{ fontSize:12 }}>👁 צפה</Btn>
              <Btn th={th} size="s" variant="success" onClick={testApprove} style={{ fontSize:12 }}>✅ אישר</Btn>
              <Btn th={th} size="s" variant="ghost" onClick={testDecline} style={{ fontSize:12, color:th.error, boxShadow:`inset 0 0 0 1.5px ${alpha(th.error,0.3)}` }}>❌ דחה</Btn>
            </div>
          </div>
        )}
      </div>

      {/* input */}
      <div style={{ flexShrink: 0, padding: '8px 14px 26px', display: 'flex', gap: 8, alignItems: 'center', background: th.card, borderTop: `1px solid ${alpha(th.ink, 0.08)}` }}>
        <input value={text} onChange={e => setText(e.target.value)} onKeyDown={e => e.key === 'Enter' && send(text)} placeholder="כתוב/י הודעה…" style={{ flex: 1, border: 'none', background: alpha(th.ink, 0.05), borderRadius: 999, padding: '11px 16px', fontFamily: th.body, fontSize: 14.5, outline: 'none', color: th.ink }} />
        <button onClick={() => send(text)} style={{ width: 44, height: 44, borderRadius: '50%', border: 'none', background: th.primary, color: '#fff', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}><Icon name="send" size={20} fill="#fff" stroke={0} /></button>
      </div>
    </div>
  );
}

const TWEAK_DEFAULTS = {
  "primaryColor": "#E8547A", "fontPair": "אופי", "radius": "רך",
  "density": "רגיל", "cardVariant": "קלאסי"
};
const NAV_ROUTES   = ['home', 'cands', 'offers', 'ai', 'set'];
const TAB_TO_ROUTE = { home:'home', cands:'cands', match:'offers', ai:'ai', set:'set' };
const ROUTE_TO_TAB = { home:'home', cands:'cands', candidate:'cands', offers:'match', chat:'match', matchFlow:'match', ai:'ai', set:'set' };

function renderScreen(cur, th, go, profile) {
  const p = cur.params;
  switch (cur.name) {
    case 'onboarding':  return <Onboarding th={th} go={go} />;
    case 'register':    return <Register th={th} go={go} />;
    case 'home':        return <Home th={th} go={go} />;
    case 'cands':       return <Candidates th={th} go={go} />;
    case 'candidate':   return <CandidateDetail th={th} go={go} params={p} />;
    case 'matchFlow':   return <MatchFlow th={th} go={go} params={p} />;
    case 'offers':      return <Offers th={th} go={go} />;
    case 'chat':        return <Chat th={th} go={go} params={p} />;
    case 'ai':          return <AIRecs th={th} go={go} />;
    case 'candidateMode': return <CandidateMode th={th} go={go} />;
    case 'set':         return <AppSettings th={th} go={go} profile={profile} />;
    case 'admin':         return <AdminPanel th={th} go={go} />;
    case 'inviteLanding': return <InvitationLanding th={th} go={go} token={p.token} />;
    case 'candSelfFill':  return <CandidateSelfFill th={th} go={go} params={p} />;
    case 'editCand':      return <EditCandidateScreen th={th} go={go} params={p} />;
    default:              return <Home th={th} go={go} />;
  }
}

function Stage({ children }) {
  const [scale, setScale] = React.useState(1);
  React.useEffect(() => {
    const fit = () => {
      const s = Math.min(1, (window.innerWidth-32)/402, (window.innerHeight-32)/874);
      setScale(s);
    };
    fit(); window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, []);
  return (
    <div style={{ position:'fixed', inset:0, display:'flex', alignItems:'center', justifyContent:'center', background:'radial-gradient(circle at 50% 30%, #3a3440, #211d26)' }}>
      <div style={{ transform:`scale(${scale})`, transformOrigin:'center center' }}>{children}</div>
    </div>
  );
}

function AppInner({ inviteToken }) {
  const [t, setTweak]  = useTweaks(TWEAK_DEFAULTS);
  const th             = makeTheme(t);
  const { user, profile } = useContext(AuthCtx);
  const data           = useContext(DataCtx);
  const [stack, setStack] = React.useState([{ name:'onboarding', params:{} }]);
  const cur  = stack[stack.length - 1];

  // Handle invite token: route to inviteLanding once profile is loaded
  React.useEffect(() => {
    if (!profile) return;
    if (inviteToken && stack.length === 1 && stack[0].name !== 'inviteLanding' && stack[0].name !== 'candSelfFill') {
      setStack([{ name: 'inviteLanding', params: { token: inviteToken } }]);
      return;
    }
    // Skip onboarding if already registered
    if (profile.profileComplete && stack.length === 1 && stack[0].name === 'onboarding') {
      setStack([{ name: 'home', params: {} }]);
    }
  }, [profile]);

  // Patch static globals so existing screens work
  React.useEffect(() => {
    window.CANDIDATES  = data.candidates;
    window.OFFERS      = data.offers;
    window.MATCHMAKERS = data.matchmakers;
    window.findCand    = (id) => data.candidates.find(c => c.id === id);
    window.findMm      = (id) => { const mm = data.matchmakers[id]; if (!mm) return { id, name:'—', grad:['#ccc','#999'] }; return { ...mm, name: mm.displayName || mm.name || '—', grad: mm.grad || ['#ccc','#999'] }; };
    window.CHATS       = {};
    window.AI_PAIRS    = [];
  }, [data.candidates, data.offers, data.matchmakers]);

  const go = React.useCallback((name, params={}) => {
    if (name === 'back')  { setStack(s => s.length > 1 ? s.slice(0,-1) : s); return; }
    if (name === 'tab')   { setStack([{ name: TAB_TO_ROUTE[params.tab]||'home', params:{} }]); return; }
    if (NAV_ROUTES.includes(name)) setStack([{ name, params }]);
    else setStack(s => [...s, { name, params }]);
  }, []);

  const showNav  = NAV_ROUTES.includes(cur.name);
  const activeTab = ROUTE_TO_TAB[cur.name] || 'home';

  return (
    <>
      <div style={{ position:'fixed', inset:0, background:'#1e1a23', display:'flex', justifyContent:'center' }}>
        <div dir="rtl" style={{ width:'100%', maxWidth:430, height:'100%', display:'flex', flexDirection:'column', background:th.cream, fontFamily:th.body, overflow:'hidden', position:'relative' }}>
          {data.loading
            ? <div style={{ flex:1, display:'flex', alignItems:'center', justifyContent:'center' }}><Logo size={60} color={th.primary} flaw={th.cream} /></div>
            : renderScreen(cur, th, go, profile)}
          {showNav && !data.loading && <BottomNav active={activeTab} onNav={(tab) => go('tab',{tab})} th={th} />}
        </div>
      </div>
      <TweaksPanel title="Tweaks">
        <TweakSection label="כרטיסיית מועמד" />
        <TweakRadio label="סגנון" value={t.cardVariant} options={['קלאסי','מגזין','מינימלי']} onChange={v => setTweak('cardVariant',v)} />
        <TweakSection label="צבע" />
        <TweakColor label="צבע ראשי" value={t.primaryColor} options={['#E8547A','#C0436B','#7B4B8A','#E0533F','#2B6E5C']} onChange={v => setTweak('primaryColor',v)} />
        <TweakSection label="טיפוגרפיה" />
        <TweakRadio label="פונט" value={t.fontPair} options={['אופי','נקי','ידידותי']} onChange={v => setTweak('fontPair',v)} />
        <TweakSection label="פריסה" />
        <TweakRadio label="עיגול פינות" value={t.radius} options={['חד','רך','מעוגל']} onChange={v => setTweak('radius',v)} />
        <TweakRadio label="צפיפות" value={t.density} options={['קומפקטי','רגיל','מרווח']} onChange={v => setTweak('density',v)} />
      </TweaksPanel>
    </>
  );
}

function App() {
  const { user, profile } = useAuthState();
  const data = useFirebaseData(user?.uid);
  const [t]  = useTweaks(TWEAK_DEFAULTS);
  const th   = makeTheme(t);
  const [inviteToken] = React.useState(() => {
    const raw = new URLSearchParams(window.location.search).get('invite');
    if (!raw) return null;
    const clean = raw.split(/https?:\/\//)[0];
    return clean || null;
  });

  if (user === undefined) {
    return (
      <div style={{ position:'fixed', inset:0, background:'#1e1a23', display:'flex', justifyContent:'center' }}>
        <div style={{ width:'100%', maxWidth:430, height:'100%', display:'flex', alignItems:'center', justifyContent:'center', background:th.cream }}>
          <Logo size={60} color={th.primary} flaw={th.cream} />
        </div>
      </div>
    );
  }

  if (!user) {
    return (
      <div style={{ position:'fixed', inset:0, background:'#1e1a23', display:'flex', justifyContent:'center' }}>
        <div style={{ width:'100%', maxWidth:430, background:th.cream, height:'100%' }}>
          {inviteToken
            ? <CandidateInviteRegister th={th} inviteToken={inviteToken} />
            : <LoginScreen th={th} inviteToken={inviteToken} />}
        </div>
      </div>
    );
  }

  return (
    <AuthCtx.Provider value={{ user, profile }}>
      <DataCtx.Provider value={data}>
        <TextsCtx.Provider value={{ texts: data.texts, defaults: DEFAULT_TEXTS }}>
          <AppInner inviteToken={inviteToken} />
        </TextsCtx.Provider>
      </DataCtx.Provider>
    </AuthCtx.Provider>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { err: null, info: null }; }
  componentDidCatch(err, info) { this.setState({ err, info }); console.error(err, info); }
  render() {
    const { err, info } = this.state;
    if (!err) return this.props.children;
    const stack = (info?.componentStack || '').trim();
    return (
      <div style={{ position:'fixed', inset:0, background:'#1a0a0a', color:'#ff6b6b', fontFamily:'monospace', overflowY:'auto', padding:'28px 20px', direction:'ltr', boxSizing:'border-box' }}>
        <div style={{ maxWidth:600, margin:'0 auto' }}>
          <div style={{ fontSize:13, color:'#ff9999', marginBottom:6, fontWeight:700, letterSpacing:1 }}>REACT ERROR</div>
          <div style={{ fontSize:17, fontWeight:700, marginBottom:16, color:'#ffaaaa', lineHeight:1.4 }}>{err.toString()}</div>
          {stack && (
            <>
              <div style={{ fontSize:11, color:'#ff6b6b88', marginBottom:6, letterSpacing:1 }}>COMPONENT STACK</div>
              <pre style={{ fontSize:11, color:'#ff9999aa', whiteSpace:'pre-wrap', wordBreak:'break-all', margin:'0 0 20px', lineHeight:1.5 }}>{stack}</pre>
            </>
          )}
          {err.stack && (
            <>
              <div style={{ fontSize:11, color:'#ff6b6b88', marginBottom:6, letterSpacing:1 }}>STACK TRACE</div>
              <pre style={{ fontSize:11, color:'#ff9999aa', whiteSpace:'pre-wrap', wordBreak:'break-all', margin:0, lineHeight:1.5 }}>{err.stack}</pre>
            </>
          )}
          <button onClick={() => this.setState({ err:null, info:null })} style={{ marginTop:24, padding:'10px 22px', background:'#ff6b6b22', border:'1.5px solid #ff6b6b55', borderRadius:8, color:'#ff9999', fontFamily:'monospace', fontSize:13, cursor:'pointer' }}>
            נסה שוב
          </button>
        </div>
      </div>
    );
  }
}

// Also catch unhandled JS errors (outside React tree)
window.addEventListener('error', (e) => {
  const root = document.getElementById('root');
  if (root && root.innerHTML.trim() === '') {
    root.innerHTML = `<div style="position:fixed;inset:0;background:#1a0a0a;color:#ff6b6b;font-family:monospace;padding:28px 20px;overflow:auto;direction:ltr"><div style="max-width:600px;margin:0 auto"><div style="font-size:13px;font-weight:700;margin-bottom:8px;color:#ff9999">JS ERROR</div><div style="font-size:17px;color:#ffaaaa;margin-bottom:16px">${e.message}</div><pre style="font-size:11px;color:#ff9999aa;white-space:pre-wrap">${e.error?.stack || ''}</pre></div></div>`;
  }
});

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary><App /></ErrorBoundary>
);
</script>
</body>
</html>
