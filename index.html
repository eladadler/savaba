// screens-d.jsx — Offer status, Matchmaker chat, AI recommendations
const { useState: useSd, useRef: useRd, useEffect: useEd } = React;

function statusTone(s, th) {
  return { 'נשלחה': th.gold, 'נצפתה': th.gold, 'אושרה': th.success, 'נדחתה': alpha(th.ink, 0.5),
           'ממתין למועמד': th.primary, 'ממתין למועמד ב': th.primary }[s] || th.gold;
}

// ════════════════════════════════════════════════════════════
// OFFER STATUS
// ════════════════════════════════════════════════════════════
function Offers({ th, go, params }) {
  const { offers, candidates, matchmakers, updateOffer } = useContext(DataCtx);
  const { user } = useContext(AuthCtx);
  const myUid = user?.uid;
  const findC = id => candidates.find(c => c.id === id) || { name:'?', grad: gradForId(id), photos:[] };
  const findM = id => { const mm = matchmakers[id]; if (!mm) return { name:'—', grad: gradForId(id||'x') }; return { ...mm, name: mm.displayName || mm.name || '—', grad: mm.grad || gradForId(id) }; };
  const [tab, setTab] = useSd(params?.tab || 'pending');
  const [subFilter, setSubFilter] = useSd(params?.filter || null);
  const [chatUnread, setChatUnread] = useSd({});
  const [sortBy, setSortBy] = useSd('newest');

  // Subscribe to mm_chats to detect unread messages from the other matchmaker
  useEd(() => {
    if (!myUid) return;
    const unsub = db.collection('mm_chats')
      .where('participants', 'array-contains', myUid)
      .onSnapshot(snap => {
        const unread = {};
        snap.forEach(doc => {
          const data = doc.data();
          const oid = data.offerId || doc.id;
          const msgs = data.messages || [];
          const last = msgs[msgs.length - 1];
          if (!last || last.from === myUid) return;     // last msg is mine → read
          const lastAt = last.at || 0;
          const lastRead = parseInt(localStorage.getItem('chatRead_' + oid) || '0');
          if (lastAt > lastRead) unread[oid] = true;
        });
        setChatUnread(unread);
      });
    return unsub;
  }, [myUid]);

  const markChatRead = (oid) => {
    localStorage.setItem('chatRead_' + oid, String(Date.now()));
    setChatUnread(prev => { const n = { ...prev }; delete n[oid]; return n; });
  };

  const pending  = offers.filter(o => o.status === 'נשלחה' || o.status === 'נצפתה' || o.status === 'ממתין למועמד' || o.status === 'ממתין למועמד ב');
  const approved = offers.filter(o => o.status === 'אושרה');
  const done     = offers.filter(o => o.status === 'נדחתה');
  const listMap  = { pending, approved, done };

  // Apply sub-filter from home banner — when active, search across ALL offers (not tab-limited)
  let list;
  if (subFilter === 'needsMyApproval') {
    list = offers.filter(o => o.bMm === myUid && o.aMm !== myUid && !['אישר','דחה'].includes(o.bStatus) && o.status !== 'נדחתה');
  } else if (subFilter === 'awaitingCand') {
    list = offers.filter(o =>
      (o.aMm === myUid || o.bMm === myUid) && o.bStatus === 'אישר' && (!o.aCandStatus || !o.bCandStatus) && o.status !== 'נדחתה' && o.status !== 'אושרה');
  } else {
    list = listMap[tab] || [];
  }

  const needsMyAction = o => o.bMm === myUid && o.aMm !== myUid && !['אישר','דחה'].includes(o.bStatus) && o.status !== 'נדחתה';
  const sortedList = (() => {
    const arr = [...list];
    if (sortBy === 'oldest') {
      arr.sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
    } else if (sortBy === 'myAction') {
      arr.sort((a, b) => (needsMyAction(b) ? 1 : 0) - (needsMyAction(a) ? 1 : 0) || (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    }
    // 'newest' already sorted from context
    return arr;
  })();

  const subFilterLabels = { needsMyApproval: 'ממתינות לאישורי', awaitingCand: 'ממתינות לתשובת מועמד' };
  const emptyMsg = { pending:'אין הצעות הממתינות לאישור', approved:'אין הצעות שאושרו', done:'אין הצעות שהסתיימו' };

  const tabs = [
    { id:'pending',  lbl:'ממתינות', count: pending.length,  dot: th.gold },
    { id:'approved', lbl:'אושרו',   count: approved.length, dot: th.success },
    { id:'done',     lbl:'נדחו',    count: done.length,     dot: null },
  ];

  return (
    <>
      <AppHeader th={th} title="הצעות" sub={`${pending.length + approved.length} פעילות`} onBack={() => go('tab', { tab: 'home' })} />
      <div style={{ display: 'flex', gap: 6, padding: '4px 18px 6px', flexShrink: 0 }}>
        {tabs.map(({ id, lbl, count, dot }) => (
          <button key={id} onClick={() => { setTab(id); setSubFilter(null); }} style={{ flex: 1, padding: '8px 4px', borderRadius: 999, border: 'none', cursor: 'pointer', fontFamily: th.display, fontWeight: 800, fontSize: 13, background: tab === id ? th.ink : 'transparent', color: tab === id ? th.cream : alpha(th.ink, 0.5), boxShadow: tab === id ? 'none' : `inset 0 0 0 1.5px ${alpha(th.ink,0.12)}`, position:'relative' }}>
            {lbl}
            {count > 0 && <span style={{ marginInlineStart:4, background: tab===id ? alpha('#fff',0.25) : (dot || alpha(th.ink,0.2)), color:'#fff', borderRadius:99, fontSize:11, fontWeight:800, padding:'1px 6px' }}>{count}</span>}
          </button>
        ))}
      </div>
      {/* Sort picker */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '0 18px 10px', flexShrink: 0 }}>
        <span style={{ fontFamily: th.body, fontSize: 12, color: alpha(th.ink, 0.38), fontWeight: 600, whiteSpace: 'nowrap', flexShrink: 0 }}>↕ מיון:</span>
        <div style={{ display: 'flex', background: alpha(th.ink, 0.06), borderRadius: 999, padding: 3, gap: 2 }}>
          {[{ id: 'newest', lbl: 'חדש' }, { id: 'oldest', lbl: 'ישן' }, { id: 'myAction', lbl: 'ממתין לי' }].map(({ id, lbl }) => (
            <button key={id} onClick={() => setSortBy(id)}
              style={{ border: 'none', cursor: 'pointer', borderRadius: 999, padding: '4px 11px',
                fontFamily: th.body, fontWeight: 700, fontSize: 12,
                background: sortBy === id ? th.cream : 'transparent',
                color: sortBy === id ? th.primary : alpha(th.ink, 0.45),
                boxShadow: sortBy === id ? `0 1px 4px ${alpha(th.ink, 0.12)}` : 'none',
                transition: 'all .15s' }}>
              {lbl}
            </button>
          ))}
        </div>
      </div>
      {/* Active filter chip */}
      {subFilter && (
        <div style={{ padding: '0 18px 8px', flexShrink: 0 }}>
          <button onClick={() => setSubFilter(null)} style={{ display:'inline-flex', alignItems:'center', gap:6, border:'none', background: alpha(th.primary, 0.1), borderRadius: 999, padding: '5px 12px', cursor:'pointer', fontFamily: th.body, fontSize: 12, fontWeight: 700, color: th.primary }}>
            <Icon name="filter" size={13} />
            {subFilterLabels[subFilter]}
            <span style={{ opacity: 0.6, fontWeight: 400 }}>✕</span>
          </button>
        </div>
      )}
      <div style={{ flex: 1, overflowY: 'auto', padding: '6px 18px 24px' }}>
        {list.length === 0 && (
          <div style={{ textAlign:'center', padding:'40px 20px', fontFamily:th.body, color:alpha(th.ink,0.4) }}>
            {subFilter ? 'אין הצעות מסוג זה כרגע' : emptyMsg[tab]}
          </div>
        )}
        {sortedList.map(o => {
          const iAmA      = o.aMm === user?.uid;
          const myCand    = findC(iAmA ? o.aId : o.bId);
          const theirC    = findC(iAmA ? o.bId : o.aId);
          const theirMm   = findM(iAmA ? o.bMm : o.aMm);
          const aCandApp  = !!(o.aCandApproved || o.candAApprovedByMm);
          const bCandApp  = !!o.bCandApproved;
          const myApp     = iAmA ? aCandApp : bCandApp;
          const theirApp  = iAmA ? bCandApp : aCandApp;
          const bothApp   = aCandApp && bCandApp;
          const finalFail = o.status === 'נדחתה';
          const needsResp = (!myApp && !finalFail) || !!chatUnread[o.id];

          const isEngaged = !!o.isEngaged;
          return (
            <button key={o.id}
              onClick={() => { markChatRead(o.id); go('offerDetail', { id: o.id }); }}
              style={{ all:'unset', cursor:'pointer', width:'100%', boxSizing:'border-box',
                background: isEngaged
                  ? `linear-gradient(150deg,${alpha(th.gold,0.13)},${alpha(th.gold,0.04)})`
                  : bothApp ? `linear-gradient(150deg,${alpha(th.success,0.09)},${alpha(th.success,0.03)})` : th.card,
                borderRadius: th.r, padding: '12px 14px', marginBottom: 14, display:'block',
                boxShadow: isEngaged
                  ? `0 6px 24px ${alpha(th.gold,0.28)}, 0 0 0 2px ${th.gold}`
                  : bothApp
                  ? `0 4px 18px ${alpha(th.success,0.18)}, 0 0 0 1.5px ${alpha(th.success,0.32)}`
                  : needsResp
                  ? `0 4px 18px ${alpha(th.primary,0.18)}, 0 0 0 2px ${th.primary}`
                  : `0 3px 12px ${alpha(th.ink,0.06)}` }}>

              {/* Row 1: names + badges */}
              <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:10 }}>
                <div style={{ fontFamily:th.display, fontWeight:800, fontSize:15, color:th.ink, display:'flex', alignItems:'center', gap:6 }}>
                  {isEngaged && <span style={{ fontSize:18 }}>💍</span>}
                  {myCand.name} · {theirC.name}
                </div>
                <div style={{ display:'flex', gap:5, flexShrink:0, marginInlineStart:6 }}>
                  {isEngaged && <span style={{ fontFamily:th.body, fontSize:11, fontWeight:700, color:th.gold, background:alpha(th.gold,0.15), borderRadius:99, padding:'3px 8px', whiteSpace:'nowrap' }}>💍 התחתנו!</span>}
                  {!isEngaged && needsResp && !bothApp && !finalFail && <span style={{ fontFamily:th.body, fontSize:11, fontWeight:700, color:th.primary, background:alpha(th.primary,0.1), borderRadius:99, padding:'3px 8px', whiteSpace:'nowrap' }}>ממתין לתגובתי</span>}
                  {!isEngaged && bothApp   && <span style={{ fontFamily:th.body, fontSize:11, fontWeight:700, color:th.success, background:alpha(th.success,0.1), borderRadius:99, padding:'3px 8px' }}>🎉 אושרה</span>}
                  {finalFail && <span style={{ fontFamily:th.body, fontSize:11, fontWeight:700, color:th.error,   background:alpha(th.error,0.1),   borderRadius:99, padding:'3px 8px' }}>נדחתה</span>}
                </div>
              </div>

              {/* Row 2: two candidate chips */}
              <div style={{ display:'flex', gap:8 }}>
                {[
                  { cand: myCand, approved: myApp,    mine: true  },
                  { cand: theirC, approved: theirApp,  mine: false },
                ].map(({ cand, approved, mine }) => (
                  <div key={cand.id} style={{ flex:1, borderRadius:th.rSm, padding:'8px 10px',
                    background: approved ? alpha(th.success,0.08) : mine ? alpha(th.primary,0.06) : alpha(th.ink,0.04),
                    border:`1.5px solid ${approved ? alpha(th.success,0.28) : mine ? alpha(th.primary,0.18) : alpha(th.ink,0.08)}` }}>
                    <div style={{ fontFamily:th.body, fontSize:9.5, fontWeight:700, color:mine?th.primary:alpha(th.ink,0.4), marginBottom:5 }}>
                      {mine ? '◆ שלי' : 'הצד השני'}
                    </div>
                    <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                      <Avatar grad={cand.grad} name={cand.name} size={26} photo={cand.photos?.[0]} />
                      <span style={{ fontFamily:th.display, fontWeight:800, fontSize:13, color:th.ink, flex:1, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{cand.name}</span>
                      <div style={{ width:18, height:18, borderRadius:'50%', flexShrink:0,
                        background: approved ? th.success : alpha(th.ink,0.1),
                        display:'flex', alignItems:'center', justifyContent:'center' }}>
                        {approved && <Icon name="check" size={10} style={{ color:'#fff' }} />}
                      </div>
                    </div>
                  </div>
                ))}
              </div>

              {/* Row 3: their mm + unread badge */}
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginTop:9, paddingTop:9, borderTop:`1px solid ${alpha(th.ink,0.06)}` }}>
                <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                  <Avatar grad={theirMm.grad} name={theirMm.name} size={20} photo={theirMm.photoURL} />
                  <span style={{ fontFamily:th.body, fontSize:12, color:alpha(th.ink,0.5) }}>{theirMm.name}</span>
                </div>
                <div style={{ display:'flex', alignItems:'center', gap:5 }}>
                  {chatUnread[o.id] && <span style={{ fontFamily:th.body, fontWeight:700, fontSize:11, color:th.primary, background:alpha(th.primary,0.1), borderRadius:999, padding:'2px 8px' }}>הודעה חדשה</span>}
                  <Icon name="chevL" size={14} style={{ color:alpha(th.ink,0.3) }} />
                </div>
              </div>
            </button>
          );
        })}
      </div>
    </>
  );
}

// MATCHMAKER CHAT
// ════════════════════════════════════════════════════════════
function Chat({ th, go, params }) {
  // All hooks MUST come before any early returns (Rules of Hooks)
  const { offers, candidates, matchmakers, updateOffer } = useContext(DataCtx);
  const { user } = useContext(AuthCtx);
  const [msgs,     setMsgs]     = useSd([]);
  const [text,     setText]     = useSd('');
  const [testOpen, setTestOpen] = useSd(false);
  const endRef = useRd(null);
  useEd(() => { endRef.current?.parentNode?.scrollTo(0, 99999); }, [msgs]);

  // Mark chat as read when this screen opens
  const chatOid = params?.id;
  useEd(() => {
    if (chatOid) localStorage.setItem('chatRead_' + chatOid, String(Date.now()));
  }, [chatOid]);

  // Firestore real-time listener — messages persist across renders/sessions
  useEd(() => {
    if (!chatOid || !user?.uid) return;
    const unsub = db.collection('mm_chats').doc(chatOid).onSnapshot(snap => {
      const data = snap.data();
      const rawMsgs = data?.messages || [];
      setMsgs(rawMsgs.map(m => ({
        from: m.from === user.uid ? 'me' : 'm2',
        text: m.text,
        t: m.at ? new Date(m.at).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }) : 'עכשיו',
      })));
    });
    return unsub;
  }, [chatOid, user?.uid]);

  const findC = id => candidates.find(c => c.id === id) || { name:'?', grad: gradForId(id||'x'), photos:[] };
  const findM = id => { const mm = matchmakers[id]; if (!mm) return { name:'—', grad: gradForId(id||'x') }; return { ...mm, name: mm.displayName||mm.name||'—', grad: mm.grad||gradForId(id) }; };

  const o = offers.find(x => x.id === params?.id) || offers[0];
  if (!o) return (
    <div style={{ height:'100%', display:'flex', alignItems:'center', justifyContent:'center', background:th.cream, direction:'rtl' }}>
      <div style={{ fontFamily:th.body, color:alpha(th.ink,0.4) }}>לא נמצאה הצעה</div>
    </div>
  );

  const iAmA    = o.aMm === user?.uid;
  const theirMmId = iAmA ? o.bMm : o.aMm;
  const theirMm   = findM(theirMmId);
  const a = findC(o.aId), b = findC(o.bId);
  const myCand   = iAmA ? a : b;
  const theirCand = iAmA ? b : a;

  const send = async (t) => {
    if (!t.trim()) return;
    const msgText = t.trim();
    setText('');
    await db.collection('mm_chats').doc(o.id).set({
      offerId: o.id,
      participants: [user.uid, theirMmId].filter(Boolean),
      lastAt: firebase.firestore.FieldValue.serverTimestamp(),
      lastMsg: msgText,
      messages: firebase.firestore.FieldValue.arrayUnion({ from: user.uid, text: msgText, at: Date.now() }),
    }, { merge: true });
  };
  const incoming = (t) => setMsgs(m => [...m, { from: 'm2', text: t, t: 'עכשיו' }]);

  // Test helpers — simulate other matchmaker's response in Firestore
  const testApprove      = async () => { await updateOffer(o.id, { bStatus: 'אישר' }); incoming('✅ [בדיקה] שדכן ב\' אישר את ההצעה!'); };
  const testDecline      = async () => { await updateOffer(o.id, { bStatus: 'דחה', status: 'נדחתה' }); incoming('❌ [בדיקה] שדכן ב\' דחה את ההצעה.'); };
  const testSeen         = async () => { await updateOffer(o.id, { status: 'נצפתה' }); incoming('👁 [בדיקה] שדכן ב\' ראה את ההצעה.'); };
  const testACandApprove = async () => { await updateOffer(o.id, { aCandStatus: 'אישר' }); incoming(`✅ [בדיקה] ${a.name} אישר/ה את ההצעה!`); };
  const testBCandApprove = async () => { await updateOffer(o.id, { bCandStatus: 'אישר', status: 'אושרה' }); incoming(`🎉 [בדיקה] ${b.name} אישר/ה — ההצעה אושרה!`); };
  const testBCandDecline = async () => { await updateOffer(o.id, { bCandStatus: 'דחה', status: 'נדחתה' }); incoming(`❌ [בדיקה] ${b.name} דחה/תה את ההצעה.`); };

  // WhatsApp link
  const waPhone = theirMm.phone ? String(theirMm.phone).replace(/\D/g,'').replace(/^0/,'972') : '';
  const waUrl = waPhone
    ? `https://wa.me/${waPhone}?text=${encodeURIComponent(`היי ${theirMm.name.split(' ')[0]}, בנושא ההצעה: ${myCand.name} ו${theirCand.name}`)}`
    : `https://wa.me/`;

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: th.cream }}>
      {/* Header */}
      <div style={{ paddingTop: 50, paddingInline: 14, paddingBottom: 10, background: th.card, flexShrink: 0, borderBottom: `1px solid ${alpha(th.ink, 0.08)}`, display: 'flex', alignItems: 'center', gap: 10 }}>
        <button onClick={() => go('offers')} style={{ width: 38, height: 38, borderRadius: '50%', border: 'none', background: alpha(th.ink, 0.05), color: th.ink, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}><Icon name="back" size={20} /></button>
        <Avatar grad={theirMm.grad} name={theirMm.name} size={40} photo={theirMm.photoURL} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontFamily: th.display, fontWeight: 800, fontSize: 16, color: th.ink }}>{theirMm.name}</div>
          {/* Tappable candidate names → profile */}
          <div style={{ display: 'flex', gap: 6, alignItems: 'center', marginTop: 1 }}>
            <button onClick={() => go('candidate', { id: o.aId })}
              style={{ all:'unset', cursor:'pointer', fontFamily:th.body, fontSize:12, color:th.primary, fontWeight:700 }}>{a.name}</button>
            <span style={{ fontFamily:th.body, fontSize:11, color:alpha(th.ink,0.3) }}>·</span>
            <button onClick={() => go('candidate', { id: o.bId })}
              style={{ all:'unset', cursor:'pointer', fontFamily:th.body, fontSize:12, color:th.primary, fontWeight:700 }}>{b.name}</button>
          </div>
        </div>
        {/* WhatsApp */}
        <a href={waUrl} target="_blank" rel="noreferrer"
          style={{ width:34, height:34, borderRadius:'50%', background:'#25D36612', border:`1px solid #25D36628`, color:'#25D366', display:'flex', alignItems:'center', justifyContent:'center', textDecoration:'none', flexShrink:0 }}>
          <Icon name="whatsapp" size={18} style={{ color:'#25D366' }} />
        </a>
        <Tag th={th} tone={statusTone(o.status, th)} soft={false}>{o.status}</Tag>
      </div>

      {/* Messages */}
      <div style={{ flex: 1, overflowY: 'auto', padding: '14px 16px', display: 'flex', flexDirection: 'column', gap: 10 }}>
        <div style={{ alignSelf: 'center', background: alpha(th.gold, 0.14), borderRadius: th.r, padding: '8px 14px', display: 'flex', alignItems: 'center', gap: 8, marginBottom: 4 }}>
          <Icon name="heart" size={15} style={{ color: th.primary }} fill={th.primary} stroke={0} />
          <span style={{ fontFamily: th.body, fontSize: 12.5, color: alpha(th.ink, 0.7) }}>הצעת שידוך: {a.name} · {b.name}</span>
        </div>

        {/* ── Approval banner: shown to the receiver (bMm) when action is needed ── */}
        {!iAmA && !['אישר','דחה'].includes(o.bStatus) && !['אושרה','נדחתה'].includes(o.status) && (
          <div style={{ background:alpha(th.primary,0.07), border:`1.5px solid ${alpha(th.primary,0.2)}`,
            borderRadius:th.r, padding:'13px 14px', marginBottom:6 }}>
            <div style={{ fontFamily:th.display, fontWeight:800, fontSize:14, color:th.ink, marginBottom:6 }}>
              🤝 הצעת שידוך ממתינה לאישורך
            </div>
            <div style={{ fontFamily:th.body, fontSize:12.5, color:alpha(th.ink,0.6), marginBottom:12 }}>
              {b.name} · {a.name} — האם ברצונך להמשיך?
            </div>
            <div style={{ display:'flex', gap:8 }}>
              <button
                onClick={async () => { await updateOffer(o.id, { bStatus: 'אישר' }); }}
                style={{ flex:1, padding:'9px 0', borderRadius:th.rSm, border:'none',
                  cursor:'pointer', fontFamily:th.display, fontWeight:800, fontSize:14,
                  background:th.success, color:'#fff' }}>
                ✓ אשר הצעה
              </button>
              <button
                onClick={async () => {
                  if (window.confirm('לדחות את הצעת השידוך?'))
                    await updateOffer(o.id, { bStatus: 'דחה', status: 'נדחתה' });
                }}
                style={{ flex:1, padding:'9px 0', borderRadius:th.rSm,
                  border:`1.5px solid ${alpha(th.error,0.3)}`, cursor:'pointer',
                  fontFamily:th.display, fontWeight:800, fontSize:14,
                  background:alpha(th.error,0.1), color:th.error }}>
                ✗ דחה
              </button>
            </div>
          </div>
        )}

        {msgs.map((m, i) => {
          const mine = m.from === 'me';
          return (
            <div key={i} style={{ alignSelf: mine ? 'flex-start' : 'flex-end', maxWidth: '78%' }}>
              <div style={{ background: mine ? th.primary : th.card, color: mine ? '#fff' : th.ink, borderRadius: 18, borderBottomRightRadius: mine ? 18 : 4, borderBottomLeftRadius: mine ? 4 : 18, padding: '9px 13px', fontFamily: th.body, fontSize: 14.5, lineHeight: 1.4, boxShadow: `0 2px 8px ${alpha(th.ink, 0.06)}` }}>{m.text}</div>
              <div style={{ fontFamily: th.body, fontSize: 10.5, color: alpha(th.ink, 0.4), marginTop: 3, textAlign: mine ? 'right' : 'left' }}>{m.t}</div>
            </div>
          );
        })}
        <div ref={endRef} />
      </div>

      {/* 🔧 TEST PANEL */}
      <div style={{ flexShrink:0, borderTop:`1px solid ${alpha(th.ink,0.07)}` }}>
        <button onClick={() => setTestOpen(x => !x)} style={{ all:'unset', cursor:'pointer', width:'100%', boxSizing:'border-box', padding:'8px 14px', display:'flex', alignItems:'center', gap:6, background:alpha('#f59e0b',0.08) }}>
          <span style={{ fontSize:14 }}>🔧</span>
          <span style={{ fontFamily:th.body, fontSize:12, fontWeight:700, color:'#b45309', flex:1 }}>כלי בדיקה — מאחורי הקלעים</span>
          <span style={{ fontFamily:th.body, fontSize:11, color:alpha(th.ink,0.4) }}>{testOpen ? '▲ סגור' : '▼ פתח'}</span>
        </button>
        {testOpen && (
          <div style={{ padding:'8px 14px 12px', background:alpha('#f59e0b',0.05), display:'flex', flexDirection:'column', gap:8 }}>
            <div style={{ fontFamily:th.body, fontSize:10.5, color:alpha(th.ink,0.5) }}>MM רמה — תגובת {theirMm.name.split(' ')[0]}:</div>
            <div style={{ display:'flex', gap:6 }}>
              <Btn th={th} size="s" variant="ghost" onClick={testSeen} style={{ fontSize:11 }}>👁 צפה</Btn>
              <Btn th={th} size="s" variant="success" onClick={testApprove} style={{ fontSize:11 }}>✅ אישר</Btn>
              <Btn th={th} size="s" variant="ghost" onClick={testDecline} style={{ fontSize:11, color:th.error, boxShadow:`inset 0 0 0 1.5px ${alpha(th.error,0.3)}` }}>❌ דחה</Btn>
            </div>
            <div style={{ fontFamily:th.body, fontSize:10.5, color:alpha(th.ink,0.5) }}>מועמד/ת א׳ ({a.name}):</div>
            <div style={{ display:'flex', gap:6 }}>
              <Btn th={th} size="s" variant="success" onClick={testACandApprove} style={{ fontSize:11 }}>✅ {a.name} אישר/ה</Btn>
            </div>
            <div style={{ fontFamily:th.body, fontSize:10.5, color:alpha(th.ink,0.5) }}>מועמד/ת ב׳ ({b.name}):</div>
            <div style={{ display:'flex', gap:6 }}>
              <Btn th={th} size="s" variant="success" onClick={testBCandApprove} style={{ fontSize:11 }}>✅ {b.name} אישר/ה</Btn>
              <Btn th={th} size="s" variant="ghost" onClick={testBCandDecline} style={{ fontSize:11, color:th.error, boxShadow:`inset 0 0 0 1.5px ${alpha(th.error,0.3)}` }}>❌ דחה/תה</Btn>
            </div>
          </div>
        )}
      </div>

      {/* Input bar */}
      <div style={{ flexShrink: 0, padding: '8px 14px 26px', display: 'flex', gap: 8, alignItems: 'center', background: th.card, borderTop: `1px solid ${alpha(th.ink, 0.08)}` }}>
        <input value={text} onChange={e => setText(e.target.value)} onKeyDown={e => e.key === 'Enter' && send(text)} placeholder="כתוב/י הודעה…" style={{ flex: 1, border: 'none', background: alpha(th.ink, 0.05), borderRadius: 999, padding: '11px 16px', fontFamily: th.body, fontSize: 14.5, outline: 'none', color: th.ink }} />
        <button onClick={() => send(text)} style={{ width: 44, height: 44, borderRadius: '50%', border: 'none', background: th.primary, color: '#fff', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}><Icon name="send" size={20} fill="#fff" stroke={0} /></button>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// AI RECOMMENDATIONS
// ════════════════════════════════════════════════════════════
function AIRecs({ th, go }) {
  const { candidates, offers } = React.useContext(DataCtx);
  const { user }               = React.useContext(AuthCtx);
  const { texts: tx, defaults: dx } = React.useContext(TextsCtx);
  const t = (key) => tx[key] || dx[key] || '';
  const myUid = user?.uid;

  // ── Scoring engine ────────────────────────────────────────────
  const pairs = React.useMemo(() => {
    if (!myUid || !candidates.length) return [];

    const mine   = candidates.filter(c => c.mmId === myUid);
    const others = candidates.filter(c => c.mmId && c.mmId !== myUid);
    if (!mine.length || !others.length) return [];

    // Offers already in flight — skip those pairs
    const existing = new Set(
      offers.flatMap(o => [`${o.aId}__${o.bId}`, `${o.bId}__${o.aId}`])
    );

    // Religiosity compatibility (gender-neutral root comparison)
    const rRoot = r => (r||'').replace(/ית$|ית$/,'י').replace(/ה$/,'');
    const RCOMPAT = {
      'חרד':      ['חרד', 'דתי-לאומ'],
      'דתי-לאומ': ['חרד', 'דתי-לאומ', 'מסורת'],
      'מסורת':    ['דתי-לאומ', 'מסורת', 'חילונ'],
      'חילונ':    ['מסורת', 'חילונ'],
    };
    const compatRelig = (r1, r2) => {
      if (!r1 || !r2) return true;
      const k1 = Object.keys(RCOMPAT).find(k => rRoot(r1).startsWith(k));
      const k2 = Object.keys(RCOMPAT).find(k => rRoot(r2).startsWith(k));
      if (!k1 || !k2) return true;
      return k1 === k2 || (RCOMPAT[k1]||[]).some(x => k2.startsWith(x));
    };

    const calcScore = (a, b) => {
      const isFemale = c => c.gender === 'f' || c.gender === 'אשה';
      if (isFemale(a) === isFemale(b)) return -1;   // same gender → skip
      let s = 50;
      // Religiosity: +20 exact match, +8 compatible, -25 incompatible (high priority)
      if (a.religiosity === b.religiosity) s += 20;
      else if (compatRelig(a.religiosity, b.religiosity)) s += 8;
      else s -= 25;
      // Shared interests: +9 each, max +30 (top priority after religiosity)
      const shared = (a.interests||[]).filter(i => (b.interests||[]).includes(i));
      s += Math.min(shared.length * 9, 30);
      // Same region +4 (lower priority than interests)
      if (a.region && a.region === b.region) s += 4;
      // Age proximity
      const diff = Math.abs((a.age||28) - (b.age||28));
      if (diff <= 3) s += 10; else if (diff <= 7) s += 5; else if (diff > 14) s -= 15;
      // Partner preference match: candidate A wants traits B has
      const partnerMatch = (seeker, candidate) =>
        (seeker.partner||[]).filter(t => {
          const c = candidate;
          if (t === 'הלכתי' || t === 'דתי') return c.religiosity?.includes('דת') || c.religiosity?.includes('חרד');
          if (t === 'חילוני') return c.religiosity?.includes('חילונ');
          if (t === 'שאפתן' || t === 'קרייריסטי') return (c.interests||[]).some(x => ['עסקים','קריירה','אקדמיה'].includes(x));
          if (t === 'חברתי') return (c.interests||[]).some(x => ['נסיעות','בידור','ריקוד'].includes(x));
          if (t === 'אקדמאי' || t === 'אקדמאית') return c.oneLine?.includes('אקדמ') || (c.interests||[]).includes('לימוד');
          return false;
        }).length;
      s += Math.min(partnerMatch(a, b) * 5, 10);
      s += Math.min(partnerMatch(b, a) * 5, 10);
      return Math.min(95, Math.max(10, s));
    };

    const buildWhy = (a, b) => {
      const shared = (a.interests||[]).filter(i => (b.interests||[]).includes(i));
      const parts = [];
      if (a.religiosity && a.religiosity === b.religiosity)
        parts.push(`שניהם ${a.religiosity}`);
      else if (compatRelig(a.religiosity, b.religiosity) && a.religiosity && b.religiosity)
        parts.push('רמת דתיות משלימה');
      if (shared.length)
        parts.push(`עניין משותף: ${shared.slice(0,3).join(', ')}`);
      if (a.region && a.region === b.region)
        parts.push(`שניהם מ${a.region}`);
      if (!parts.length) parts.push('פרופילים עם פוטנציאל התאמה גבוה');
      return parts.join(' · ');
    };

    const out = [];
    for (const c1 of mine) {
      for (const c2 of others) {
        if (existing.has(`${c1.id}__${c2.id}`)) continue;
        const s = calcScore(c1, c2);
        if (s < 0) continue;
        out.push({ aId: c1.id, bId: c2.id, score: s, why: buildWhy(c1, c2) });
      }
    }
    out.sort((x, y) => y.score - x.score);
    return out.slice(0, 10);
  }, [candidates, offers, myUid]);

  // ── Render ────────────────────────────────────────────────────
  return (
    <>
      <AppHeader th={th} title="המלצות AI" sub="הזיווגים שהאלגוריתם מצא השבוע" action={<div style={{ color: th.gold }}><Icon name="spark" size={26} fill={th.gold} /></div>} />
      <div style={{ flex: 1, overflowY: 'auto', padding: '10px 18px 24px' }}>
        <div style={{ display: 'flex', gap: 10, alignItems: 'flex-start', background: alpha(th.gold, 0.1), borderRadius: th.r, padding: 13, marginBottom: 16 }}>
          <Icon name="info" size={18} style={{ color: th.gold, flexShrink: 0 }} />
          <span style={{ fontFamily: th.body, fontSize: 13, color: alpha(th.ink, 0.72), lineHeight: 1.45 }}>
            <span dangerouslySetInnerHTML={{ __html: t('ai_info_text') }} />
          </span>
        </div>

        {pairs.length === 0 && (
          <div style={{ textAlign:'center', padding:'48px 24px', color:alpha(th.ink,0.4) }}>
            <Icon name="spark" size={44} style={{ marginBottom:14, color:alpha(th.ink,0.15) }} />
            <div style={{ fontFamily:th.display, fontWeight:800, fontSize:17, marginBottom:8, color:alpha(th.ink,0.5) }}>אין התאמות כרגע</div>
            <div style={{ fontFamily:th.body, fontSize:13.5, lineHeight:1.5 }}>
              הוסף מועמדים ממגדרים שונים כדי שה-AI יוכל להציע זיווגים
            </div>
          </div>
        )}

        {pairs.map((p, i) => {
          const a = findCand(p.aId), b = findCand(p.bId);
          if (!a || !b) return null;
          const myCand   = a.mmId === myUid ? a : b;
          const theirCand = a.mmId === myUid ? b : a;
          return (
            <div key={i} style={{ background:th.card, borderRadius:th.rLg, padding:16, marginBottom:14, boxShadow:`0 6px 20px ${alpha(th.ink,0.07)}` }}>
              <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:12 }}>
                <div style={{ display:'flex', alignItems:'center' }}>
                  <Avatar grad={a.grad} name={a.name} size={52} photo={a.photos&&a.photos[0]} style={{ marginInlineEnd:-10, zIndex:2 }} />
                  <Avatar grad={b.grad} name={b.name} size={52} photo={b.photos&&b.photos[0]} style={{ marginInlineStart:-10 }} />
                </div>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontFamily:th.display, fontWeight:800, fontSize:16, color:th.ink }}>{a.name} · {b.name}</div>
                  <div style={{ fontFamily:th.body, fontSize:12.5, color:alpha(th.ink,0.5) }}>{a.age} · {b.age} | {a.region} · {b.region}</div>
                </div>
                <ScoreRing score={p.score} th={th} />
              </div>
              <div style={{ background:alpha(th.gold,0.1), borderRadius:th.r, padding:12, marginBottom:12 }}>
                <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:5 }}>
                  <Icon name="spark" size={15} style={{ color:th.gold }} fill={th.gold} />
                  <span style={{ fontFamily:th.display, fontWeight:800, fontSize:13, color:th.ink }}>למה הם מתאימים</span>
                </div>
                <p style={{ margin:0, fontFamily:th.body, fontSize:13.5, color:alpha(th.ink,0.75), lineHeight:1.5 }}>{p.why}</p>
              </div>
              <div style={{ display:'flex', gap:8 }}>
                <Btn th={th} variant="ghost" onClick={() => go('candidate', { id: theirCand.id })}>הצג כרטיסייה</Btn>
                <Btn th={th} full onClick={() => go('matchFlow', { id: myCand.id, withId: theirCand.id })} icon={<Icon name="heart" size={17} fill="#fff" stroke={0} />}>יזום שידוך</Btn>
              </div>
            </div>
          );
        })}
      </div>
    </>
  );
}

// CANDIDATE INQUIRY CHAT — matchmaker ↔ matchmaker about a candidate
// ════════════════════════════════════════════════════════════
function CandInquiry({ th, go, params }) {
  const { candidates, matchmakers, notifications, markNotificationRead } = useContext(DataCtx);
  const { user, profile } = useContext(AuthCtx);
  const myUid   = user?.uid;
  const candId  = params?.candId;
  const toMmId  = params?.toMm;

  const c = candidates.find(x => x.id === candId) || { name:'?', grad:['#ccc','#999'], photos:[] };
  const resolveM = id => { const m = matchmakers[id]; return { ...m, name: m?.displayName||m?.name||'—', grad: m?.grad||['#ccc','#999'] }; };
  const theirMm = resolveM(toMmId);

  // Deterministic doc ID — order-agnostic, unique per (pair of MMs + candidate)
  const chatId = [...[myUid, toMmId].sort(), candId].join('__');

  const [msgs,    setMsgs]    = useSd([]);
  const [text,    setText]    = useSd('');
  const [loading, setLoading] = useSd(true);
  const [sending, setSending] = useSd(false);
  const endRef = useRd(null);

  useEd(() => {
    if (!chatId) return;
    const unsub = db.collection('mm_chats').doc(chatId).onSnapshot(
      snap => { setMsgs(snap.exists ? (snap.data().messages || []) : []); setLoading(false); },
      ()   => setLoading(false)
    );
    return () => unsub();
  }, [chatId]);

  useEd(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [msgs]);

  // Mark incoming new_msg notifications for this chat as read when the screen opens
  useEd(() => {
    if (!chatId || !myUid) return;
    notifications
      .filter(n => n.type === 'new_msg' && n.chatId === chatId && !n.read)
      .forEach(n => markNotificationRead(n.id));
  }, [chatId]);

  const send = async () => {
    if (!text.trim() || sending) return;
    const msgText = text.trim();
    setText('');
    setSending(true);
    try {
      await db.collection('mm_chats').doc(chatId).set({
        fromMm: myUid, toMm: toMmId, candId,
        participants: [myUid, toMmId],
        lastAt: firebase.firestore.FieldValue.serverTimestamp(),
        lastMsg: msgText,
        messages: firebase.firestore.FieldValue.arrayUnion({ from: myUid, text: msgText, at: Date.now() }),
      }, { merge: true });
      await db.collection('notifications').add({
        toUid: toMmId,
        type: 'new_msg',
        fromMmId: myUid,
        fromMmName: profile?.displayName || 'שדכן/ית',
        candId,
        candName: c.name,
        chatId,
        read: false,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
    } catch(e) { console.error(e); }
    setSending(false);
  };

  return (
    <div style={{ height:'100%', display:'flex', flexDirection:'column', background:th.cream }}>
      {/* Header */}
      <div style={{ paddingTop:50, paddingInline:14, paddingBottom:10, background:th.card, flexShrink:0, borderBottom:`1px solid ${alpha(th.ink,0.08)}`, display:'flex', alignItems:'center', gap:10 }}>
        <button onClick={() => go('back')} style={{ width:38, height:38, borderRadius:'50%', border:'none', background:alpha(th.ink,0.05), color:th.ink, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
          <Icon name="back" size={20} />
        </button>
        <Avatar grad={theirMm.grad} name={theirMm.name} size={40} />
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontFamily:th.display, fontWeight:800, fontSize:16, color:th.ink }}>{theirMm.name}</div>
          <div style={{ fontFamily:th.body, fontSize:12, color:alpha(th.ink,0.5) }}>בנושא {c.name}</div>
        </div>
      </div>
      {/* Candidate context chip */}
      <div style={{ flexShrink:0, padding:'10px 16px 6px' }}>
        <div style={{ display:'flex', alignItems:'center', gap:8, background:alpha(th.primary,0.07), border:`1px solid ${alpha(th.primary,0.15)}`, borderRadius:th.rSm, padding:'8px 12px' }}>
          <Avatar grad={c.grad} name={c.name} size={30} photo={c.photos?.[0]} />
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ fontFamily:th.body, fontSize:10, color:alpha(th.ink,0.45) }}>שיחה בנושא</div>
            <div style={{ fontFamily:th.display, fontWeight:800, fontSize:13, color:th.ink }}>{c.name}{c.age?`, ${c.age}`:''}{c.region?` · ${c.region}`:''}</div>
          </div>
        </div>
      </div>
      {/* Messages */}
      <div style={{ flex:1, overflowY:'auto', padding:'8px 16px 12px', display:'flex', flexDirection:'column', gap:8 }}>
        {loading && <div style={{ textAlign:'center', color:alpha(th.ink,0.4), fontFamily:th.body, fontSize:13, padding:24 }}>טוען…</div>}
        {!loading && msgs.length === 0 && (
          <div style={{ textAlign:'center', padding:'36px 20px' }}>
            <div style={{ fontSize:34, marginBottom:10 }}>💬</div>
            <div style={{ fontFamily:th.display, fontWeight:800, fontSize:17, color:th.ink, marginBottom:6 }}>פתח/י שיחה</div>
            <div style={{ fontFamily:th.body, fontSize:13.5, color:alpha(th.ink,0.5), lineHeight:1.55 }}>שאל/י שאלות, קבל/י פרטים נוספים<br />על {c.name} מ{theirMm.name}</div>
          </div>
        )}
        {msgs.map((m, i) => {
          const mine = m.from === myUid;
          return (
            <div key={i} style={{ alignSelf:mine?'flex-start':'flex-end', maxWidth:'80%' }}>
              <div style={{ background:mine?th.primary:th.card, color:mine?'#fff':th.ink, borderRadius:18, borderBottomRightRadius:mine?18:4, borderBottomLeftRadius:mine?4:18, padding:'9px 13px', fontFamily:th.body, fontSize:14.5, lineHeight:1.4, boxShadow:`0 2px 8px ${alpha(th.ink,0.06)}` }}>
                {m.text}
              </div>
              <div style={{ fontFamily:th.body, fontSize:10.5, color:alpha(th.ink,0.4), marginTop:3, textAlign:mine?'right':'left' }}>
                {mine ? 'אני' : theirMm.name}
              </div>
            </div>
          );
        })}
        <div ref={endRef} />
      </div>
      {/* Input bar */}
      <div style={{ flexShrink:0, padding:'10px 14px 24px', background:th.card, borderTop:`1px solid ${alpha(th.ink,0.07)}`, display:'flex', gap:8, alignItems:'flex-end' }}>
        <textarea value={text} onChange={e => setText(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }}
          placeholder={`שאל/י שאלה על ${c.name}…`} rows={1}
          style={{ flex:1, resize:'none', border:'none', outline:'none', background:'transparent', fontFamily:th.body, fontSize:15, color:th.ink, lineHeight:1.5, padding:'4px 0' }} />
        <button onClick={send} disabled={!text.trim()||sending}
          style={{ width:38, height:38, borderRadius:'50%', border:'none', background:text.trim()?th.primary:alpha(th.ink,0.1), color:'#fff', cursor:text.trim()?'pointer':'default', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, transition:'background .15s' }}>
          <Icon name="send" size={17} fill="#fff" stroke={0} />
        </button>
      </div>
    </div>
  );
}

// CAND BROWSE — candidate-facing opposite-gender browse screen
// ════════════════════════════════════════════════════════════
function CandBrowse({ th, go, me }) {
  const { candidates, lists } = useContext(DataCtx);
  const { profile } = useContext(AuthCtx);
  const { texts: _tx, defaults: _dx } = useContext(TextsCtx);
  const t = (key) => _tx[key] || _dx[key] || '';
  const [q, setQ] = useSb('');
  const [filterOpen, setFilterOpen] = useSb(false);
  const [filters, setFilters] = useSb({ rel: [], region: '', ageMin: 18, ageMax: 55, maritalStatus: [] });

  const isFemaleG = g => g === 'f' || g === 'אשה' || g === 'אישה';
  const isMaleG   = g => g === 'm' || g === 'גבר' || g === 'גברים';
  // fallback to impersonation profile.gender when Firestore field is missing
  const meGender  = me.gender || profile?.gender || '';
  const meIsMale  = isMaleG(meGender);

  const list = React.useMemo(() => candidates.filter(c => {
    if (c.id === me.id) return false; // don't show myself
    const cIsMale   = isMaleG(c.gender);
    const cIsFemale = isFemaleG(c.gender);
    if (meIsMale ? !cIsFemale : !cIsMale) return false;
    if (c.available === false) return false;
    if (c.hidden) return false;
    if (q && !c.name.includes(q) && !(c.oneLine || '').includes(q)) return false;
    if (filters.region && c.region !== filters.region) return false;
    if (filters.rel.length && !filters.rel.includes(c.religiosity)) return false;
    if (c.age < filters.ageMin || c.age > filters.ageMax) return false;
    if (filters.maritalStatus.length && !filters.maritalStatus.includes(c.family)) return false;
    return true;
  }), [candidates, q, filters, meIsMale]);

  const activeFilters = (filters.region ? 1 : 0) + filters.rel.length + filters.maritalStatus.length;
  const liveRegions = (lists.regions && lists.regions.length) ? lists.regions : REGIONS;
  const liveRelig   = (lists.religiosity && lists.religiosity.length) ? lists.religiosity : RELIGIOSITY;
  const set = (k, v) => setFilters(s => ({ ...s, [k]: v }));

  return (
    <>
      <AppHeader th={th} title={meIsMale ? 'מועמדות' : 'מועמדים'} sub={`${list.length} נמצאו`} />
      <div style={{ flex:1, overflowY:'auto', padding:'8px 18px 16px' }}>
        <div style={{ display:'flex', gap:8, alignItems:'center', marginBottom:12 }}>
          <div style={{ position:'relative', flex:1 }}>
            <span style={{ position:'absolute', right:12, top:'50%', transform:'translateY(-50%)', color:alpha(th.ink,0.4) }}><Icon name="search" size={19} /></span>
            <input value={q} onChange={e => setQ(e.target.value)} placeholder={t('cand_browse_search')}
              style={{ width:'100%', boxSizing:'border-box', padding:'11px 40px 11px 14px', borderRadius:999, border:`1.5px solid ${alpha(th.ink,0.12)}`, fontFamily:th.body, fontSize:14.5, background:th.card, outline:'none', color:th.ink }} />
          </div>
          <button onClick={() => setFilterOpen(true)}
            style={{ position:'relative', border:'none', background:activeFilters > 0 ? alpha(th.primary,0.1) : th.card, width:46, height:46, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', color:activeFilters > 0 ? th.primary : th.ink, cursor:'pointer', flexShrink:0, boxShadow:'0 2px 8px rgba(0,0,0,0.07)' }}>
            <Icon name="filter" size={21} />
            {activeFilters > 0 && <span style={{ position:'absolute', top:-3, left:-3, background:th.primary, color:'#fff', borderRadius:'50%', minWidth:18, height:18, fontSize:11, fontWeight:800, display:'flex', alignItems:'center', justifyContent:'center', padding:'0 4px' }}>{activeFilters}</span>}
          </button>
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
          {list.map(c => (
            <CandCard key={c.id} c={c} th={th} myUid={null}
              onClick={() => go('candViewCand', { id: c.id, meId: me.id })} />
          ))}
        </div>
        {list.length === 0 && (
          <div style={{ textAlign:'center', padding:'50px 20px', color:alpha(th.ink,0.4) }}>
            <Icon name="search" size={40} />
            <div style={{ fontFamily:th.body, marginTop:10, fontSize:15 }}>{t('cand_browse_empty')}</div>
          </div>
        )}
      </div>
      <Sheet open={filterOpen} onClose={() => setFilterOpen(false)} th={th} title="פילטרים">
        <Field th={th} label={`טווח גיל: ${filters.ageMin}–${filters.ageMax}`}>
          <div style={{ display:'flex', gap:10, alignItems:'center' }}>
            <input type="range" min={18} max={60} value={filters.ageMin} onChange={e => set('ageMin', Math.min(+e.target.value, filters.ageMax))} style={{ flex:1, accentColor:th.primary }} />
            <input type="range" min={18} max={60} value={filters.ageMax} onChange={e => set('ageMax', Math.max(+e.target.value, filters.ageMin))} style={{ flex:1, accentColor:th.primary }} />
          </div>
        </Field>
        <Field th={th} label="אזור"><MultiChips th={th} value={filters.region ? [filters.region] : []} onChange={v => set('region', v[v.length-1] === filters.region ? '' : v[v.length-1] || '')} options={liveRegions} /></Field>
        <Field th={th} label="קרבה לדת"><MultiChips th={th} value={filters.rel} onChange={v => set('rel', v)} options={liveRelig} tone={th.gold} /></Field>
        <Field th={th} label="סטטוס משפחתי"><MultiChips th={th} value={filters.maritalStatus} onChange={v => set('maritalStatus', v)} options={['רווק/ה', 'גרוש/ה', 'אלמן/ה']} /></Field>
        <div style={{ display:'flex', gap:10, marginTop:6 }}>
          <Btn th={th} variant="ghost" onClick={() => setFilters({ rel:[], region:'', ageMin:18, ageMax:55, maritalStatus:[] })}>נקה</Btn>
          <Btn th={th} full onClick={() => setFilterOpen(false)}>הצג תוצאות</Btn>
        </div>
      </Sheet>
    </>
  );
}
