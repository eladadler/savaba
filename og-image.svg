<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4f1"/>
      <stop offset="100%" stop-color="#fde8ed"/>
    </linearGradient>
    <linearGradient id="heart-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f07090"/>
      <stop offset="100%" stop-color="#E8547A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1100" cy="80"  r="180" fill="#E8547A" opacity="0.06"/>
  <circle cx="80"   cy="550" r="140" fill="#E8547A" opacity="0.05"/>
  <circle cx="1050" cy="550" r="90"  fill="#E8547A" opacity="0.04"/>

  <!-- Heart icon (centered, large) -->
  <g transform="translate(540, 130) scale(2.5)">
    <rect width="48" height="48" rx="13" fill="#fff" opacity="0.9"/>
    <path d="M24 41C12 33 5 25.5 5 16.5 5 10.3 9.6 6 15.2 6c3.6 0 6.5 1.9 8.8 5C26.3 7.9 29.2 6 32.8 6 38.4 6 43 10.3 43 16.5 43 25.5 36 33 24 41Z" fill="url(#heart-grad)"/>
    <path d="M24 14c-1.6 2-3.4 3-3.4 5.4 0 1.8 1.5 3.1 3.4 3.1-1.2 1.1-2 2.2-2 3.8 0 2 1.7 3.2 4 3.2" stroke="#fff4f1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Main title -->
  <text x="600" y="340"
        font-family="'Heebo', 'Arial', sans-serif"
        font-weight="900"
        font-size="96"
        fill="#1a1522"
        text-anchor="middle"
        direction="rtl">סבבה והכל</text>

  <!-- Subtitle -->
  <text x="600" y="420"
        font-family="'Assistant', 'Arial', sans-serif"
        font-weight="600"
        font-size="38"
        fill="#E8547A"
        text-anchor="middle"
        direction="rtl">מערכת השידוכים הדיגיטלית</text>

  <!-- Divider -->
  <rect x="500" y="448" width="200" height="3" rx="2" fill="#E8547A" opacity="0.3"/>

  <!-- Tagline -->
  <text x="600" y="510"
        font-family="'Assistant', 'Arial', sans-serif"
        font-weight="500"
        font-size="30"
        fill="#1a1522"
        opacity="0.5"
        text-anchor="middle"
        direction="rtl">קיבלת הזמנה להצטרף 💝</text>
</svg>
